server {
  listen 80;
  server_name _;
  root /srv/unitytech;
  index index.html;
  charset utf-8;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location ~ /\. { deny all; }
  # la app y su configuración no se guardan en caché: cada actualización llega enseguida
  location ~ (index\.html|config\.js|sw\.js|manifest\.webmanifest|supabase\.js)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /olumi/app { return 301 /olumi/app/; }
  location / { try_files $uri $uri/ =404; }
}
