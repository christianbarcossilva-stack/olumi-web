server {
  listen 80;
  server_name _;
  root /srv/unitytech;
  index index.html;
  charset utf-8;
  server_tokens off;
  gzip on;
  # text/javascript: así sirve nginx los .js desde la 1.25; sin esto el motor 3D (690 KB) viajaba sin comprimir
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # el navegador recuerda por un año que este sitio va siempre por https
  add_header Strict-Transport-Security "max-age=31536000" always;
  location ~ /\. { deny all; }
  # la app y su configuración no se guardan en caché: cada actualización llega enseguida
  location ~ (index\.html|config\.js|sw\.js|manifest\.webmanifest|supabase\.js)$ { expires -1; try_files $uri =404; }
  # el motor 3D no cambia entre versiones: el navegador lo guarda un mes
  location ~ /lib/[^/]+\.js$ { expires 30d; try_files $uri =404; }
  location = /olumi/app { return 301 /olumi/app/; }
  location = /ondi/app { return 301 /ondi/app/; }
  location / { try_files $uri $uri/ =404; }
}
