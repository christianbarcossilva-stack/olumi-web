<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#dfe3e8}canvas{display:block}</style>
<script>addEventListener('unhandledrejection',e=>{window.__ok='ERROR '+(e.reason&&e.reason.stack||e.reason)});addEventListener('error',e=>{window.__ok='ERROR '+e.message})</script>
<script type="module">
// Visor del taller: dibuja avatares con el mismo motor (three r169) y el MISMO núcleo de movimiento que la oficina (avatar-core.js).
// ?m=a.glb,b.glb  &p=idle,walk0.10,walk0.35,sit,tecla  (walkN = fracción del ciclo del paso)  &h=giro  &lado=1 (de costado)  &silla=1
import * as THREE from './three.module.min.js';import {RoomEnvironment} from './RoomEnvironment.js';import {GLTFLoader} from './GLTFLoader.js';import {clone} from './SkeletonUtils.js';
const {avatarGLB,avPose,AV_GES}=new Function('THREE',await (await fetch('avatar-core.js')).text()+';return {avatarGLB,avPose,AV_GES}')(THREE);
const P=new URLSearchParams(location.search),W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#dfe3e8');const pm=new THREE.PMREMGenerator(r);sc.environment=pm.fromScene(new RoomEnvironment(),.04).texture;sc.environmentIntensity=.55;
const sun=new THREE.DirectionalLight('#fff4e2',2.4);sun.position.set(3,6,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-6,right:6,top:5,bottom:-5,near:.5,far:20});sun.shadow.bias=-.0004;sc.add(sun);sc.add(new THREE.HemisphereLight('#eef3ff','#b9b3a8',.5));
const fl=new THREE.Mesh(new THREE.PlaneGeometry(30,30).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:'#cfd3d8',roughness:.9}));fl.receiveShadow=true;sc.add(fl);
const caja=(w,h,d,x,y,z,c,par)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;par.add(m);return m};
const cam=new THREE.PerspectiveCamera(+P.get('fov')||30,W/H,.1,60);
const files=(P.get('m')||'of-h.glb').split(','),poses=(P.get('p')||'idle,walk0.1,sit').split(','),L=new GLTFLoader(),out=[];
let n=0;const tot=files.length*poses.length,gap=+P.get('gap')||1.05,rot=P.get('lado')?0:(+P.get('h')||1.0);
for(const f of files){const g=await L.loadAsync(f);let tris=0;g.scene.traverse(o=>{if(o.isMesh){tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;o.castShadow=true;const m=o.material;if(m&&m.transparent){m.transparent=false;m.alphaTest=.32;m.depthWrite=true;m.side=THREE.DoubleSide;o.castShadow=false}}});
  for(const p of poses){const a=avatarGLB(clone(g.scene),+P.get('alto')||1.74),grp=new THREE.Group();grp.add(a.g);
    const [p0,sem]=p.split('@'),gs=p0.startsWith('g:')?p0.split(':'):null,sit=p0==='sit'||p0==='tecla',md=sit?'sit':p0.startsWith('walk')?'walk':'idle';if(sem)a.seed=+sem;   // idle@3.7 = otra persona (otra semilla) · g:saludo:1.2 = gesto a los 1,2 s
    if(md==='walk'){a.gd=(+p0.slice(4)||0)*2*.33*a.an.alto;a.mix=1}if(gs)a.ges={id:gs[1],dur:AV_GES[gs[1]].dur,t0:1.3-(+gs[2]||1)};
    for(let i=0;i<80;i++)avPose(a,md,.05,{t:1.3,teclado:p0==='tecla'?{d:.36,h:.755}:null});a.sync();
    if(sit&&P.get('silla')!=='0'){// la misma silla y el mismo escritorio de la oficina (medidas de scene.js), con la persona mirando hacia +x
      caja(.52,.08,.52,0,.43,0,'#3b3f46',grp);caja(.08,.55,.48,-.24,.745,0,'#3b3f46',grp);caja(.06,.39,.06,0,.195,0,'#8a8f98',grp);
      if(p==='tecla'){caja(.9,.04,1.8,.24+.45,.72,0,'#c9a877',grp);caja(.15,.015,.48,.36,.7475,0,'#f2f2f2',grp);caja(.03,.36,.58,.24+.75,.74+.36,-.3,'#111',grp)}}
    grp.position.set((n-(tot-1)/2)*gap,0,0);grp.rotation.y=P.get('lado')?0:-rot;sc.add(grp);n++}
  out.push(f+': '+Math.round(tris)+' tri')}
if(P.get('cara')){cam.fov=14;cam.updateProjectionMatrix();cam.position.set(1.6,1.72,2.6);cam.lookAt(0,1.62,0)}
else if(P.get('lado')){const d=3.2+tot*.66;cam.position.set(0,1.05,d);cam.lookAt(0,.9,0)}
else{const d=3.4+tot*.72;cam.position.set(P.get('recto')?0:d*.22,+P.get('mira')||(P.get('recto')?1.0:1.5),d);cam.lookAt(0,+P.get('mira')||.88,0)}
r.render(sc,cam);window.__ok=out.join(' | ')+' | llamadas '+r.info.render.calls;
</script>
