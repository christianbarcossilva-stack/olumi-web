<!doctype html>
<html lang="es-UY">
<head>
<script>if(location.protocol==='http:'&&/(^|\.)unitytech\.uy$/.test(location.hostname))location.replace('https:'+location.href.slice(5))</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101419" media="(prefers-color-scheme: dark)">
<title>Ondi · versión de prueba</title>
<link rel="icon" type="image/png" href="../app/icono-192.png">
<link rel="apple-touch-icon" href="../app/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="../../olumi/app/config.js"></script>
<script src="../../olumi/app/vendor/supabase.js"></script>
<style>
/* Ondi con cuentas: la instaladora administra sus clientes, los enlaza con UniFi y le da acceso de solo lectura al IT de cada cliente.
   Mismos colores y letras que la app de Ondi: grafito frío + cian "señal"; verde/ámbar/rojo solo para estado. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunken:#e4e8ed; --ink:#141a21; --muted:#5a6573; --line:#d8dee5;
  --accent:#0a7fa3; --accent-soft:#d9eff6; --on-accent:#ffffff;
  --ok:#1d8a4c; --ok-soft:#dcf2e5; --warn:#b67a00; --warn-soft:#fbefd2; --crit:#cf3434; --crit-soft:#fbe1e1;
  --shadow:0 1px 2px rgba(20,26,33,.06),0 6px 20px rgba(20,26,33,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101419; --surface:#181e25; --sunken:#0c1014; --ink:#e7ecf1; --muted:#93a0ae; --line:#28313b;
  --accent:#3fc6ea; --accent-soft:#12313c; --on-accent:#06212a;
  --ok:#3ccf7e; --ok-soft:#123222; --warn:#f0b43a; --warn-soft:#3a2c0c; --crit:#ff6b6b; --crit-soft:#3d1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101419; --surface:#181e25; --sunken:#0c1014; --ink:#e7ecf1; --muted:#93a0ae; --line:#28313b;
  --accent:#3fc6ea; --accent-soft:#12313c; --on-accent:#06212a;
  --ok:#3ccf7e; --ok-soft:#123222; --warn:#f0b43a; --warn-soft:#3a2c0c; --crit:#ff6b6b; --crit-soft:#3d1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--accent)}

.beta{position:sticky;top:0;z-index:30;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;text-align:center;padding:5px 12px;padding-top:max(5px,env(safe-area-inset-top))}
.logo{display:inline-flex;align-items:center;gap:9px;color:var(--ink)}
.logo .wm{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em;line-height:1;font-size:23px}
.logo .by{display:block;font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:3px}

/* entrada */
.auth{min-height:calc(100% - 30px);display:grid;place-items:center;padding:28px 16px}
.authcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 24px;display:grid;gap:16px}
.authcard h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.02em}
.authcard p{margin:0}
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:15px;color:var(--ink);min-width:0;width:100%}
.fld textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
.fld small{font-weight:400}
.err{background:var(--crit-soft);color:var(--crit);border-radius:10px;padding:9px 12px;font-size:13.5px}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:13.5px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.choice{display:grid;gap:10px}
.choice button{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px}
.choice button:hover{border-color:var(--accent)}
.choice b{font-size:15px} .choice span{font-size:13px;color:var(--muted)}

/* app */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - 30px)}
.side{position:sticky;top:30px;height:calc(100vh - 30px);padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.side .logo{padding:0 8px}
.orgsel{display:grid;gap:4px;padding:0 4px}
.orgsel label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-left:4px}
.orgsel select{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 8px;width:100%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;padding:12px;border-radius:10px;background:var(--sunken);font-size:13px;display:grid;gap:6px;overflow-wrap:anywhere}
main{min-width:0;padding:26px 28px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap.wide{max-width:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:700;font-size:29px;letter-spacing:-.02em;margin:0;line-height:1.1}
.head p{margin:4px 0 0;color:var(--muted);max-width:66ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{border:0;background:none;padding:0;color:var(--muted);font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px 20px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0 0 6px;letter-spacing:-.01em}
.card h2 + p{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:9px;font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit)}
.btn.danger.arm{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.down{background:var(--crit-soft);color:var(--crit)} .pill.off{background:var(--sunken);color:var(--muted)}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}

.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cl{display:grid;gap:10px;text-align:left;padding:16px 18px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.cl:hover{border-color:var(--accent)}
.cl b{font-size:16px} .cl .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.maq{position:relative;height:calc(100vh - 250px);min-height:460px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sunken)}
.maq iframe{width:100%;height:100%;border:0;display:block}
.maq.full{position:fixed;inset:30px 0 0 0;height:auto;z-index:40;border-radius:0;border:0}
.maqbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.maqbar .grow{flex:1}
.save{font-size:12.5px;color:var(--muted)}

.steps{display:grid;gap:14px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px}
.step > i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--sunken);color:var(--muted);font-size:14px}
.step.done > i{background:var(--ok-soft);color:var(--ok)}
.step.now > i{background:var(--accent);color:var(--on-accent)}
.step h3{margin:3px 0 4px;font-size:15.5px}
.step p{margin:0 0 10px;color:var(--muted);font-size:14px}
.radio{display:grid;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio span{display:grid;gap:1px} .radio small{color:var(--muted)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline .fld{flex:1 1 260px}
.slist{display:grid;gap:8px}
.slist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.slist button:hover{border-color:var(--accent)}
.slist small{color:var(--muted)}
.code{font-family:var(--f-mono);font-size:30px;font-weight:500;letter-spacing:.08em;padding:10px 16px;border-radius:12px;background:var(--sunken);display:inline-block}
ol.how{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:4px}
ol.how b{color:var(--ink)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpis b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpis span{font-size:12.5px;color:var(--muted)}
.ppl{display:grid}
.ppl > div{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.ppl > div:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.mtop{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:30px;z-index:20}
  .mtop select{max-width:46vw;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  .mnav{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto}
  .mnav button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13.5px;white-space:nowrap;color:var(--ink)}
  .mnav svg{width:16px;height:16px;flex:none}
  .beta .long{display:none}
  .mnav button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
  main{padding:18px 16px 48px}
  .head h1{font-size:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .maq{height:calc(100vh - 260px);min-height:380px}
}
@media (min-width:861px){.mnav{display:none}}
</style>
</head>
<body>
<div class="beta">Versión de prueba de Ondi<span class="long"> con cuentas · lo que cargues acá queda guardado de verdad</span></div>
<div id="root"></div>
<div class="toast" id="toast" hidden role="status"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CFG = window.OLUMI_CONFIG || {};
const SB = window.supabase && CFG.supabaseUrl ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
const HERE = location.origin + location.pathname;
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
const ROLN = { owner: 'Dueño', admin: 'Administrador', encargado: 'Encargado', tecnico: 'Técnico', ventas: 'Ventas', administracion: 'Administración', subcontratista: 'Subcontratista', viewer: 'Solo lectura' };
const IC = {
  sites: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12"/><path d="M9 21v-6h6v6"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5"/></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  ref: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>'
};
const logo = () => `<span class="logo"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#fff" stroke-width="2.2" opacity=".45"/><circle cx="16" cy="16" r="4.5" fill="none" stroke="#fff" stroke-width="2.2" opacity=".45"/><path d="M16 6.5A9.5 9.5 0 0 1 25.5 16H16z" fill="#fff" opacity=".28"/><path d="M16 16L22.7 9.3" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="21.6" cy="21" r="2.3" fill="#fff"/></svg><span><span class="wm">ondi</span><span class="by">by Unity Tech</span></span></span>`;
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); };
const fmtD = d => d ? new Date(d).toLocaleString('es-UY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const ago = d => { if (!d) return ''; const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 1 ? 'recién' : m < 60 ? 'hace ' + m + ' min' : m < 1440 ? 'hace ' + Math.round(m / 60) + ' h' : fmtD(d); };

/* ---------- estado ---------- */
const S = { user: null, ctxs: [], ctx: null, sites: [], site: null, view: 'clientes', tab: 'maqueta', claves: null, auth: 'login', msg: '', info: '', falta: false,
  unifi: {}, sitiosUI: null, acc: null, code: undefined, eq: {}, maqSave: '', armed: null };
const CODE = (new URLSearchParams(location.search).get('codigo') || '').toUpperCase();
const staff = () => S.ctx && S.ctx.kind === 'org';
const editor = () => staff() && ['owner', 'admin', 'encargado', 'tecnico'].includes(S.ctx.role);
const admin = () => staff() && ['owner', 'admin'].includes(S.ctx.role);
const orgId = () => S.ctx && S.ctx.org;
const faltaSQL = e => e && /ondi_|relation .* does not exist|Could not find the (function|table)|schema cache/i.test(e.message || '') ;
function errTxt(e) { const m = (e && (e.message || e.error)) || String(e || '');
  if (/Invalid login/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/already registered|already exists/i.test(m)) return 'Ese email ya tiene cuenta: entrá con tu contraseña.';
  if (/Email not confirmed/i.test(m)) return 'Falta confirmar el email: revisá tu casilla (y el correo no deseado).';
  if (/Password should|at least 6/i.test(m)) return 'La contraseña tiene que tener al menos 6 caracteres.';
  if (/codigo_invalido/.test(m)) return 'Ese código no existe. Revisalo con quien te lo pasó.';
  if (/demasiados_intentos/.test(m)) return 'Demasiados intentos con códigos. Esperá una hora.';
  if (/sin_permiso/.test(m)) return 'No tenés permiso para hacer eso en esta empresa.';
  if (/clave_invalida/.test(m)) return 'Esa clave no parece una clave de UniFi. Copiala de nuevo.';
  if (/rate limit/i.test(m)) return 'Se mandaron demasiados emails. Probá en una hora.';
  if (/fetch|network|Failed to send/i.test(m)) return 'Sin conexión con el servidor. Revisá internet y probá de nuevo.';
  if (faltaSQL(e)) return 'Falta preparar la base de Ondi (correr ondi-1.0.sql en Supabase).';
  return m || 'Algo salió mal. Probá de nuevo.'; }

/* ---------- entrada ---------- */
function authView() {
  const m = S.msg ? `<div class="err" role="alert">${esc(S.msg)}</div>` : '', i = S.info ? `<div class="okmsg">${esc(S.info)}</div>` : '';
  const em = `<label class="fld">Email<input id="a_email" type="email" autocomplete="email" required></label>`;
  let b = '';
  if (!SB) b = `<h1>Falta conectar el servidor</h1><p class="muted">No se encontró la configuración de Supabase.</p>`;
  else if (S.auth === 'login') b = `<div><h1>Entrar a Ondi</h1><p class="muted">Con la misma cuenta de Olumi.</p></div>${i}
    <form class="form" data-f="login">${em}<label class="fld">Contraseña<input id="a_pass" type="password" autocomplete="current-password" required></label>${m}<button class="btn pri full" type="submit">Entrar</button></form>
    <div class="links"><button class="lnk" data-a="signup">Crear una cuenta</button><button class="lnk" data-a="forgot">Olvidé mi contraseña</button></div>

      <label><input type="radio" name="cuenta" value="org" ${!propia ? 'checked' : ''} ${admin() ? '' : 'disabled'}><span><b>La cuenta de ${esc(S.ctx.name)}</b><small>${kOrg ? 'Cargada · termina en ' + esc(kOrg.hint) : 'Todavía no está cargada'}</small></span></label>
      <label><input type="radio" name="cuenta" value="propia" ${propia ? 'checked' : ''} ${admin() ? '' : 'disabled'}><span><b>Una cuenta propia del cliente</b><small>${kSite ? 'Cargada · termina en ' + esc(kSite.hint) : 'Si el cliente es el dueño de su consola en unifi.ui.com'}</small></span></label></div>
    ${!propia && !kOrg ? `<p style="margin-top:10px">${admin() ? '<button class="btn" data-nav="unifi">Cargar la clave de la empresa</button>' : 'Un administrador tiene que cargar la clave.'}</p>` : ''}
    ${propia && admin() ? `<form class="inline" data-do-f="keysite" style="margin-top:10px"><label class="fld">Clave de API del cliente<input id="ks" type="password" autocomplete="off" placeholder="${kSite ? 'Pegá una nueva para cambiarla' : 'Pegala acá'}"></label><button class="btn pri" type="submit">Guardar</button></form>` : ''}`;
  const lista = S.sitiosUI;
  const s2 = !kUse ? '<p>Primero cargá la clave.</p>' : `<p>Elegí cuál de los sitios de esa cuenta es este cliente.</p>
    ${lista && lista.error ? `<div class="err">${esc(lista.error)}</div><p></p>` : ''}
    ${lista && lista.sitios ? `<div class="slist">${lista.sitios.map(x => `<button data-pick="${esc(x.hostId)}|${esc(x.siteId)}"><b>${esc(x.nombre)}</b><span class="tag">${x.equipos ?? '?'} equipos</span><small>${esc(x.isp || x.zona || x.siteId)}</small>${x.caidos ? `<small style="color:var(--crit)">${x.caidos} caídos</small>` : '<small></small>'}</button>`).join('') || '<p class="muted">Esa cuenta no tiene sitios.</p>'}</div>` : ''}
    ${editor() ? `<p style="margin-top:10px"><button class="btn ${lista ? '' : 'pri'}" data-do="buscar">${lista === 'cargando' ? 'Buscando…' : lista ? 'Buscar de nuevo' : 'Buscar los sitios'}</button></p>` : ''}`;
  const s3 = linked ? `<p><span class="pill ok">Enlazado</span> con <b>${esc(u.nombre || u.siteId)}</b>${u.at ? ' · ' + esc(fmtD(u.at)) : ''}.</p><div class="acts"><button class="btn" data-tab="equipos">Ver los equipos</button>${editor() ? '<button class="btn danger" data-do="unlink">Desenlazar</button>' : ''}</div>`
    : '<p>Cuando elijas el sitio, los equipos aparecen en la pestaña Equipos.</p>';
  return `<div class="grid2"><div class="card pad"><div class="steps">${step(1, kUse ? 'done' : 'now', 'Cuenta de UniFi', s1)}${step(2, linked ? 'done' : kUse ? 'now' : '', 'Sitio de UniFi', s2)}${step(3, linked ? 'done' : '', 'Listo', s3)}</div></div>
    <div class="card pad"><h2>Cómo funciona</h2><ol class="how"><li>La clave es de <b>solo lectura</b>: Ondi ve los equipos, no cambia nada en la red.</li><li>Queda guardada en el servidor. Nadie la puede ver después, ni desde acá.</li><li>UniFi agrupa los equipos por consola (UDM, Cloud Key, UCG). Si un cliente tiene varias, creá un cliente por consola o avisanos.</li><li>Otras marcas (switches, cámaras y NVR) se suman con el agente local más adelante.</li></ol></div></div>`; }

/* conexión UniFi de la empresa */
function unifiOrgView() { const k = claveDe(''), T = S.test;
  return `<div class="wrap"><div class="head"><div><h1>Conexión UniFi</h1><p>La clave de la cuenta de UniFi de ${esc(S.ctx.name)}. Con una sola clave Ondi ve las consolas de todos los clientes que administrás desde esa cuenta.</p></div></div>
  <div class="grid2"><div class="card pad"><h2>Clave de API</h2><p>${k ? `<span class="pill ok">Cargada</span> termina en <span class="mono">${esc(k.hint)}</span> · ${esc(fmtD(k.updated_at))}` : '<span class="pill off">Sin cargar</span>'}</p>
    ${admin() ? `<form class="inline" data-do-f="keyorg"><label class="fld">${k ? 'Cambiar la clave' : 'Pegá la clave'}<input id="ko" type="password" autocomplete="off" spellcheck="false"></label><button class="btn pri" type="submit">Guardar</button></form>
      <div class="acts" style="margin-top:12px">${k ? `<button class="btn" data-do="probar">${T === 'cargando' ? 'Probando…' : 'Probar la conexión'}</button><button class="btn danger ${S.armed === 'delkey' ? 'arm' : ''}" data-do="delkey">${S.armed === 'delkey' ? '¿Seguro? Tocá de nuevo' : 'Borrar la clave'}</button>` : ''}</div>
      ${T && T !== 'cargando' ? (T.error ? `<div class="err" style="margin-top:12px">${esc(T.error)}</div>` : `<div class="okmsg" style="margin-top:12px">Conectado: ${T.consolas} consola${T.consolas === 1 ? '' : 's'} y ${T.sitios} sitio${T.sitios === 1 ? '' : 's'}.</div>`) : ''}`
      : '<p class="muted">Solo el dueño o un administrador puede cargarla.</p>'}</div>
    <div class="card pad"><h2>Cómo sacar la clave</h2><ol class="how"><li>Entrá a <b>unifi.ui.com</b> con la cuenta que administra a tus clientes.</li><li>Abajo a la izquierda: <b>API</b> (o Ajustes → API Keys).</li><li>Tocá <b>Create API Key</b>, ponele de nombre <b>Ondi</b> y copiala. UniFi la muestra una sola vez.</li><li>Pegala acá y tocá <b>Guardar</b>. Después, <b>Probar la conexión</b>.</li></ol>
    <p class="muted" style="font-size:13.5px;margin:12px 0 0">No la mandes por WhatsApp ni por email: pegala directo acá.</p></div></div></div>`; }

/* accesos del IT del cliente */
function accesosView() { const st = S.site;
  if (S.acc === null || S.acc && S.acc.site !== st.id) { S.acc = { site: st.id, list: null }; S.code = undefined; loadAcc(st); }
  const link = S.code ? HERE + '?codigo=' + encodeURIComponent(S.code) : '';
  const list = S.acc.list;
  return `<div class="grid2"><div class="card pad"><h2>Código para el IT del cliente</h2><p class="muted">Con este código, la gente de sistemas de ${esc(st.name)} entra a ver la maqueta y los equipos de su empresa. No pueden cambiar nada ni ver a tus otros clientes.</p>
      ${S.code === undefined ? '<p class="muted">Cargando…</p>' : S.code ? `<p><span class="code">${esc(S.code)}</span></p><p class="muted" style="font-size:13.5px">O mandales este enlace: <span class="mono" style="overflow-wrap:anywhere">${esc(link)}</span></p>
        <div class="acts"><button class="btn pri" data-do="copylink">Copiar el enlace</button>${admin() ? `<button class="btn" data-do="newcode">Cambiar el código</button><button class="btn danger" data-do="nocode">Desactivar</button>` : ''}</div>`
        : admin() ? '<button class="btn pri" data-do="newcode">Crear el código</button>' : '<p class="muted">Un administrador lo tiene que crear.</p>'}
      <ol class="how" style="margin-top:14px"><li>Le pasás el enlace o el código.</li><li>Crea su cuenta con su email (o entra con la que tenga).</li><li>Queda adentro, en solo lectura. Lo ves en la lista de la derecha.</li></ol></div>
    <div class="card pad"><h2>Quién tiene acceso</h2>${list === null ? '<p class="muted">Cargando…</p>' : list.length ? `<div class="ppl">${list.map(a => `<div><span><b>${esc(a.name || a.email)}</b><br><span class="muted" style="font-size:13px">${esc(a.email || '')} · desde ${esc(fmtD(a.created_at))}</span></span>${admin() ? `<button class="btn sm danger ${S.armed === 'rm:' + a.user_id ? 'arm' : ''}" data-rm="${esc(a.user_id)}">${S.armed === 'rm:' + a.user_id ? '¿Seguro?' : 'Quitar'}</button>` : ''}</div>`).join('')}</div>` : '<p class="muted">Nadie todavía.</p>'}
    <p class="muted" style="font-size:13.5px;margin:14px 0 0">Tu equipo (técnicos y encargados) entra con el código de equipo de Olumi, en Ajustes → Equipo.</p></div></div>`; }
async function loadAcc(st) { const [c, l] = await Promise.all([admin() ? SB.rpc('ondi_codigo', { o: st.org_id, s: st.id, renovar: false }) : Promise.resolve({ data: null }), SB.from('ondi_accesos').select('user_id,email,name,created_at').eq('org_id', st.org_id).eq('site_id', st.id).order('created_at')]);
  if (S.site !== st) return; S.code = c.error ? null : c.data; S.acc.list = l.data || []; if (S.tab === 'accesos') render(); }

/* datos */
function datosView() { const st = S.site, d = st.data || {};
  return `<div class="grid2"><div class="card pad"><h2>Datos del cliente</h2><form class="form" data-do-f="datos"><label class="fld">Nombre<input id="d_name" value="${esc(st.name)}" required maxlength="120" ${editor() ? '' : 'disabled'}></label>
    <label class="fld">Nombre en la maqueta <small>(si es distinto, por ejemplo el nombre del parque)</small><input id="d_parque" value="${esc(d.parque || '')}" maxlength="80" ${editor() ? '' : 'disabled'}></label>
    <label class="fld">Dirección<input id="d_dir" value="${esc(d.direccion || '')}" maxlength="200" ${editor() ? '' : 'disabled'}></label>
    <label class="fld">Contacto de IT<input id="d_cont" value="${esc(d.contacto || '')}" maxlength="200" placeholder="Nombre, teléfono o email" ${editor() ? '' : 'disabled'}></label>
    <label class="fld">Notas<textarea id="d_notas" maxlength="2000" ${editor() ? '' : 'disabled'}>${esc(d.notas || '')}</textarea></label>
    ${editor() ? '<div><button class="btn pri" type="submit">Guardar</button></div>' : ''}</form></div>
    ${admin() ? `<div class="card pad"><h2>Borrar el cliente</h2><p class="muted">Se borran su maqueta, el enlace con UniFi y los accesos de su gente. No se puede deshacer.</p>
      <form class="form" data-do-f="delsite"><label class="fld">Escribí el nombre para confirmar<input id="del_name" autocomplete="off" placeholder="${esc(st.name)}"></label><div><button class="btn danger" type="submit">Borrar ${esc(st.name)}</button></div></form></div>` : ''}</div>`; }

/* ---------- acciones ---------- */
async function saveSite(st, patch) { const data = { ...(st.data || {}), ...(patch.data || {}) }; const upd = { data }; if (patch.name) upd.name = patch.name;
  const r = await SB.from('ondi_sites').update(upd).eq('org_id', st.org_id).eq('id', st.id).select().single(); if (r.error) throw r.error; Object.assign(st, r.data); return st; }
function openSite(id) { const st = S.sites.find(x => x.id === id); if (!st) return; S.site = st; S.view = 'site'; S.tab = 'maqueta'; S.unifi = {}; S.sitiosUI = null; S.acc = null; ls.set('ondi.site.' + orgId(), id); history.replaceState(null, '', '#c'); render(); scrollTo(0, 0); }
document.addEventListener('change', async e => {
  if (e.target.id === 'ctxsel' || e.target.id === 'ctxsel2') { S.ctx = S.ctxs.find(c => c.key === e.target.value) || S.ctx; ls.set('ondi.ctx', S.ctx.key); history.replaceState(null, '', location.pathname); await loadCtx(); }
  if (e.target.name === 'cuenta') { S.unifi.propia = e.target.value === 'propia'; S.sitiosUI = null; render(); }
});
document.addEventListener('click', async e => { const t = e.target.closest('[data-nav],[data-site],[data-tab],[data-do],[data-pick],[data-rm]'); if (!t) return;
  if (t.dataset.nav) { S.view = t.dataset.nav; S.site = null; history.replaceState(null, '', location.pathname); S.test = null; render(); return; }
  if (t.dataset.site) return openSite(t.dataset.site);
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  const st = S.site;
  try {
    if (t.dataset.pick) { const [hostId, siteId] = t.dataset.pick.split('|'), x = (S.sitiosUI.sitios || []).find(o => o.hostId === hostId && o.siteId === siteId);
      await saveSite(st, { data: { unifi: { hostId, siteId, nombre: x ? x.nombre : siteId, propia: !!(S.unifi.propia ?? (st.data.unifi || {}).propia), at: new Date().toISOString() } } }); delete S.eq[st.id]; toast('Enlazado con ' + (x ? x.nombre : siteId)); render(); return; }
    if (t.dataset.rm) { const k = 'rm:' + t.dataset.rm; if (S.armed !== k) { S.armed = k; render(); setTimeout(() => { if (S.armed === k) { S.armed = null; render(); } }, 4000); return; } S.armed = null;
      const r = await SB.from('ondi_accesos').delete().eq('org_id', st.org_id).eq('site_id', st.id).eq('user_id', t.dataset.rm); if (r.error) throw r.error; S.acc.list = S.acc.list.filter(a => a.user_id !== t.dataset.rm); toast('Acceso quitado'); render(); return; }
    const a = t.dataset.do;
    if (a === 'newsite') { S.newsite = true; render(); const f = $('#ns_name'); if (f) f.focus(); }
    if (a === 'cancelnew') { S.newsite = false; render(); }
    if (a === 'eqref') { delete S.eq[st.id]; render(); }
    if (a === 'buscar') { S.sitiosUI = 'cargando'; render(); const propia = S.unifi.propia ?? !!(st.data.unifi || {}).propia; try { S.sitiosUI = await fn({ accion: 'sitios', alcance: propia ? st.id : '' }); } catch (er) { S.sitiosUI = { error: errTxt(er) }; } render(); }
    if (a === 'unlink') { const d = { ...(st.data || {}) }; delete d.unifi; const r = await SB.from('ondi_sites').update({ data: d }).eq('org_id', st.org_id).eq('id', st.id).select().single(); if (r.error) throw r.error; Object.assign(st, r.data); delete S.eq[st.id]; toast('Desenlazado'); render(); }
    if (a === 'probar') { S.test = 'cargando'; render(); try { S.test = await fn({ accion: 'probar', alcance: '' }); } catch (er) { S.test = { error: errTxt(er) }; } render(); }
    if (a === 'delkey') { if (S.armed !== 'delkey') { S.armed = 'delkey'; render(); setTimeout(() => { if (S.armed === 'delkey') { S.armed = null; render(); } }, 4000); return; } S.armed = null;
      const r = await SB.rpc('ondi_set_unifi', { o: orgId(), alcance: '', clave: '' }); if (r.error) throw r.error; S.test = null; toast('Clave borrada'); await loadClaves(); }
    if (a === 'newcode') { const r = await SB.rpc('ondi_codigo', { o: st.org_id, s: st.id, renovar: !!S.code }); if (r.error) throw r.error; S.code = r.data; toast(S.code ? 'Código nuevo listo' : ''); render(); }
    if (a === 'nocode') { const r = await SB.rpc('ondi_sin_codigo', { o: st.org_id, s: st.id }); if (r.error) throw r.error; S.code = null; toast('Código desactivado: los que ya entraron siguen hasta que los quites'); render(); }
    if (a === 'copylink') { const link = HERE + '?codigo=' + encodeURIComponent(S.code); try { await navigator.clipboard.writeText(link); toast('Enlace copiado'); } catch (er) { prompt('Copiá el enlace:', link); } }
    if (a === 'maqfull') { const b = $('#maqbox'); if (!b) return; if (b.requestFullscreen && !document.fullscreenElement) b.requestFullscreen().catch(() => b.classList.toggle('full')); else if (document.fullscreenElement) document.exitFullscreen(); else b.classList.toggle('full'); }
    if (a === 'maqexport') { const blob = new Blob([JSON.stringify(MAQ && MAQ.state || {}, null, 1)], { type: 'application/json' }), u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = 'maqueta-' + st.name.replace(/[^\w-]+/g, '-').toLowerCase() + '.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
    if (a === 'maqimport') { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (!d || d.v !== 1) throw 0;
        const r = await SB.from('ondi_maquetas').upsert({ org_id: st.org_id, site_id: st.id, data: d }, { onConflict: 'org_id,site_id' }); if (r.error) throw r.error; toast('Armado importado'); mountMaq(); } catch (er) { toast(er && er.message ? errTxt(er) : 'Ese archivo no es un armado de maqueta.'); } }; inp.click(); }
  } catch (er) { toast(errTxt(er)); } });
document.addEventListener('submit', async e => { const f = e.target.closest('[data-do-f]'); if (!f) return; e.preventDefault(); const k = f.dataset.doF, btn = f.querySelector('[type=submit]'); btn.disabled = true; const st = S.site; const v = id => (($('#' + id) || {}).value || '').trim();
  try {
    if (k === 'newsite') { const r = await SB.from('ondi_sites').insert({ org_id: orgId(), name: v('ns_name'), data: v('ns_dir') ? { direccion: v('ns_dir') } : {} }).select().single(); if (r.error) throw r.error; S.sites.push(r.data); S.sites.sort((a, b) => a.name.localeCompare(b.name, 'es')); S.newsite = false; openSite(r.data.id); toast('Cliente creado'); }
    if (k === 'keyorg' || k === 'keysite') { const val = v(k === 'keyorg' ? 'ko' : 'ks'); if (!val) throw { message: 'clave_invalida' };
      const r = await SB.rpc('ondi_set_unifi', { o: orgId(), alcance: k === 'keyorg' ? '' : st.id, clave: val }); if (r.error) throw r.error; toast('Clave guardada en el servidor'); S.test = null; await loadClaves();
      if (k === 'keyorg') { S.test = 'cargando'; render(); try { S.test = await fn({ accion: 'probar', alcance: '' }); } catch (er) { S.test = { error: errTxt(er) }; } render(); } }
    if (k === 'datos') { await saveSite(st, { name: v('d_name') || st.name, data: { parque: v('d_parque'), direccion: v('d_dir'), contacto: v('d_cont'), notas: ($('#d_notas') || {}).value || '' } }); toast('Guardado'); render(); }
    if (k === 'delsite') { if (v('del_name').toLowerCase() !== st.name.trim().toLowerCase()) throw { message: 'Escribí el nombre exacto del cliente.' };
      const r = await SB.from('ondi_sites').delete().eq('org_id', st.org_id).eq('id', st.id); if (r.error) throw r.error; S.sites = S.sites.filter(x => x !== st); S.site = null; S.view = 'clientes'; toast('Cliente borrado'); render(); }
  } catch (er) { toast(errTxt(er)); } finally { btn.disabled = false; } });
document.addEventListener('fullscreenchange', () => {});

if (SB) SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') showAuth('setpass'); if (ev === 'SIGNED_OUT' && !S.auth) location.reload(); });
boot().catch(e => showAuth('login', errTxt(e)));
})();
</script>
</body>
</html>
