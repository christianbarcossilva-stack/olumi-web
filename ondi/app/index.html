<meta charset="utf-8">

<meta name="theme-color" content="#101419" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ondi by Unity Tech: monitoreo multicliente de redes UniFi y multimarca, con pantallas para monitores y avisos por WhatsApp.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ondi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: consola de operación multicliente — barra lateral en escritorio, pestañas tipo iOS en teléfono, y un modo pantalla oscuro para monitores de pared. Grafito frío + acento "señal" cian; verde/ámbar/rojo solo para estado. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunken:#e4e8ed; --ink:#141a21; --muted:#5a6573; --line:#d8dee5;
  --accent:#0a7fa3; --accent-soft:#d9eff6; --on-accent:#ffffff;
  --ok:#1d8a4c; --ok-soft:#dcf2e5; --warn:#b67a00; --warn-soft:#fbefd2; --crit:#cf3434; --crit-soft:#fbe1e1;
  --shadow:0 1px 2px rgba(20,26,33,.06),0 6px 20px rgba(20,26,33,.06);
  /* Modo pantalla: siempre oscuro, igual en ambos temas */
  --w-bg:#0a0e12; --w-tile:#131a21; --w-line:#222c36; --w-ink:#eef3f7; --w-muted:#8796a5; --w-accent:#3fc6ea;
  --w-ok:#34d27b; --w-warn:#f3b53c; --w-crit:#ff5a5a; --w-crit-bg:#2a1416;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
  --plane:#f7f9fb; --grid:rgba(20,26,33,.05); --zone:#ffffff; --zone-line:#c9d1da;
  --ch1:#2f7fc4; --ch6:#d27a1f; --ch11:#8a55c6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101419; --surface:#181e25; --sunken:#0c1014; --ink:#e7ecf1; --muted:#93a0ae; --line:#28313b;
  --accent:#3fc6ea; --accent-soft:#12313c; --on-accent:#06212a;
  --ok:#3ccf7e; --ok-soft:#123222; --warn:#f0b43a; --warn-soft:#3a2c0c; --crit:#ff6b6b; --crit-soft:#3d1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); --plane:#141a20; --grid:rgba(255,255,255,.04); --zone:#1b222a; --zone-line:#34404c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101419; --surface:#181e25; --sunken:#0c1014; --ink:#e7ecf1; --muted:#93a0ae; --line:#28313b;
  --accent:#3fc6ea; --accent-soft:#12313c; --on-accent:#06212a;
  --ok:#3ccf7e; --ok-soft:#123222; --warn:#f0b43a; --warn-soft:#3a2c0c; --crit:#ff6b6b; --crit-soft:#3d1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); --plane:#141a20; --grid:rgba(255,255,255,.04); --zone:#1b222a; --zone-line:#34404c; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.logo{display:inline-flex;align-items:center;gap:9px;color:var(--ink)}
.logo svg{flex:none;display:block}
.logo .wm{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em;line-height:1}
.logo .by{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:3px}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px}
.side .logo-slot{padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:9px;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.count{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:12px;border-radius:10px;background:var(--sunken);font-size:13px;display:flex;flex-direction:column;gap:8px}
.live{display:flex;align-items:center;gap:8px;font-weight:500}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.paused .pulse{background:var(--muted);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-align:left}

main{min-width:0;padding-block:26px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar,.tabs{display:none}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.head .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{border:0;background:none;padding:0;color:var(--muted);font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb:hover{color:var(--ink)}
.demo-tag{font-size:12px;font-weight:500;color:var(--muted);border:1px dashed var(--line);border-radius:20px;padding:4px 10px;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.sec-title h2{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.55;cursor:default}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.down{background:var(--crit-soft);color:var(--crit)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.down{background:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunken);color:var(--muted);white-space:nowrap;font-weight:500}
.chip svg{width:13px;height:13px}
.chip.scr{background:var(--accent-soft);color:var(--ink)}

.summary{display:grid;grid-template-columns:1.3fr repeat(3,1fr);overflow:hidden}
.summary>div{padding:18px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.summary>div:first-child{border-left:0}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.summary .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.summary .sub{font-size:13px;color:var(--muted)}
.health{display:flex;gap:4px;margin-top:8px;height:8px}
.health i{display:block;border-radius:4px}
.big.warn{color:var(--warn)} .big.down{color:var(--crit)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}

.alist{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:14px;padding:14px 16px 14px 0;border-top:1px solid var(--line);align-items:center}
.alert:first-child{border-top:0}
.alert .stripe{align-self:stretch;border-radius:0 4px 4px 0}
.alert.down .stripe{background:var(--crit)} .alert.warn .stripe{background:var(--warn)} .alert.done .stripe{background:var(--line)}
.alert h3{margin:0;font-size:15px;font-weight:600}
.alert .meta{font-size:13px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;margin-top:4px;align-items:center}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--ink)}
.new-flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--crit-soft)}to{background:transparent}}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sites{display:flex;flex-direction:column}
.site{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:13px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.site:first-child{border-top:0}
.site:hover{background:var(--sunken)}
.site h3{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site .meta{font-size:13px;color:var(--muted);margin-top:2px}
.typecounts{display:flex;gap:10px;flex-wrap:wrap}
.tc{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.tc svg{width:15px;height:15px}
.tc b{font-weight:500}
.tc.bad{color:var(--crit)} .tc.meh{color:var(--warn)}
.tc.bad b,.tc.meh b{font-weight:600}
.uptime{text-align:right}
.uptime b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.uptime span{display:block;font-size:11px;color:var(--muted)}
.compact .site{grid-template-columns:auto minmax(0,1fr) auto auto}
.compact .typecounts{display:none}

.sitebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.sitebar>div{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.sitebar>div:first-child{border-left:0}
.sitebar .val{font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sitebar select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-weight:500;max-width:100%}
.group h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.group h2 svg{width:16px;height:16px}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dev{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.dev:hover{border-color:var(--muted)}
.dev.down{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.dev.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.dev .row{display:flex;align-items:center;gap:8px;min-width:0}
.dev .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.dev .bm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dev .metric{font-size:12px;color:var(--muted);min-width:0;display:flex;flex-direction:column;gap:3px}
.dev .metric b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev.down .metric b{color:var(--crit)}
.bands{display:flex;gap:4px}
.band{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;background:var(--sunken);color:var(--muted)}
.band.hot{background:var(--warn-soft);color:var(--warn)}
.spark{display:block;flex:none}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:1.6}
.spark .ar{fill:var(--accent);opacity:.12}
.spark .end{fill:var(--accent)}
.spark.down .ln{stroke:var(--crit)} .spark.down .end,.spark.down .ar{fill:var(--crit)}
.spark.warn .ln{stroke:var(--warn)} .spark.warn .end,.spark.warn .ar{fill:var(--warn)}
.spark .grid{stroke:var(--line);stroke-width:1}
.spark text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.screen-card{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.screen-card .top{display:flex;align-items:flex-start;gap:14px}
.screen-card h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px}
.mini{flex:none;width:120px;aspect-ratio:16/9;max-width:100%;border-radius:7px;background:var(--w-bg);padding:5px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:3px;border:3px solid var(--ink)}
.mini i{border-radius:2px;background:var(--w-tile);border-top:2px solid var(--w-ok)}
.mini i.warn{border-top-color:var(--w-warn)} .mini i.down{border-top-color:var(--w-crit);background:var(--w-crit-bg)}
.picks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pick{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.pick:first-child{border-top:0}
.pick:hover{background:var(--sunken)}
.pick input{width:17px;height:17px;accent-color:var(--accent);margin:0;flex:none}
.pick .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .other{font-size:12px;color:var(--muted);white-space:nowrap}
.routing{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.routing>div{padding:16px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.routing>div:first-child{border-left:0}
.routing h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.routing h3 svg{width:18px;height:18px;color:var(--accent)}
.routing ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

.set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.panel{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.panel p.help{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt .t{font-weight:500}
.opt .d{font-size:13px;color:var(--muted)}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:.2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.contacts{display:flex;flex-direction:column;gap:8px}
.contact{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sunken);border-radius:9px;font-size:14px}
.contact .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.contact .x{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plan{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.plan.cur{border-color:var(--accent);background:var(--accent-soft)}
.plan b{font-family:var(--f-display);font-size:16px;font-weight:500}
.plan .pr{font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.logo-opt{border:1px solid var(--line);border-radius:12px;padding:16px 10px 12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.logo-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.logo-opt .cap{font-size:12px;color:var(--muted)}
.logo-opt .cap b{display:block;color:var(--ink);font-size:13px}
.logo-opt svg{border-radius:14px}
.ui-box{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:var(--sunken);font-size:14px}
.ui-box .ico{width:36px;height:36px;border-radius:9px;background:var(--surface);display:grid;place-items:center;flex:none;border:1px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:12px}

.scrim{position:fixed;inset:0;background:rgba(8,12,16,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:70}
.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:21px}
.sheet-h .x{margin-left:auto;border:0;background:var(--sunken);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.sheet-b{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kv div{min-width:0}
.kv .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto}
.radios{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
.radios th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.radios td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.radios tr:last-child td{border-bottom:0}
.meter{display:flex;align-items:center;gap:8px}
.meter i{display:block;height:6px;border-radius:3px;background:var(--sunken);width:70px;position:relative;overflow:hidden}
.meter i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.meter i b.hot{background:var(--warn)}
.events{display:flex;flex-direction:column;font-size:14px}
.events div{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.events div:first-child{border-top:0}
.events .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:92px;flex:none;padding-top:2px}
.chart-box{background:var(--sunken);border-radius:10px;padding:10px 10px 4px;overflow-x:auto}
.report{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.report .rh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.report .bigp{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--ok);line-height:1}
.bars{display:flex;gap:2px;height:28px;align-items:flex-end}
.bars i{flex:1;border-radius:2px;background:var(--ok)}
.bars i.w{background:var(--warn)} .bars i.d{background:var(--crit)}

/* Estados extra */
.dot.spare{background:var(--muted);opacity:.6}
.dot.unreach{background:transparent;box-shadow:inset 0 0 0 2px var(--crit)}
.pill.spare,.pill.unreach{background:var(--sunken);color:var(--muted)}
.dev.spare,.dev.unreach{border-style:dashed;opacity:.75}
.site-tabs{align-self:flex-start}
.realnote{margin:-8px 0 0;font-size:13px;color:var(--muted)}

/* Plano */
.plan-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.plan-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.plan-card{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;min-width:0}
.stage.v2d .plane{position:relative;width:100%;aspect-ratio:16/9}
.plane{background-color:var(--plane);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:5% 8.9%;border:1px solid var(--line);border-radius:10px}
.plane-name{position:absolute;right:10px;bottom:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);z-index:1}
.zone{position:absolute;border:1.5px solid var(--zone-line);border-radius:6px;background:var(--zone)}
.zone span{position:absolute;left:8px;top:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.zone.down{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,var(--zone))}
.zone.warn{border-color:color-mix(in srgb,var(--warn) 70%,var(--zone-line))}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lines line{stroke:var(--crit);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2}
.pin .pd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--f-mono);color:#fff;background:var(--ok);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pin.warn .pd{background:var(--warn)} .pin.down .pd{background:var(--crit);animation:ping 1.4s infinite} .pin.spare .pd{background:var(--muted)} .pin.unreach .pd{background:var(--surface);border-color:var(--crit)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.pin .pl{font-family:var(--f-mono);font-size:10.5px;font-weight:500;background:var(--surface);color:var(--ink);padding:0 4px;border-radius:4px;border:1px solid var(--line);line-height:1.4}
.pin.ch .pd{width:24px;height:24px}
.pin.c1 .pd{background:var(--ch1)} .pin.c6 .pd{background:var(--ch6)} .pin.c11 .pd{background:var(--ch11)}
.pin.changed .pd{outline:2px solid var(--ink);outline-offset:2px}
.pin.halo .pd{width:var(--halo);height:var(--halo);background:color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent);color:var(--ink)}
.pin.halo.down .pd,.pin.halo.spare .pd{background:var(--sunken);border-color:var(--muted);color:var(--muted)}
.editing .pin{cursor:grab;touch-action:none}
.editing .pin .pd{outline:2px dashed var(--accent);outline-offset:3px}
.stage.v3d{height:clamp(340px,50vw,600px);perspective:1500px;display:grid;place-items:center;overflow:hidden;--lift:120px}
.levels{position:relative;width:min(720px,78%);aspect-ratio:16/9;transform-style:preserve-3d;transform:rotateX(56deg) rotateZ(-30deg) translateY(-6%)}
.levels .plane{position:absolute;inset:0;transform:translateZ(calc(var(--i) * var(--lift)));box-shadow:0 30px 40px -24px rgba(0,0,0,.4)}
.levels .plane[data-level="mz"]{background:transparent;border-color:transparent;box-shadow:none}
.levels .plane[data-level="mz"] .zone{background:color-mix(in srgb,var(--zone) 88%,transparent);box-shadow:0 18px 30px -18px rgba(0,0,0,.45)}
.levels .plane-name{right:auto;bottom:auto;left:8px;top:-22px;color:var(--ink)}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;gap:6px;align-items:center}
.lg-line{display:inline-block;width:22px;border-top:2px dashed var(--crit)}
.chk{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;font-family:var(--f-mono);padding:0 5px}
.chk.c1{background:var(--ch1)} .chk.c6{background:var(--ch6)} .chk.c11{background:var(--ch11)} .chk.ring{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.plan-side{padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.plan-side h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px}
.plan-side p{margin:0}
.sstat{display:flex;gap:16px;flex-wrap:wrap}
.sstat b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.sstat .w b{color:var(--warn)} .sstat .d b{color:var(--crit)}
.chbars{display:flex;flex-direction:column;gap:8px}
.chbars div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.chbars i{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden;display:block}
.chbars i b{display:block;height:100%;background:var(--muted);border-radius:4px}
.toplist,.changes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.toplist li,.changes li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.toplist li:first-child,.changes li:first-child{border-top:0}
.unpl{display:flex;flex-direction:column;gap:6px}
.unp{display:flex;gap:8px;align-items:center;font-size:13px}
.unp span:nth-child(2){flex:1;min-width:0}
.plane.img{background-image:var(--img);background-size:contain;background-repeat:no-repeat;background-position:center}
.levels .plane.img{background-color:var(--plane)}
.w-page{font-family:var(--f-mono);font-size:13px;color:var(--w-muted)}
.form-note{font-size:13px;color:var(--muted);margin:0}
.plan-empty{padding:28px;display:flex;flex-direction:column;gap:16px}
.plan-empty h2{margin:0 0 6px;font-family:var(--f-display);font-weight:500}
.plan-empty p{margin:0}

/* Topología */
.topo-head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.topo-head p{max-width:72ch}
.topo{padding:18px;overflow-x:auto}
.t-root{display:flex;justify-content:center;padding-bottom:18px;position:relative}
.t-root::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:18px;background:var(--line)}
.t-root .tnode{min-width:min(260px,100%)}
.t-sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;border-top:2px solid var(--line);padding-top:18px}
.t-col{display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.t-col::before{content:"";position:absolute;top:-18px;left:24px;width:2px;height:18px;background:var(--line)}
.t-cap{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 0}
.t-kids{display:flex;flex-direction:column;gap:6px;margin-left:12px;padding-left:12px;border-left:2px solid var(--line)}
.t-col.down .t-kids{border-left-style:dashed;border-left-color:var(--crit)}
.tnode{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;min-width:0}
.tnode .tn{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .tm{grid-column:2;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode.big{padding:10px 12px}
.tnode.big .tn{font-weight:600}
.tnode.down{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.tnode.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.tnode.unreach,.tnode.spare{opacity:.65;border-style:dashed}
.tnode:hover{border-color:var(--muted)}

/* Revisión */
.finds{display:flex;flex-direction:column;gap:10px}
.find{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px 18px}
.find .fi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.find.warn .fi{background:var(--warn-soft);color:var(--warn)}
.find.info .fi{background:var(--accent-soft);color:var(--accent)}
.find.ok .fi{background:var(--ok-soft);color:var(--ok)}
.find h3{margin:0 0 4px;font-size:16px}
.find p{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Modo pantalla */
.wall{position:fixed;inset:0;z-index:50;background:var(--w-bg);color:var(--w-ink);overflow:auto;display:flex;flex-direction:column;gap:18px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wall .logo{color:var(--w-ink)}
.w-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.w-title{font-family:var(--f-display);font-weight:500;font-size:clamp(18px,1.6vw,26px);color:var(--w-muted)}
.w-title b{color:var(--w-ink);font-weight:700}
.w-stats{display:flex;gap:22px;margin-left:auto;align-items:baseline;flex-wrap:wrap}
.w-stat{display:flex;align-items:baseline;gap:7px;font-size:clamp(12px,.9vw,15px);color:var(--w-muted)}
.w-stat b{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,2.4vw,40px);color:var(--w-ink);font-variant-numeric:tabular-nums}
.w-stat.down b{color:var(--w-crit)} .w-stat.warn b{color:var(--w-warn)} .w-stat.ok b{color:var(--w-ok)}
.w-clock{font-family:var(--f-mono);font-size:clamp(20px,2vw,32px);font-variant-numeric:tabular-nums}
.w-exit{border:1px solid var(--w-line);background:var(--w-tile);color:var(--w-ink);border-radius:9px;padding:8px 14px;font-weight:500}
.w-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;flex:1;align-content:start}
.tile{background:var(--w-tile);border:1px solid var(--w-line);border-radius:14px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-width:0;text-align:left;color:inherit}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--w-ok)}
.tile.warn::before{background:var(--w-warn)}
.tile.down::before{background:var(--w-crit)}
.tile.down{border-color:color-mix(in srgb,var(--w-crit) 60%,var(--w-line));animation:alarm 1.6s ease-in-out infinite}
@keyframes alarm{50%{background:var(--w-crit-bg)}}
.tile .t-top{display:flex;align-items:flex-start;gap:10px}
.tile h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,1.5vw,24px);letter-spacing:-.01em;line-height:1.15}
.tile .city{font-size:13px;color:var(--w-muted);margin-top:2px}
.tile .state{margin-left:auto;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.tile.ok .state{color:var(--w-ok)} .tile.warn .state{color:var(--w-warn)} .tile.down .state{color:var(--w-crit)}
.tile .types{display:flex;flex-wrap:wrap;gap:6px 16px}
.tile .ty{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:15px;color:var(--w-muted)}
.tile .ty svg{width:17px;height:17px}
.tile .ty b{color:var(--w-ink);font-weight:500}
.tile .ty.bad,.tile .ty.bad b{color:var(--w-crit)} .tile .ty.meh,.tile .ty.meh b{color:var(--w-warn)}
.tile .probs{display:flex;flex-direction:column;gap:5px;font-size:14px}
.tile .probs div{display:flex;gap:8px;align-items:baseline}
.tile .probs .dot{width:8px;height:8px}
.tile .probs .dot.down{background:var(--w-crit)} .tile .probs .dot.warn{background:var(--w-warn)}
.tile .probs span.w{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--w-muted);white-space:nowrap}
.tile .okline{font-size:14px;color:var(--w-muted)}
.tile .foot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--w-muted);font-family:var(--f-mono)}
.w-ticker{display:flex;gap:28px;font-size:14px;color:var(--w-muted);border-top:1px solid var(--w-line);padding-top:12px;overflow:hidden;white-space:nowrap}
.w-ticker b{color:var(--w-ink);font-weight:500}

.toasts{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;width:min(370px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;animation:tin .25s ease-out}
.toast .dot{margin-top:5px}
.toast small{display:block;opacity:.75;font-size:12px;margin-top:2px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  html{scroll-padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-block:11px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
  .topbar .live{margin-left:auto;font-size:13px}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 0;position:relative}
  .tabs button svg{width:23px;height:23px}
  .tabs button[aria-current="page"]{color:var(--accent)}
  .tabs .count{position:absolute;top:0;left:calc(50% + 5px);min-width:18px;height:17px;font-size:11px;padding:0 5px}
  .head h1{font-size:26px}
  .summary{grid-template-columns:repeat(4,1fr)}
  .sitebar{grid-template-columns:1fr 1fr}
  .sitebar>div:nth-child(3){border-left:0}
  .sitebar>div:nth-child(n+3){border-top:1px solid var(--line)}
  .grid2,.set,.screens,.routing{grid-template-columns:minmax(0,1fr)}

  .routing>div:first-child{border-top:0}
  .site,.compact .site{grid-template-columns:auto minmax(0,1fr) auto}
  .site .typecounts{grid-column:2/4}
  .site .watch{grid-column:2/4}
  .site .uptime{grid-row:1;grid-column:3}
  .alert{grid-template-columns:4px 1fr}
  .alert .acts{grid-column:2;justify-content:flex-start}
  .kv{grid-template-columns:1fr 1fr}
  .plans{grid-template-columns:1fr}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .toasts{right:auto;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .w-stats{margin-left:0;width:100%;order:3}
}
@media (max-width:860px){.plan-wrap{grid-template-columns:minmax(0,1fr)}.stage.v3d{--lift:56px}.levels{width:92%}}
@media (max-width:600px){.pin .pl{display:none}.zone span{font-size:10px;left:4px;top:3px}
  .summary{grid-template-columns:1fr 1fr}
  .summary>div:nth-child(3){border-left:0}
  .summary>div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:420px){.fields{grid-template-columns:1fr}.devs{grid-template-columns:1fr}.logos{gap:6px}.mini{width:90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div class="app" id="app">
  <aside class="side">
    <span class="logo-slot" data-size="30" data-by="1"></span>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="live"><span class="pulse"></span><span id="liveTxt">En vivo · UniFi cada 60 s</span></div>
      <button class="linkbtn" id="toggleSim" type="button">Pausar simulación</button>
      <span class="muted" style="font-size:12px">Demo con datos de ejemplo. Los clientes y equipos son ficticios.</span>
    </div>
  </aside>
  <div style="min-width:0">
    <header class="topbar"><span class="logo-slot" data-size="24"></span><div class="live"><span class="pulse"></span><span>En vivo</span></div></header>
    <main><div class="wrap" id="view"></div></main>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="wall"></div>
<div id="modal"></div>
<input type="file" id="planFile" accept="image/*" hidden aria-label="Imagen del plano">
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  panel:sv('<path d="M3 12h4l3-8 4 16 3-8h4"/>'),

function spark(hist,status,w=118,h=34,axis=false){
  const vals = hist.filter(v=>v!=null); const max = Math.max(...vals, 10)*1.15;
  const pad = axis?28:2, step = (w-pad-2)/(hist.length-1);
  const pts = hist.map((v,i)=>v==null?null:[pad+i*step, h-3-(v/max)*(h-8)]);
  let dPath='', started=false, last=null;
  pts.forEach(p=>{ if(!p){started=false;return;} dPath += (started?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); started=true; last=p; });
  const v = pts.filter(Boolean);
  const aPath = v.length ? 'M'+v[0][0]+' '+(h-3)+' '+v.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' L'+v[v.length-1][0]+' '+(h-3)+'Z' : '';
  let g='';
  if(axis){ [0,.5,1].forEach(f=>{const y=h-3-f*(h-8); g+=`<line class="grid" x1="${pad}" x2="${w-2}" y1="${y}" y2="${y}"/><text x="0" y="${y+3}">${Math.round(max*f)}</text>`;}); }
  const endDot = last ? `<circle class="end" cx="${last[0]}" cy="${last[1]}" r="2.6"/>` : '';
  const downX = status==='down' && axis ? `<text x="${w-82}" y="12" style="fill:var(--crit)">sin respuesta</text>`:'';
  return `<svg class="spark ${status}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${g}<path class="ar" d="${aPath}"/><path class="ln" d="${dPath}"/>${endDot}${downX}</svg>`;
}

    return `<span class="${cls} ${bad?'bad':meh?'meh':''}" title="${TYPES[t].many}">${I[t]}<b>${bad?bad+'/':''}${l.length}</b></span>`;}).join('');

function route(){
  const h=(location.hash||'#panel').slice(1); let m;
  if((m=h.match(/^pantalla-(p\d+)$/)) && screen(m[1])){ openWall(m[1], true); return; }
  S.wall=null;
  if((m=h.match(/^cliente-(c\d+)$/)) && site(m[1])){ go('sitios', m[1], true); return; }
  const v = Object.keys(VIEW2HASH).find(k=>VIEW2HASH[k]===h);
  go(v||'panel', null, true);
}

const nCl = x => x.radios && x.status!=='down' && !x.unreach && !x.spare ? x.radios.reduce((a,r)=>a+r.cl,0) : 0;
const shortName = x => x.name.split(' - ')[0];
function conflicts(id, chOf, thr=19){
  const aps = siteDevs(id).filter(x=>x.type==='ap'&&x.pos&&x.radios&&!x.spare&&x.status!=='down'&&!x.unreach), out=[];
  for(let i=0;i<aps.length;i++) for(let j=i+1;j<aps.length;j++){ const a=aps[i], b=aps[j]; if(a.pos[2]!==b.pos[2]) continue;
    const dd = Math.hypot(a.pos[0]-b.pos[0], (a.pos[1]-b.pos[1])*.56); if(dd<thr && chOf(a)===chOf(b)) out.push([a,b,dd]); }
  return out;
}
function getProp(id){
  if(S.prop[id]) return S.prop[id];
  const aps = siteDevs(id).filter(x=>x.type==='ap'&&x.pos&&x.radios&&!x.spare&&x.status!=='down');
  const near = (a,b) => a.pos[2]===b.pos[2] ? Math.hypot(a.pos[0]-b.pos[0],(a.pos[1]-b.pos[1])*.56) : 99;
  const deg = a => aps.filter(b=>b!==a && near(a,b)<30).length;
  const order = [...aps].sort((a,b)=>deg(b)-deg(a)), res = {};
  order.forEach(a=>{ let best=a.radios[0].ch, bs=1e9;
    [1,6,11].forEach(c=>{ let sc = c===a.radios[0].ch ? -0.06 : 0; order.forEach(b=>{ if(res[b.id]===c){ const dd=near(a,b); if(dd<30) sc += 1/Math.max(dd,1); } }); if(sc<bs){ bs=sc; best=c; } });
    res[a.id]=best; });
  return S.prop[id]=res;
}

function findings(s){

    } else F.push({sev:'ok', title:'Ningún par de AP cercanos comparte canal en 2,4 GHz', text:'Los canales 1, 6 y 11 están bien repartidos.'});
    const p5 = conflicts(s.id, x=>x.radios[1].ch, 14);
    if(p5.length) F.push({sev:'info', title:`${p5.length===1?'Un par':p5.length+' pares'} de AP cercanos en el mismo canal de 5 GHz`, text:p5.map(([a,b])=>`${esc(shortName(a))} y ${esc(shortName(b))} usan el ${a.radios[1].ch}`).join('; ')+'. En 5 GHz molesta menos, pero conviene separarlos.'});
  } else if(top && top[1]>=3) F.push({sev:'info', title:`${top[1]} AP en el canal ${top[0]} de 2,4 GHz`, text:'Subí el plano del lugar para ver cuáles están cerca y se pisan.', act:`<button class="btn sm" type="button" data-stab="plano">Subir plano</button>`});
  aps.filter(a=>a.radios.some(r=>r.util>80)).forEach(a=>F.push({sev:'warn', title:`Canal saturado en ${esc(a.name)}`, text:`El canal de 2,4 GHz está ocupado al ${a.radios[0].util} %. Revisá interferencias o pasá clientes a 5 y 6 GHz.`}));
  const upd = ds.filter(x=>x.upd); if(upd.length) F.push({sev:'info', title:`${upd.length} equipo${upd.length>1?'s':''} con firmware nuevo disponible`, text:upd.map(x=>esc(x.name)).join(', ')+'.'});

  const sp = ds.filter(x=>x.spare); if(sp.length) F.push({sev:'info', title:`${sp.length} equipo${sp.length>1?'s':''} marcado${sp.length>1?'s':''} como repuesto`, text:`${sp.map(x=>esc(x.name)).join(' y ')} figura${sp.length>1?'n':''} offline en UniFi, pero son de prueba o repuesto. Ondi no avisa por ellos ni los cuenta en la disponibilidad.`});
  const apsAll = ds.filter(x=>x.type==='ap'), conv = apsAll.filter(x=>/^\d+\s*-/.test(x.name));
  if(conv.length > apsAll.length/2){ const bad = apsAll.filter(x=>!new RegExp('^'+x.ip.split('.').pop()+'\\s*-').test(x.name));
    F.push(bad.length ? {sev:'info', title:`${bad.length} equipo${bad.length>1?'s':''} fuera de la convención de nombres`, text:`El resto se llama «final de la IP · modelo · ubicación». Revisá: ${bad.map(x=>esc(x.name)+' ('+x.ip+')').join(', ')}.`} : {sev:'ok', title:'Nombres consistentes', text:'Todos los AP empiezan con el final de su IP.'}); }

  ds.filter(x=>x.type==='sw'&&x.status==='warn').forEach(x=>F.push({sev:'warn', title:`PoE cerca del límite en ${esc(x.name)}`, text:esc(x.mval)+'.'}));

function loadPlanImage(file, cb){
  const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = ()=>{ const W=1600, k=Math.min(1, W/img.width); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',.82)); };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast('No pude leer esa imagen','Probá con un JPG o PNG','down'); };
  img.src = url;

function recover(x,why){
  x.status='ok'; x.lat=x.base; x.hist[x.hist.length-1]=x.base;
  if(x.type==='sw') topoKids(x).forEach(k=>k.unreach=false);
  if(x.type==='cam' && x.mval==='Sin señal') x.mval='4K · grabando';
  if(x.type==='ap' && x.mval==='Desconectado'){ x.mval='9 conectados'; x.uptime='recién'; }
  ALERTS.filter(a=>a.dev===x.id && a.state!=='done').forEach(a=>{ a.state='done'; a.dur=Math.max(1,Math.round((Date.now()-a.at)/60000))+' min'; });
  toast(`${x.name} volvió a funcionar`, why || site(x.site).name);
  render();
}

  if(!S.sim) return;
  tick++;
  DEV.forEach(x=>{ if(x.status==='down'||x.unreach) return; const v=Math.max(1,Math.round(x.base*(0.7+Math.random()*0.6))+(x.latHigh?300:0)); x.lat=v; x.hist.push(v); x.hist.shift(); });
  if(tick%8===3 && !simDev){
    const [sid,name] = SIMS[Math.floor(tick/8)%2];
    const cand = devBy(sid,name); const s = site(sid);
    if(!cand || cand.spare || cand.unreach || cand.status==='down') return;
    simDev = cand;
    simDev.status='down'; simDev.lat=null; simDev.hist[23]=null; simDev.mval='Desconectado'; simDev.uptime='—';
    const a = {id:++aid, dev:simDev.id, sev:'down', title:'Access Point desconectado', at:Date.now(), state:'open', notified:routeFor(sid,'down'), ticket:S.cfg.olumi?'OL-'+(ticketN++):null};
    ALERTS.push(a); S.flash=a.id;
    toast(`${name} desconectado`, `${s.name} · ${s.screen?'se ve en '+screen(s.screen).name+' y push al iPhone':a.notified.join(' y ')}${a.ticket?' · ticket '+a.ticket:''}`,'down');
  } else if(tick%8===7 && simDev){ const x=simDev; simDev=null; recover(x, site(x.site).name+' · se recuperó solo'); return; }
  const typing = (document.activeElement && document.activeElement.id==='q') || S.editPins || drag;
  const sig = signature();
  if(sig!==lastSig){ lastSig=sig; if(!$('#modal').innerHTML && !typing) render(); else { renderNav(); renderWall(); } }
  else patchLive();
}, 3000);
/* Firma del estado visible: si no cambia, no se redibuja la vista (así no se pierden clics ni hover). */
let lastSig = '';
function signature(){
  return [ DEV.map(x=>x.status+(x.spare?'s':'')+(x.unreach?'u':'')+x.mval).join(','), ALERTS.map(a=>a.id+a.state+(a.ticket||'')).join(','),
    SITES.map(s=>s.id+(s.screen||'')+(s.discovering?'d':'')).join(','), SCREENS.length, S.contacts.length, Math.floor(Date.now()/60000) ].join('|');
}
/* Entre cambios, solo se actualizan en el lugar las latencias y los gráficos de respuesta. */
function patchLive(){
  document.querySelectorAll('.dev[data-dev]').forEach(el=>{ const x=dev(el.dataset.dev); if(!x || x.status==='down' || x.unreach || x.spare) return;
    const lat=el.querySelector('.row .mono'); if(lat) lat.textContent=x.lat+' ms';
    const sp=el.querySelector('.spark'); if(sp) sp.outerHTML=spark(x.hist,x.status); });
}

let booted=false;
function boot(){ if(!booted){ booted=true; render(); } route(); }
boot();
</script>
