<meta charset="utf-8">

<style>
:root{--bg:#F6F5F2;--fg:#1E1F23;--muted:#5E6068;--card:#fff;--line:#E4E2DC;--acc:#C2560A}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:32px 16px}

a.card b{display:block;font-size:20px}
a.card span{color:var(--muted);font-size:15px}
