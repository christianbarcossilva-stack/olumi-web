<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="kliva-mode" content="demo">
<meta name="robots" content="noindex">
<link rel="icon" href="../icono.svg">
<meta name="theme-color" content="#030304">
<title>Kliva</title>
<script>
// Antes de dibujar: día o noche, color y transparencia que eligió la persona en este dispositivo.
(() => {
  const root = document.documentElement;
  let look = {};
  try { look = JSON.parse(localStorage.getItem('kliva.look') || '{}'); } catch { /* sin almacenamiento */ }
  root.dataset.mode = look.mode || root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if (look.solid) root.dataset.solido = '';
  if (look.plain) root.dataset.fondo = 'liso';
  if (look.accent) { root.style.setProperty('--accent', look.accent); root.style.setProperty('--accent-fg', look.fg || '#1E1F23'); }
  if (new URLSearchParams(location.search).has('cine')) root.dataset.cine = '';
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Kliva · identidad de la familia Olumi (claude/olumi-identidad.md) con su propio color de punto.
   Negro, vidrio y el violeta del punto del logo: el color que no usa ninguna de las marcas que Kliva maneja.
   Un solo trazo de ícono (1,8), una sola escala de esquinas (8 · 12 · 16 · 20 · cápsula; 26 y 30 en fichas y menú)
   y un solo movimiento (la pastilla se estira, la pantalla aterriza, los íconos se dibujan, el punto late).
   Pieza propia de Kliva: la puerta dibujada como en un plano, sobre la línea del muro. */
:root {
  --accent: #9D7CFF; --accent-fg: #1E1F23;
  --mo: cubic-bezier(.22, 1, .36, 1); --t1: .14s; --t2: .34s; --t3: .55s;
  --text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hanken Grotesk', 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  --glow: color-mix(in srgb, var(--accent) 36%, transparent);
}
:root[data-mode="light"] {
  color-scheme: light;
  --bg: #E3E6EA; --fg: #15171B; --muted: #454A56; --faint: #575D6A;
  --surface: rgb(255 255 255 / .46); --surface-2: rgb(16 20 28 / .05); --line: rgb(16 20 28 / .1);
  --thick: rgb(244 246 249 / .78); --bar: rgb(248 249 251 / .72); --pop: rgb(250 251 253 / .92);
  --sheen: rgb(255 255 255 / .55); --field: rgb(255 255 255 / .6);
  --rim: linear-gradient(135deg, rgb(255 255 255 / .98) 0%, rgb(255 255 255 / .45) 22%, rgb(255 255 255 / .1) 50%, rgb(255 255 255 / .35) 78%, rgb(255 255 255 / .95) 100%);
  --gl-shadow: inset 0 1px 1px rgb(255 255 255 / .9), 0 0 0 .5px rgb(20 24 32 / .07), 0 2px 5px rgb(20 24 32 / .05), 0 22px 44px -16px rgb(20 24 32 / .2);
  --blur: 22px; --sat: 185%;
  --accent-ink: color-mix(in srgb, var(--accent) 58%, #000);
  --pass: #08552F; --deny: #A01F18; --warn: #6E3D00; --off: #7C8494;
  --pass-wash: rgb(11 107 61 / .11); --deny-wash: rgb(179 38 30 / .09); --warn-wash: rgb(160 96 0 / .12);
  --atmos: radial-gradient(34vmax 28vmax at 94% 98%, var(--glow), transparent 70%), radial-gradient(36vmax 28vmax at 8% 4%, #fff, transparent 70%),
    radial-gradient(42vmax 30vmax at 82% 8%, rgb(150 166 192 / .5), transparent 70%), linear-gradient(160deg, #EDEFF2, #D3D7DE);
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --bg: #030304; --fg: #F3F4F6; --muted: #B9BEC9; --faint: #8D93A0;
  --surface: rgb(40 42 48 / .36); --surface-2: rgb(255 255 255 / .065); --line: rgb(255 255 255 / .1);
  --thick: rgb(16 17 20 / .74); --bar: rgb(14 15 18 / .7); --pop: rgb(26 28 33 / .94);
  --sheen: rgb(255 255 255 / .07); --field: rgb(255 255 255 / .06);
  --rim: linear-gradient(135deg, rgb(255 255 255 / .34) 0%, rgb(255 255 255 / .09) 24%, rgb(255 255 255 / .02) 52%, rgb(255 255 255 / .07) 78%, rgb(255 255 255 / .2) 100%);
  --gl-shadow: inset 0 1px 0 rgb(255 255 255 / .12), 0 0 0 .5px rgb(0 0 0 / .6), 0 24px 48px -16px rgb(0 0 0 / .8);
  --blur: 24px; --sat: 170%;
  --accent-ink: color-mix(in srgb, var(--accent) 62%, #fff);
  --pass: #55D69B; --deny: #FF8A7F; --warn: #F0BE62; --off: #7B8291;
  --pass-wash: rgb(74 203 144 / .15); --deny-wash: rgb(255 110 98 / .16); --warn-wash: rgb(232 183 90 / .16);
  --atmos: radial-gradient(38vmax 30vmax at 92% 96%, var(--glow), transparent 70%), radial-gradient(36vmax 28vmax at 6% 0%, rgb(150 160 180 / .15), transparent 70%), #030304;
}
:root[data-fondo="liso"] { --atmos: var(--bg); }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overflow: hidden; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--atmos); }
#root { height: 100%; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.022em; line-height: 1.12; text-wrap: balance; }
h1 { font-size: 34px; }
h2 { font-size: 19px; letter-spacing: -.015em; }
h3 { font-size: 15px; letter-spacing: -.01em; }
p { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: .92em; }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── Vidrio ────────────────────────────────────────────────────────────── */
.card, .side, .top, .dock, .sheet-panel, .palette-box, .gate-card {
  border: 1px solid transparent;
  background: linear-gradient(180deg, var(--sheen), transparent 46%) padding-box, linear-gradient(var(--surface), var(--surface)) padding-box, var(--rim) border-box;
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat)); backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  box-shadow: var(--gl-shadow);
}
.side, .top, .dock { background: linear-gradient(180deg, var(--sheen), transparent 40%) padding-box, linear-gradient(var(--bar), var(--bar)) padding-box, var(--rim) border-box; }
.sheet-panel, .palette-box, .gate-card { background: linear-gradient(180deg, var(--sheen), transparent 30%) padding-box, linear-gradient(var(--thick), var(--thick)) padding-box, var(--rim) border-box; }
:root[data-solido] :is(.card, .side, .top, .dock, .sheet-panel, .palette-box, .gate-card) { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--pop) padding-box, var(--rim) border-box; }

/* ── Marca ─────────────────────────────────────────────────────────────── */
.mark { flex: none; width: 38px; height: 38px; border-radius: 12px; background: #1E1F23; box-shadow: inset 0 1px 0 rgb(255 255 255 / .14), 0 6px 16px rgb(0 0 0 / .25); }
.mark svg { display: block; width: 100%; height: 100%; fill: none; stroke: #F3F4F6; stroke-linecap: round; }
.mark .stem { stroke-width: 3.2; }
.mark .leaf { stroke-width: 2.4; }
.mark .arc { stroke-width: 1.4; stroke-dasharray: 1.6 2.4; opacity: .6; }
.mark .dot { fill: var(--accent); stroke: none; transform-box: fill-box; transform-origin: center; }
.mark.beat .dot { animation: beat .7s var(--mo); }
@keyframes beat { 40% { transform: scale(1.7); } }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand b { display: block; font-weight: 700; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; color: var(--muted); font-size: 12.5px; }

/* ── Estructura ────────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
.side { display: flex; flex-direction: column; gap: 10px; width: 264px; margin: 14px 0 14px 14px; padding: 16px 12px 12px; border-radius: 30px; overflow: hidden auto; scrollbar-width: none; transition: width var(--t3) var(--mo); }
.side-head { display: flex; align-items: center; gap: 8px; padding: 0 4px 2px; }
.side-head .brand { flex: 1 1 auto; }
.fold { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--muted); transition: transform var(--t3) var(--mo); }
kbd { font: 600 11.5px var(--text); padding: 3px 7px; border-radius: 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.menu { position: relative; flex: 1 0 auto; display: flex; flex-direction: column; gap: 2px; }
.menu-label { margin: 14px 0 4px; padding: 12px 12px 0; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.nav { position: relative; z-index: 1; display: flex; align-items: center; gap: 13px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--fg); text-decoration: none; font-weight: 500; white-space: nowrap; transition: color var(--t2), transform var(--t1) var(--mo); }
.nav:active { transform: scale(.975); }
.nav > span:first-of-type { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.nav[aria-current="page"] { color: var(--accent-fg); font-weight: 600; }
.count { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--deny); color: #fff; font-size: 11.5px; font-weight: 700; line-height: 20px; text-align: center; }
:root[data-mode="dark"] .count { color: #1E1F23; }
.pill { position: absolute; z-index: 0; border-radius: 999px; pointer-events: none; opacity: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff) 0%, var(--accent) 52%, color-mix(in srgb, var(--accent) 91%, #000) 100%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), inset 0 -1px 0 rgb(0 0 0 / .12), 0 6px 18px var(--glow);
  transition: top var(--pa, .34s) var(--mo), bottom var(--pb, .55s) var(--mo), left var(--pa, .34s) var(--mo), right var(--pb, .55s) var(--mo), opacity .25s; }
.pill.on { opacity: 1; }
.side-foot { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.me { display: flex; align-items: center; gap: 11px; padding: 6px 8px; border: 0; border-radius: 16px; background: none; text-align: left; min-width: 0; }
.me:hover { background: var(--surface-2); }
.me > span:nth-child(2) { flex: 1 1 auto; min-width: 0; }
.me b, .me small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me small { color: var(--muted); font-size: 12.5px; }
/* Qué empresa y qué área se está mirando: debajo de la marca, como el selector de espacio de trabajo. */
.me.scope { width: 100%; gap: 10px; padding: 7px 8px; box-shadow: inset 0 0 0 1px var(--line); }
.me.scope b { font-size: 14.5px; }
.me.scope .badge { width: 32px; height: 32px; border-radius: 12px; color: var(--accent-ink); background: var(--accent-soft); box-shadow: none; }
.me.scope:disabled { opacity: 1; cursor: default; background: none; }
.title-pick { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 44px; padding: 0; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-align: left; }
.title-pick .i { flex: none; width: 22px; height: 22px; color: var(--muted); transition: color var(--t2); }
.title-pick:hover .i { color: var(--fg); }
.row .tick { flex: none; color: var(--accent-ink); }
.row[aria-pressed="true"] strong { color: var(--accent-ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
/* Control de horario: el resumen del período y los días del turno. */
.card.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 0; }
.tally > div { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; }
.tally > div + div { box-shadow: inset 1px 0 0 var(--line); }
.tally strong { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.tally span { color: var(--muted); font-size: 13.5px; }
.tally [data-tone="warn"] strong { color: var(--warn); }
.tally [data-tone="deny"] strong { color: var(--deny); }
.days { display: flex; gap: 8px; flex-wrap: wrap; }
.days label { position: relative; cursor: pointer; }
.days input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.days span { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-weight: 700; transition: background var(--t2), color var(--t2); }
.days input:checked + span { background: var(--accent); color: var(--accent-fg, #fff); box-shadow: none; }
.days input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) {
  .card.tally { grid-template-columns: 1fr 1fr; }
  .tally > div:nth-child(3) { box-shadow: inset 0 1px 0 var(--line); }
  .tally > div:nth-child(4) { box-shadow: inset 1px 0 0 var(--line), inset 0 1px 0 var(--line); }
  .tally strong { font-size: 26px; }
}
.switch { position: relative; flex: none; width: 40px; height: 24px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); transition: background var(--t2); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform var(--t2) var(--mo); }
[aria-checked="true"] > .switch, [aria-pressed="true"] > .switch { background: var(--pass); }
[aria-checked="true"] > .switch::after, [aria-pressed="true"] > .switch::after { transform: translateX(16px); }

.app[data-nav="mini"] .side { width: 68px; padding-inline: 10px; }
.app[data-nav="mini"] :is(.brand > span:not(.mark), kbd, .nav > span, .menu-label, .me > span:nth-child(2), .me > .i, .nav .switch) { display: none; }
.app[data-nav="mini"] .side-head { flex-direction: column; gap: 10px; padding: 0; }
/* Plegado, el logo de Kliva se queda arriba, como en Olumi */
.app[data-nav="mini"] .side-head .brand { flex: none; gap: 0; }
.app[data-nav="mini"] .fold { transform: rotate(180deg); }
.app[data-nav="mini"] :is(.nav, .me) { justify-content: center; padding-inline: 0; gap: 0; }
.app[data-nav="mini"] .menu-label { display: block; height: 0; margin: 8px 6px; padding: 0; overflow: hidden; }

.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 10px; margin: 14px 16px 0; padding: 8px; border-radius: 26px; }
.top .mark { display: none; }
/* Barra de arriba como la de Olumi: el título de la pantalla, la búsqueda que quedó puesta y una lupa */
.top-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 6px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.top-q { flex: 0 1 auto; min-width: 0; display: flex; }
.top:has(.top-chip) .top-title { flex: 0 1 auto; }
.view-head.plain > div:first-child > h1 { display: none; }
.top-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 36px; padding: 0 8px 0 14px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); color: var(--fg); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.top-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-chip .i { flex: none; width: 18px; height: 18px; color: var(--muted); }
.top-search { flex: 1 1 auto; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--muted); text-align: left; }
.top-search span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.round { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); transition: transform var(--t1) var(--mo), background var(--t2); }
.round:active { transform: scale(.94); }
.round .count { position: absolute; top: -3px; right: -3px; box-shadow: 0 0 0 2px var(--bg); }
.main { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }
.view { max-width: 1240px; padding: 30px 30px 72px; display: flex; flex-direction: column; gap: 20px; }
.view-head { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; }
/* Plano: el motor común ocupa todo lo que queda de la pantalla; con pantalla completa, todo */
.main.fixed { overflow: hidden; display: flex; flex-direction: column; }
.main.fixed > .view.full { flex: 1; min-height: 0; height: auto; }
.view.full { max-width: none; height: 100%; padding-bottom: 24px; }
.plano { position: relative; flex: 1 1 auto; min-height: 360px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--pop); }
.plano iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.plano .empty { margin: 24px; }
:root.plano-full .plano { position: fixed; inset: 0; z-index: 60; border: 0; border-radius: 0; }
.view-head > div:first-child { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lede { color: var(--muted); font-size: 16px; line-height: 1.5; max-width: 68ch; }
.lede b { color: var(--fg); font-weight: 600; }
.lede .bad { color: var(--deny); font-weight: 500; }
.lede .wait { color: var(--warn); font-weight: 500; }
.note { align-self: flex-start; padding: 5px 12px; border-radius: 999px; background: var(--warn-wash); color: var(--warn); font-size: 13px; font-weight: 600; }
.dock { display: none; }

@media (prefers-reduced-motion: no-preference) {
  .view.land > * { animation: land var(--t3) var(--mo) both; }
  .view.land > :nth-child(2) { animation-delay: 60ms; }
  .view.land > :nth-child(3) { animation-delay: 120ms; }
  .view.land > :nth-child(4) { animation-delay: 180ms; }
  .view.land > :nth-child(n+5) { animation-delay: 240ms; }
  @keyframes land { from { opacity: 0; transform: translateY(14px) scale(.985); } }
  .nav[aria-current="page"] .i > *, .dock a[aria-current="page"] .i > * { stroke-dasharray: 1; animation: draw .7s var(--mo); }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
}

@media (max-width: 899px) {
  /* En el celular el título va en la barra (como en Olumi) y la explicación de cada pantalla no ocupa lugar arriba */
  .top-title { padding-left: 0; font-size: 19px; }
  /* con una búsqueda puesta, la búsqueda ocupa el lugar del título (la pantalla ya se ve abajo, marcada) */
  .top:has(.top-chip) .top-title { display: none; }
  .top-q { flex: 1 1 auto; }
  .view-head.plain > div:first-child { display: none; }
  .view-head.plain:not(:has(> :nth-child(2))) { display: none; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .top { margin: 0; padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top)); border: 0; border-bottom: 1px solid var(--line); border-radius: 0; box-shadow: none; background: var(--bar); }
  .top .mark { display: block; }
  .top .btn.pri { width: 44px; min-width: 44px; padding: 0; }
  .top .btn.pri span { display: none; }
  .view { padding: 20px 16px 128px; gap: 16px; }
  #alarm { padding: 10px 12px 0; }
  #alarm:not(:empty) + .view { padding-top: 16px; }
  .view.full { padding: 14px 12px calc(86px + env(safe-area-inset-bottom)); gap: 12px; }
  .view.full .view-head .lede { display: none; }
  .plano { min-height: 300px; border-radius: 16px; }
  .wall { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .dock { --bar: color-mix(in srgb, var(--pop) 88%, transparent); }
  h1 { font-size: 30px; }
  .dock { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; padding: 6px; border-radius: 30px; }
  .dock a, .dock button { position: relative; z-index: 1; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; border: 0; border-radius: 999px; background: none; color: var(--fg); text-decoration: none; font-size: 11.5px; font-weight: 600; }
  .dock [aria-current="page"] { color: var(--accent-fg); }
  .dock .count { position: absolute; top: 2px; left: calc(50% + 6px); }

}

/* ── Botones, campos y selectores ──────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--fg);
  background: linear-gradient(180deg, var(--sheen), transparent 60%), var(--surface-2); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 var(--sheen);
  transition: transform var(--t1) var(--mo), background-color .2s, box-shadow .2s, opacity .2s; }
.btn:active { transform: scale(.965); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.pri, .btn.go[data-armed] { color: var(--accent-fg);
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff) 0%, var(--accent) 52%, color-mix(in srgb, var(--accent) 91%, #000) 100%);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), inset 0 -1px 0 rgb(0 0 0 / .12), 0 6px 18px var(--glow); }
.btn.danger { color: var(--deny); }
.btn.danger[data-armed] { background: var(--deny); color: var(--bg); box-shadow: none; }
.btn.go[data-armed] { --accent: var(--pass); --glow: transparent; color: var(--bg); }
.btn.wide { width: 100%; min-height: 52px; font-size: 16px; }
/* Elegir un archivo: el botón es la etiqueta; el campo del navegador queda debajo, invisible, para que siga andando con teclado */
.btn.file { position: relative; justify-content: flex-start; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.btn.file span { overflow: hidden; text-overflow: ellipsis; }
.btn.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-weight: 600; font-size: 14px; }
.field small, .hint { color: var(--muted); font-size: 13px; line-height: 1.4; }
input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="url"], input[type="datetime-local"], input[type="date"], input[type="time"], input[type="tel"], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 13px; border: 0; border-radius: 12px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); }
select { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
textarea { min-height: 80px; resize: vertical; }
:is(input, select, textarea):focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--accent-ink); }
::placeholder { color: var(--faint); opacity: 1; }
.form { display: flex; flex-direction: column; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.form-actions .push { margin-left: auto; }
.form-error { color: var(--deny); font-weight: 500; }
.form-error:empty { display: none; }
.check { display: flex; align-items: flex-start; gap: 11px; padding: 8px 0; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.check small { display: block; color: var(--muted); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.seg { position: relative; display: inline-flex; align-self: flex-start; max-width: 100%; padding: 4px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow-x: auto; scrollbar-width: none; }
.seg-in { position: relative; display: inline-flex; }
.seg button { position: relative; z-index: 1; flex: none; min-height: 40px; padding: 0 15px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-weight: 600; font-size: 14px; transition: color var(--t2); }
.seg button[aria-pressed="true"] { color: var(--fg); }
.seg .pill { background: var(--pop); box-shadow: inset 0 0 0 1px var(--line), 0 2px 8px rgb(0 0 0 / .14); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--c); box-shadow: inset 0 1px 0 rgb(255 255 255 / .4), inset 0 0 0 1px rgb(0 0 0 / .12); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
.swatch.custom { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--surface-2); color: var(--muted); }
.swatch.custom input { position: absolute; inset: -8px; width: 60px; height: 60px; opacity: 0; cursor: pointer; }

/* ── Tarjetas y renglones ──────────────────────────────────────────────── */
.card { border-radius: 20px; padding: 18px 20px 20px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card.flush { padding-bottom: 6px; }
.card-head { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
.card-head > :first-child { flex: 1 1 auto; min-width: 0; }
.back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 6px -4px; padding: 4px 8px 4px 2px; border: 0; border-radius: 999px; background: none; color: var(--accent-ink, var(--accent)); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
.back .i { width: 18px; height: 18px; }
@media (max-width: 899px) { .back { min-height: 44px; margin-block: -6px 0; } }
.back:hover { background: var(--surface-2); }
/* Ficha de cliente (instaladora mirando todas las empresas): la ficha entera se toca */
.card.client { width: 100%; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; gap: 10px; transition: transform var(--t2) var(--mo); }
.card.client:active { transform: scale(.99); }
.card.client:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.card.client > .card-head { flex-wrap: nowrap; align-items: flex-start; }
.card.client > .card-head > .i { margin-top: 4px; flex: none; width: 20px; height: 20px; color: var(--muted); }
.client-name { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; }
.client-name b { font-size: 19px; font-weight: 700; letter-spacing: -.015em; }
.client-name small { grid-column: 2; }
.health { width: 10px; height: 10px; border-radius: 50%; background: var(--pass); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pass) 18%, transparent); }
.health[data-tone="deny"] { background: var(--deny); box-shadow: 0 0 0 4px color-mix(in srgb, var(--deny) 18%, transparent); }
.client-line { color: var(--muted); font-size: 15px; line-height: 1.5; }
.client-line b { color: var(--fg); font-weight: 600; }
.client-line .bad { color: var(--deny); font-weight: 500; }
.card-head small { display: block; color: var(--muted); font-size: 13.5px; font-weight: 400; letter-spacing: 0; margin-top: 2px; }
.rows > li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 10px 2px; border: 0; background: none; text-align: left; }
button.row { border-radius: 12px; transition: background var(--t2); }
button.row:hover { background: var(--surface-2); }
.row-main { flex: 1 1 auto; min-width: 0; }
.row-main strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
.row-main span { display: block; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.row-side { flex: none; max-width: 46%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; font-size: 13.5px; color: var(--muted); }
.avatar { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; font-size: 14px; background-size: cover; background-position: center; }
.avatar.idle { background-color: var(--surface-2); color: var(--faint); }
.avatar.lg { width: 68px; height: 68px; font-size: 22px; }
.badge { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 9px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.chip[data-tone="pass"] { background: var(--pass-wash); color: var(--pass); }
.chip[data-tone="deny"] { background: var(--deny-wash); color: var(--deny); }
.chip[data-tone="warn"] { background: var(--warn-wash); color: var(--warn); }
.chip[data-tone="accent"] { background: var(--accent-soft); color: var(--accent-ink); }
.empty { color: var(--muted); padding: 10px 2px 14px; max-width: 60ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; align-items: start; }
.secret { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.secret code { flex: 1 1 auto; min-width: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; user-select: all; }
.result { padding: 11px 13px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
.result[data-tone="pass"] { background: var(--pass-wash); color: var(--pass); }
.result[data-tone="deny"] { background: var(--deny-wash); color: var(--deny); }
.result[data-tone="warn"] { background: var(--warn-wash); color: var(--warn); }
.card-tools { flex: none; display: flex; gap: 8px; }
/* Repetición en el plano: el botón y, mientras corre, el reloj con su avance. */
.replay { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.replay-now { display: grid; line-height: 1.15; }
.replay-now b { font-size: 17px; font-variant-numeric: tabular-nums; }
.replay-now small { color: var(--muted); font-size: 12px; }
.replay-line { display: block; width: 120px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.replay-line > i { display: block; width: 0; height: 100%; border-radius: 2px; background: var(--accent); }
/* Un área en emergencia: se ve arriba de todo, en cualquier pantalla, hasta que vuelve a la normalidad. */
#alarm:empty { display: none; }
/* Una emergencia se ve siempre, aunque la pantalla se desplace: la franja queda pegada arriba del contenido. */
#alarm { position: sticky; top: 0; z-index: 4; display: grid; gap: 8px; max-width: 1240px; padding: 14px 30px 0; }
#alarm:not(:empty) + .view { padding-top: 22px; }
.alarm { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: 16px; text-align: left; font: inherit; background: linear-gradient(var(--deny-wash), var(--deny-wash)), var(--bg); color: var(--deny); box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 22%, transparent); }
.alarm[data-mode="locked"] { background: linear-gradient(var(--warn-wash), var(--warn-wash)), var(--bg); color: var(--warn); }
.alarm > .i { flex: none; width: 24px; height: 24px; }
.alarm > span:not(.btn, .go) { flex: 1; min-width: 0; display: grid; gap: 1px; }
.alarm b { font-size: 15.5px; }
.alarm small { font-size: 13.5px; opacity: .9; }
.alarm .btn { flex: none; color: var(--fg); }
.alarm > .go { display: none; flex: none; opacity: .8; }
.alarm > .go .i { display: block; width: 20px; height: 20px; }
@media (max-width: 899px) { .alarm .btn, .alarm .by { display: none; } .alarm > .go { display: block; } }
.qr { display: block; width: 188px; height: 188px; border-radius: 12px; }
@media (max-width: 560px) {
  .row { flex-wrap: wrap; gap: 8px 12px; }
  .row-main { flex-basis: 0; }
  .row-side { flex: 1 1 100%; max-width: none; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; text-align: left; padding-left: 54px; }
  .row.flat .row-side { padding-left: 0; }
  .form-row { grid-template-columns: 1fr; }
  .card { padding: 16px 16px 18px; }
}

/* ── Panel: el plano de puertas y lo que pasa ahora ────────────────────── */
.panel-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .panel-grid { grid-template-columns: minmax(0, 1fr); } }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); row-gap: 18px; }
.door { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; padding: 0 4px 8px; border: 0; border-radius: 12px; color: var(--fg); text-align: center;
  /* el muro: dos tramos a los lados del vano, continuos de una puerta a la otra */
  background: linear-gradient(currentColor, currentColor) left 8px / calc(50% - 24px) 6px no-repeat, linear-gradient(currentColor, currentColor) right 8px / calc(50% - 24px) 6px no-repeat;
  transition: transform var(--t1) var(--mo); }
.door:active { transform: scale(.97); }
.glyph { width: 64px; height: 64px; fill: none; stroke: currentColor; overflow: visible; }
.glyph .jamb { stroke-width: 2; }
.glyph .arc { stroke-width: 1; stroke-dasharray: 2 3; stroke: var(--off); }
.glyph .leaf { stroke-width: 2.2; stroke-linecap: round; transform-box: view-box; transform-origin: 8px 11px; transition: transform .6s cubic-bezier(.3, 1.3, .5, 1), stroke .2s; }
.door[data-state="open"] .leaf { transform: rotate(82deg); stroke: var(--pass); stroke-width: 3; }
.door[data-state="open"] .arc { stroke: var(--pass); }
.door[data-state="unknown"] .leaf { transform: rotate(38deg); stroke-dasharray: 5 4; stroke: var(--off); }
.door[data-state="off"] { color: var(--off); }
.door[data-state="off"] :is(.door-name, .door-sub) { color: var(--muted); }
.door[data-state="off"] .leaf { stroke-dasharray: 2 5; }
.door[data-alert] :is(.leaf, .arc) { stroke: var(--deny); }
.door[data-alert] .leaf { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
.door-name { max-width: 100%; margin-top: -2px; font-weight: 600; font-size: 14px; line-height: 1.2; letter-spacing: -.01em; overflow-wrap: anywhere; }
.door-sub { max-width: 100%; color: var(--muted); font-size: 12.5px; line-height: 1.25; overflow-wrap: anywhere; }
.door[data-state="open"] .door-sub { color: var(--pass); font-weight: 600; }
.door[data-alert] .door-sub { color: var(--deny); font-weight: 600; }
.chart { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.hours { display: block; width: 100%; height: auto; }
.hours .pass { fill: var(--accent); }
.hours .deny { fill: var(--deny); }
.hours .base { stroke: var(--line); stroke-width: 1; }
.hours-cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ev { display: grid; grid-template-columns: 42px 12px minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 10px 2px; }
.events > li + li { border-top: 1px solid var(--line); }
.ev time { color: var(--muted); font-size: 13px; white-space: nowrap; }
.ev.long { grid-template-columns: 94px 12px minmax(0, 1fr); }
.ev strong { font-weight: 600; }
.ev em { font-style: normal; color: var(--deny); margin-left: 8px; }
.ev-where { display: block; color: var(--muted); font-size: 13.5px; }
.sign { width: 10px; height: 10px; align-self: start; margin-top: 6px; border-radius: 50%; border: 1.5px solid var(--off); }
.ev[data-tone="pass"] .sign { background: var(--pass); border-color: var(--pass); }
.ev[data-tone="deny"] .sign { background: var(--deny); border-color: var(--deny); border-radius: 2px; transform: rotate(45deg) scale(.86); }
.ev[data-tone="alert"] .sign { width: 0; height: 0; margin-top: 5px; border: 6px solid transparent; border-top: 0; border-bottom: 10px solid var(--warn); border-radius: 0; background: none; }
.ev.fresh { animation: arrive .9s var(--mo); }
@keyframes arrive { from { background: var(--accent-soft); } }
.row.fresh { animation: arrive 1.6s var(--mo); }

/* ── Ficha lateral, buscador y avisos ──────────────────────────────────── */
.sheet, .palette { position: fixed; inset: 0; z-index: 20; display: flex; }
.sheet { justify-content: flex-end; padding: 14px; }
.backdrop { position: absolute; inset: 0; background: rgb(0 0 0 / .42); }
.sheet-panel { position: relative; width: min(480px, 100%); height: 100%; display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px 22px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1 1 auto; min-width: 0; font-size: 22px; overflow-wrap: anywhere; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; padding: 20px 22px 28px; display: flex; flex-direction: column; gap: 18px; }
.sheet-body h3 { margin-top: 4px; }
.photo { display: flex; align-items: center; gap: 14px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick label { display: block; padding: 11px 13px; border-radius: 16px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
.pick label:has(input:checked) { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 75%, transparent); }
.pick input { position: absolute; opacity: 0; }
.pick strong { display: block; font-weight: 600; }
.pick small { color: var(--muted); font-size: 12.5px; }
/* Selector con buscador (el área): parece un campo, se abre debajo, adentro de la ficha */
.picker-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 9px 12px 9px 13px; border: 0; border-radius: 12px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.picker-btn > span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-btn > span.faint { color: var(--faint); }
.picker-btn .i { flex: none; width: 18px; height: 18px; color: var(--muted); }
.picker-btn[aria-expanded="true"] { box-shadow: inset 0 0 0 1.5px var(--accent); }
.picker-pop { margin-top: 6px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), 0 12px 32px rgb(0 0 0 / .12); overflow: hidden; }
.picker-q { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-bottom: 1px solid var(--line); }
.picker-q .i { flex: none; width: 18px; height: 18px; color: var(--muted); }
.picker-q input[type="search"] { min-height: 44px; padding: 0; border-radius: 0; background: none; box-shadow: none; }
.picker-list { max-height: 264px; overflow-y: auto; margin: 0; padding: 6px; list-style: none; }
.picker-list .group { padding: 10px 12px 4px; color: var(--faint); font-size: 12px; font-weight: 600; }
.picker-list .opt { min-height: 44px; border-radius: 12px; color: var(--fg); font: inherit; cursor: pointer; }
.picker-list .opt:hover, .picker-list .opt:focus-visible { background: var(--surface-2); outline: none; }
.picker-list .opt .i { flex: none; width: 18px; height: 18px; color: var(--muted); }
.picker-list .opt[aria-selected="true"] .i:last-child { color: var(--accent-ink, var(--accent)); }
.picker-list .empty { padding: 14px 12px; color: var(--muted); font-size: 14px; }
.palette { align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
.palette-box { position: relative; width: min(620px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; }
.palette-field { display: flex; align-items: center; gap: 12px; padding: 6px 18px; border-bottom: 1px solid var(--line); color: var(--muted); }
.palette-field input { min-height: 52px; padding: 0; background: none; box-shadow: none; font-size: 17px; }
.palette-field input:focus-visible { box-shadow: none; }
.palette-list { overflow-y: auto; padding: 8px; }
.palette-list .group { padding: 10px 12px 4px; color: var(--faint); font-size: 12px; font-weight: 600; }
/* El número (legajo) va en una pastilla, como en Olumi: es lo que la gente reconoce */
.palette-list .opt .key { flex: none; min-width: 40px; padding: 5px 8px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 6px 12px; border: 0; border-radius: 16px; background: none; text-align: left; }
.opt[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); }
.opt span { flex: 1 1 auto; min-width: 0; }
.opt b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.opt small { display: block; color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 104px; z-index: 30; transform: translateX(-50%); max-width: min(92vw, 520px); padding: 11px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 600; box-shadow: 0 10px 30px rgb(0 0 0 / .35); }
.toast[data-tone="deny"] { background: var(--deny); }
@media (prefers-reduced-motion: no-preference) {
  .sheet-panel { animation: sheet var(--t3) var(--mo) both; }
  .palette-box { animation: land var(--t2) var(--mo) both; }
  .backdrop { animation: fade var(--t2) ease both; }
  .toast:not([hidden]) { animation: toast var(--t2) var(--mo) both; }
  @keyframes sheet { from { opacity: 0; transform: translateX(34px) scale(.985); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes toast { from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.97); } }
}
@media (max-width: 899px) {
  .sheet { padding: 0; align-items: flex-end; }
  .sheet-panel { width: 100%; height: auto; max-height: 92%; border-radius: 26px 26px 0 0; }
  .sheet-body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  .palette { padding-top: 8px; }

<script>
(() => {
'use strict';
// Control de horario: el cálculo, sin base de datos ni red. Lo usan el servidor (store.js) y la demostración de la web
// (scripts/build-web.js lo copia adentro de la página), así los dos cuentan igual.
// Para cada persona y cada día: la entrada (primera pasada), la salida (última), las horas y cómo estuvo contra su turno.
// La ventana de un día con turno va de 4 horas antes de la entrada a 6 después de la salida; un turno de noche sale al día siguiente.
// Estados: ok, tarde, salio_antes, ausente, en_curso (entró y el turno no terminó), sin_salida, pendiente (todavía no empezó),
// extra (vino un día que no le tocaba), sin_turno. Los días van en hora local.
const HORARIO_MIN = 60_000, HORARIO_HORA = 3600_000;
const nextDay = t => { const d = new Date(t); d.setDate(d.getDate() + 1); d.setHours(0, 0, 0, 0); return d.getTime(); };
const atMinute = (day, minutes) => { const d = new Date(day); d.setHours(0, minutes, 0, 0); return d.getTime(); };
const dateKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

/** holidays: Map id de empresa → Set de días 'AAAA-MM-DD' · people: [{ id, company_id, schedule_id, since (desde cuándo cuenta: el alta o su primera pasada, lo que sea antes), … }] · schedules: Map id → { name, days: [0..6], start_min, end_min, tolerance } · passes: Map id persona → [ts ordenados]. */
function attendanceReport({ people, schedules, passes, from, to, now = Date.now(), holidays = new Map() }) {
  const MIN = HORARIO_MIN, HOUR = HORARIO_HORA;
  const days = []; for (let d = new Date(from).setHours(0, 0, 0, 0); d < to; d = nextDay(d)) days.push(d);
  const rows = [], totals = [];
  for (const p of people) {
    const sch = schedules.get(p.schedule_id), mine = passes.get(p.id), used = new Set(), out = [];
    const since = p.since ?? -Infinity, free = holidays.get(p.company_id);
    // primero los días con turno: la ventana va de 4 horas antes de la entrada a 6 después de la salida
    if (sch) for (const day of days) {
      if (!sch.days.includes(new Date(day).getDay()) || free?.has(dateKey(day))) continue; // un feriado no se espera a nadie: si viene, es fuera de turno
      const start = atMinute(day, sch.start_min), end = sch.end_min > sch.start_min ? atMinute(day, sch.end_min) : atMinute(nextDay(day), sch.end_min), tol = sch.tolerance * MIN;
      const got = mine.filter((t, i) => !used.has(i) && t >= start - 4 * HOUR && t <= end + 6 * HOUR && used.add(i));
      // un turno que empezó antes de que la persona estuviera cargada, y sin pasadas, no es una falta
      if (!got.length && start < since) continue;
      const entry = got[0] ?? null, exit = got.length > 1 && got.at(-1) - entry > MIN ? got.at(-1) : null;
      const late = entry && entry - start > tol ? Math.round((entry - start) / MIN) : 0, early = exit && end - exit > tol ? Math.round((end - exit) / MIN) : 0;
      const state = !entry ? (now < start + tol ? 'pendiente' : 'ausente') : !exit ? (now < end + 6 * HOUR ? 'en_curso' : 'sin_salida') : late ? 'tarde' : early ? 'salio_antes' : 'ok';
      out.push({ date: dateKey(day), start, end, entry, exit, minutes: exit ? Math.round((exit - entry) / MIN) : 0, late, early, state });
    }
    // después, lo que sobra: días sin turno (o sin turno asignado) en los que igual pasó
    const loose = new Map();
    mine.forEach((t, i) => { if (!used.has(i) && t >= from && t < to) { const k = dateKey(t); (loose.get(k) ?? loose.set(k, []).get(k)).push(t); } });
    for (const [date, list] of loose) {
      const entry = list[0], exit = list.length > 1 && list.at(-1) - entry > MIN ? list.at(-1) : null;
      out.push({ date, start: null, end: null, entry, exit, minutes: exit ? Math.round((exit - entry) / MIN) : 0, late: 0, early: 0, state: sch ? 'extra' : 'sin_turno' });
    }
    out.sort((x, y) => x.date.localeCompare(y.date));
    for (const r of out) rows.push({ person_id: p.id, ...r });
    totals.push({ id: p.id, ref: p.ref, name: p.name, document: p.document, company: p.company, site_id: p.site_id, schedule_id: p.schedule_id, schedule: sch?.name ?? '',
      days: out.filter(r => r.entry).length, minutes: out.reduce((n, r) => n + r.minutes, 0), late: out.filter(r => r.late).length,
      early: out.filter(r => r.early).length, absent: out.filter(r => r.state === 'ausente').length, inside: out.some(r => r.state === 'en_curso') });
  }
  return { from, to, people: totals, days: rows };
}

/** Quién está adentro: recorre en orden las pasadas por las puertas que marcan horario. Por una de entrada queda adentro,
 *  por una de salida afuera; si la puerta sirve para las dos cosas, cada pasada da vuelta el estado.
 *  passes: [{ person_id, ts, site_id, door_name, dir }] ordenadas por hora → Map persona → { site_id, since, door } */
function quienEstaAdentro(passes) {
  const at = new Map();
  for (const r of passes) {
    const was = at.get(r.person_id), here = was?.site_id === r.site_id;
    if (r.dir === 'in' || (r.dir !== 'out' && !here)) at.set(r.person_id, { site_id: r.site_id, since: here ? was.since : r.ts, door: r.door_name });
    else at.delete(r.person_id);
  }
  return at;
}

// Lo que comparten el servidor y la beta de la web (scripts/build-web.js lo copia adentro de la página, sin los "export"):
// cómo se llama cada tipo de evento y cada estado del horario, y las filas de las planillas que se descargan.
const KIND = {
  access_granted: 'Acceso', access_denied: 'Rechazo', remote_open: 'Apertura remota', exit_button: 'Botón de salida',
  door_opened: 'Puerta abierta', door_closed: 'Puerta cerrada', door_forced: 'Puerta forzada', door_held: 'Puerta retenida',
  duress: 'Aviso de coacción', tamper: 'Equipo manipulado', alarm: 'Alarma', emergency: 'Emergencia', other: 'Otro',
};
const ESTADO = {
  ok: 'Bien', tarde: 'Llegó tarde', salio_antes: 'Salió antes', ausente: 'Faltó', en_curso: 'Adentro', sin_salida: 'Sin marca de salida',
  pendiente: 'Todavía no empezó', extra: 'Fuera de turno', sin_turno: 'Sin turno',
};
const celda = v => `"${String(v ?? '').replaceAll('"', '""')}"`;
const hora = t => t ? new Date(t).toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
/** Una planilla para Excel o Numbers: separada por punto y coma y con la marca que les hace leer bien los tildes. */
const filas = lista => lista.map(f => f.map(celda).join(';') + '\r\n').join('');
const planilla = (titulos, lista) => '\ufeff' + titulos.join(';') + '\r\n' + filas(lista);
const PLANILLA_EVENTOS = ['Fecha', 'Hora', 'Tipo', 'Persona', 'Tarjeta', 'Método', 'Puerta', 'Área', 'Detalle', 'Operador'];
const filaEvento = e => {
  const d = new Date(e.ts);
  return [d.toLocaleDateString('es-UY'), d.toLocaleTimeString('es-UY', { hour12: false }), KIND[e.kind] ?? e.kind, e.person_name, e.card, e.method, e.door_name, e.site_name, e.detail, e.actor];
};
const PLANILLA_HORARIO = ['Fecha', 'Legajo', 'Persona', 'Documento', 'Turno', 'Entrada esperada', 'Salida esperada', 'Entrada', 'Salida', 'Horas', 'Llegó tarde (min)', 'Salió antes (min)', 'Estado'];
/** report: lo que devuelve attendanceReport (horario.js). */
const filasHorario = ({ days, people }) => {
  const porId = new Map(people.map(p => [p.id, p]));
  return days.map(d => {
    const p = porId.get(d.person_id);
    return [d.date.split('-').reverse().join('/'), p.ref, p.name, p.document, p.schedule, hora(d.start), hora(d.end), hora(d.entry), hora(d.exit),
      (d.minutes / 60).toFixed(2).replace('.', ','), d.late || '', d.early || '', ESTADO[d.state] ?? d.state];
  });
};
/** La lista para una evacuación: quién está adentro, dónde y desde cuándo. sitios: Map id de área → nombre. */
const PLANILLA_ADENTRO = ['Persona', 'Legajo', 'Documento', 'Área', 'Entró', 'Por', 'Tipo', 'Visita a', 'Empleador'];
const filasAdentro = (lista, sitios) => lista.map(p => [p.name, p.ref, p.document, sitios.get(p.site_id) ?? '', hora(p.since), p.door, p.kind === 'visit' ? 'Visita' : 'Personal', p.host, p.company]);

// Utilidades de la interfaz.
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

// html`…` escapa todo lo que se interpola; solo lo ya armado con html`…` o raw() entra tal cual.
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = s => new Raw(s);
const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESCAPES[c]);
const piece = v => v instanceof Raw ? v.s : v == null || v === false ? '' : esc(v);
const html = (strings, ...values) => new Raw(strings.reduce((out, s, i) => {
  const v = values[i - 1];
  return out + (Array.isArray(v) ? v.map(piece).join('') : piece(v)) + s;
}));

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const saved = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch { /* sin almacenamiento */ } },
};

function saveBlob(blob, filename) {
  if (native()) return shareFile(blob, filename);   // en el teléfono: hoja de compartir de iOS
  const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: filename });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);
}

const hourFormat = new Intl.DateTimeFormat('es-UY', { hour: '2-digit', minute: '2-digit', hour12: false });
const dayFormat = new Intl.DateTimeFormat('es-UY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const dateFormat = new Intl.DateTimeFormat('es-UY', { day: 'numeric', month: 'long', year: 'numeric' });
const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();
const when = ts => (isToday(ts) ? hourFormat : dayFormat).format(ts);
const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const initials = name => String(name).trim().split(/\s+/).slice(0, 2).map(w => w[0] ?? '').join('').toUpperCase();
const toLocalInput = ms => { if (!ms) return ''; const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
const fromLocalInput = text => text ? new Date(text).getTime() : null;

const METHOD = { card: 'tarjeta', face: 'rostro', fingerprint: 'huella', pin: 'clave', qr: 'código QR', remote: 'remoto', button: 'botón', mixed: 'doble factor' };
const ROLE = { admin: 'Administrador', operator: 'Operador', viewer: 'Solo lectura' };
const ALERT_KINDS = ['door_forced', 'door_held', 'duress', 'tamper', 'alarm'];
const tone = kind => ['access_granted', 'remote_open', 'exit_button'].includes(kind) ? 'pass'
  : kind === 'access_denied' ? 'deny' : ALERT_KINDS.includes(kind) || kind === 'emergency' ? 'alert' : 'quiet';

// Un solo juego de íconos: grilla de 24, trazo 1,8, puntas redondas, color del texto. Si falta uno, se dibuja igual.
const ICONS = {
  panel: '<path d="M3 6h4M17 6h4M7 6v12M7 18A12 12 0 0 0 19 6"/>',

  personas: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>',
  niveles: '<circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M17 12v3M20.5 12v2"/>',
  equipos: '<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="9" r="2.5"/><path d="M10 16h4"/>',
  plano: '<path d="M3.5 7.5 12 3l8.5 4.5L12 12z"/><path d="M3.5 7.5V16L12 20.5V12M20.5 7.5V16L12 20.5"/><path d="M9 10.4v4.3l3 1.6"/>',
  integraciones: '<path d="M9 15l6-6M10.5 6.5l1-1a4.2 4.2 0 0 1 6 6l-1 1M13.5 17.5l-1 1a4.2 4.2 0 0 1-6-6l1-1"/>',
  ajustes: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  close: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  left: '<path d="M14 6l-6 6 6 6"/>',
  updown: '<path d="M8 10l4-4 4 4M8 14l4 4 4-4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  alert: '<path d="M12 4l9 16H3zM12 10v4M12 17h.01"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  logout: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10"/>',
  site: '<path d="M4 20V8l8-4 8 4v12M9 20v-6h6v6M4 20h16"/>',
  send: '<path d="M4 12l16-8-6 16-3-6z"/>',
  data: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
  servidor: '<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/>',
  candado: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  adentro: '<circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.2a3 3 0 0 1 0 5.6M17.5 14.2a5.5 5.5 0 0 1 3 4.8"/>',
  planilla: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16M4 15h16M10 4v16"/>',
  repetir: '<path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5M4.5 4v4h4"/><path d="M10.5 9.5v5l4-2.5z"/>',
  alto: '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',
  horario: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M10 3h4M18.5 6l1.2-1.2"/>',
  empresa: '<path d="M4 20V6.5L11 4v16M11 9h9v11M2.5 20h19M7 9h1M7 13h1M7 16.5h1M14.5 13h2M14.5 16.5h2"/>',

const icon = name => raw(`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name].replace(/<(path|circle|rect|ellipse) /g, '<$1 pathLength="1" ')}</svg>`);
// La marca: una K hecha con una puerta de plano (el marco, la hoja abierta y el recorrido del giro). El punto es la luz del lector.
const MARK = raw('<span class="mark"><svg viewBox="0 0 38 38" aria-hidden="true"><path class="stem" d="M12 9v20"/><path class="leaf" d="M14.5 19.5l9-8.3"/><path class="arc" d="M16.5 21.5L25 29"/><circle class="dot" cx="26.5" cy="9.5" r="2.8"/></svg></span>');
const brand = (title, sub) => html`<span class="brand">${MARK}<span><b>${title}</b>${sub ? html`<small>${sub}</small>` : ''}</span></span>`;
const GLYPH = raw('<svg class="glyph" viewBox="0 0 64 64" aria-hidden="true"><path class="jamb" d="M8 5v12M56 5v12"/><path class="arc" d="M56 11A48 48 0 0 1 14.7 58.5"/><line class="leaf" x1="8" y1="11" x2="56" y2="11"/></svg>');

// Acceso al servidor real. La demostración (03-demo.js) ofrece exactamente esta misma interfaz.
/** base: la dirección del servidor cuando la página no la sirve él mismo (la app del teléfono). */
function liveApi(base = '') {
  let token = saved.get('kliva.token'), view = {};
  // Qué empresa y qué área se está mirando: el servidor recorta todo a eso (y nunca deja ver más de lo que el usuario puede).
  const auth = () => ({ ...(token && { Authorization: `Bearer ${token}` }), ...(view.empresa && { 'X-Kliva-Empresa': view.empresa }), ...(view.area && { 'X-Kliva-Area': view.area }) });

  async function call(method, path, body) {
    const res = await fetch(base + path, {
      method,
      headers: { ...(body && { 'Content-Type': 'application/json' }), ...auth() },
      body: body && JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || `El servidor respondió ${res.status}`), { status: res.status });
    return data;
  }

  return {
    demo: false,
    get: path => call('GET', path),
    post: (path, body = {}) => call('POST', path, body),
    patch: (path, body = {}) => call('PATCH', path, body),
    put: (path, body = {}) => call('PUT', path, body),
    del: path => call('DELETE', path),
    /** Baja un archivo que necesita la sesión (la copia de datos, la planilla de eventos). */
    async download(path, filename) {
      const res = await fetch(base + path, { headers: auth() });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'No se pudo descargar');
      await saveBlob(await res.blob(), filename);
    },
    hasSession: () => Boolean(token),
    setSession(value) { token = value; saved.set('kliva.token', value); },
    setView(value) { view = { ...value }; },

    /** Escucha lo que pasa en vivo y se reconecta sola. Devuelve la función para cortar. */
    stream(onMessage) {
      const abort = new AbortController();
      (async () => {
        while (!abort.signal.aborted) {
          try {
            const res = await fetch(base + '/api/stream', { headers: auth(), signal: abort.signal });
            if (res.status === 401) return onMessage('expired', {});
            onMessage('online', {});
            const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
            for (let buffer = ''; ;) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += value;
              for (let cut; (cut = buffer.indexOf('\n\n')) >= 0; buffer = buffer.slice(cut + 2)) {
                const m = /^event: (\w+)\ndata: (.*)$/s.exec(buffer.slice(0, cut));
                if (m) onMessage(m[1], JSON.parse(m[2]));
              }
            }
          } catch { /* se reintenta abajo */ }
          if (abort.signal.aborted) return;
          onMessage('offline', {});
          await wait(3000);
        }
      })();
      return () => abort.abort();
    },
  };
}

    for (const e of db.events) {
      if (!sc.sites.has(e.site_id)) continue;
      const slot = hours[Math.floor(e.ts / H) - first], key = e.kind === 'access_granted' ? 'granted' : e.kind === 'access_denied' ? 'denied' : null;
      if (slot && key) slot[key]++;
      if (e.ts >= midnight) { if (key) today[key]++; else if (ALERT_KINDS.includes(e.kind)) today.alerts++; }
    }
    const sync = [...db.sync.values()].filter(r => ids.has(r.device_id)), n = status => sync.filter(r => r.status === status).length;
    return {
      devices: { total: devices.length, online: devices.filter(d => d.status === 'online').length },
      doors: { total: doors.length, open: doors.filter(p => p.state === 'open').length },
      people: people.length, today,
      sync: { pending: n('pending'), error: n('error'), unsupported: n('unsupported') }, hours,
    };
  }

  const listed = p => ({

  const newPerson = () => ({ id: newId('h'), ref: String(1001 + db.people.length + serial), name: '', company: '', document: '', cards: [], pin: '', face: '', hasFace: false,
    active: 1, valid_from: null, valid_to: null, levels: [], created_at: now(), company_id: null, site_id: null, schedule_id: null, host: '' });
  function savePerson(person, input) {
    const company = person.company_id || companyFor(input.company_id);
    const area = (input.site_id === undefined ? person.site_id : input.site_id) || null, shift = (input.schedule_id === undefined ? person.schedule_id : input.schedule_id) || null;
    if (area && site(area)?.company_id !== company) throw fail(400, 'El área elegida es de otra empresa');
    if (shift && db.schedules.find(x => x.id === shift)?.company_id !== company) throw fail(400, 'Ese turno no es de la empresa de la persona');
    const kind = person.kind ?? (input.kind === 'visit' ? 'visit' : 'staff');
    input = { ...input, kind, company_id: company, site_id: area, schedule_id: kind === 'visit' ? null : shift };
    const next = { ...person, ...input };
    if (kind === 'visit' && !next.valid_to) throw fail(400, 'Indicá hasta cuándo vale la visita');
    next.name = String(next.name ?? '').trim();
    next.cards = [...new Set((next.cards ?? []).map(c => String(c).trim()).filter(Boolean))];
    if (!next.name) throw fail(400, 'Falta el nombre');
    if (next.pin && !/^\d{4,8}$/.test(next.pin)) throw fail(400, 'La clave debe tener entre 4 y 8 dígitos');

      if (!/^\d{1,20}$/.test(c)) throw fail(400, `La tarjeta "${c}" debe tener solo números`);

      if (owner) throw fail(400, `La tarjeta ${c} ya está asignada a ${owner.name}`);

    if (input.face !== undefined) { next.face = input.face ?? ''; next.hasFace = Boolean(next.face); if (next.face) next.device_face = 0; }
    Object.assign(person, next, { active: Number(Boolean(next.active)), updated_at: now() });

  // ── Rutas (las mismas que server/http/api.js) ──────────────────────────────
  const routes = [];

  const saveCompany = (c, body) => {

  on('PATCH', '/api/companies/:id', ({ params, body }) => { const c = saveCompany(db.companies.find(x => x.id === params.id), body); log('Cambio en empresa', c.name); return { id: c.id }; });

  on('POST', '/api/devices', ({ body }) => {

  on('GET', '/api/people', ({ query }) => {
    const q = fold(query.get('q') ?? '');
    const sc = scope();
    return db.people.filter(p => personIn(sc, p) && (fold([p.name, p.company, p.document, ...p.cards].join(' ')).includes(q) || p.ref === q)).sort((a, b) => a.name.localeCompare(b.name, 'es')).map(listed);
  });
  on('POST', '/api/people/import', ({ body }) => {
    const rows = body.rows ?? [];
    if (!rows.length) throw fail(400, 'La planilla no tiene filas');
    const company = companyFor(body.company_id), out = { added: 0, errors: [] };
    const find = (list, text, what) => { const k = fold(String(text ?? '').trim()); if (!k) return null; const hit = list.find(x => x.company_id === company && fold(x.name) === k); if (!hit) throw fail(400, `No existe ${what} "${String(text).trim()}"`); return hit.id; };

      try {
        const level = find(db.levels, r.level, 'el nivel'), p = newPerson();
        savePerson(p, { name: r.name, document: r.document ?? '', company: r.employer ?? '', company_id: company, cards: String(r.cards ?? '').split(/[\s,/|]+/).filter(Boolean),
          site_id: find(db.sites, r.area, 'el área'), schedule_id: find(db.schedules, r.schedule, 'el turno'), levels: level ? [level] : [] });
        db.people.push(p);

  });

  const LOOSE = [['Rosario Techera', ['5552140'], true], ['Walter Acosta', [], true], ['Graciela Pintos', ['5552317'], false], ['Néstor Barboza', ['5552388'], true]];
  const devicePeople = id => {

    const loose = [LOOSE[n % 4], LOOSE[(n + 1) % 4]].map(([name, cards, has_face], i) => ({ ref: String(200 + n * 10 + i), name, cards, has_face, valid_to: null, known: null })).filter(x => !db.adopted.has(`${id}|${x.ref}`));
    return [...loose, ...mine];

  on('POST', '/api/devices/:id/people', ({ params, body }) => {
