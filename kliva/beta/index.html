    const u = db.users.find(x => x.id === params.id), { password: _omit, ...rest } = body;
    if (u.role === 'admin' && (rest.role ?? 'admin') !== 'admin' && !db.users.some(x => x !== u && x.role === 'admin')) throw fail(400, 'Tiene que quedar al menos un administrador activo');
    Object.assign(u, rest, rest.reset2fa ? { mfa: false } : {}, { areas: u.company_id && rest.areas ? rest.areas.join(',') : u.areas ?? '' });
  });
  on('DELETE', '/api/users/:id', ({ params }) => {
    if (params.id === me.id) throw fail(400, 'No podés borrar tu propio usuario');
    db.users = db.users.filter(u => u.id !== params.id);
  });
  on('POST', '/api/license', () => { throw fail(400, 'En la demostración no se cargan licencias'); });

  // Control de horario: turnos y el cálculo, el mismo que usa el servidor (server/core/horario.js).
  on('GET', '/api/schedules', () => { const sc = scope(); return db.schedules.filter(x => !sc.company || x.company_id === sc.company)
    .map(x => ({ ...x, people: db.people.filter(p => p.schedule_id === x.id && p.active).length })); });
  const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t ?? '')); if (!m || +m[1] > 23 || +m[2] > 59) throw fail(400, 'La hora tiene que ser como 08:30'); return +m[1] * 60 + +m[2]; };
  const saveSchedule = (x, body) => {
    const name = String(body.name ?? '').trim(), days = [...new Set((body.days ?? []).map(Number))].filter(d => d >= 0 && d <= 6).sort();
    if (!name) throw fail(400, 'Falta el nombre del turno');
    if (!days.length) throw fail(400, 'Elegí al menos un día');
    const start_min = toMin(body.start), end_min = toMin(body.end);
    if (start_min === end_min) throw fail(400, 'La entrada y la salida no pueden ser a la misma hora');
    return Object.assign(x, { name, days, start_min, end_min, tolerance: Math.min(Math.max(Number(body.tolerance) || 0, 0), 120) });
  };
  on('POST', '/api/schedules', ({ body }) => { const x = saveSchedule({ id: newId('sch'), company_id: companyFor(body.company_id) }, body); db.schedules.push(x); log('Alta de turno', x.name); return { id: x.id }; });
  on('PATCH', '/api/schedules/:id', ({ params, body }) => { saveSchedule(db.schedules.find(x => x.id === params.id), body); return { id: params.id }; });
  on('DELETE', '/api/schedules/:id', ({ params }) => {
    db.schedules = db.schedules.filter(x => x.id !== params.id);
    db.people.forEach(p => { if (p.schedule_id === params.id) p.schedule_id = null; });
  });
  function attendance(query) {
    const sc = scope(), monday = new Date(now()); monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
    const from = Number(query.get('from')) || monday.getTime(), to = Math.min(Number(query.get('to')) || now() + 1, now() + 1);
    if (to - from > 93 * 24 * H) throw fail(400, 'El período máximo es de tres meses');
    const people = db.people.filter(p => p.active && (p.kind ?? 'staff') === 'staff' && personIn(sc, p)).sort((a, b) => a.name.localeCompare(b.name, 'es')).map(p => ({ ...p }));
    const clocks = new Set(db.doors.filter(p => p.clock).map(p => p.id)), passes = new Map(people.map(p => [p.id, []]));
    for (const e of db.events) if (e.kind === 'access_granted' && clocks.has(e.door_id) && passes.has(e.person_id) && e.ts >= from - 12 * H && e.ts < to + 18 * H) passes.get(e.person_id).push(e.ts);
    passes.forEach(list => list.sort((a, b) => a - b));
    const first = new Map();
    for (const e of db.events) if (e.kind === 'access_granted' && e.person_id && !(first.get(e.person_id) <= e.ts)) first.set(e.person_id, e.ts);
    for (const p of people) p.since = Math.min(p.created_at ?? Infinity, first.get(p.id) ?? Infinity);
    const holidays = new Map();
    for (const h of db.holidays) (holidays.get(h.company_id) ?? holidays.set(h.company_id, new Set()).get(h.company_id)).add(h.day);
    return attendanceReport({ people, schedules: new Map(db.schedules.map(x => [x.id, x])), passes, from, to, now: now(), holidays });
  }
  on('GET', '/api/attendance', ({ query }) => attendance(query));
  on('GET', '/api/holidays', () => { const sc = scope(); return db.holidays.filter(h => !sc.company || h.company_id === sc.company).sort((a, b) => a.day.localeCompare(b.day)); });
  on('POST', '/api/holidays', ({ body }) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(body.day)) || Number.isNaN(Date.parse(body.day))) throw fail(400, 'Elegí el día del feriado');
    const company_id = companyFor(body.company_id), old = db.holidays.find(h => h.company_id === company_id && h.day === body.day);
    if (old) old.name = String(body.name ?? '').trim(); else db.holidays.push({ id: newId('f'), company_id, day: body.day, name: String(body.name ?? '').trim() });
    return { id: (old ?? db.holidays.at(-1)).id };
  });
  on('DELETE', '/api/holidays/:id', ({ params }) => { db.holidays = db.holidays.filter(h => h.id !== params.id); });

  // Avisos, seguridad, datos e integraciones
  on('GET', '/api/alerts', () => [
    ...db.sites.filter(s => s.mode && s.mode !== 'normal' && scope().sites.has(s.id)).map(s => ({ id: `mode-${s.id}`, kind: 'emergency', ts: s.mode_at, title: MODES[s.mode], detail: `${s.name}, por ${s.mode_by}`, site_id: s.id })),
    ...db.devices.filter(d => d.enabled && d.status === 'offline' && scope().sites.has(d.site_id)).map(d => ({ id: `dev-${d.id}`, kind: 'device_offline', ts: d.last_seen, title: d.name, detail: d.status_detail, device_id: d.id })),
    ...db.events.filter(e => ALERT_KINDS.includes(e.kind) && e.ts > now() - 24 * H && scope().sites.has(e.site_id)).slice(0, 20).map(e => ({ id: e.id, kind: e.kind, ts: e.ts, title: e.door_name, detail: e.site_name, door_id: e.door_id })),
  ].sort((a, b) => b.ts - a.ts));
  const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  on('POST', '/api/me/2fa/start', () => {
    const secret = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => B32[b % 32]).join('');
    return { secret, uri: `otpauth://totp/${encodeURIComponent(`Kliva:${me.email}`)}?secret=${secret}&issuer=Kliva` };
  });
  on('POST', '/api/me/2fa/confirm', ({ body }) => { if (!/^\d{6}$/.test(body.code ?? '')) throw fail(400, 'El código tiene 6 dígitos'); me.mfa = true; log('Verificación en dos pasos activada', ''); });
  on('POST', '/api/me/2fa/disable', () => { if (db.security.require_2fa) throw fail(400, 'Tu empresa exige la verificación en dos pasos a los administradores'); me.mfa = false; });
  const sessions = [{ id: 'a1', agent: navigator.userAgent, created_at: now() - 2 * H, seen_at: now(), current: true }, { id: 'a2', agent: 'iPhone', created_at: now() - 50 * H, seen_at: now() - 3 * H, current: false }];
  on('GET', '/api/me/sessions', () => sessions);
  on('DELETE', '/api/me/sessions/:id', ({ params }) => { sessions.splice(sessions.findIndex(x => x.id === params.id), 1); });
  on('POST', '/api/me/sessions/close-others', () => { sessions.splice(1); });
  on('POST', '/api/security', ({ body }) => {
    if (body.require_2fa && !me.mfa) throw fail(400, 'Primero activá la verificación en dos pasos en tu propia cuenta');
    Object.assign(db.security, body);
    log('Cambio en la seguridad', '');
  });
  on('GET', '/api/backups', () => db.backups);
  on('POST', '/api/backups', () => { db.backups.unshift({ name: `kliva-demo-${db.backups.length + 1}.db`, at: now(), size: 4_310_000 }); });
  on('GET', '/api/integrations', () => ({ keys: db.keys.map(({ key: _omit, ...k }) => k), webhooks: db.webhooks, topics: ['access', 'denied', 'alert', 'device'] }));
  const randomKey = prefix => prefix + Array.from(crypto.getRandomValues(new Uint8Array(24)), b => 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[b % 62]).join('');
  on('POST', '/api/keys', ({ body }) => {
    if (!String(body.name ?? '').trim()) throw fail(400, 'Ponele un nombre a la clave, para saber quién la usa');
    const key = randomKey('kl_'), row = { id: newId('k'), name: body.name.trim(), hint: `${key.slice(0, 7)}…${key.slice(-4)}`, scope: body.scope ?? 'read', created_at: now(), used_at: null };
    db.keys.unshift(row);
    log('Clave de API creada', row.name);
    return { ...row, key };
  });
  on('DELETE', '/api/keys/:id', ({ params }) => { db.keys = db.keys.filter(k => k.id !== params.id); });
  const saveHook = (hook, body) => {
    if (!/^https?:\/\/\S+$/.test(body.url ?? '')) throw fail(400, 'La dirección tiene que empezar con https:// (o http:// dentro de la red local)');
    if (!(body.topics ?? []).length) throw fail(400, 'Elegí al menos un tipo de aviso');
    return Object.assign(hook, { name: body.name, url: body.url, topics: body.topics, enabled: Number(body.enabled ?? 1) });
  };
  on('POST', '/api/webhooks', ({ body }) => {
    const hook = saveHook({ id: newId('w'), created_at: now(), last_at: null, last_status: '', fails: 0, pending: 0 }, body);
    db.webhooks.push(hook);
    log('Conexión creada', hook.name);
    return { id: hook.id, secret: randomKey('whsec_') };
  });
  on('PATCH', '/api/webhooks/:id', ({ params, body }) => { saveHook(db.webhooks.find(w => w.id === params.id), body); return { id: params.id }; });
  on('DELETE', '/api/webhooks/:id', ({ params }) => { db.webhooks = db.webhooks.filter(w => w.id !== params.id); });
  on('POST', '/api/webhooks/:id/test', ({ params }) => {
    const out = { ok: false, status: 'La demostración no manda avisos de verdad' };
    Object.assign(db.webhooks.find(w => w.id === params.id), { last_at: now(), last_status: out.status });
    return out;
  });

  // Descargas: la copia completa y la planilla de eventos, armadas con los datos de la demostración.
  function download(path, filename) {
    const [route, search = ''] = path.split('?'), q = new URLSearchParams(search);
    if (route === '/api/export') {
      const copy = { product: 'Kliva', exported_at: new Date().toISOString(), org: db.org, companies: db.companies, sites: db.sites, schedules: db.schedules, devices: db.devices, doors: db.doors, levels: db.levels,
        people: db.people.map(({ face, hasFace, ...p }) => ({ ...p, has_face: hasFace, ...(q.get('fotos') === '1' && face && { face }) })), operators: db.users, events: db.events.length };
      return saveBlob(new Blob([JSON.stringify(copy, null, 2)], { type: 'application/json' }), filename);
    }
    const text = route === '/api/presence.csv' ? planilla(PLANILLA_ADENTRO, filasAdentro(presence(), new Map(db.sites.map(s => [s.id, s.name]))))
      : route === '/api/attendance.csv' ? planilla(PLANILLA_HORARIO, filasHorario(attendance(q)))
      : planilla(PLANILLA_EVENTOS, db.events.filter(e => e.ts >= (Number(q.get('from')) || 0) && e.ts < (Number(q.get('to')) || now()) && scope().sites.has(e.site_id) && inGroup(e, q.get('group') ?? 'all')).map(filaEvento));
    return saveBlob(new Blob([text], { type: 'text/csv' }), filename);
  }

  // ── La historia de la web (modo cine) ──────────────────────────────────────
  // Cada capítulo tiene su hora y un efecto. Antes de mostrar uno se rebobina: lo que pasó en los capítulos
  // anteriores queda puesto una sola vez y con su hora; lo de los que siguen, no está. Así, subir y bajar
  // por la página siempre muestra lo mismo.
  const LUCIA = 'Lucía Fernández', byName = name => db.doors.find(p => p.name === name), lucia = () => db.people.find(p => p.name === LUCIA);
  const fallen = () => db.devices.find(d => d.name === 'Controladora de portones');
  let comeback = null;
  function setDevice(d, status, detail = '') {
    if (d.status === status) return;
    Object.assign(d, { status, status_detail: detail, ...(status === 'online' && { last_seen: now() }) });
    for (const p of db.doors) if (p.device_id === d.id) Object.assign(p, { state: status === 'online' ? 'closed' : 'unknown', state_at: now() });
    emit('device', { id: d.id, status, status_detail: detail });
  }
  function told(live, kind, doorName, person, extra, open = 0) {
    const door = byName(doorName), e = { ...event(now(), kind, door, person, extra), told: true };
    db.events.unshift(e);
    if (!live) return;
    if (open) swing(door, open);
    emit('event', e);
    return open ? `[data-door="${door.id}"]` : '#feed .ev';
  }
  const door = name => `[data-door="${byName(name).id}"]`;
  if (cine) { for (const d of db.devices) Object.assign(d, { status: 'online', status_detail: '', last_seen: now() }); for (const p of db.doors) p.state = 'closed'; db.people.forEach(p => plan(p, true)); }
  const STORY = [
    ['inicio', '07:40', live => { if (live && !ticker) ticker = setTimeout(tick, 1400); }],
    ['alta', '07:40', live => {
      const p = { id: newId('h'), ref: '1099', name: LUCIA, company: 'Logística Sur', document: '', cards: ['5550600'], pin: '', face: '', hasFace: true, active: 1,
        valid_from: null, valid_to: null, levels: [db.levels[0].id], created_at: now(), updated_at: now(), company_id: 'c1', site_id: 's1', schedule_id: null };
      db.people.push(p);
      plan(p, !live);
      if (live) emit('sync', { fresh: p.id });
    }],
    ['pasa', '07:52', live => told(live, 'access_granted', 'Vestuarios', lucia(), { method: 'face' }, 3200)],
    ['rechazo', '09:15', live => told(live, 'access_denied', 'Molinete de entrada', null, { method: 'card', card: '5559417', detail: 'Tarjeta no registrada' })],
    ['abre', '11:03', live => told(live, 'remote_open', 'Portón 2', null, { method: 'remote', actor: me.name }, 4200)],
    ['cae', '14:20', live => {
      if (!live) return;
      setDevice(fallen(), 'offline', 'No se llega al equipo por la red');
      comeback = setTimeout(() => setDevice(fallen(), 'online'), 5200);
      return door('Portón 2');
    }],
    ['baja', '18:00', live => { const p = lucia(); p.active = 0; plan(p, !live); if (live) emit('sync', { fresh: p.id }); }],
  ];
  const chapter = name => STORY.findIndex(c => c[0] === name);
  function rewind(name) {
    const upTo = chapter(name);
    if (upTo < 0) return;
    clearTimeout(ticker); clearTimeout(comeback); ticker = null;
    setDevice(fallen(), 'online');
    db.events = db.events.filter(e => !e.told);
    const p = lucia();
    if (p) { db.people = db.people.filter(x => x !== p); for (const key of [...db.sync.keys()]) if (key.startsWith(`${p.ref}|`)) db.sync.delete(key); }
    for (const [, at, run] of STORY.slice(0, upTo)) { setClock(at); run(false); }
    setClock(STORY[upTo][1]);
  }
  const play = name => STORY[chapter(name)]?.[2](true);

  async function call(method, fullPath, body = {}) {
    await wait(80 + Math.random() * 140);
    const [path, search = ''] = fullPath.split('?');
    for (const [m, pattern, fn] of routes) {
      const hit = m === method && pattern.exec(path);
      if (hit) return structuredClone(fn({ params: hit.groups ?? {}, query: new URLSearchParams(search), body }) ?? { ok: true });
    }
    throw fail(404, 'Ese recurso no existe');
  }

  return {
    demo: true,
    get: path => call('GET', path),
    post: (path, body) => call('POST', path, body),
    patch: (path, body) => call('PATCH', path, body),
    put: (path, body) => call('PUT', path, body),
    del: path => call('DELETE', path),
    download: async (path, filename) => download(path, filename),
    cine: cine ? { rewind, play } : null,
    hasSession: () => true,
    setSession() {},
    setView(value) { view = { ...value }; },
    stream(onMessage) {
      listeners.add(onMessage);
      if (!ticker && !cine) ticker = setTimeout(tick, 1800); // en modo cine las escenas las pide la página
      return () => { listeners.delete(onMessage); if (!listeners.size) { clearTimeout(ticker); ticker = null; } };
    },
  };
}

// Código QR (modo byte, corrección M, versiones 1 a 10). Alcanza para el enlace de la verificación en dos pasos.
const QR_EC = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];      // códigos de corrección por bloque
const QR_BLOCKS = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
const QR_TOTAL = [0, 26, 44, 70, 100, 134, 172, 196, 242, 292, 346];
const QR_ALIGN = [[], [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];
const QR_MASKS = [
  (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
  (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
  (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0,
];

/** Devuelve la matriz del código: filas de 0 y 1. */
function qrMatrix(text) {
  const bytes = new TextEncoder().encode(text);
  const dataCount = v => QR_TOTAL[v] - QR_EC[v] * QR_BLOCKS[v];
  let v = 1;
  while (v <= 10 && bytes.length > dataCount(v) - (v < 10 ? 2 : 3)) v++;
  if (v > 10) throw new Error('El texto es demasiado largo para un código QR');

  // Datos: modo, largo, bytes, cierre y relleno.
  const bits = [], push = (value, n) => { for (let i = n - 1; i >= 0; i--) bits.push((value >>> i) & 1); };
  push(4, 4); push(bytes.length, v < 10 ? 8 : 16);
  bytes.forEach(b => push(b, 8));
  const capacity = dataCount(v) * 8;
  push(0, Math.min(4, capacity - bits.length));
  while (bits.length % 8) bits.push(0);
  for (let pad = 0xEC; bits.length < capacity; pad ^= 0xFD) push(pad, 8);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => a << 1 | b, 0));

  // Corrección de errores (Reed-Solomon sobre GF(256)).
  const exp = new Uint8Array(512), log = new Uint8Array(256);
  for (let i = 0, x = 1; i < 255; i++) { exp[i] = x; log[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
  const mul = (a, b) => a && b ? exp[log[a] + log[b]] : 0;
  const ecLen = QR_EC[v];
  let gen = [1];
  for (let i = 0; i < ecLen; i++) {
    const next = new Array(gen.length + 1).fill(0);
    gen.forEach((g, j) => { next[j] ^= g; next[j + 1] ^= mul(g, exp[i]); });
    gen = next;
  }
  const ecc = block => {
    const rem = new Array(ecLen).fill(0);
    for (const d of block) {
      const factor = d ^ rem.shift();
      rem.push(0);
      for (let i = 0; i < ecLen; i++) rem[i] ^= mul(gen[i + 1], factor);
    }
    return rem;
  };
  const blocks = [], n = QR_BLOCKS[v], short = Math.floor(data.length / n), longOnes = data.length % n;
  for (let i = 0, at = 0; i < n; i++) {
    const size = short + (i >= n - longOnes ? 1 : 0);
    blocks.push(data.slice(at, at + size));
    at += size;
  }
  const eccs = blocks.map(ecc), stream = [];
  for (let i = 0; i <= short; i++) for (const b of blocks) if (i < b.length) stream.push(b[i]);
  for (let i = 0; i < ecLen; i++) for (const e of eccs) stream.push(e[i]);

  // Matriz con los patrones fijos.
  const size = 17 + 4 * v;
  const m = Array.from({ length: size }, () => new Array(size).fill(0));
  const fixed = Array.from({ length: size }, () => new Array(size).fill(false));
  const set = (x, y, dark) => { if (x >= 0 && y >= 0 && x < size && y < size) { m[y][x] = dark ? 1 : 0; fixed[y][x] = true; } };
  for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
  for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      set(cx + dx, cy + dy, d !== 2 && d !== 4);
    }
  }
  const centers = QR_ALIGN[v], last = centers.length - 1;
  centers.forEach((cy, i) => centers.forEach((cx, j) => {
    if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));
  const bit = (value, i) => (value >>> i) & 1;
  const drawFormat = mask => {
    let rem = mask; // nivel M = 00
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const f = (mask << 10 | rem) ^ 0x5412;
    for (let i = 0; i <= 5; i++) set(8, i, bit(f, i));
    set(8, 7, bit(f, 6)); set(8, 8, bit(f, 7)); set(7, 8, bit(f, 8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bit(f, i));
    for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(f, i));
    for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(f, i));
    set(8, size - 8, 1);
  };
  drawFormat(0);
  if (v >= 7) {
    let rem = v;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
    const info = v << 12 | rem;
    for (let i = 0; i < 18; i++) { const a = size - 11 + i % 3, b = Math.floor(i / 3); set(a, b, bit(info, i)); set(b, a, bit(info, i)); }
  }

  // Los datos suben y bajan en columnas de a dos, desde la derecha.
  let at = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;
      if (!fixed[y][x] && at < stream.length * 8) { m[y][x] = bit(stream[at >>> 3], 7 - (at & 7)); at++; }
    }
  }

  // Se prueba cada máscara y queda la que deja el dibujo más fácil de leer.
  const penalty = grid => {
    let score = 0, dark = 0;
    const runs = line => {
      for (let i = 0, run = 1; i < size; i++, run++) {
        if (i + 1 < size && line(i + 1) === line(i)) continue;
        if (run >= 5) score += run - 2;
        run = 0;
      }
      for (let i = 0; i + 10 < size; i++) {
        const p = k => line(i + k);
        if (p(0) && !p(1) && p(2) && p(3) && p(4) && !p(5) && p(6) && !p(7) && !p(8) && !p(9) && !p(10)) score += 40;
        if (!p(0) && !p(1) && !p(2) && !p(3) && p(4) && !p(5) && p(6) && p(7) && p(8) && !p(9) && p(10)) score += 40;
      }
    };
    for (let k = 0; k < size; k++) { runs(i => grid[k][i]); runs(i => grid[i][k]); }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      dark += grid[y][x];
      if (x + 1 < size && y + 1 < size && grid[y][x] === grid[y][x + 1] && grid[y][x] === grid[y + 1][x] && grid[y][x] === grid[y + 1][x + 1]) score += 3;
    }
    return score + 10 * Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5);
  };
  const masked = mask => m.map((row, y) => row.map((cell, x) => fixed[y][x] ? cell : cell ^ (QR_MASKS[mask](x, y) ? 1 : 0)));
  let best = null;
  for (let mask = 0; mask < 8; mask++) {
    drawFormat(mask);
    const grid = masked(mask), score = penalty(grid);
    if (!best || score < best.score) best = { score, grid };
  }
  return best.grid;
}

/** El código como SVG, con el margen blanco que necesitan las cámaras. */
function qrSvg(text) {
  const grid = qrMatrix(text), n = grid.length + 8;
  let d = '';
  grid.forEach((row, y) => row.forEach((cell, x) => { if (cell) d += `M${x + 4} ${y + 4}h1v1h-1z`; }));
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" role="img" aria-label="Código QR para la app de verificación"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/** Dibuja el plano de la Planta Ruta 5 como lo exportaría un programa de arquitectura: 48 × 30 m a 40 px por metro. */
function dibujoPlanta() {
  const M = 40, W = 48 * M, H = 30 * M, c = Object.assign(document.createElement('canvas'), { width: W, height: H }), x = c.getContext('2d');
  const X = v => (v + 24) * M, Y = v => (v + 15) * M;

  const muros = [
    [-22, 13, 22, 13, 0.3, [[-18.5, -17.5]]], [-22, -13, 22, -13, 0.3, [[-2, 4]]], [-22, -13, -22, 13, 0.3, []], [22, -13, 22, 13, 0.3, []],
    [-22, 5, 22, 5, 0.15, [[-11, -7.6], [3.55, 4.45], [14.6, 15.5]]], [-14, -13, -14, 13, 0.15, [[-8.45, -7.55], [-0.45, 0.45], [8.5, 9.5]]],
    [-22, -4, -14, -4, 0.15, []], [-6, 5, -6, 13, 0.15, [[8.55, 9.45]]], [6, 5, 6, 13, 0.15, [[8.55, 9.45]]], [14, 5, 14, 13, 0.15, []],
    [12, -13, 12, -2, 0.15, [[-6.45, -5.55]]], [12, -2, 22, -2, 0.15, []],
  ];
  x.fillStyle = '#1f2125';
  for (const [x0, z0, x1, z1, g, huecos] of muros) {
    const horiz = z0 === z1, a = horiz ? x0 : z0, b = horiz ? x1 : z1, tramos = []; let s = a;
    for (const [h0, h1] of huecos) { tramos.push([s, h0]); s = h1; } tramos.push([s, b]);
    for (const [t0, t1] of tramos) if (t1 > t0) horiz ? x.fillRect(X(t0) - (t0 === a ? g * M / 2 : 0), Y(z0) - g * M / 2, (t1 - t0) * M + (t0 === a ? g * M / 2 : 0) + (t1 === b ? g * M / 2 : 0), g * M)
      : x.fillRect(X(x0) - g * M / 2, Y(t0), g * M, (t1 - t0) * M);
  }
  // puertas dibujadas como en el plano: la hoja y su giro
  x.strokeStyle = '#1f2125'; x.lineWidth = 2;
  const puerta = (hx, hz, ancho, a0, a1) => { x.beginPath(); x.moveTo(X(hx), Y(hz)); x.lineTo(X(hx) + Math.cos(a1) * ancho * M, Y(hz) + Math.sin(a1) * ancho * M); x.stroke();
    x.setLineDash([6, 6]); x.beginPath(); x.arc(X(hx), Y(hz), ancho * M, Math.min(a0, a1), Math.max(a0, a1)); x.stroke(); x.setLineDash([]); };
  puerta(-18.5, 13, 0.9, 0, -Math.PI / 2); puerta(-14, 8.5, 0.9, Math.PI / 2, 0); puerta(-14, -0.45, 0.9, Math.PI / 2, Math.PI); puerta(-14, -8.45, 0.9, Math.PI / 2, Math.PI);
  puerta(3.55, 5, 0.9, 0, Math.PI / 2); puerta(-6, 8.55, 0.9, Math.PI / 2, 0); puerta(6, 8.55, 0.9, Math.PI / 2, 0); puerta(12, -6.45, 0.9, -Math.PI / 2, 0); puerta(14.6, 5, 0.9, 0, Math.PI / 2);
  // portón de carga y molinetes
  x.setLineDash([10, 8]); x.strokeRect(X(-2), Y(-13.6), 6 * M, 0.5 * M); x.setLineDash([]);
  for (const mx of [-10.3, -8.3]) { x.fillStyle = '#8a8f98'; x.fillRect(X(mx - 0.62), Y(4.6), 0.3 * M, 0.8 * M); x.strokeRect(X(mx - 0.31), Y(4.6), 0.62 * M, 0.8 * M); }
  // muebles livianos, para que se lea como un plano real
  x.strokeStyle = '#9aa0a8'; x.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) x.strokeRect(X(-21.4), Y(-3.4 + i * 1.3), 0.5 * M, 1.1 * M);                    // lockers
  for (const [ax, az] of [[-20, -10], [-17, -10], [-20, -7], [-17, -7]]) x.strokeRect(X(ax), Y(az), 2 * M, 1 * M);   // mesas del comedor
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) x.strokeRect(X(-10 + i * 5.5), Y(-10 + j * 6), 4 * M, 2.2 * M);   // líneas de producción
  for (let i = 0; i < 4; i++) x.strokeRect(X(13), Y(-12.2 + i * 2.4), 8 * M, 0.8 * M);                      // estanterías
  for (const [ax, az] of [[-4, 7], [-1.5, 7], [-4, 10], [-1.5, 10], [8, 7.5], [16, 7.5]]) x.strokeRect(X(ax), Y(az), 1.6 * M, 0.8 * M);
  // nombre y superficie de cada ambiente
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const [n, cx, cz, m2] of [['Portería', -18, 9, '64,0'], ['Hall de molinetes', -10, 10.2, '64,0'], ['Oficinas', 0, 12, '96,0'], ['Gerencia', 10, 11.5, '64,0'], ['Sala de reuniones', 18, 11.5, '64,0'],

  x.strokeStyle = '#7b818b'; x.fillStyle = '#7b818b'; x.lineWidth = 1.5; x.font = '22px system-ui, sans-serif';
  x.beginPath(); x.moveTo(X(-22), Y(-14.2)); x.lineTo(X(22), Y(-14.2)); x.moveTo(X(-23.2), Y(-13)); x.lineTo(X(-23.2), Y(13)); x.stroke();
  for (const v of [-22, 22]) { x.beginPath(); x.moveTo(X(v), Y(-14.5)); x.lineTo(X(v), Y(-13.9)); x.stroke(); }
  x.fillText('44,00', X(0), Y(-14.6));
  x.save(); x.translate(X(-23.6), Y(0)); x.rotate(-Math.PI / 2); x.fillText('26,00', 0, 0); x.restore();
  x.lineWidth = 2; x.beginPath(); x.moveTo(X(23), Y(-11.5)); x.lineTo(X(23.4), Y(-12.6)); x.lineTo(X(23.8), Y(-11.5)); x.stroke(); x.fillText('N', X(23.4), Y(-13.3));
  x.textAlign = 'right'; x.fillStyle = '#2b2e35'; x.font = '600 22px system-ui, sans-serif'; x.fillText('Planta Ruta 5 · planta baja', X(22), Y(14.3));
  x.textAlign = 'left'; x.fillStyle = '#7b818b'; x.font = '20px system-ui, sans-serif';
  for (let i = 0; i <= 2; i++) { x.fillRect(X(-22 + i * 5), Y(14.05), 2, 14); x.fillText(`${i * 5}`, X(-22 + i * 5) + 5, Y(14.45)); }

/** Solo toca la pantalla si el contenido cambió: lo que llega en vivo no rehace lo que está igual. */
const drawn = new WeakMap();
function setHTML(el, content) {
  const text = Array.isArray(content) ? content.join('') : String(content);
  if (!el || drawn.get(el) === text) return false;
  drawn.set(el, text);
  el.innerHTML = text;
  return true;
}

let toastTimer;

}

/** Botones de dos toques (abrir, eliminar): el primero arma, el segundo confirma. */
function confirmed(button, question) {
  if (button.dataset.armed != null) return true;
  button.dataset.label = button.textContent;
  button.dataset.armed = '';
  button.textContent = question;
  setTimeout(() => disarm(button), 3500);
  return false;
}
function disarm(button) {
  if (!button.isConnected || button.dataset.armed == null) return;
  delete button.dataset.armed;
  button.textContent = button.dataset.label;
}

function values(form) {
  const out = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') {
      if (el.dataset.list == null) out[el.name] = el.checked;
      else (out[el.name] ??= []).push(...(el.checked ? [el.value] : []));
    } else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
    else out[el.name] = el.type === 'password' ? el.value : el.value.trim();
  }
  return out;
}

async function submit(form) {
  const button = $('button[type="submit"]', form), error = $('.form-error', form);
  if (error) error.textContent = '';
  // campos que no son de los del navegador (como el área): avisan si quedaron vacíos
  const missing = $$('input[type="hidden"][data-required]', form).find(i => !i.value);
  if (missing) { if (error) error.textContent = missing.dataset.required; else toast(missing.dataset.required, 'deny'); missing.closest('[data-picker]')?.querySelector('.picker-btn')?.focus(); return; }
  if (button) button.disabled = true;
  try {
    await forms[form.dataset.form](form, values(form));
  } catch (e) {
    if (error?.isConnected) error.textContent = e.message; else toast(e.message, 'deny');
  } finally {
    if (button?.isConnected) button.disabled = false;
  }
}

async function copyText(text, done = 'Copiado') {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch { toast('No se pudo copiar: seleccioná el texto y copialo a mano', 'deny'); }
}
actions.copy = el => copyText(el.dataset.text);

// ── La pastilla: una sola forma de marcar dónde estás (menú, barra del celular y pestañas) ──
/** El frente llega primero (340 ms) y la cola lo alcanza (550 ms). */
function movePill(container, axis = 'y') {
  const pill = container && $(':scope > .pill', container);
  if (!pill) return;
  const target = $(':scope > [aria-current="page"], :scope > [aria-pressed="true"]', container);
  if (!target || !target.offsetParent) return pill.classList.remove('on');
  const c = container.getBoundingClientRect(), t = target.getBoundingClientRect(), edge = container.clientLeft;
  const box = { top: t.top - c.top - edge, bottom: c.bottom - t.bottom - edge, left: t.left - c.left - edge, right: c.right - t.right - edge };
  const a = axis === 'y' ? box.top : box.left, forward = a > Number(pill.dataset.a ?? a), first = !pill.classList.contains('on');
  pill.style.setProperty('--pa', forward ? '.55s' : '.34s');
  pill.style.setProperty('--pb', forward ? '.34s' : '.55s');
  if (first) pill.style.transition = 'none';
  for (const side in box) pill.style[side] = `${box[side]}px`;
  pill.dataset.a = a;
  if (first) { void pill.offsetWidth; pill.style.transition = ''; }
  pill.classList.add('on');
}
/** Grupo de pestañas con pastilla. options: [[id, texto]] */

    $('meta[name="theme-color"]').content = root.dataset.mode === 'dark' ? '#030304' : '#E3E6EA';
  },
  /** Tinta que se lee sobre el color elegido: grafito sobre los claros, blanco sobre los oscuros. */
  ink(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4);
    return .2126 * r + .7152 * g + .0722 * b > .3 ? '#1E1F23' : '#FFFFFF';
  },
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => look.apply());

// ── Puertas ──────────────────────────────────────────────────────────────────
function doorLook(d) {
  const off = d.device_status !== 'online', alert = !off && S.doorAlert[d.id], last = S.lastPass[d.id];
  const mode = !off && S.sites.find(s => s.id === d.site_id)?.mode;   // el área está en emergencia: manda sobre lo demás
  if (mode === 'open') return { state: 'open', alert: false, sub: 'Abierta por evacuación' };
  if (mode === 'locked') return { state: 'closed', alert: false, sub: 'Bloqueada' };
  const sub = off ? 'Sin conexión' : alert ? KIND[alert]
    : d.state === 'open' ? (last && Date.now() - last.at < 15_000 && last.name) || 'Abierta'
    : d.state === 'closed' ? 'Cerrada' : 'Sin sensor';
  return { state: off ? 'off' : d.state, alert: Boolean(alert), sub };
}

function doorTile(d) {
  const state = doorLook(d);
  return html`<button class="door" type="button" data-action="door" data-door="${d.id}" data-state="${state.state}" ${state.alert ? raw('data-alert') : ''}>
    ${GLYPH}<span class="door-name">${d.name}</span><span class="door-sub">${state.sub}</span></button>`;
}

/** Actualiza una puerta ya dibujada sin recrearla, así la hoja gira en vez de saltar. */
function patchDoor(id) {
  const d = S.doors.find(p => p.id === id), el = $(`.door[data-door="${CSS.escape(id)}"]`);
  if (!d || !el) return;
  const state = doorLook(d);
  el.dataset.state = state.state;
  el.toggleAttribute('data-alert', state.alert);
  $('.door-sub', el).textContent = state.sub;
}

function hoursChart(hours) {
  const peak = Math.max(1, ...hours.map(h => h.granted + h.denied)), total = hours.reduce((n, h) => n + h.granted + h.denied, 0);
  const width = 288, step = width / 24, scale = 44 / peak;
  const bars = hours.map((h, i) => {
    const x = (i * step + 1.5).toFixed(1), w = (step - 3).toFixed(1), g = h.granted * scale, d = h.denied * scale;
    return (g ? `<rect class="pass" x="${x}" y="${(48 - g).toFixed(1)}" width="${w}" height="${g.toFixed(1)}" rx="2"/>` : '')
      + (d ? `<rect class="deny" x="${x}" y="${(48 - g - d).toFixed(1)}" width="${w}" height="${d.toFixed(1)}" rx="2"/>` : '');
  }).join('');
  return html`<figure class="chart" id="chart"><svg class="hours" viewBox="0 0 ${width} 50" role="img" aria-label="Pasadas por hora en las últimas 24 horas">${raw(bars)}<path class="base" d="M0 48.5H${width}"/></svg>
    <figcaption class="hours-cap"><span>hace 24 h</span><span>${total ? `${count(total, 'pasada', 'pasadas')}, pico de ${peak} por hora` : 'Sin pasadas en las últimas 24 horas'}</span><span>ahora</span></figcaption></figure>`;
}

  return html`${S.linkDown ? html`<span class="bad">Sin conexión con el servidor; reintentando.</span> ` : ''}

      : o.devices.total === 1 ? 'El equipo está en línea.' : html`Los <b>${o.devices.total}</b> equipos están en línea.`}
    ${o.doors.total ? (o.doors.open ? html`<b>${count(o.doors.open, 'puerta abierta', 'puertas abiertas')}</b> ahora.` : 'Ninguna puerta abierta.') : ''}
    ${S.presence.length ? html`<b>${count(S.presence.length, 'persona', 'personas')}</b> adentro.` : ''}
    Hoy van <b>${count(o.today.granted, 'acceso', 'accesos')}</b> y <b>${count(o.today.denied, 'rechazo', 'rechazos')}</b>${o.today.alerts ? html`, con <span class="bad">${count(o.today.alerts, 'alerta', 'alertas')}</span>` : ''}.
    ${o.sync.error ? html`<span class="bad">${count(o.sync.error, 'alta falló', 'altas fallaron')} al enviarse a los equipos.</span>` : ''}
    ${o.sync.pending ? html`<span class="wait">${count(o.sync.pending, 'alta pendiente', 'altas pendientes')} de enviar.</span>` : ''}`;
}

function syncChip(p) {
  if (!p.active) return html`<span class="chip">Deshabilitada</span>`;
  const { done = 0, pending = 0, error = 0, unsupported = 0 } = p.sync;
  if (error) return html`<span class="chip" data-tone="deny">Error en ${count(error, 'equipo', 'equipos')}</span>`;
  if (pending) return html`<span class="chip" data-tone="warn">Enviando a ${count(pending, 'equipo', 'equipos')}</span>`;
  if (done) return html`<span class="chip" data-tone="pass">En ${count(done, 'equipo', 'equipos')}</span>`;
  if (unsupported) return html`<span class="chip">Carga manual en ${count(unsupported, 'equipo', 'equipos')}</span>`;
  return html`<span class="chip">Sin puertas asignadas</span>`;
}

/** Achica la foto hasta que entre en lo que aceptan los terminales faciales (200 KB). */
async function shrinkPhoto(file) {
  const image = await createImageBitmap(file);
  for (const [side, quality] of [[640, 0.85], [520, 0.8], [420, 0.75], [320, 0.7]]) {
    const scale = Math.min(1, side / Math.max(image.width, image.height));
    const canvas = Object.assign(document.createElement('canvas'), { width: Math.round(image.width * scale), height: Math.round(image.height * scale) });
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    const url = canvas.toDataURL('image/jpeg', quality);
    if (url.length * 0.75 < 190 * 1024) return url;
  }
  throw new Error('No se pudo achicar la foto. Probá con otra imagen.');
}

// y busca por número (legajo, tarjeta, documento, dirección del equipo). Lo que coincide exacto con el número va primero.
const palette = {
  items: [], index: 0, mode: 'all',
  open(mode = 'all') {
    this.mode = mode;
    $('#palette').hidden = false;
    Object.assign($('#palette-q'), { value: '', placeholder: mode === 'doors' ? '¿Qué puerta abrimos?' : 'Nombre, número, tarjeta, puerta o equipo' }).focus();
    this.render();
  },
  close() { $('#palette').hidden = true; },
  get isOpen() { return !$('#palette').hidden; },
  render() {
    const raw = $('#palette-q').value.trim(), q = fold(raw), num = raw.replace(/\D/g, '');
    const hit = (...parts) => !q || fold(parts.filter(Boolean).join(' ')).includes(q);
    const same = (...nums) => num.length > 0 && nums.some(n => n && String(n).replace(/\D/g, '') === num);
    const groups = [], all = this.mode === 'all';
    const add = (label, list, max = q ? 6 : 5) => {
      if (!list.length) return;
      list.sort((a, b) => (b.exact ? 1 : 0) - (a.exact ? 1 : 0));
      groups.push([label, list.slice(0, max)]);
    };
    const screens = () => add(q ? 'Pantallas' : 'Ir a', NAV.filter(n => n.id && hit(n.label)).map(n => ({ icon: n.id, title: n.label, run: () => { location.hash = n.id; } })), q ? 4 : 9);
    if (all && !q) screens();
    if (all && q) {
      const staff = [], visits = [];
      for (const p of S.people) {
        const card = num && p.cards.find(c => String(c).replace(/\D/g, '') === num);
        if (!hit(p.name, p.company, p.document, p.ref, p.host, ...p.cards)) continue;
        (p.kind === 'visit' ? visits : staff).push({ key: p.ref, title: p.name, exact: same(p.ref, p.document, ...p.cards),
          sub: [p.kind === 'visit' ? (p.host ? `Visita a ${p.host}` : 'Visita') : p.company, card ? `tarjeta ${card}` : '', p.document && same(p.document) ? `documento ${p.document}` : ''].filter(Boolean).join(', '),
          run: () => actions['person-edit']({ dataset: { id: p.id } }) });
      }
      add('Personas', staff); add('Visitas', visits);
    }
    add('Puertas', S.doors.filter(d => hit(d.name, d.site_name, d.device_name)).map(d => ({ icon: 'panel', title: d.name, sub: `${d.site_name}, ${doorLook(d).sub.toLowerCase()}`, run: () => actions.door({ dataset: { door: d.id } }) })));
    if (all && q) {
      add('Equipos', S.devices.filter(d => hit(d.name, d.brand_label, d.host, d.model, d.serial)).map(d => ({ icon: 'equipos', title: d.name, sub: [d.brand_label, d.site_name, d.host].filter(Boolean).join(', '), exact: same(d.host, d.serial),
        run: () => { location.hash = 'equipos'; if (isAdmin()) actions['device-edit']({ dataset: { id: d.id } }); } })));
      if (isGlobal() && S.companies.length > 1) add('Empresas', S.companies.filter(c => hit(c.name, c.legal_name, c.tax_id, ...c.areas.map(a => a.name))).map(c => ({ icon: 'empresa', title: c.name, exact: same(c.tax_id),
        sub: c.areas.map(a => a.name).join(', ') || 'Sin áreas', run: () => { location.hash = 'panel'; setVista({ empresa: c.id, area: '' }); } })));
      screens();
      // como en Olumi: la búsqueda también se puede dejar puesta en la lista de personas
      groups.push(['', [{ icon: 'search', title: `Buscar «${raw}» en Personas`, run: () => { S.peopleQ = raw; if (S.view === 'personas') { const f = $('#people-q'); if (f) f.value = raw; load('people').then(() => { setHTML($('#people-list'), peopleRows()); drawChrome(); }); } else location.hash = 'personas'; } }]]);
    }
    this.items = groups.flatMap(([, list]) => list);
    this.index = 0;
    let i = 0;
    $('#palette-list').innerHTML = this.items.length ? groups.map(([label, list]) => html`${label ? html`<li class="group" role="presentation">${label}</li>` : ''}${list.map(item => html`<li role="presentation">
      <button class="opt" type="button" role="option" data-action="palette-run" data-i="${i}" aria-selected="${String(i++ === 0)}">${item.key ? html`<span class="key">${item.key}</span>` : icon(item.icon ?? 'personas')}<span><b>${item.title}</b>${item.sub ? html`<small>${item.sub}</small>` : ''}</span></button></li>`)}`).join('')
      : html`<li class="empty" style="padding:16px">Nada coincide con esa búsqueda.</li>`;
  },
  move(step) {
    if (!this.items.length) return;
    this.index = (this.index + step + this.items.length) % this.items.length;
    $$('#palette-list .opt').forEach((el, i) => { el.setAttribute('aria-selected', String(i === this.index)); if (i === this.index) el.scrollIntoView({ block: 'nearest' }); });
  },
  run(i = this.index) { const item = this.items[i]; if (!item) return; this.close(); item.run(); },
};

function peopleRows() {

  if (visits) return list.sort((a, b) => b.active - a.active || (b.valid_to ?? 0) - (a.valid_to ?? 0)).map(p => html`<li><button class="row ${S.fresh === p.id ? 'fresh' : ''}" type="button" data-action="person-edit" data-id="${p.id}">
    <span class="avatar ${p.active ? '' : 'idle'}">${initials(p.name)}</span>
    <span class="row-main"><strong>${p.name}</strong><span>${[p.host && `Visita a ${p.host}`, p.company, areaById(p.site_id)?.name].filter(Boolean).join(', ') || 'Visita'}</span></span>
    <span class="row-side">${visitChip(p)}<span>${p.valid_to ? `Hasta ${when(p.valid_to)}` : ''}</span></span></button></li>`);
  return list.map(p => {
    const creds = [p.cards.length && count(p.cards.length, 'tarjeta', 'tarjetas'), p.has_face && 'rostro', p.has_pin && 'clave'].filter(Boolean).join(', ');
    const levels = p.levels.map(id => S.levels.find(l => l.id === id)?.name).filter(Boolean).join(', ');
    const manual = p.sync.unsupported && (p.sync.done || p.sync.pending || p.sync.error);
    return html`<li><button class="row ${S.fresh === p.id ? 'fresh' : ''}" type="button" data-action="person-edit" data-id="${p.id}">
      <span class="avatar ${p.active ? '' : 'idle'}">${initials(p.name)}</span>

  });
}

          <span>${canDo(d.capabilities)}${d.capabilities.people ? '' : '. Las personas se cargan con el software de la marca'}</span></span>
        <span class="row-side">${deviceChip(d)}<span>${d.status === 'offline' ? d.status_detail : count(d.doors, 'puerta', 'puertas')}${d.sync_errors ? `, ${count(d.sync_errors, 'alta con error', 'altas con error')}` : ''}</span></span></button></li>`)
        : html`<li class="empty">Esta área no tiene equipos todavía.</li>`}</ul></section>`;

/** Qué puede hacer Kliva con un equipo, dicho sin vueltas: es lo que mira el instalador antes de prometer algo. */
function klivaPuede(c) {
  const yes = [c.liveEvents && 'recibe los eventos', c.remoteOpen && 'abre a distancia', c.people && 'carga personas', c.history && 'recupera lo que pasó sin conexión',
    c.readPeople && 'trae las personas ya cargadas', c.hold && 'abre todo en una evacuación', c.lock && 'bloquea las puertas'].filter(Boolean);
  const no = [!c.people && 'cargar personas', !c.history && 'recuperar lo que pasó sin conexión', !c.readPeople && 'traer las personas ya cargadas', !c.lock && 'bloquear las puertas a distancia'].filter(Boolean);
  return `${yes.join(', ').replace(/^./, x => x.toUpperCase())}.${no.length ? ` Todavía no: ${no.join(', ')}.` : ''}`;
}
const brandHint = b => b.capabilities.people

async function fillSettings() {
  if (!isAdmin()) return;
  const tab = settingsTab(), still = () => S.view === 'ajustes' && settingsTab() === tab;
  if ($('#user-list')) {
    S.users = await S.api.get('/api/users');
    const list = $('#user-list');
    if (still() && list) setHTML(list, userRows(list.dataset.company || null));
  } else if (tab === 'bitacora') {
    const audit = await S.api.get('/api/audit');
    if (still()) setHTML($('#audit-list'), audit.length ? audit.map(a => html`<li class="ev long"><time>${dayFormat.format(a.ts)}</time><span class="sign" aria-hidden="true"></span>
      <span><strong>${a.action}</strong><span class="ev-where">${[a.detail, a.user_name].filter(Boolean).join(', por ')}</span></span></li>`) : html`<li class="empty">Sin movimientos todavía.</li>`);
  } else if (tab === 'datos' && S.security.backups) {
    const backups = await S.api.get('/api/backups');
    if (still()) setHTML($('#backup-list'), backups.length ? backups.map(b => html`<li class="row flat"><span class="badge">${icon('data')}</span>
      <span class="row-main"><strong>${dayFormat.format(b.at)}</strong><span class="mono">backups/${b.name}</span></span><span class="row-side">${(b.size / 1048576).toFixed(1).replace('.', ',')} MB</span></li>`) : html`<li class="empty">Todavía no hay copias.</li>`);
  }
}

// ── Plano ────────────────────────────────────────────────────────────────────
// El plano de cada área con las puertas en 3D arriba. Es el motor común de Unity Tech (el mismo de Ondi y Darvi), dentro de un marco:
// Kliva le pasa un anfitrión con el plano guardado, las puertas reales y lo que pasa en vivo; el motor dibuja, edita y avisa qué guardar.
// Sin «embebida»: el Plano ocupa toda la vista (no es una página que se desplaza), así que la rueda y los dos dedos del
// trackpad giran y acercan la cámara como en Ondi y Olumi, sin tener que apretar Ctrl.
const MOTOR = '/motor/beta/index.html?app=kliva';
const planoSite = () => S.sites.find(s => s.id === S.planoSite) || S.sites[0];

/** Cómo está cada puerta, en las palabras del motor. */
function doorPlanState(d) {
  if (!d || d.device_status !== 'online') return 'caida';
  if (S.doorAlert[d.id]) return 'alerta';
  return d.state === 'open' ? 'abierta' : 'cerrada';
}

/** Prepara el anfitrión del motor para el sitio elegido. El marco lo lee al abrir, así que esto va antes de dibujar la vista. */
async function preparePlan() {
  const site = planoSite();
  S.planoSite = site?.id ?? null;
  if (!site) return;
  if (S.motorOk === undefined) S.motorOk = await fetch(MOTOR.split('?')[0], { method: 'HEAD' }).then(r => r.ok, () => false);
  const { plano } = await S.api.get(`/api/sites/${site.id}/plano`);
  let timer = null, pending = null, listener = null;
  window.__maquetaHost = {
    state: plano, park: site.name, installer: S.me.name,
    role: isAdmin() ? 'inst' : 'cli',
    tema: root.dataset.mode === 'dark' ? 'oscuro' : 'claro',
    save(state) {   // el motor ya espera a que se termine de mover algo; acá se juntan los cambios seguidos en un solo envío
      pending = state; clearTimeout(timer);
      timer = setTimeout(async () => {
        const body = pending; pending = null;
        try { await S.api.put(`/api/sites/${site.id}/plano`, { plano: body }); for (const x of body.puertas ?? []) S.places[x.puerta] = x.lugar; }
        catch (e) { toast(e.status === 413 ? 'El plano es demasiado grande: probá con una imagen más liviana' : e.message, 'deny'); }
      }, 600);
    },
    puertas: async () => S.doors.filter(d => d.site_id === site.id).map(d => ({ id: d.id, nombre: d.name, equipo: d.device_name, estado: doorPlanState(d) })),
    alVivo: fn => { listener = fn; },
    vivo: m => listener?.(m),
    abrir: canOperate() ? id => S.api.post(`/api/doors/${id}/open`) : undefined,
    juego: on => root.classList.toggle('plano-full', on),
  };
}

/** Lo que llega en vivo, traducido para el motor: solo las puertas del sitio que se está mirando. */
function planLive(type, data) {
  const host = window.__maquetaHost;
  if (S.view !== 'plano' || !host || S.replay) return; // durante una repetición, el plano muestra el pasado
  const ofSite = id => S.doors.find(d => d.id === id && d.site_id === S.planoSite);
  if (type === 'event' && data.door_id && ofSite(data.door_id)) {
    const d = ofSite(data.door_id);
    if (data.kind === 'access_granted') host.vivo({ puerta: d.id, ev: 'pasa', quien: data.person_name || '', estado: doorPlanState(d) });
    else if (data.kind === 'access_denied') host.vivo({ puerta: d.id, ev: 'rechazo', estado: doorPlanState(d) });
    else host.vivo({ puerta: d.id, estado: doorPlanState(d) });
  } else if (type === 'door' && ofSite(data.id)) host.vivo({ puerta: data.id, estado: doorPlanState(ofSite(data.id)) });
  else if (type === 'device') for (const d of S.doors.filter(x => x.device_id === data.id && x.site_id === S.planoSite)) host.vivo({ puerta: d.id, estado: doorPlanState(d) });
}

views.plano = () => {
  const site = planoSite();
  if (!site) return html`${head('Plano')}<section class="card"><p class="empty">Todavía no hay áreas. Se crean en Ajustes, en la ficha de la empresa, y después se les suman sus equipos.</p></section>`;
  const lede = isAdmin() ? 'Tocá Editar para subir el plano del lugar, ubicar cada puerta y nombrar los sectores.' : 'Cada puerta, en su lugar y en vivo.';
  return html`
    <header class="view-head"><div><h1>Plano</h1><p class="lede">${lede}</p></div>
      ${S.sites.length > 1 ? seg('plano-site', S.sites.map(s => [s.id, s.name]), site.id, 'Área') : ''}${S.motorOk === false ? '' : html`<div class="replay" id="replay">${replayBar()}</div>`}</header>
    <div class="plano">${S.motorOk === false
      ? html`<p class="empty">El plano 3D se abre con Kliva instalado o en unitytech.uy/kliva/beta. Esta copia no trae los archivos del motor.</p>`
      : html`<iframe id="plano-frame" src="${MOTOR}&sitio=${site.id}" title="Plano de ${site.name}" allow="fullscreen"></iframe>`}</div>`;
};

};

/** Lleva al plano y, cuando el motor está listo, elige la puerta. */

/** El motor avisa que está listo cuando aparece window.__maqueta en el marco; entonces se elige la puerta pedida. */
async function focusPlanDoor() {
  const id = S.planoFocus; if (!id) return;
  S.planoFocus = null;

    const M = $('#plano-frame')?.contentWindow?.__maqueta;
    if (M) { const p = M.E.piezas.find(q => q.puerta === id); if (p) M.elegir(p, true); else toast('Esa puerta todavía no está ubicada en el plano'); return; }
    await wait(100);
  }
}

/** El modo noche de Kliva manda: el motor cambia con él. */
function planTheme() {
  const host = window.__maquetaHost, M = $('#plano-frame')?.contentWindow?.__maqueta;
  const tema = root.dataset.mode === 'dark' ? 'oscuro' : 'claro';
  if (host) host.tema = tema;
  if (M && M.motor.tema !== tema) M.motor.ponerTema(tema);
}

// ── Repetición: volver a ver en el plano lo que pasó ─────────────────────────
// Las pasadas de un rato (una hora, cuatro, o todo el día) se vuelven a mostrar aceleradas sobre el plano: cada puerta
// se abre con el nombre de quien pasó y el reloj corre arriba. Sirve para revisar un incidente sin leer un listado.
const REPLAYS = [['La última hora', 3600_000], ['Las últimas 4 horas', 4 * 3600_000], ['Todo el día de hoy', 0]];
const replayBar = () => S.replay
  ? html`<button class="btn sm" type="button" data-action="replay-stop" aria-label="Detener la repetición" title="Detener">${icon('alto')}</button>
      <span class="replay-now"><b id="replay-clock">${hourFormat.format(S.replay.from)}</b><small>${count(S.replay.total, 'pasada', 'pasadas')}</small></span><i class="replay-line"><i id="replay-fill"></i></i>`
  : html`<button class="btn sm" type="button" data-action="replay" title="Volver a ver en el plano lo que pasó">${icon('repetir')}<span>Repetir</span></button>`;
const drawReplay = () => { const box = $('#replay'); if (box) setHTML(box, replayBar()); };
actions.replay = () => sheet.open('Repetir en el plano', html`<p class="hint">Las pasadas de ese rato se vuelven a ver sobre el plano, aceleradas, con el nombre de quien pasó por cada puerta.</p>
  <ul class="rows">${REPLAYS.map(([label, ms]) => html`<li><button class="row" type="button" data-action="replay-play" data-ms="${ms}"><span class="badge">${icon('repetir')}</span><span class="row-main"><strong>${label}</strong></span></button></li>`)}</ul>`);
actions['replay-stop'] = () => stopReplay();
actions['replay-play'] = async el => {
  const ms = Number(el.dataset.ms), to = Date.now(), from = ms ? to - ms : new Date().setHours(0, 0, 0, 0), host = window.__maquetaHost;
  const doors = new Set(S.doors.filter(d => d.site_id === S.planoSite).map(d => d.id));
  sheet.close();
  let events = [];
  try {
    for (let before = to; events.length < 4000;) {
      const page = await S.api.get(`/api/events?group=access&from=${from}&before=${before}&limit=1000`);
      events.push(...page);
      if (page.length < 1000) break;
      before = page.at(-1).ts;
    }
  } catch (e) { return toast(e.message, 'deny'); }
  events = events.filter(e => doors.has(e.door_id)).reverse();
  if (!events.length || !host) return toast('No hubo pasadas en ese rato en esta área');
  stopReplay();
  const span = to - from, length = Math.min(45_000, Math.max(12_000, events.length * 400)); // dura entre 12 y 45 segundos, según cuánto pasó
  const R = S.replay = { from, total: events.length, timers: [], started: performance.now() };
  for (const id of doors) host.vivo({ puerta: id, estado: 'cerrada' });
  drawReplay();
  for (const e of events) R.timers.push(setTimeout(() => {
    const granted = e.kind === 'access_granted';
    host.vivo({ puerta: e.door_id, ev: granted ? 'pasa' : 'rechazo', quien: e.person_name || '', estado: granted ? 'abierta' : 'cerrada' });
    if (granted) R.timers.push(setTimeout(() => host.vivo({ puerta: e.door_id, estado: 'cerrada' }), 1100));
  }, (e.ts - from) / span * length));
  const step = () => {
    if (S.replay !== R) return;
    const k = Math.min((performance.now() - R.started) / length, 1), clock = $('#replay-clock'), fill = $('#replay-fill');
    if (clock) clock.textContent = hourFormat.format(from + k * span);
    if (fill) fill.style.width = `${(k * 100).toFixed(1)}%`;
    if (k < 1) R.frame = requestAnimationFrame(step); else setTimeout(() => S.replay === R && stopReplay(true), 1500);
  };
  step();
};
/** Corta la repetición y deja cada puerta como está de verdad ahora. */
function stopReplay(finished = false) {
  const R = S.replay, host = window.__maquetaHost;
  if (!R) return;
  R.timers.forEach(clearTimeout); cancelAnimationFrame(R.frame);
  S.replay = null;
  if (host) for (const d of S.doors.filter(x => x.site_id === S.planoSite)) host.vivo({ puerta: d.id, estado: doorPlanState(d) });
  drawReplay();
  if (finished) toast('Fin de la repetición: el plano vuelve a mostrar lo que pasa ahora');
}

// Empresas y áreas. Una instalación de Kliva atiende a varias empresas; cada empresa se divide en áreas
// (una planta, un centro logístico, una oficina) y cada área tiene sus equipos, sus puertas y su plano.
// Arriba siempre se ve qué empresa y qué área se está mirando; el servidor recorta todo a eso.

const isGlobal = () => Boolean(S.me) && !S.me.company_id;          // usuario de la instaladora: ve todas las empresas
const companyById = id => S.companies.find(c => c.id === id);
/** La empresa que se está mirando; null es "todas las empresas" (solo la instaladora). */
const viewCompany = () => isGlobal() ? companyById(S.vista.empresa) ?? null : companyById(S.me.company_id) ?? S.companies[0] ?? null;
const areaById = id => S.companies.flatMap(c => c.areas).find(a => a.id === id);
const companyOfArea = id => S.companies.find(c => c.areas.some(a => a.id === id));
const canSwitch = () => (isGlobal() && S.companies.length > 1) || (viewCompany()?.areas.length ?? 0) > 1;

/** Deja la vista en algo que existe y que el usuario puede ver, y se la pasa al cliente de la API. */
function fixVista(v = S.vista) {
  // con una sola empresa, mirar "todas" es mirar esa: se muestra su nombre
  const own = isGlobal() ? companyById(v.empresa) ?? (S.companies.length === 1 ? S.companies[0] : null) : viewCompany();
  const area = own?.areas.find(a => a.id === v.area);
  S.vista = { empresa: isGlobal() && own ? own.id : '', area: area?.id ?? '' };
  S.api.setView(S.vista);
}

function scopeTitle() {
  const c = viewCompany();
  return c ? c.name : 'Todas las empresas';
}
function scopeSub() {
  const c = viewCompany();
  if (!c) return count(S.companies.length, 'empresa', 'empresas');
  if (S.vista.area) return areaById(S.vista.area)?.name ?? '';
  return c.areas.length === 1 ? c.areas[0].name : c.areas.length ? `Todas las áreas (${c.areas.length})` : 'Sin áreas todavía';
}

/** En el menú, debajo de la marca: dónde estás parado. */
const scopeSwitch = () => html`<button class="me scope" type="button" data-action="scope" ${canSwitch() ? '' : raw('disabled')} title="${scopeTitle()}" aria-label="Elegir empresa y área">
  <span class="badge">${icon('empresa')}</span><span><b>${scopeTitle()}</b><small>${scopeSub()}</small></span>${canSwitch() ? icon('updown') : ''}</button>`;
const drawScope = () => { setHTML($('#scope'), scopeSwitch()); };

/** Las áreas de la empresa que se mira, para elegir una o todas. Solo aparece si hay más de una. */
function areaBar() {
  const c = viewCompany();
  if (!c || c.areas.length < 2) return '';
  return seg('scope-area', [['', 'Todas'], ...c.areas.map(a => [a.id, a.name])], S.vista.area, 'Área');
}
/** Debajo del nombre de un área: de qué empresa es (si se miran todas) y dónde queda. */
const areaSub = site => [!viewCompany() && companyById(site.company_id)?.name, site.address].filter(Boolean).join(', ');

const pickRow = (action, id, title, sub, on, glyph) => html`<li><button class="row" type="button" data-action="${action}" data-id="${id}" aria-pressed="${String(on)}">
  <span class="badge">${icon(glyph)}</span><span class="row-main"><strong>${title}</strong><span>${sub}</span></span>${on ? html`<span class="tick">${icon('check')}</span>` : ''}</button></li>`;

function scopeSheet() {
  const c = viewCompany();
  sheet.open('Qué mirar', html`
    ${isGlobal() && S.companies.length > 1 ? html`<h3>Empresa</h3><ul class="rows">
      ${pickRow('scope-company', '', 'Todas las empresas', `${count(S.companies.length, 'empresa', 'empresas')} de ${S.org}`, !S.vista.empresa, 'empresa')}
      ${S.companies.map(x => pickRow('scope-company', x.id, x.name, `${count(x.areas.length, 'área', 'áreas')}, ${count(x.people, 'persona', 'personas')}`, S.vista.empresa === x.id, 'empresa'))}</ul>` : ''}
    ${c && c.areas.length > 1 ? html`<h3>Área de ${c.name}</h3><ul class="rows">
      ${pickRow('scope-pick-area', '', 'Todas las áreas', count(c.areas.length, 'área', 'áreas'), !S.vista.area, 'site')}
      ${c.areas.map(a => pickRow('scope-pick-area', a.id, a.name, a.address || count(a.devices, 'equipo', 'equipos'), S.vista.area === a.id, 'site'))}</ul>` : ''}`);
}
actions.scope = () => canSwitch() && scopeSheet();
actions['scope-company'] = async el => {
  await setVista({ empresa: el.dataset.id, area: '' });
  if ((viewCompany()?.areas.length ?? 0) > 1) scopeSheet(); else sheet.close();
};
actions['scope-pick-area'] = async el => { sheet.close(); await setVista({ ...S.vista, area: el.dataset.id }); };
actions['scope-area'] = el => el.dataset.id !== S.vista.area && setVista({ ...S.vista, area: el.dataset.id });

/** Cambia lo que se mira: vuelve a traer todo recortado a eso y reengancha lo que llega en vivo. */
async function setVista(v) {
  S.vista = v;
  fixVista();
  saved.set('kliva.vista', JSON.stringify(S.vista));
  try { await load('overview', 'sites', 'devices', 'doors', 'levels', 'people', 'feed', 'notices', 'places', 'schedules', 'presence'); }
  catch (e) { return toast(e.message, 'deny'); }
  if (!S.sites.some(s => s.id === S.planoSite)) S.planoSite = null;
  S.stop?.();
  S.stop = S.api.stream(onLive);
  drawScope();
  await route();
}

// ── Ajustes: empresas, sus áreas y sus usuarios ──────────────────────────────

// ── Elegir el área en una ficha: con buscador (para cuando son muchas) y para crear una nueva ahí mismo,
// sin ir a Ajustes. Se abre adentro de la ficha, debajo del campo, para que no la tape nada.
const manyCompanies = () => !viewCompany() && S.companies.length > 1;
const areaLabel = s => manyCompanies() ? `${companyById(s.company_id)?.name ?? ''}, ${s.name}` : s.name;
const canCreateArea = () => isAdmin() && !S.me.areas;
function areaPicker(name, current) {
  const s = S.sites.find(x => x.id === current);
  return html`<div class="field picker" data-picker><span id="${name}-label">Área</span>
    <input type="hidden" name="${name}" value="${s?.id ?? ''}" data-required="Elegí el área${canCreateArea() ? ' o creá una' : ''}">
    <button class="picker-btn" type="button" data-action="picker-toggle" aria-expanded="false" aria-labelledby="${name}-label">
      <span class="${s ? '' : 'faint'}">${s ? areaLabel(s) : (S.sites.length ? 'Elegí un área' : 'Todavía no hay áreas: creá la primera')}</span>${icon('updown')}</button>
    <div class="picker-pop" hidden>
      <label class="picker-q">${icon('search')}<input type="search" autocomplete="off" spellcheck="false" aria-label="Buscar un área"
        placeholder="${S.sites.length ? (canCreateArea() ? 'Buscar o crear un área' : 'Buscar un área') : 'Nombre del área, por ejemplo Planta B'}"></label>
      <ul class="picker-list" role="listbox"></ul>
    </div></div>`;
}
function pickerDraw(box) {
  const typed = $('.picker-q input', box).value.trim(), q = fold(typed), cur = $('input[type="hidden"]', box).value;
  const hit = s => !q || fold(`${s.name} ${s.address ?? ''} ${companyById(s.company_id)?.name ?? ''}`).includes(q);
  const opt = s => html`<li role="presentation"><button class="opt" type="button" role="option" data-action="picker-choose" data-id="${s.id}" aria-selected="${String(s.id === cur)}">
    ${icon('site')}<span><b>${s.name}</b>${s.address ? html`<small>${s.address}</small>` : ''}</span>${s.id === cur ? icon('check') : ''}</button></li>`;
  let out = '';
  if (manyCompanies()) {
    for (const c of S.companies) {
      const list = S.sites.filter(s => s.company_id === c.id && hit(s));
      if (list.length) out += html`<li class="group" role="presentation">${c.name}</li>${list.map(opt)}`;
    }
  } else out += S.sites.filter(hit).map(opt).join('');
  // Crear: con lo que se escribió, en la empresa que se está mirando (o en cada una, si se miran todas)
  if (canCreateArea() && typed && !S.sites.some(s => fold(s.name) === q)) {
    const targets = viewCompany() ? [viewCompany()] : S.companies.length ? S.companies.slice(0, 6) : [null];
    out += html`<li class="group" role="presentation">Nueva</li>${targets.map(c => html`<li role="presentation"><button class="opt" type="button" data-action="picker-new" data-company="${c?.id ?? ''}">
      ${icon('plus')}<span><b>Crear «${typed}»</b>${c && (manyCompanies() || S.companies.length > 1) ? html`<small>en ${c.name}</small>` : ''}</span></button></li>`)}`;
  }
  if (!out) out = html`<li class="empty">${S.sites.length ? 'Ningún área coincide.' : canCreateArea() ? 'Escribí el nombre del área: una planta, un depósito, una oficina.' : 'Pedile a un administrador que cree el área.'}</li>`;
  setHTML($('.picker-list', box), out);
}
function pickerClose(box) {
  if (!box) return;
  $('.picker-pop', box).hidden = true;
  $('.picker-btn', box).setAttribute('aria-expanded', 'false');
}
function pickerSet(box, s) {
  $('input[type="hidden"]', box).value = s.id;
  setHTML($('.picker-btn', box), html`<span>${areaLabel(s)}</span>${icon('updown')}`);
  pickerClose(box);
  $('.picker-btn', box).focus();
}
actions['picker-toggle'] = el => {

  if (!pop.hidden) return pickerClose(box);
  pop.hidden = false; el.setAttribute('aria-expanded', 'true');
  const q = $('.picker-q input', box); q.value = ''; pickerDraw(box);
  q.focus({ preventScroll: true }); box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
};

// Control de horario: a qué hora entró y salió cada persona contra su turno, con las pasadas de las puertas que marcan horario.
// El cálculo es el mismo del servidor (server/core/horario.js); acá solo se muestra y se administran los turnos.

const hhmmText = min => `${String(Math.floor(min / 60) % 24).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
const hoursText = min => min < 60 ? `${min} min` : `${Math.floor(min / 60)} h${min % 60 ? ` ${String(min % 60).padStart(2, '0')}` : ''}`;
const WEEK = [[1, 'L', 'lunes'], [2, 'M', 'martes'], [3, 'M', 'miércoles'], [4, 'J', 'jueves'], [5, 'V', 'viernes'], [6, 'S', 'sábado'], [0, 'D', 'domingo']];
function daysText(days) {
  const has = new Set(days), run = list => list.every(d => has.has(d)) && has.size === list.length;
  if (run([0, 1, 2, 3, 4, 5, 6])) return 'Todos los días';
  if (run([1, 2, 3, 4, 5])) return 'Lunes a viernes';
  if (run([1, 2, 3, 4, 5, 6])) return 'Lunes a sábado';
  const names = WEEK.filter(([d]) => has.has(d)).map(([, , name]) => name.slice(0, 3));
  return names.length ? names.join(', ').replace(/^./, c => c.toUpperCase()) : 'Ningún día';
}
const scheduleText = x => `${daysText(x.days)}, ${hhmmText(x.start_min)} a ${hhmmText(x.end_min)}${x.end_min <= x.start_min ? ' del día siguiente' : ''}`;

const ESTADO_TONO = { ok: 'pass', tarde: 'warn', salio_antes: 'warn', ausente: 'deny', en_curso: 'accent', sin_salida: 'warn' };
const stateChip = state => html`<span class="chip" ${ESTADO_TONO[state] ? raw(`data-tone="${ESTADO_TONO[state]}"`) : ''}>${ESTADO[state]}</span>`;

const PERIODS = [['hoy', 'Hoy'], ['semana', 'Esta semana'], ['mes', 'Este mes']];
function periodRange(id = S.horarioPeriod) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (id === 'semana') d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  if (id === 'mes') d.setDate(1);
  return { from: d.getTime(), to: Date.now() + 1 };
}

      <div data-tone="${sum('late') ? 'warn' : ''}"><strong>${sum('late')}</strong><span>Llegadas tarde</span></div>
      <div data-tone="${sum('absent') ? 'deny' : ''}"><strong>${sum('absent')}</strong><span>Faltas</span></div>

    <section class="card flush"><div class="card-head"><h2>Personas<small>${count(people.length, 'persona con turno o con pasadas', 'personas con turno o con pasadas')} ${period}</small></h2></div>

const pageMode = () => $('meta[name="kliva-mode"]').content;     // demo (página suelta) · live (servida por Kliva) · app

/** Con qué habla la app: el servidor real, la demostración, o nada todavía (null: hay que conectar). */
function apiForMode() {
  if (pageMode() === 'live') return liveApi();

function showConnect(message = '', value = '') {
  S.stop?.();

  $('#root').innerHTML = html`<div class="gate"><form class="gate-card form" data-form="connect">${brand('Kliva', 'Control de acceso')}<h1>Conectá tu Kliva</h1>
    <p class="muted">La dirección del Kliva de tu empresa. Te la pasa quien lo instaló.</p>
    <label class="field"><span>Dirección</span><input type="text" name="server" value="${value}" placeholder="acceso.tuempresa.uy" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="url" required autofocus></label>
    <p class="form-error" role="alert">${message}</p><button class="btn pri wide" type="submit">Conectar</button>
    <button class="btn wide" type="button" data-action="connect-demo">Ver la demostración</button>
    <p class="hint">La demostración usa datos inventados y no se conecta a ningún equipo.</p></form></div>`;

forms.connect = async (_form, v) => {
  let url;
  try { url = new URL(/^https?:\/\//i.test(v.server.trim()) ? v.server.trim() : `https://${v.server.trim()}`); } catch { throw new Error('Esa dirección no es válida'); }
  const base = (url.origin + url.pathname).replace(/\/+$/, '');
  let state;
  try { state = await (await fetch(`${base}/api/state`, { signal: AbortSignal.timeout(8000) })).json(); }
  catch { throw new Error(`No se llega a ${url.host}. Revisá la dirección y que el teléfono tenga red; si es una dirección de la empresa, conectate a su Wi-Fi.`); }
  if (state?.product !== 'Kliva') throw new Error(`En ${url.host} no hay un Kliva`);
  if (!state.configured) throw new Error('Ese Kliva todavía no está instalado. La instalación se hace una vez, desde una computadora.');
  saved.set('kliva.servidor', base);
  saved.set('kliva.token', null);
  saved.set('kliva.vista', null);
  await boot();
};

/** En el teléfono, un archivo se guarda y se comparte con la hoja de iOS (Archivos, Mail, WhatsApp). */
async function shareFile(blob, filename) {
  const { Filesystem, Share } = window.Capacitor.Plugins;
  const data = await new Promise((done, fail) => { const r = new FileReader(); r.onload = () => done(String(r.result).split(',')[1]); r.onerror = fail; r.readAsDataURL(blob); });
  const { uri } = await Filesystem.writeFile({ path: filename, data, directory: 'CACHE' });
  await Share.share({ title: filename, url: uri });
}

// Emergencias y quién está adentro. Un área entera queda con las puertas abiertas (evacuación) o cerradas (bloqueo)
// hasta que alguien la vuelve a la normalidad; mientras tanto se ve arriba en toda la app. Y la lista de quién está
// adentro, que es lo primero que se pregunta en una evacuación.
const MODE = { open: ['Evacuación', 'puertas abiertas'], locked: ['Bloqueo', 'puertas cerradas'] };

/** La franja de arriba: una por cada área en emergencia de las que se están mirando. */
function drawAlarm() {
  const box = $('#alarm');
  if (box) setHTML(box, S.sites.filter(s => MODE[s.mode]).map(s => html`<button class="alarm" type="button" data-mode="${s.mode}" data-action="emergency" data-id="${s.id}" role="alert">${icon(s.mode === 'open' ? 'alert' : 'candado')}
    <span><b>${MODE[s.mode][0]} en ${s.name}</b><small>${MODE[s.mode][1].replace('p', 'P')} desde las ${hourFormat.format(s.mode_at)}<span class="by">, por ${s.mode_by}</span></small></span>
    <span class="btn sm">${canOperate() ? 'Resolver' : 'Ver'}</span><span class="go">${icon('right')}</span></button>`));
}

const insideRows = list => list.length ? html`<ul class="rows">${list.map(p => html`<li class="row flat">
  <span class="avatar">${initials(p.name)}</span><span class="row-main"><strong>${p.name}</strong><span>${[p.kind === 'visit' && (p.host ? `Visita a ${p.host}` : 'Visita'), p.company].filter(Boolean).join(', ') || `Legajo ${p.ref}`}</span></span>
  <span class="row-side">${p.kind === 'visit' ? html`<span class="chip" data-tone="warn">Visita</span>` : ''}<span>Desde las ${hourFormat.format(p.since)}, por ${p.door}</span></span></li>`)}</ul>`
  : html`<p class="empty">Nadie adentro, según las últimas pasadas.</p>`;

async function insideSheet(site, emergency) {
  if (!site) return;
  await load('presence').catch(() => {});
  const list = S.presence.filter(p => p.site_id === site.id), failed = S.modeFailed?.site === site.id ? S.modeFailed.list : [];
  sheet.open(emergency ? `Emergencia en ${site.name}` : `Adentro en ${site.name}`, html`
    ${!emergency || !canOperate() ? '' : MODE[site.mode] ? html`
      <p class="result" data-tone="${site.mode === 'open' ? 'deny' : 'warn'}"><b>${MODE[site.mode][0]}:</b> ${MODE[site.mode][1]} desde las ${hourFormat.format(site.mode_at)}, por ${site.mode_by}.</p>
      <button class="btn pri wide" type="button" data-action="mode-set" data-id="${site.id}" data-mode="normal">Volver a la normalidad</button>`
      : html`<button class="btn danger wide" type="button" data-action="mode-set" data-id="${site.id}" data-mode="open">${icon('alert')}<span>Evacuación: abrir todas las puertas</span></button>

        <p class="hint">Las puertas quedan así hasta que alguien vuelva el área a la normalidad desde acá. Queda anotado quién lo hizo y a qué hora.</p>`}
    ${failed.length ? html`<p class="result" data-tone="warn">${failed.map(f => `${f.device}: ${f.why}`).join('. ')}.</p>` : ''}
    <h3>Adentro ahora (${list.length})</h3>

    ${list.length ? html`<div class="form-actions"><button class="btn sm" type="button" data-action="presence-download">${icon('download')}<span>Descargar la lista</span></button></div>` : ''}
    <p class="hint">Cuenta la última pasada de cada persona por una puerta que marca horario, en las últimas 18 horas.</p>`);
}

const IMPORT_COLS = [['name', 'Nombre', /^(nombre|apellido|persona)/], ['document', 'Documento', /^(documento|cedula|ci\b)/], ['cards', 'Tarjetas', /^tarjeta/], ['area', 'Área', /^area/],
  ['schedule', 'Turno', /^(turno|horario)/], ['level', 'Nivel', /^nivel/], ['employer', 'Empleador', /^(empleador|contratista|empresa)/]];
function cellsOf(line, sep) {
  const out = []; let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) { if (ch !== '"') cur += ch; else if (line[i + 1] === '"') { cur += '"'; i++; } else quoted = false; }
    else if (ch === '"') quoted = true;
    else if (ch === sep) { out.push(cur); cur = ''; } else cur += ch;
  }
  return [...out, cur].map(c => c.trim());
}
/** El texto de una planilla (separada por punto y coma, coma o tabulación) → una fila por persona. */
function parsePeopleSheet(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) throw new Error('La planilla tiene que traer los títulos en la primera fila y una persona en cada fila siguiente');
  const sep = [';', '\t', ','].reduce((best, s) => lines[0].split(s).length > lines[0].split(best).length ? s : best);
  const titles = cellsOf(lines[0], sep).map(fold), cols = IMPORT_COLS.map(([key, , re]) => [key, titles.findIndex(t => re.test(t))]).filter(([, i]) => i >= 0);
  if (!cols.some(([key]) => key === 'name')) throw new Error('No encuentro la columna Nombre en la primera fila');
  return lines.slice(1).map(l => { const c = cellsOf(l, sep); return Object.fromEntries(cols.map(([key, i]) => [key, c[i] ?? ''])); });
}

  const box = $('#import-preview'), go = $('#import-go');
