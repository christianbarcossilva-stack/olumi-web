const stale = new Set();
let refreshTimer;
/** Junta los pedidos de refresco que llegan seguidos y vuelve a dibujar una sola vez (y solo si algo cambió). */
function refreshSoon(...keys) {
  keys.forEach(k => stale.add(k));
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    const batch = [...stale];
    stale.clear();
    try { await load(...batch); } catch { return; }
    if (S.view === 'personas') { setHTML($('#people-list'), peopleRows()); showFresh(); }
    else if (['panel', 'equipos', 'niveles'].includes(S.view)) render();
    else if (S.view === 'horario' && batch.includes('attendance')) render();
    drawBell();
  }, 350);
}

/** Deja un elemento a la vista moviendo solo el área de la app, nunca la página que la contiene:
 *  si está cerca, lo justo para que entre entero; si está lejos, lo lleva al medio. */
function bringIn(el) {
  const main = $('#main');
  if (!el || !main) return;
  const box = el.getBoundingClientRect(), view = main.getBoundingClientRect();
  const foot = ($('.dock')?.offsetHeight || 0) + 24; // en el celular la barra de abajo tapa el final
  const out = Math.max(box.bottom - (view.bottom - foot), 0) || Math.min(box.top - (view.top + 12), 0);
  const far = Math.abs(out) > main.clientHeight / 3;
  main.scrollBy({ top: far ? box.top - view.top - (main.clientHeight - box.height) / 2 : out, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
/** La persona recién tocada queda a la vista, una sola vez. */
function showFresh() {
  if (S.shown === S.fresh || !$('.row.fresh')) return;
  S.shown = S.fresh;
  bringIn($('.row.fresh'));
}

function onLive(type, data) {
  try { handleLive(type, data); } finally { planLive(type, data); }
}

function handleLive(type, data) {
  const status = () => { if (S.view === 'panel') { setHTML($('#status'), statusText()); patchClients(); } };
  if (type === 'event' && data.recovered) return refreshSoon('feed', 'overview', 'presence', ...(S.view === 'eventos' ? ['events'] : [])); // vino del historial de un equipo: va en su lugar, no arriba
  if (type === 'event') {
    S.feed.unshift(data);
    if (S.feed.length > 80) S.feed.length = 80;
    const o = S.overview, key = data.kind === 'access_granted' ? 'granted' : data.kind === 'access_denied' ? 'denied' : null;
    if (key) {
      o.today[key]++;
      if (data.ts - o.hours.at(-1).t < 3600_000) o.hours.at(-1)[key]++; else refreshSoon('overview');
    } else if (ALERT_KINDS.includes(data.kind)) { o.today.alerts++; refreshSoon('notices'); }
    if (data.door_id && data.kind === 'access_granted') S.lastPass[data.door_id] = { name: data.person_name, at: Date.now() };
    if (data.door_id && (data.kind === 'door_forced' || data.kind === 'door_held')) S.doorAlert[data.door_id] = data.kind;

    if (S.view === 'panel') {
      const feed = $('#feed');
      if (feed && inGroup(data, 'main')) {
        feed.insertAdjacentHTML('afterbegin', eventRow(data, { fresh: true }));
        while (feed.children.length > 40) feed.lastElementChild.remove();
        feed.parentElement.querySelector(':scope > .empty')?.remove();
      }
      status();
      if (key && $('#chart')) $('#chart').outerHTML = hoursChart(o.hours);
      if (data.door_id) patchDoor(data.door_id);
    } else if (S.view === 'eventos' && inGroup(data, S.eventGroup)) {
      S.events.unshift(data);
      $('#event-list .empty')?.remove();
      $('#event-list')?.insertAdjacentHTML('afterbegin', eventRow(data, { fresh: true, long: true }));
    }
    if (S.view === 'horario' && data.kind === 'access_granted' && data.person_id) refreshSoon('attendance');
    if (data.kind === 'access_granted' && data.person_id) refreshSoon('presence');
  } else if (type === 'door') {
    const door = S.doors.find(p => p.id === data.id);
    if (!door) return refreshSoon('doors');
    Object.assign(door, data);
    if (data.state !== 'open') delete S.doorAlert[door.id];
    S.overview.doors.open = S.doors.filter(p => p.state === 'open').length;
    if (S.view === 'panel') { patchDoor(door.id); status(); }
  } else if (type === 'site') {
    Object.assign(S.sites.find(s => s.id === data.id) ?? {}, data);
    drawAlarm();
    if (S.view === 'panel') for (const d of S.doors) if (d.site_id === data.id) patchDoor(d.id);
    status();
    refreshSoon('notices');
  } else if (type === 'device') {
    Object.assign(S.devices.find(d => d.id === data.id) ?? {}, data);
    if (data.status) for (const d of S.doors) if (d.device_id === data.id) d.device_status = data.status;
    refreshSoon('devices', 'doors', 'overview', 'notices');
  } else if (type === 'sync') {
    if (data.fresh) S.fresh = data.fresh;
    refreshSoon('people', 'devices', 'overview', 'notices');
  } else if (type === 'offline') {
    S.linkDown = true;
    status();
  } else if (type === 'online' && S.linkDown) {
    S.linkDown = false;
    refreshSoon('overview', 'sites', 'devices', 'doors', 'levels', 'people', 'feed', 'notices');
  } else if (type === 'expired') {
    S.api.setSession(null);
    showLogin('La sesión se cerró. Ingresá de nuevo.');
  }
}

// ── Ingreso ──────────────────────────────────────────────────────────────────
let pendingLogin = null;
function showLogin(message = '') {
  S.stop?.();
  pendingLogin = null;
  sheet.close(); palette.close();
  $('#root').innerHTML = html`<div class="gate"><form class="gate-card form" data-form="login">${brand('Kliva', S.org || 'Control de acceso')}<h1>Ingresar</h1>
    <label class="field"><span>Correo</span><input type="email" name="email" autocomplete="username" required autofocus></label>
    <label class="field"><span>Contraseña</span><input type="password" name="password" autocomplete="current-password" required></label>
    <p class="form-error" role="alert">${message}</p><button class="btn pri wide" type="submit">Ingresar</button>${serverLine()}</form></div>`;
}
async function signIn(credentials) {
  const out = await S.api.post('/api/login', credentials);
  if (out.mfa) {
    pendingLogin = credentials;
    return void ($('#root').innerHTML = html`<div class="gate"><form class="gate-card form" data-form="login-code">${brand('Kliva', S.org || 'Control de acceso')}<h1>Tu código</h1>
      <p class="muted">Abrí la app de códigos del teléfono y escribí los 6 dígitos de Kliva.</p>
      <label class="field"><span>Código de verificación</span><input type="text" name="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus></label>
      <p class="form-error" role="alert"></p><button class="btn pri wide" type="submit">Entrar</button>
      <div class="form-actions"><button class="btn sm" type="button" data-action="login-back">Volver</button></div>
      <p class="hint">¿Perdiste el teléfono? Un administrador puede quitártelos desde Ajustes, en la ficha de tu empresa.</p></form></div>`);
  }
  S.api.setSession(out.token);
  await enter();
}
forms.login = (_form, v) => signIn({ email: v.email, password: v.password });
forms['login-code'] = (_form, v) => signIn({ ...pendingLogin, code: v.code });
actions['login-back'] = () => showLogin();
actions.logout = async () => {
  if (S.api.demo) return toast('En la demostración la sesión queda abierta');
  await S.api.post('/api/logout').catch(() => {});
  S.api.setSession(null);
  showLogin();
};

// ── Primera instalación ──────────────────────────────────────────────────────
const W = { step: 1, preview: false, engine: 'sqlite', url: '', org: '', name: '', email: '', password: '', license: '' };
function showSetup(preview = false) { Object.assign(W, { step: 1, preview }); drawSetup(); }

function drawSetup() {
  const pg = W.engine === 'postgres';
  const body = W.step === 1 ? html`<h1>¿Dónde se guardan los datos?</h1>
      <p class="muted">Se elige una sola vez. Kliva crea ahí todo lo que necesita.</p>
      <label class="choice"><input type="radio" name="engine" value="sqlite" ${pg ? '' : raw('checked')}>
        <span><strong>En este servidor</strong><small>Base local, sin instalar nada más, con una copia de respaldo por día.</small></span></label>
      <label class="choice"><input type="radio" name="engine" value="postgres" ${pg ? raw('checked') : ''}>
        <span><strong>En una base PostgreSQL</strong><small>Un servidor de la empresa o una base en la nube. Los datos quedan donde la empresa decida.</small></span></label>
      <label class="field" id="pg-url" ${pg ? '' : raw('hidden')}><span>Dirección de la base</span>
        <input type="text" name="url" class="mono" value="${W.url}" placeholder="postgres://usuario:clave@servidor:5432/kliva" autocomplete="off" spellcheck="false">
        <small>Si la base está en la nube, agregá ?sslmode=require al final. La conexión se prueba al continuar.</small></label>`
    : W.step === 2 ? html`<h1>La empresa y su administrador</h1>
      <p class="muted">El administrador es quien después agrega equipos, personas y operadores.</p>
      <label class="field"><span>Nombre de la empresa</span><input type="text" name="org" value="${W.org}" required autofocus></label>
      <label class="field"><span>Nombre del administrador</span><input type="text" name="name" value="${W.name}" required></label>
      <label class="field"><span>Correo</span><input type="email" name="email" value="${W.email}" autocomplete="username" required></label>
      <label class="field"><span>Contraseña</span><input type="password" name="password" autocomplete="new-password" minlength="10" required><small>Al menos 10 caracteres. Después conviene activar los dos pasos en Mi cuenta.</small></label>`
    : html`<h1>Licencia</h1>
      <p class="muted">Sin licencia, Kliva funciona en modo evaluación con hasta 2 equipos. También se puede cargar más adelante, desde Ajustes.</p>
      <label class="field"><span>Clave de licencia (opcional)</span><textarea name="license" class="mono" placeholder="Pegá acá la clave">${W.license}</textarea></label>`;

  $('#root').innerHTML = html`<div class="gate"><form class="gate-card form" data-form="setup">${brand('Kliva', 'Primera instalación')}
    <div class="steps" role="img" aria-label="Paso ${W.step} de 3">${[1, 2, 3].map(n => html`<span ${n <= W.step ? raw('data-on') : ''}></span>`)}</div>
    ${body}<p class="form-error" role="alert"></p>
    <div class="form-actions">${W.step > 1 ? html`<button class="btn" type="button" data-action="setup-back">Atrás</button>` : ''}
      ${W.preview ? html`<button class="btn" type="button" data-action="setup-exit">Salir del asistente</button>` : ''}
      <button class="btn pri push" type="submit">${W.step === 3 ? 'Terminar la instalación' : 'Continuar'}</button></div></form></div>`;
}
actions['setup-back'] = () => { W.step--; drawSetup(); };
actions['setup-exit'] = () => { shell(); route(); };
actions['wizard-preview'] = () => showSetup(true);
forms.setup = async (_form, v) => {
  Object.assign(W, v);
  if (W.step === 1 && W.engine === 'postgres') {
    if (!W.url) throw new Error('Escribí la dirección de la base');
    await S.api.post('/api/setup/check-db', { url: W.url });
  }
  if (W.step < 3) { W.step++; return drawSetup(); }
  if (W.preview) { shell(); await route(); return toast('En una instalación real, acá queda todo listo para agregar equipos'); }
  const session = await S.api.post('/api/setup', {
    db: { engine: W.engine, url: W.url }, org: W.org, admin: { name: W.name, email: W.email, password: W.password }, license: W.license || undefined,
  });
  W.password = '';
  S.api.setSession(session.token);
  await enter();
};

// ── Arranque ─────────────────────────────────────────────────────────────────
async function enter() {
  try {
    const me = await S.api.get('/api/me');
    Object.assign(S, { me: me.user, org: me.org, license: me.license, engine: me.engine, security: me.security, companies: me.companies ?? [] });
  } catch (e) {
    if (e.status !== 401) throw e;
    S.api.setSession(null);
    return showLogin();
  }
  try { S.vista = JSON.parse(saved.get('kliva.vista') || '{}'); } catch { S.vista = {}; }
  fixVista();
  await load('overview', 'sites', 'devices', 'doors', 'levels', 'people', 'feed', 'notices', 'places', 'schedules', 'presence');
  S.planoSite = saved.get('kliva.plano.site');
  shell();
  await route();
  S.stop?.();
  S.stop = S.api.stream(onLive);
}

async function boot() {
  S.stop?.();
  S.api = apiForMode();
  look.apply();
  if (!S.api) return showConnect();
  try {
    const state = await S.api.get('/api/state');
    Object.assign(S, { brands: state.brands, version: state.version, org: state.org });
    if (!state.configured) isApp() ? showConnect('Ese Kliva todavía no está instalado. La instalación se hace una vez, desde una computadora.', serverHost()) : showSetup();
    else if (!S.api.hasSession()) showLogin();
    else await enter();
  } catch (e) {
    $('#root').innerHTML = html`<div class="gate"><div class="gate-card">${brand('Kliva')}<h1>No se pudo conectar</h1>
      <p class="muted">${isApp() ? `No se llega a ${serverHost()}. Revisá que el teléfono tenga red; si es una dirección de la empresa, conectate a su Wi-Fi.` : e.message}</p>
      <div class="form-actions"><button class="btn pri" type="button" data-action="retry">Reintentar</button>${isApp() ? html`<button class="btn" type="button" data-action="server-change">Cambiar de servidor</button>` : ''}</div></div></div>`;
  }
}
actions.retry = () => boot();

document.addEventListener('click', e => {
  // tocar fuera de un selector abierto lo cierra
  for (const box of $$('[data-picker]')) if (!$('.picker-pop', box).hidden && !box.contains(e.target)) pickerClose(box);
  const el = e.target.closest('[data-action]'), fn = el && actions[el.dataset.action];
  if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  (async () => fn(el, e))().catch(error => toast(error.message, 'deny'));
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  submit(form);
});
document.addEventListener('keydown', e => {
  const pick = e.target.closest?.('.picker-q');
  if (pick) {
    const box = pick.closest('[data-picker]'), opts = $$('.picker-list .opt', box), at = opts.indexOf(document.activeElement);
    if (e.key === 'Enter') { e.preventDefault(); (opts.find(o => o.getAttribute('aria-selected') === 'true' && $('.picker-q input', box).value === '') ?? opts[0])?.click(); return; }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); pickerClose(box); $('.picker-btn', box).focus(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); opts[0]?.focus(); return; }
  }
  const inList = e.target.closest?.('.picker-list');
  if (inList && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Escape')) {
    const box = inList.closest('[data-picker]'), opts = $$('.picker-list .opt', box), at = opts.indexOf(e.target);
    e.preventDefault();
    if (e.key === 'Escape') { pickerClose(box); $('.picker-btn', box).focus(); return; }
    const next = at + (e.key === 'ArrowDown' ? 1 : -1);
    (next < 0 ? $('.picker-q input', box) : opts[Math.min(next, opts.length - 1)]).focus(); return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && S.me) { e.preventDefault(); return palette.isOpen ? palette.close() : palette.open(); }
  // «/» abre el buscador, como en Olumi, salvo que se esté escribiendo en un campo
  if (e.key === '/' && S.me && !palette.isOpen && !sheet.isOpen && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? '') && !document.activeElement?.isContentEditable) { e.preventDefault(); return palette.open(); }
  if (palette.isOpen) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); palette.move(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Enter') { e.preventDefault(); palette.run(); }
    else if (e.key === 'Escape') palette.close();
  } else if (e.key === 'Escape' && sheet.isOpen) sheet.close();
});
window.addEventListener('hashchange', () => { if ($('#view')) route(); });
window.addEventListener('resize', () => { if ($('#view')) { drawChrome(); $$('.seg-in').forEach(el => movePill(el, 'x')); } });

let searchTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'palette-q') return palette.render();
  if (e.target.closest('.picker-q')) return pickerDraw(e.target.closest('[data-picker]'));
  if (e.target.id === 'look-custom') { const c = e.target.value.toUpperCase(); return look.set({ accent: c, fg: look.ink(c) }); }
  if (e.target.id !== 'people-q') return;
  S.peopleQ = e.target.value;
  drawTopQuery();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => { await load('people'); setHTML($('#people-list'), peopleRows()); }, 220);
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.name === 'engine') $('#pg-url').hidden = el.value !== 'postgres';
  if (el.dataset.redraw) redrawForCompany(el);
  if (el.name === 'sheet' && el.form?.dataset.form === 'import') importPreview(el);
  if (el.name === 'brand') {
    const b = S.brands.find(x => x.brand === el.value);
    el.form.elements.port.value = b.defaultPort;
    el.form.elements.username.value = b.brand === 'zkteco' ? '' : 'admin';
    $('#brand-hint').textContent = brandHint(b);
  }
  if (el.id === 'idle-hours') {
    try { await S.api.post('/api/security', { idle_hours: Number(el.value) }); S.security.idle_hours = Number(el.value); toast('Guardado'); }
    catch (error) { toast(error.message, 'deny'); }
  }
  if (el.id === 'look-custom') render();
  if (el.id === 'face-file' && el.files[0]) {
    try {
      S.draftFace = await shrinkPhoto(el.files[0]);
      Object.assign($('#face-preview'), { textContent: '' }).style.backgroundImage = `url(${S.draftFace})`;
      $('#face-clear').hidden = false;
      $('#face-hint').textContent = 'Foto lista. Se envía a los equipos al guardar.';
    } catch (error) { toast(error.message, 'deny'); }
    el.value = '';
  }
});

// ── Modo cine: la página de Kliva usa esta misma app como escenario y le pide cada escena ──
const CINE = { inicio: 'panel', alta: 'personas', pasa: 'panel', rechazo: 'panel', abre: 'panel', cae: 'panel', baja: 'personas' };
let scene = 0;
window.addEventListener('message', async e => {
  const m = e.data, cine = S.api?.cine;
  if (e.origin !== location.origin || m?.kliva !== 'cine' || !cine) return;
  if (m.tema) root.dataset.mode = m.tema;
  if (!CINE[m.ev] || !$('#view')) return;
  const mine = ++scene;
  cine.rewind(m.ev);
  Object.assign(S, { lastPass: {}, doorAlert: {}, fresh: null, shown: null, peopleQ: '' });
  await load('people', 'devices', 'doors', 'overview', 'feed', 'notices');
  if (mine !== scene) return;
  if (S.view !== CINE[m.ev]) location.replace(`#${CINE[m.ev]}`); else { render(); drawBell(); $('#main').scrollTop = 0; }
  await wait(650);
  if (mine !== scene) return;
  const look = cine.play(m.ev);
  if (look) { await wait(150); bringIn($(look)); }
});

boot();

})();
</script>
