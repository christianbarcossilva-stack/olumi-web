<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kliva-mode" content="demo">
<meta name="robots" content="noindex">
<title>Kliva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Plano de obra: papel frío, tinta azul de Prusia y un solo azul de trazo. El color lo ponen los estados. */
  --paper: #F2F4F7;
  --sheet: #FFFFFF;
  --ink: #0D1B2E;
  --ink-2: #51607A;
  --line: #D3DAE4;
  --blue: #1D49C8;
  --on-blue: #FFFFFF;
  --blue-wash: #E4EBFB;
  --pass: #17834F;
  --pass-wash: #DFF3E8;
  --deny: #C8322B;
  --deny-wash: #FBE5E3;
  --warn: #9A5F06;
  --warn-wash: #FBEFD5;
  --off: #8A96A8;
  --display: 'Sofia Sans Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --text: 'Sofia Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* Disposición: riel de navegación + lienzo. Las puertas se dibujan sobre una línea de muro,
     como en un plano; todo lo demás va en renglones con filetes, sin tarjetas. */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A1220; --sheet: #111C2E; --ink: #E8EEF7; --ink-2: #97A6BC; --line: #26364F;
    --blue: #86ABFF; --on-blue: #0A1220; --blue-wash: #182849;
    --pass: #4ACB90; --pass-wash: #12332A; --deny: #FF7A6E; --deny-wash: #3A1A1C;
    --warn: #E8B75A; --warn-wash: #37290F; --off: #6D7B91;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A1220; --sheet: #111C2E; --ink: #E8EEF7; --ink-2: #97A6BC; --line: #26364F;
  --blue: #86ABFF; --on-blue: #0A1220; --blue-wash: #182849;
  --pass: #4ACB90; --pass-wash: #12332A; --deny: #FF7A6E; --deny-wash: #3A1A1C;
  --warn: #E8B75A; --warn-wash: #37290F; --off: #6D7B91;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 400 15px/1.45 var(--text); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
#root { height: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 30px; letter-spacing: -0.01em; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
p { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-2); }
.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ── Marca ─────────────────────────────────────────────────────────────── */
.brand { display: flex; align-items: center; gap: 8px; font: 700 23px/1 var(--display); letter-spacing: -0.01em; }
.brand svg { width: 22px; height: 26px; fill: none; stroke: currentColor; stroke-linecap: square; }
.brand .stem { stroke-width: 4.5; }
.brand .swing { stroke-width: 2.6; }
.brand .path { stroke-width: 1.8; stroke-dasharray: 2.4 2.2; }

/* ── Estructura ────────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); height: 100%; }
.rail { display: flex; flex-direction: column; gap: 2px; padding: 22px 12px 16px; border-right: 1px solid var(--line); overflow-y: auto; }
.rail .brand { padding: 0 10px 22px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; text-decoration: none; color: var(--ink-2); font-weight: 500; }
.nav:hover { color: var(--ink); }
.nav[aria-current="page"] { background: var(--sheet); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.rail-foot { margin-top: auto; padding: 12px 10px 0; font-size: 13px; color: var(--ink-2); }
.main { overflow-y: auto; min-width: 0; }
.view { max-width: 1160px; padding: 30px 34px 72px; display: flex; flex-direction: column; gap: 22px; }
.view-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.view-head h1 { margin-right: auto; }
.topbar { display: none; }
.chart { margin: 0; display: flex; flex-direction: column; gap: 6px; }
li.empty { padding: 16px 4px; }
.demo-note { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--warn-wash); color: var(--warn); font-weight: 600; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .rail { grid-row: 2; flex-direction: row; justify-content: space-between; gap: 0; padding: 4px 6px 6px; border-right: 0; border-top: 1px solid var(--line); background: var(--sheet); overflow: visible; }
  .rail .brand, .rail-foot { display: none; }
  .nav { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 2px; padding: 6px 2px; font: 600 11.5px/1.2 var(--display); letter-spacing: 0.01em; }
  .nav[aria-current="page"] { background: none; box-shadow: none; color: var(--blue); }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 16px 0; font-size: 13.5px; }
  .topbar .brand { font-size: 21px; }
  .view { padding: 14px 16px 40px; gap: 18px; }
  h1 { font-size: 26px; }
}

/* ── Controles ─────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 16px; border: 1px solid var(--blue); border-radius: 8px; background: var(--blue); color: var(--on-blue); font-weight: 600; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: default; filter: none; }
.btn.plain { background: none; color: var(--blue); border-color: var(--line); }
.btn.plain:hover { border-color: var(--blue); filter: none; }
.btn.danger { background: none; color: var(--deny); border-color: var(--line); }
.btn.danger[data-armed] { background: var(--deny); border-color: var(--deny); color: var(--sheet); }
.btn.go[data-armed] { background: var(--pass); border-color: var(--pass); color: var(--sheet); }
.btn.wide { width: 100%; min-height: 46px; font-size: 16px; }
.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); }
.icon-btn:hover { background: var(--paper); color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-weight: 600; font-size: 14px; }
.field small, .hint { color: var(--ink-2); font-size: 13px; }
input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="datetime-local"], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); color: var(--ink);
}
textarea { min-height: 76px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
.form { display: flex; flex-direction: column; gap: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 4px; }
.form-actions .push { margin-left: auto; }
.form-error { color: var(--deny); font-weight: 500; }
.check { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--blue); flex: none; }
.check small { display: block; color: var(--ink-2); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--paper); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.search { display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); color: var(--ink-2); }
.search input { border: 0; background: none; padding-left: 0; outline: none; }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }

/* ── Panel: estado, plano de puertas y lo que pasa ahora ───────────────── */
.status { font-size: 17px; line-height: 1.5; max-width: 62ch; }
.status b { font-weight: 700; }
.status .bad { color: var(--deny); }
.status .wait { color: var(--warn); }
.panel-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 40px; align-items: start; }
@media (max-width: 1020px) { .panel-grid { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
.plan { display: flex; flex-direction: column; gap: 30px; min-width: 0; }
.site-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); row-gap: 20px; }
.door {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 0 4px 8px; border: 0; border-radius: 10px;
  color: var(--ink); text-align: center; min-width: 0;
  /* el muro: dos tramos a los lados del vano, continuos de una puerta a la otra */
  background:
    linear-gradient(var(--ink), var(--ink)) left 8px / calc(50% - 24px) 6px no-repeat,
    linear-gradient(var(--ink), var(--ink)) right 8px / calc(50% - 24px) 6px no-repeat;
}
.door:hover .door-name { color: var(--blue); }
.glyph { width: 64px; height: 64px; fill: none; stroke: var(--ink); overflow: visible; }
.glyph .jamb { stroke-width: 2; }
.glyph .arc { stroke-width: 1; stroke-dasharray: 2 3; stroke: var(--off); }
.glyph .leaf { stroke-width: 2.2; stroke-linecap: round; transform-box: view-box; transform-origin: 8px 11px; transition: transform .5s cubic-bezier(.3, 1.25, .5, 1), stroke .2s; }
.door[data-state="open"] .leaf { transform: rotate(82deg); stroke: var(--pass); stroke-width: 3; }
.door[data-state="open"] .arc { stroke: var(--pass); }
.door[data-state="unknown"] .leaf { transform: rotate(38deg); stroke-dasharray: 5 4; stroke: var(--off); }
.door[data-state="off"] { color: var(--off); background-image: linear-gradient(var(--off), var(--off)), linear-gradient(var(--off), var(--off)); }
.door[data-state="off"] .glyph { stroke: var(--off); }
.door[data-state="off"] .leaf { stroke-dasharray: 2 5; }
.door[data-alert] .leaf, .door[data-alert] .arc { stroke: var(--deny); }
.door[data-alert] .leaf { animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
.door-name { font: 600 15.5px/1.2 var(--display); max-width: 100%; overflow-wrap: anywhere; margin-top: -2px; }
.door-sub { font-size: 12.5px; line-height: 1.25; color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }
.door[data-state="open"] .door-sub { color: var(--pass); font-weight: 600; }
.door[data-alert] .door-sub { color: var(--deny); font-weight: 600; }
.empty { color: var(--ink-2); padding: 14px 0; max-width: 56ch; }

.now { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.hours { display: block; width: 100%; height: auto; }
.hours .pass { fill: var(--blue); }
.hours .deny { fill: var(--deny); }
.hours .base { stroke: var(--line); stroke-width: 1; }
.hours text { fill: var(--ink-2); font: 500 9px var(--text); }
.hours-cap { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); }

/* ── Renglones (eventos, personas, equipos…) ───────────────────────────── */
.events { border-top: 1px solid var(--line); }
.ev { display: grid; grid-template-columns: 42px 12px minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ev time { color: var(--ink-2); font-size: 13.5px; white-space: nowrap; }
.ev.long { grid-template-columns: 96px 12px minmax(0, 1fr); }
.ev strong { font-weight: 600; }
.ev em { font-style: normal; color: var(--deny); margin-left: 8px; }
.ev-where { display: block; color: var(--ink-2); font-size: 13.5px; }
.mark { width: 10px; height: 10px; align-self: start; margin-top: 6px; border-radius: 50%; border: 1.5px solid var(--off); }
.ev[data-tone="pass"] .mark { background: var(--pass); border-color: var(--pass); }
.ev[data-tone="deny"] .mark { background: var(--deny); border-color: var(--deny); border-radius: 2px; transform: rotate(45deg) scale(.86); }
.ev[data-tone="alert"] .mark { width: 0; height: 0; margin-top: 5px; border: 6px solid transparent; border-top: 0; border-bottom: 10px solid var(--warn); border-radius: 0; background: none; }
.ev.fresh { animation: arrive .45s ease-out; }
@keyframes arrive { from { background: var(--blue-wash); } }

.rows { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
button.row:hover { background: var(--sheet); }
.row-main { flex: 1 1 auto; min-width: 0; }
.row-main strong { font-weight: 600; display: block; overflow-wrap: anywhere; }
.row-main span { display: block; color: var(--ink-2); font-size: 13.5px; overflow-wrap: anywhere; }
.row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; text-align: right; font-size: 13.5px; color: var(--ink-2); }
.avatar { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--blue-wash); color: var(--blue); font: 600 15px var(--display); background-size: cover; background-position: center; }
.avatar.idle { background-color: var(--paper); color: var(--off); box-shadow: inset 0 0 0 1px var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--paper); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip[data-tone="pass"] { background: var(--pass-wash); color: var(--pass); box-shadow: none; }
.chip[data-tone="deny"] { background: var(--deny-wash); color: var(--deny); box-shadow: none; }
.chip[data-tone="warn"] { background: var(--warn-wash); color: var(--warn); box-shadow: none; }
.tag { flex: none; width: 78px; font: 600 14px var(--display); color: var(--ink-2); }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.section-head h2 { margin-right: auto; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .row { gap: 10px; flex-wrap: wrap; }
  .row-side { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; text-align: left; flex-basis: 100%; padding-left: 50px; }
  .row.flat .row-side { padding-left: 0; }
  .tag { width: auto; }
  .form-row { grid-template-columns: 1fr; }
}

/* ── Hoja lateral ──────────────────────────────────────────────────────── */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgb(13 27 46 / .42); }
.sheet-panel { position: relative; width: min(460px, 100%); height: 100%; display: flex; flex-direction: column; background: var(--sheet); border-left: 1px solid var(--line); animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateX(28px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 16px 14px 14px 22px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin-right: auto; font-size: 22px; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; padding: 20px 22px 32px; display: flex; flex-direction: column; gap: 18px; }
.photo { display: flex; align-items: center; gap: 14px; }
.photo .avatar { width: 64px; height: 64px; font-size: 22px; }
.result { padding: 10px 12px; border-radius: 8px; background: var(--paper); font-size: 14px; }
.result[data-tone="pass"] { background: var(--pass-wash); color: var(--pass); }
.result[data-tone="deny"] { background: var(--deny-wash); color: var(--deny); }
.brand-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.brand-pick label { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.brand-pick label:has(input:checked) { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.brand-pick input { position: absolute; opacity: 0; }
.brand-pick strong { display: block; font: 600 17px var(--display); }
.brand-pick small { color: var(--ink-2); }

.toast { position: fixed; left: 50%; bottom: 76px; z-index: 30; transform: translateX(-50%); max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 500; box-shadow: 0 6px 24px rgb(13 27 46 / .25); }
.toast[data-tone="deny"] { background: var(--deny); color: #fff; }

/* ── Ingreso e instalación ─────────────────────────────────────────────── */
.gate { min-height: 100%; display: grid; grid-template-columns: minmax(0, 440px); justify-content: center; align-content: start; padding: clamp(28px, 9vh, 96px) 20px 48px; }
.gate-card { display: flex; flex-direction: column; gap: 22px; }
.gate h1 { font-size: 34px; }
.steps { display: flex; gap: 6px; }
.steps span { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.steps span[data-on] { background: var(--blue); }
.choice { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); cursor: pointer; }
.choice:has(input:checked) { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.choice input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--blue); flex: none; }
.choice strong { display: block; }
.choice small { color: var(--ink-2); font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="root"></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" data-action="sheet-close"></div>
  <aside class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-action="sheet-close" aria-label="Cerrar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
'use strict';
// Utilidades de la interfaz.
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

// html`…` escapa todo lo que se interpola; solo lo ya armado con html`…` o raw() entra tal cual.
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = s => new Raw(s);
const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESCAPES[c]);
const piece = v => v instanceof Raw ? v.s : v == null || v === false ? '' : esc(v);
const html = (strings, ...values) => new Raw(strings.reduce((out, s, i) => {
  const v = values[i - 1];
  return out + (Array.isArray(v) ? v.map(piece).join('') : piece(v)) + s;
}));

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const saved = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch { /* sin almacenamiento */ } },
};

const hourFormat = new Intl.DateTimeFormat('es-UY', { hour: '2-digit', minute: '2-digit', hour12: false });
const dayFormat = new Intl.DateTimeFormat('es-UY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const dateFormat = new Intl.DateTimeFormat('es-UY', { day: 'numeric', month: 'long', year: 'numeric' });
const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();
const when = ts => (isToday(ts) ? hourFormat : dayFormat).format(ts);
const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const initials = name => String(name).trim().split(/\s+/).slice(0, 2).map(w => w[0] ?? '').join('').toUpperCase();
const toLocalInput = ms => { if (!ms) return ''; const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
const fromLocalInput = text => text ? new Date(text).getTime() : null;

const KIND = {

// Acceso al servidor real. La demostración (03-demo.js) ofrece exactamente esta misma interfaz.
function liveApi() {
  let token = saved.get('kliva.token');

  async function call(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { ...(body && { 'Content-Type': 'application/json' }), ...(token && { Authorization: `Bearer ${token}` }) },
      body: body && JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || `El servidor respondió ${res.status}`), { status: res.status });
    return data;
  }

  return {
    demo: false,
    get: path => call('GET', path),
    post: (path, body = {}) => call('POST', path, body),
    patch: (path, body = {}) => call('PATCH', path, body),
    del: path => call('DELETE', path),
    hasSession: () => Boolean(token),
    setSession(value) { token = value; saved.set('kliva.token', value); },

    /** Escucha lo que pasa en vivo y se reconecta sola. Devuelve la función para cortar. */
    stream(onMessage) {
      const abort = new AbortController();
      (async () => {
        while (!abort.signal.aborted) {
          try {
            const res = await fetch('/api/stream', { headers: { Authorization: `Bearer ${token}` }, signal: abort.signal });
            if (res.status === 401) return onMessage('expired', {});
            onMessage('online', {});
            const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
            for (let buffer = ''; ;) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += value;
              for (let cut; (cut = buffer.indexOf('\n\n')) >= 0; buffer = buffer.slice(cut + 2)) {
                const m = /^event: (\w+)\ndata: (.*)$/s.exec(buffer.slice(0, cut));
                if (m) onMessage(m[1], JSON.parse(m[2]));
              }
            }
          } catch { /* se reintenta abajo */ }
          if (abort.signal.aborted) return;
          onMessage('offline', {});
          await wait(3000);
        }
      })();
      return () => abort.abort();
    },
  };
}

  const fail = (status, message) => Object.assign(new Error(message), { status });
  const fold = text => text.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
  const pick = list => list[Math.floor(Math.random() * list.length)];
  let serial = 0;

  const db = {

    ],
    devices: [], doors: [], levels: [], people: [], events: [], sync: new Map(),
    users: [
      { ...me, active: 1 },
      { id: 'u2', name: 'Guardia de portería', email: 'porteria@demo.uy', role: 'operator', active: 1 },
      { id: 'u3', name: 'Gerencia', email: 'gerencia@demo.uy', role: 'viewer', active: 1 },
    ],
    audit: [],
  };

  // ── Datos de ejemplo ───────────────────────────────────────────────────────
  const addDevice = (site_id, brand, name, host, model, firmware, doorNames, status = 'online', detail = '') => {

    db.devices.push(d);
    doorNames.forEach((name, i) => db.doors.push({ id: newId('p'), device_id: d.id, number: i + 1, name, state: status === 'online' ? 'closed' : 'unknown', state_at: Date.now() }));

  addDevice('s1', 'hikvision', 'Facial de vestuarios', '10.20.1.35', 'DS-K1T671TM-3XF', 'V3.3.5 build 230511', ['Vestuarios']);
  addDevice('s2', 'dahua', 'Controladora de portones', '10.30.0.12', 'ASC2204C-S', '1.000.0000000.5.R', ['Portón 1', 'Portón 2', 'Sala de racks', 'Oficina de tráfico']);

  const doorId = name => db.doors.find(p => p.name === name).id;
  const addLevel = (name, ...doors) => db.levels.push({ id: newId('l'), name, doors: doors.map(doorId) });
  addLevel('Operarios de planta', 'Portería peatonal', 'Molinete de entrada', 'Molinete de salida', 'Vestuarios');
  addLevel('Mantenimiento', 'Portería peatonal', 'Molinete de entrada', 'Molinete de salida', 'Vestuarios', 'Depósito de repuestos', 'Sala de racks');
  addLevel('Administración', 'Administración', 'Oficina de tráfico', 'Portería peatonal');
  addLevel('Tráfico y portones', 'Portón 1', 'Portón 2', 'Barrera de camiones', 'Oficina de tráfico');

  [
    ['Ana Núñez', 'Logística Sur', ['5550123'], true, '', [0]], ['Bruno Castro', 'Logística Sur', ['5550187'], false, '', [0]],
    ['Carla Méndez', 'Mantenimiento Industrial', ['5550201', '5550202'], true, '4821', [1]], ['Diego Olivera', 'Mantenimiento Industrial', ['5550233'], false, '', [1]],
    ['Elena Sosa', 'Logística Sur', [], true, '7350', [2]], ['Federico Viera', 'Logística Sur', ['5550310'], true, '', [2]],
    ['Gabriela Rocha', 'Transporte del Este', ['5550356'], false, '', [3]], ['Héctor Píriz', 'Transporte del Este', ['5550371'], false, '', [3]],
    ['Inés Barrios', 'Logística Sur', ['5550402'], true, '', [0]], ['Joaquín Techera', 'Seguridad Atlántica', ['5550440'], false, '1964', [0, 3]],
    ['Karina Acosta', 'Logística Sur', [], true, '', [2]], ['Luis Ferreira', 'Mantenimiento Industrial', ['5550488'], false, '', [1]],
    ['Mariana Cabrera', 'Logística Sur', ['5550513'], true, '', [0]], ['Nicolás Silva', 'Transporte del Este', ['5550547'], false, '', [3]],
  ].forEach(([name, company, cards, hasFace, pin, levels], i) => db.people.push({
    id: newId('h'), ref: String(1001 + i), name, company, document: '', cards, pin, face: '', hasFace, active: 1,
    valid_from: null, valid_to: null, levels: levels.map(n => db.levels[n].id), created_at: Date.now() - 40 * 24 * H, updated_at: Date.now() - 2 * 24 * H,
  }));

  // ── Reglas ─────────────────────────────────────────────────────────────────
  const site = id => db.sites.find(s => s.id === id);
  const device = id => db.devices.find(d => d.id === id);
  const doorRow = p => {
    const d = device(p.device_id);
    return { ...p, device_name: d.name, brand: d.brand, device_status: d.status, site_id: d.site_id, site_name: site(d.site_id).name };
  };
  const doorsOf = person => new Set(person.levels.flatMap(id => db.levels.find(l => l.id === id)?.doors ?? []));
  const syncRows = ref => db.devices.map(d => db.sync.get(`${ref}|${d.id}`)).filter(Boolean);

  /** Igual que el servidor: decide qué le corresponde a cada equipo; acá el "envío" tarda un segundo. */
  function plan(person, instant = false) {
    const mine = doorsOf(person);
    for (const d of db.devices) {
      const key = `${person.ref}|${d.id}`;
      if (!person.active || !db.doors.some(p => p.device_id === d.id && mine.has(p.id))) { db.sync.delete(key); continue; }
      const can = brandOf(d.brand).capabilities.people;
      const row = { device_id: d.id, device_name: d.name, brand: d.brand, op: 'upsert', status: can ? 'pending' : 'unsupported', error: '' };
      db.sync.set(key, row);
      const done = () => { if (db.sync.get(key) === row) { row.status = 'done'; emit('sync', {}); } };
      if (can && d.status === 'online') instant ? row.status = 'done' : setTimeout(done, 900 + Math.random() * 900);
    }
  }
  db.people.forEach(p => plan(p, true));

  const event = (ts, kind, door, person, extra = {}) => ({
    id: newId('e'), ts, kind, device_id: door.device_id, door_id: door.id, person_id: person?.id ?? null,
    site_name: site(device(door.device_id).site_id).name, door_name: door.name, person_name: person?.name ?? '',
    card: '', method: '', detail: '', actor: '', ...extra,
  });
  const onlineDoors = () => db.doors.filter(p => device(p.device_id).status === 'online');

  function swing(door, ms = 2600) {
    door.state = 'open'; door.state_at = Date.now();
    emit('door', { id: door.id, state: 'open', state_at: door.state_at });
    setTimeout(() => {
      door.state = 'closed'; door.state_at = Date.now();
      emit('door', { id: door.id, state: 'closed', state_at: door.state_at });
    }, ms);
  }

  /** Una pasada verosímil: casi siempre alguien con permiso, a veces un rechazo. */
  function pass(ts, live) {
    const person = pick(db.people.filter(p => p.active));
    const allowed = doorsOf(person), open = onlineDoors();
    const mine = open.filter(p => allowed.has(p.id)), roll = Math.random();
    if (roll < 0.9 && mine.length) {
      const door = pick(mine), brand = device(door.device_id).brand;
      const method = person.hasFace && (brand === 'hikvision' || brand === 'intelbras') ? 'face' : person.cards.length ? 'card' : 'pin';
      if (live && door.state !== 'open') swing(door);
      return event(ts, 'access_granted', door, person, { method, card: method === 'card' ? person.cards[0] : '' });
    }
    const others = open.filter(p => !allowed.has(p.id));
    if (roll < 0.96 || !others.length || !person.cards.length) {
      return event(ts, 'access_denied', pick(open), null, { method: 'card', card: String(5559000 + Math.floor(Math.random() * 900)), detail: 'Tarjeta no registrada' });
    }
    return event(ts, 'access_denied', pick(others), person, { method: 'card', card: person.cards[0], detail: 'Sin permiso en esta puerta' });
  }

  // Historia de las últimas 24 horas, más cargada en horario de trabajo.
  for (let i = 0, now = Date.now(); i < 150; i++) {
    const ts = now - Math.random() * 24 * H, hour = new Date(ts).getHours();
    if (hour >= 6 && hour < 19 ? Math.random() < 0.95 : Math.random() < 0.12) db.events.push(pass(ts, false));
  }
  db.events.sort((a, b) => b.ts - a.ts);
  db.audit.push(
    { id: 'a2', ts: Date.now() - 3 * H, user_name: 'Christian', action: 'Alta de persona', detail: 'Nicolás Silva' },
    { id: 'a1', ts: Date.now() - 26 * H, user_name: 'Christian', action: 'Alta de equipo', detail: 'Portero de camiones, 10.30.0.40' },
  );

  let ticker = null, ticks = 0;
  function tick() {
    ticker = setTimeout(tick, 3200 + Math.random() * 3600);
    const idle = onlineDoors().filter(p => p.state === 'closed');
    const e = ++ticks % 14 === 0 && idle.length
      ? (door => (swing(door, 7000), event(Date.now(), 'door_held', door, null)))(pick(idle))
      : pass(Date.now(), true);
    db.events.unshift(e);
    emit('event', e);
  }

  function overview() {
    const now = Date.now(), midnight = new Date(now).setHours(0, 0, 0, 0), first = Math.floor(now / H) - 23;
    const hours = Array.from({ length: 24 }, (_, i) => ({ t: (first + i) * H, granted: 0, denied: 0 }));
    const today = { granted: 0, denied: 0, alerts: 0 };
    for (const e of db.events) {
      const slot = hours[Math.floor(e.ts / H) - first], key = e.kind === 'access_granted' ? 'granted' : e.kind === 'access_denied' ? 'denied' : null;
      if (slot && key) slot[key]++;
      if (e.ts >= midnight) { if (key) today[key]++; else if (ALERT_KINDS.includes(e.kind)) today.alerts++; }
    }
    const sync = [...db.sync.values()], n = status => sync.filter(r => r.status === status).length;
    return {
      devices: { total: db.devices.length, online: db.devices.filter(d => d.status === 'online').length },
      doors: { total: db.doors.length, open: db.doors.filter(p => p.state === 'open').length },
      people: db.people.filter(p => p.active).length, today,
      sync: { pending: n('pending'), error: n('error'), unsupported: n('unsupported') }, hours,
    };
  }

  const listed = p => ({
    id: p.id, ref: p.ref, name: p.name, company: p.company, document: p.document, active: p.active, valid_from: p.valid_from, valid_to: p.valid_to,
    updated_at: p.updated_at, has_face: Number(p.hasFace), has_pin: Number(Boolean(p.pin)), cards: p.cards, levels: p.levels,
    sync: syncRows(p.ref).reduce((acc, r) => ({ ...acc, [r.status]: (acc[r.status] ?? 0) + 1 }), {}),
  });

  function savePerson(person, input) {
    const next = { ...person, ...input };
    next.name = String(next.name ?? '').trim();
    next.cards = [...new Set((next.cards ?? []).map(c => String(c).trim()).filter(Boolean))];
    if (!next.name) throw fail(400, 'Falta el nombre');
    if (next.pin && !/^\d{4,8}$/.test(next.pin)) throw fail(400, 'La clave debe tener entre 4 y 8 dígitos');
    for (const c of next.cards) {
      if (!/^\d{1,20}$/.test(c)) throw fail(400, `La tarjeta "${c}" debe tener solo números`);
      const owner = db.people.find(o => o.id !== person.id && o.cards.includes(c));
      if (owner) throw fail(400, `La tarjeta ${c} ya está asignada a ${owner.name}`);
    }
    if (input.face !== undefined) { next.face = input.face ?? ''; next.hasFace = Boolean(next.face); }
    Object.assign(person, next, { active: Number(Boolean(next.active)), updated_at: Date.now() });
    plan(person);
  }

  // ── Rutas (las mismas que server/http/api.js) ──────────────────────────────
  const routes = [];
  const on = (method, path, fn) => routes.push([method, new RegExp('^' + path.replace(/:(\w+)/g, '(?<$1>[^/]+)') + '$'), fn]);
  const session = () => ({ token: 'demo', user: me });
  const log = (action, detail) => db.audit.unshift({ id: newId('a'), ts: Date.now(), user_name: me.name, action, detail });

  on('GET', '/api/state', () => ({ product: 'Kliva', version: 'demostración', configured: true, org: db.org, brands: BRANDS }));
  on('POST', '/api/setup/check-db', () => ({ ok: true, version: 'PostgreSQL 16.4' }));
  on('POST', '/api/setup', session);
  on('POST', '/api/login', session);
  on('POST', '/api/logout', () => {});
  on('GET', '/api/me', () => ({ user: me, org: db.org, engine: 'sqlite', license: db.license }));
  on('GET', '/api/overview', overview);

  on('GET', '/api/sites', () => db.sites.map(s => ({ ...s, devices: db.devices.filter(d => d.site_id === s.id).length })));
  on('POST', '/api/sites', ({ body }) => {
    if (!String(body.name ?? '').trim()) throw fail(400, 'Falta el nombre del sitio');
    const s = { id: newId('s'), name: body.name.trim(), address: body.address ?? '' };
    db.sites.push(s);
    return s;
  });
  on('PATCH', '/api/sites/:id', ({ params, body }) => { Object.assign(site(params.id), { name: body.name, address: body.address ?? '' }); });
  on('DELETE', '/api/sites/:id', ({ params }) => {
    if (db.devices.some(d => d.site_id === params.id)) throw fail(400, 'El sitio todavía tiene equipos. Quitalos o movelos antes de borrarlo.');
    db.sites = db.sites.filter(s => s.id !== params.id);
  });

  on('GET', '/api/devices', () => db.devices.map(d => {
    const rows = [...db.sync.values()].filter(r => r.device_id === d.id), b = brandOf(d.brand);
    return { ...d, site_name: site(d.site_id).name, doors: db.doors.filter(p => p.device_id === d.id).length, brand_label: b.label, protocol: b.protocol,
      capabilities: b.capabilities, sync_pending: rows.filter(r => r.status === 'pending').length, sync_errors: rows.filter(r => r.status === 'error').length };
  }));
  on('POST', '/api/devices/test', ({ body }) => {
    const b = brandOf(body.brand ?? device(body.id)?.brand);
    if (!String(body.host ?? device(body.id)?.host ?? '').trim()) throw fail(422, 'Falta la dirección del equipo');
    return { model: b.model, serial: 'DEMO' + Math.floor(Math.random() * 9e7), firmware: 'demostración', doors: Array.from({ length: b.doors }, (_, i) => ({ no: i + 1 })) };
  });
  on('POST', '/api/devices', ({ body }) => {
    const b = brandOf(body.brand);
    if (!String(body.name ?? '').trim()) throw fail(400, 'Falta el nombre del equipo');
    if (!site(body.site_id)) throw fail(400, 'Elegí el sitio donde está el equipo');
    const d = addDevice(body.site_id, body.brand, body.name.trim(), body.host, b.model, 'demostración', Array.from({ length: b.doors }, (_, i) => `Puerta ${i + 1}`));
    d.port = Number(body.port) || b.defaultPort;
    log('Alta de equipo', `${d.name}, ${d.host}`);
    return { id: d.id };
  });
  on('PATCH', '/api/devices/:id', ({ params, body }) => {
    const d = device(params.id), { password: _omit, ...rest } = body;
    Object.assign(d, rest, { enabled: Number(rest.enabled ?? d.enabled) });
  });
  on('DELETE', '/api/devices/:id', ({ params }) => {
    const gone = new Set(db.doors.filter(p => p.device_id === params.id).map(p => p.id));
    db.doors = db.doors.filter(p => !gone.has(p.id));
    db.levels.forEach(l => { l.doors = l.doors.filter(id => !gone.has(id)); });
    db.devices = db.devices.filter(d => d.id !== params.id);
    for (const key of [...db.sync.keys()]) if (key.endsWith(`|${params.id}`)) db.sync.delete(key);
  });
  on('POST', '/api/devices/:id/resync', () => { db.people.forEach(p => plan(p)); });

  on('GET', '/api/doors', () => db.doors.map(doorRow));
  on('PATCH', '/api/doors/:id', ({ params, body }) => {
    if (!String(body.name ?? '').trim()) throw fail(400, 'Falta el nombre de la puerta');
    db.doors.find(p => p.id === params.id).name = body.name.trim();
  });
  on('POST', '/api/doors/:id/open', ({ params }) => {
    const door = db.doors.find(p => p.id === params.id), d = device(door.device_id);
    if (d.status !== 'online') throw fail(409, `${d.name} está sin conexión: no se puede abrir desde acá`);
    const e = event(Date.now(), 'remote_open', door, null, { method: 'remote', actor: me.name });
    db.events.unshift(e);
    emit('event', e);
    if (door.state !== 'open') swing(door, 3500);
    log('Apertura remota', `${door.name}, ${e.site_name}`);
    return e;
  });

  on('GET', '/api/people', ({ query }) => {
    const q = fold(query.get('q') ?? '');
    return db.people.filter(p => fold([p.name, p.company, p.document, ...p.cards].join(' ')).includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'es')).map(listed);
  });
  on('GET', '/api/people/:id', ({ params }) => {
    const p = db.people.find(x => x.id === params.id);
    if (!p) throw fail(404, 'Esa persona ya no existe');
    return { ...p, has_face: Number(p.hasFace), sync: syncRows(p.ref) };
  });
  on('POST', '/api/people', ({ body }) => {
    const p = { id: newId('h'), ref: String(1001 + db.people.length + serial), name: '', company: '', document: '', cards: [], pin: '', face: '', hasFace: false,
      active: 1, valid_from: null, valid_to: null, levels: [], created_at: Date.now() };
    savePerson(p, body);
    db.people.push(p);
    log('Alta de persona', p.name);
    return { id: p.id };
  });
  on('PATCH', '/api/people/:id', ({ params, body }) => { savePerson(db.people.find(p => p.id === params.id), body); });
  on('DELETE', '/api/people/:id', ({ params }) => {
    const p = db.people.find(x => x.id === params.id);
    db.people = db.people.filter(x => x !== p);
    for (const key of [...db.sync.keys()]) if (key.startsWith(`${p.ref}|`)) db.sync.delete(key);
    log('Baja de persona', p.name);
  });

  on('GET', '/api/levels', () => db.levels.map(l => ({ ...l, members: db.people.filter(p => p.levels.includes(l.id)).length })));
  const saveLevel = (level, body) => {
    if (!String(body.name ?? '').trim()) throw fail(400, 'Falta el nombre del nivel');
    Object.assign(level, { name: body.name.trim(), doors: body.doors ?? [] });
    db.people.filter(p => p.levels.includes(level.id)).forEach(p => plan(p));
  };
  on('POST', '/api/levels', ({ body }) => { const l = { id: newId('l'), name: '', doors: [] }; saveLevel(l, body); db.levels.push(l); return { id: l.id }; });
  on('PATCH', '/api/levels/:id', ({ params, body }) => saveLevel(db.levels.find(l => l.id === params.id), body));
  on('DELETE', '/api/levels/:id', ({ params }) => {
    db.levels = db.levels.filter(l => l.id !== params.id);
    db.people.forEach(p => { if (p.levels.includes(params.id)) { p.levels = p.levels.filter(id => id !== params.id); plan(p); } });
  });

  on('GET', '/api/events', ({ query }) => {
    const group = query.get('group'), before = Number(query.get('before')), door = query.get('door'), person = query.get('person');
    const kinds = { access: ['access_granted', 'access_denied'], denied: ['access_denied'], alerts: ALERT_KINDS }[group];
    return db.events.filter(e => (!before || e.ts < before) && (!door || e.door_id === door) && (!person || e.person_id === person) && (!kinds || kinds.includes(e.kind)))
      .slice(0, Number(query.get('limit')) || 60);
  });
  on('GET', '/api/audit', () => db.audit);

  on('GET', '/api/users', () => db.users);
  on('POST', '/api/users', ({ body }) => {
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email ?? '')) throw fail(400, 'El correo no es válido');
    if (String(body.password ?? '').length < 10) throw fail(400, 'La contraseña debe tener al menos 10 caracteres');
    db.users.push({ id: newId('u'), name: body.name, email: body.email.toLowerCase(), role: body.role ?? 'operator', active: 1 });
  });
  on('PATCH', '/api/users/:id', ({ params, body }) => {
    const u = db.users.find(x => x.id === params.id), { password: _omit, ...rest } = body;
    if (u.role === 'admin' && (rest.role ?? 'admin') !== 'admin' && !db.users.some(x => x !== u && x.role === 'admin')) throw fail(400, 'Tiene que quedar al menos un administrador activo');
    Object.assign(u, rest);
  });
  on('DELETE', '/api/users/:id', ({ params }) => {
    if (params.id === me.id) throw fail(400, 'No podés borrar tu propio usuario');
    db.users = db.users.filter(u => u.id !== params.id);
  });
  on('POST', '/api/license', () => { throw fail(400, 'En la demostración no se cargan licencias'); });

  async function call(method, fullPath, body = {}) {
    await wait(80 + Math.random() * 140);
    const [path, search = ''] = fullPath.split('?');
    for (const [m, pattern, fn] of routes) {
      const hit = m === method && pattern.exec(path);
      if (hit) return structuredClone(fn({ params: hit.groups ?? {}, query: new URLSearchParams(search), body }) ?? { ok: true });
    }
    throw fail(404, 'Ese recurso no existe');
  }

  return {
    demo: true,
    get: path => call('GET', path),
    post: (path, body) => call('POST', path, body),
    patch: (path, body) => call('PATCH', path, body),
    del: path => call('DELETE', path),
    hasSession: () => true,
    setSession() {},
    stream(onMessage) {
      listeners.add(onMessage);
      if (!ticker) ticker = setTimeout(tick, 1800);
      return () => { listeners.delete(onMessage); if (!listeners.size) { clearTimeout(ticker); ticker = null; } };
    },
  };
}

let toastTimer;
function toast(message, mood = '') {
  const el = $('#toast');

  el.dataset.tone = mood;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, mood === 'deny' ? 6000 : 3000);
}

/** Botones de dos toques (abrir, eliminar): el primero arma, el segundo confirma. */
function confirmed(button, question) {
  if (button.dataset.armed != null) return true;
  button.dataset.label = button.textContent;
  button.dataset.armed = '';
  button.textContent = question;
  setTimeout(() => disarm(button), 3500);
  return false;
}
function disarm(button) {
  if (!button.isConnected || button.dataset.armed == null) return;
  delete button.dataset.armed;
  button.textContent = button.dataset.label;
}

function values(form) {
  const out = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') {
      if (el.dataset.list == null) out[el.name] = el.checked;
      else (out[el.name] ??= []).push(...(el.checked ? [el.value] : []));
    } else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
    else out[el.name] = el.type === 'password' ? el.value : el.value.trim();
  }
  return out;
}

async function submit(form) {
  const button = $('button[type="submit"]', form), error = $('.form-error', form);
  if (error) error.textContent = '';
  if (button) button.disabled = true;
  try {
    await forms[form.dataset.form](form, values(form));
  } catch (e) {
    if (error?.isConnected) error.textContent = e.message; else toast(e.message, 'deny');
  } finally {
    if (button?.isConnected) button.disabled = false;
  }
}

// ── Puertas ──────────────────────────────────────────────────────────────────
function doorLook(d) {
  const off = d.device_status !== 'online', alert = !off && S.alerts[d.id], last = S.lastPass[d.id];
  const sub = off ? 'Sin conexión' : alert ? KIND[alert]
    : d.state === 'open' ? (last && Date.now() - last.ts < 15_000 && last.person_name) || 'Abierta'
    : d.state === 'closed' ? 'Cerrada' : 'Sin sensor';
  return { state: off ? 'off' : d.state, alert: Boolean(alert), sub };
}

function doorTile(d) {
  const look = doorLook(d);
  return html`<button class="door" type="button" data-action="door" data-door="${d.id}" data-state="${look.state}" ${look.alert ? raw('data-alert') : ''}>
    ${GLYPH}<span class="door-name">${d.name}</span><span class="door-sub">${look.sub}</span></button>`;
}

/** Actualiza una puerta ya dibujada sin recrearla, así la hoja gira en vez de saltar. */
function patchDoor(id) {
  const d = S.doors.find(p => p.id === id), el = $(`.door[data-door="${CSS.escape(id)}"]`);
  if (!d || !el) return;
  const look = doorLook(d);
  el.dataset.state = look.state;
  el.toggleAttribute('data-alert', look.alert);
  $('.door-sub', el).textContent = look.sub;
}

// ── Eventos ──────────────────────────────────────────────────────────────────
function eventRow(e, { fresh = false, long = false } = {}) {
  const who = e.person_name || (e.card ? `Tarjeta ${e.card}` : '');
  const title = e.kind === 'access_granted' ? who || 'Acceso' : e.kind === 'access_denied' ? who || 'Sin identificar' : KIND[e.kind] ?? 'Evento';
  const how = e.kind === 'access_granted' ? METHOD[e.method] : e.kind === 'remote_open' && e.actor ? `por ${e.actor}` : e.kind !== 'access_denied' ? e.detail : '';
  const where = [e.door_name, e.site_name, how].filter(Boolean).join(', ');
  const dated = long || !isToday(e.ts); // con fecha cuando no es de hoy
  return html`<li class="ev ${fresh ? 'fresh' : ''} ${dated ? 'long' : ''}" data-tone="${tone(e.kind)}">
    <time>${dated ? dayFormat.format(e.ts) : hourFormat.format(e.ts)}</time><span class="mark" aria-hidden="true"></span>
    <span><strong>${title}</strong>${e.kind === 'access_denied' ? html`<em>${e.detail || 'Rechazado'}</em>` : ''}<span class="ev-where">${where}</span></span></li>`;
}

const inGroup = (e, group) => group === 'all' ? true
  : group === 'access' ? e.kind === 'access_granted' || e.kind === 'access_denied'
  : group === 'denied' ? e.kind === 'access_denied'
  : group === 'alerts' ? ALERT_KINDS.includes(e.kind)
  : e.kind !== 'door_opened' && e.kind !== 'door_closed';

function hoursChart(hours) {
  const peak = Math.max(1, ...hours.map(h => h.granted + h.denied)), total = hours.reduce((n, h) => n + h.granted + h.denied, 0);
  const width = 288, step = width / 24, scale = 44 / peak;
  const bars = hours.map((h, i) => {
    const x = (i * step + 1.5).toFixed(1), w = (step - 3).toFixed(1), g = h.granted * scale, d = h.denied * scale;
    return (g ? `<rect class="pass" x="${x}" y="${(48 - g).toFixed(1)}" width="${w}" height="${g.toFixed(1)}" rx="1.5"/>` : '')
      + (d ? `<rect class="deny" x="${x}" y="${(48 - g - d).toFixed(1)}" width="${w}" height="${d.toFixed(1)}" rx="1.5"/>` : '');
  }).join('');
  return html`<figure class="chart" id="chart"><svg class="hours" viewBox="0 0 ${width} 50" role="img" aria-label="Pasadas por hora en las últimas 24 horas">${raw(bars)}<path class="base" d="M0 48.5H${width}"/></svg>
    <figcaption class="hours-cap"><span>hace 24 h</span><span>${total ? `${count(total, 'pasada', 'pasadas')}, pico de ${peak} por hora` : 'Sin pasadas en las últimas 24 horas'}</span><span>ahora</span></figcaption></figure>`;
}

function statusText() {
  const o = S.overview, off = S.devices.filter(d => d.enabled && d.status !== 'online');
  return html`${S.linkDown ? html`<span class="bad">Sin conexión con el servidor; reintentando.</span> ` : ''}
    ${o.devices.total === 0 ? 'Todavía no hay equipos cargados.'
      : off.length ? html`<b>${o.devices.online}</b> de <b>${o.devices.total}</b> equipos en línea. <span class="bad">Sin conexión: ${off.map(d => d.name).join(', ')}.</span>`
      : o.devices.total === 1 ? 'El equipo está en línea.' : html`Los <b>${o.devices.total}</b> equipos están en línea.`}
    ${o.doors.total ? (o.doors.open ? html`<b>${count(o.doors.open, 'puerta abierta', 'puertas abiertas')}</b> ahora.` : 'Ninguna puerta abierta.') : ''}
    Hoy van <b>${count(o.today.granted, 'acceso', 'accesos')}</b> y <b>${count(o.today.denied, 'rechazo', 'rechazos')}</b>${o.today.alerts ? html`, con <span class="bad">${count(o.today.alerts, 'alerta', 'alertas')}</span>` : ''}.
    ${o.sync.error ? html`<span class="bad">${count(o.sync.error, 'alta falló', 'altas fallaron')} al enviarse a los equipos.</span>` : ''}
    ${o.sync.pending ? html`<span class="wait">${count(o.sync.pending, 'alta pendiente', 'altas pendientes')} de enviar.</span>` : ''}`;
}

function syncChip(p) {
  if (!p.active) return html`<span class="chip">Deshabilitada</span>`;
  const { done = 0, pending = 0, error = 0, unsupported = 0 } = p.sync;
  if (error) return html`<span class="chip" data-tone="deny">Error en ${count(error, 'equipo', 'equipos')}</span>`;
  if (pending) return html`<span class="chip" data-tone="warn">Enviando a ${count(pending, 'equipo', 'equipos')}</span>`;
  if (done) return html`<span class="chip" data-tone="pass">En ${count(done, 'equipo', 'equipos')}</span>`;
  if (unsupported) return html`<span class="chip">Carga manual en ${count(unsupported, 'equipo', 'equipos')}</span>`;
  return html`<span class="chip">Sin puertas asignadas</span>`;
}

/** Achica la foto hasta que entre en lo que aceptan los terminales faciales (200 KB). */
async function shrinkPhoto(file) {
  const image = await createImageBitmap(file);
  for (const [side, quality] of [[640, 0.85], [520, 0.8], [420, 0.75], [320, 0.7]]) {
    const scale = Math.min(1, side / Math.max(image.width, image.height));
    const canvas = Object.assign(document.createElement('canvas'), { width: Math.round(image.width * scale), height: Math.round(image.height * scale) });
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    const url = canvas.toDataURL('image/jpeg', quality);
    if (url.length * 0.75 < 190 * 1024) return url;
  }
  throw new Error('No se pudo achicar la foto. Probá con otra imagen.');
}

function render() {
  const view = $('#view');
  if (!view || !views[S.view]) return;
  view.innerHTML = views[S.view]();
  for (const link of $$('[data-nav]')) {
    if (link.dataset.nav === S.view) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
  }
  if (S.view === 'ajustes') fillSettings().catch(e => toast(e.message, 'deny'));
}

async function route() {
  const id = location.hash.slice(1);
  S.view = views[id] ? id : 'panel';
  try {
    if (S.view === 'eventos') await load('events');
    if (S.view === 'personas') await load('people', 'levels');
  } catch (e) { toast(e.message, 'deny'); }
  render();
  const main = $('#main');
  if (main) main.scrollTop = 0;
}

// ── En vivo ──────────────────────────────────────────────────────────────────
const stale = new Set();
let refreshTimer;
/** Junta los pedidos de refresco que llegan seguidos y vuelve a dibujar una sola vez. */
function refreshSoon(...keys) {
  keys.forEach(k => stale.add(k));
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    const batch = [...stale];
    stale.clear();
    try { await load(...batch); } catch { return; }
    if (S.view === 'personas') { const list = $('#people-list'); if (list) list.innerHTML = peopleRows().join(''); }
    else if (['panel', 'equipos', 'niveles'].includes(S.view)) render();
  }, 350);
}

function onLive(type, data) {
  const status = () => { const el = $('#status'); if (el && S.view === 'panel') el.innerHTML = statusText(); };
  if (type === 'event') {
    S.feed.unshift(data);
    if (S.feed.length > 80) S.feed.length = 80;
    const o = S.overview, key = data.kind === 'access_granted' ? 'granted' : data.kind === 'access_denied' ? 'denied' : null;
    if (key) {
      o.today[key]++;
      if (data.ts - o.hours.at(-1).t < 3600_000) o.hours.at(-1)[key]++; else refreshSoon('overview');
    } else if (ALERT_KINDS.includes(data.kind)) o.today.alerts++;
    if (data.door_id && data.kind === 'access_granted') S.lastPass[data.door_id] = data;
    if (data.door_id && (data.kind === 'door_forced' || data.kind === 'door_held')) S.alerts[data.door_id] = data.kind;

    if (S.view === 'panel') {
      const feed = $('#feed');
      if (feed && inGroup(data, 'main')) {
        feed.insertAdjacentHTML('afterbegin', eventRow(data, { fresh: true }));
        while (feed.children.length > 40) feed.lastElementChild.remove();
        $('.now > .empty')?.remove();
      }
      status();
      if (key && $('#chart')) $('#chart').outerHTML = hoursChart(o.hours);
      if (data.door_id) patchDoor(data.door_id);
    } else if (S.view === 'eventos' && inGroup(data, S.eventGroup)) {
      S.events.unshift(data);
      $('#event-list .empty')?.remove();
      $('#event-list')?.insertAdjacentHTML('afterbegin', eventRow(data, { fresh: true, long: true }));
    }
  } else if (type === 'door') {
    const door = S.doors.find(p => p.id === data.id);
    if (!door) return refreshSoon('doors');
    Object.assign(door, data);
    if (data.state !== 'open') delete S.alerts[door.id];
    S.overview.doors.open = S.doors.filter(p => p.state === 'open').length;
    if (S.view === 'panel') { patchDoor(door.id); status(); }
  } else if (type === 'device') {
    Object.assign(S.devices.find(d => d.id === data.id) ?? {}, data);
    refreshSoon('devices', 'doors', 'overview');
  } else if (type === 'sync') {
    refreshSoon('people', 'devices', 'overview');
  } else if (type === 'offline') {
    S.linkDown = true;
    status();
  } else if (type === 'online' && S.linkDown) {
    S.linkDown = false;
    refreshSoon('overview', 'sites', 'devices', 'doors', 'levels', 'people', 'feed');
  } else if (type === 'expired') {
    S.api.setSession(null);
    showLogin('La sesión venció. Ingresá de nuevo.');
  }
}

// ── Ingreso ──────────────────────────────────────────────────────────────────
function showLogin(message = '') {
  S.stop?.();
  $('#root').innerHTML = html`<div class="gate"><form class="gate-card form" data-form="login">${BRAND}<h1>Ingresar</h1>
    <label class="field"><span>Correo</span><input type="email" name="email" autocomplete="username" required autofocus></label>
    <label class="field"><span>Contraseña</span><input type="password" name="password" autocomplete="current-password" required></label>
    <p class="form-error" role="alert">${message}</p><button class="btn wide" type="submit">Ingresar</button></form></div>`;
}
forms.login = async (_form, v) => {
  S.api.setSession((await S.api.post('/api/login', { email: v.email, password: v.password })).token);
  await enter();
};
actions.logout = async () => {
  if (S.api.demo) return toast('En la demostración la sesión queda abierta');
  await S.api.post('/api/logout').catch(() => {});
  S.api.setSession(null);
  showLogin();
};

// ── Primera instalación ──────────────────────────────────────────────────────
const W = { step: 1, preview: false, engine: 'sqlite', url: '', org: '', name: '', email: '', password: '', license: '' };

function showSetup(preview = false) {
  Object.assign(W, { step: 1, preview });
  drawSetup();
}

function drawSetup() {
  const pg = W.engine === 'postgres';
  const body = W.step === 1 ? html`<h1>¿Dónde se guardan los datos?</h1>
      <p class="muted">Se elige una sola vez. Kliva crea ahí todo lo que necesita.</p>
      <label class="choice"><input type="radio" name="engine" value="sqlite" ${pg ? '' : raw('checked')}>
        <span><strong>En este servidor</strong><small>Base local, sin instalar nada más. Lo indicado cuando hay un solo servidor.</small></span></label>
      <label class="choice"><input type="radio" name="engine" value="postgres" ${pg ? raw('checked') : ''}>
        <span><strong>En una base PostgreSQL</strong><small>Un servidor del cliente o una base en la nube. Los datos quedan donde el cliente decida.</small></span></label>
      <label class="field" id="pg-url" ${pg ? '' : raw('hidden')}><span>Dirección de la base</span>
        <input type="text" name="url" value="${W.url}" placeholder="postgres://usuario:clave@servidor:5432/kliva" autocomplete="off" spellcheck="false">
        <small>Si la base está en la nube, agregá ?sslmode=require al final. La conexión se prueba al continuar.</small></label>`
    : W.step === 2 ? html`<h1>La empresa y su administrador</h1>
      <p class="muted">El administrador es quien después agrega equipos, personas y operadores.</p>
      <label class="field"><span>Nombre de la empresa</span><input type="text" name="org" value="${W.org}" required autofocus></label>
      <label class="field"><span>Nombre del administrador</span><input type="text" name="name" value="${W.name}" required></label>
      <label class="field"><span>Correo</span><input type="email" name="email" value="${W.email}" autocomplete="username" required></label>
      <label class="field"><span>Contraseña</span><input type="password" name="password" autocomplete="new-password" minlength="10" required><small>Al menos 10 caracteres.</small></label>`
    : html`<h1>Licencia</h1>
      <p class="muted">Sin licencia, Kliva funciona en modo evaluación con hasta 2 equipos. También se puede cargar más adelante, desde Ajustes.</p>
      <label class="field"><span>Clave de licencia (opcional)</span><textarea name="license" placeholder="Pegá acá la clave">${W.license}</textarea></label>`;

  $('#root').innerHTML = html`<div class="gate"><form class="gate-card form" data-form="setup">${BRAND}
    <div class="steps" role="img" aria-label="Paso ${W.step} de 3">${[1, 2, 3].map(n => html`<span ${n <= W.step ? raw('data-on') : ''}></span>`)}</div>
    ${body}<p class="form-error" role="alert"></p>
    <div class="form-actions">${W.step > 1 ? html`<button class="btn plain" type="button" data-action="setup-back">Atrás</button>` : ''}
      ${W.preview ? html`<button class="btn plain" type="button" data-action="setup-exit">Salir del asistente</button>` : ''}
      <button class="btn push" type="submit">${W.step === 3 ? 'Terminar la instalación' : 'Continuar'}</button></div></form></div>`;
}

actions['setup-back'] = () => { W.step--; drawSetup(); };
actions['setup-exit'] = () => { shell(); route(); };
actions['wizard-preview'] = () => { S.view = 'asistente'; showSetup(true); };

forms.setup = async (_form, v) => {
  Object.assign(W, v);
  if (W.step === 1 && W.engine === 'postgres') {
    if (!W.url) throw new Error('Escribí la dirección de la base');
    await S.api.post('/api/setup/check-db', { url: W.url });
  }
  if (W.step < 3) { W.step++; return drawSetup(); }
  if (W.preview) {
    shell(); await route();
    return toast('En una instalación real, acá queda todo listo para agregar equipos');
  }
  const session = await S.api.post('/api/setup', {
    db: { engine: W.engine, url: W.url }, org: W.org, admin: { name: W.name, email: W.email, password: W.password }, license: W.license || undefined,
  });
  W.password = '';
  S.api.setSession(session.token);
  await enter();
};

// ── Arranque ─────────────────────────────────────────────────────────────────
async function enter() {
  try {
    const me = await S.api.get('/api/me');
    Object.assign(S, { me: me.user, org: me.org, license: me.license, engine: me.engine });
  } catch (e) {
    if (e.status !== 401) throw e;
    S.api.setSession(null);
    return showLogin();
  }
  await load('overview', 'sites', 'devices', 'doors', 'levels', 'people', 'feed');
  shell();
  await route();
  S.stop?.();
  S.stop = S.api.stream(onLive);
}

async function boot() {
  S.api = $('meta[name="kliva-mode"]').content === 'live' ? liveApi() : demoApi();
  applyTheme();
  try {
    const state = await S.api.get('/api/state');
    Object.assign(S, { brands: state.brands, version: state.version, org: state.org });
    if (!state.configured) showSetup();
    else if (!S.api.hasSession()) showLogin();
    else await enter();
  } catch (e) {
    $('#root').innerHTML = html`<div class="gate"><div class="gate-card">${BRAND}<h1>No se pudo conectar</h1>
      <p class="muted">${e.message}</p><div><button class="btn" type="button" data-action="retry">Reintentar</button></div></div></div>`;
  }
}
actions.retry = () => boot();

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'), fn = el && actions[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  (async () => fn(el, e))().catch(error => toast(error.message, 'deny'));
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  submit(form);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.isOpen) sheet.close(); });
window.addEventListener('hashchange', () => { if ($('#view')) route(); });

let searchTimer;
document.addEventListener('input', e => {
  if (e.target.id !== 'people-q') return;
  S.peopleQ = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    await load('people');
    const list = $('#people-list');
    if (list) list.innerHTML = peopleRows().join('');
  }, 220);
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.name === 'engine') $('#pg-url').hidden = el.value !== 'postgres';
  if (el.name === 'brand') {
    const brand = S.brands.find(b => b.brand === el.value);
    el.form.elements.port.value = brand.defaultPort;
    el.form.elements.username.value = brand.brand === 'zkteco' ? '' : 'admin';
    $('#brand-hint').textContent = brandHint(brand);
  }
  if (el.id === 'face-file' && el.files[0]) {
    try {
      S.draftFace = await shrinkPhoto(el.files[0]);
      Object.assign($('#face-preview'), { textContent: '' }).style.backgroundImage = `url(${S.draftFace})`;
      $('#face-clear').hidden = false;
      $('#face-hint').textContent = 'Foto lista. Se envía a los equipos al guardar.';
    } catch (error) { toast(error.message, 'deny'); }
    el.value = '';
  }
});

boot();

})();
</script>
</body>
</html>
