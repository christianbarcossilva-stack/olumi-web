<script type="module">
// Maqueta con el motor común. Dentro de la app de Ondi lee el cliente de window.parent.__ondiMaqueta;
// sola, abre una escena de ejemplo (?escena=deposito) o la guardada en este navegador.
import { abrirMaqueta } from './maqueta.js?v=1';
const P = new URLSearchParams(location.search), app = P.get('app') || 'ondi';
document.documentElement.dataset.app = app;
let host = null; try { host = window.parent !== window && window.parent.__ondiMaqueta || null; } catch (e) {}
let escena = null;
if (!host) { const id = P.get('escena') || 'deposito';
  try { const g = localStorage.getItem('motor.escena.' + id); if (g && !P.has('nuevo')) escena = JSON.parse(g).escena; } catch (e) {}
  if (!escena) escena = await (await fetch('escenas/' + id.replace(/[^\w-]/g, '') + '.json')).json(); }
const M = await abrirMaqueta({ host, escena, app, raiz: document.body, catalogo: '../olumi/beta/3d/', clave: 'motor.escena.' + (P.get('escena') || 'deposito'), editable: host ? undefined : !P.has('ver'), ruedaConCtrl: P.has('embebida') });
window.__maqueta = M;
</script>
