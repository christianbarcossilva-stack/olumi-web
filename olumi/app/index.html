<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E1F23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olumi">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<title>Olumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@800&display=swap">
<style>
/* Layout: sidebar (desktop) / bottom tabs (phone) + work surface; pipeline stages colored after the fiber-optic strand code */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --surface-2:#F7F7F4; --line:#D9D9D3; --line-2:#E8E8E3;
  --fg:#1E1F23; --muted:#5C5E66; --accent:#1E1F23; --accent-fg:#FFC93C; --accent-soft:#ECECE6;
  --ok:#16794a; --ok-soft:#dcf2e6; --warn:#a35a00; --warn-soft:#fbecd5; --bad:#b4312a; --bad-soft:#fbe1df;
  --s-nuevo:#1f5fd6; --s-relev:#e0701a; --s-pres:#8b5a2b; --s-neg:#7a46cc; --s-gan:#16794a; --s-per:#6b7787;
  --shadow:0 1px 2px rgb(20 28 40 / .06), 0 3px 10px rgb(20 28 40 / .05);
  --scrim:rgb(12 18 28 / .42);
  --f-head:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1F23; --surface:#2A2C31; --surface-2:#313339; --line:#3D3F46; --line-2:#34363C;
  --fg:#F3F3F1; --muted:#A9ABB2; --accent:#FFC93C; --accent-fg:#1E1F23; --accent-soft:#3D3622;
  --ok:#56c98b; --ok-soft:#13301f; --warn:#f2a945; --warn-soft:#35260e; --bad:#f07a72; --bad-soft:#3b1816;
  --s-nuevo:#6c9bff; --s-relev:#f5954a; --s-pres:#c4935f; --s-neg:#a985f0; --s-gan:#56c98b; --s-per:#8e9bad;
  --shadow:0 1px 2px rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1E1F23; --surface:#2A2C31; --surface-2:#313339; --line:#3D3F46; --line-2:#34363C;
  --fg:#F3F3F1; --muted:#A9ABB2; --accent:#FFC93C; --accent-fg:#1E1F23; --accent-soft:#3D3622;
  --ok:#56c98b; --ok-soft:#13301f; --warn:#f2a945; --warn-soft:#35260e; --bad:#f07a72; --bad-soft:#3b1816;
  --s-nuevo:#6c9bff; --s-relev:#f5954a; --s-pres:#c4935f; --s-neg:#a985f0; --s-gan:#56c98b; --s-per:#8e9bad;
  --shadow:0 1px 2px rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .6); color-scheme:dark }

/* preferencia propia del CRM: claro, oscuro o automático por horario */
:root[data-mode="light"]{--bg:#F2F2EF;--surface:#FFFFFF;--surface-2:#F7F7F4;--line:#D9D9D3;--line-2:#E8E8E3;--fg:#1E1F23;--muted:#5C5E66;--accent:#1E1F23;--accent-fg:#FFC93C;--accent-soft:#ECECE6;--ok:#16794a;--ok-soft:#dcf2e6;--warn:#a35a00;--warn-soft:#fbecd5;--bad:#b4312a;--bad-soft:#fbe1df;--s-nuevo:#1f5fd6;--s-relev:#e0701a;--s-pres:#8b5a2b;--s-neg:#7a46cc;--s-gan:#16794a;--s-per:#6b7787;--shadow:0 1px 2px rgb(20 28 40 / .06), 0 3px 10px rgb(20 28 40 / .05);--scrim:rgb(12 18 28 / .42);color-scheme:light}
:root[data-mode="dark"]{--bg:#1E1F23; --surface:#2A2C31; --surface-2:#313339; --line:#3D3F46; --line-2:#34363C;
  --fg:#F3F3F1; --muted:#A9ABB2; --accent:#FFC93C; --accent-fg:#1E1F23; --accent-soft:#3D3622;
  --ok:#56c98b; --ok-soft:#13301f; --warn:#f2a945; --warn-soft:#35260e; --bad:#f07a72; --bad-soft:#3b1816;
  --s-nuevo:#6c9bff; --s-relev:#f5954a; --s-pres:#c4935f; --s-neg:#a985f0; --s-gan:#56c98b; --s-per:#8e9bad;
  --shadow:0 1px 2px rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .6); color-scheme:dark}

/* Grafito: amarillo para lo que se toca, naranja para lo urgente */
:root{--yel:#E0A800;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#FFE4CF;--urg-text:#A84300;--yel-soft:#FFF0C2;--yel-text:#6E5200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--yel:#FFC93C;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#45311F;--urg-text:#FF9B52;--yel-soft:#3D3622;--yel-text:#FFC93C}}
:root[data-theme="dark"]{--yel:#FFC93C;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#45311F;--urg-text:#FF9B52;--yel-soft:#3D3622;--yel-text:#FFC93C}
:root[data-mode="light"]{--yel:#E0A800;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#FFE4CF;--urg-text:#A84300;--yel-soft:#FFF0C2;--yel-text:#6E5200}
:root[data-mode="dark"]{--yel:#FFC93C;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#45311F;--urg-text:#FF9B52;--yel-soft:#3D3622;--yel-text:#FFC93C}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-head);font-stretch:108%;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num,.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* shell */
.app{min-height:100%;display:grid;grid-template-columns:212px minmax(0,1fr)}
.nav{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px;padding-left:max(10px, env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand svg{flex:none}
.brand strong{display:block;font-family:var(--f-head);font-stretch:112%;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.brand span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;color:var(--muted);font-weight:600;position:relative}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .pill{margin-left:auto;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
.shell{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:var(--gl);padding-right:var(--gr)}
.top .mbrand{display:none}
.search{flex:1;min-width:0;position:relative}
.search input[type=search]{width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
#banner:empty{display:none}
#banner{padding-left:var(--gl);padding-right:var(--gr);padding-block:10px 0}
.note{border-radius:8px;padding:9px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line)}
main{padding-left:var(--gl);padding-right:var(--gr);padding-block:18px 40px;min-width:0}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.tgl{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.tgl.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],input[type=email],input[type=tel],input[type=password],input[type=time],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;box-sizing:border-box}
textarea{resize:vertical;min-height:72px;width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width: 899px), (pointer: coarse){input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]),select,textarea{font-size:16px}}

.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px}
.vhead h1{font-size:26px;font-weight:750;font-stretch:115%}
.sub{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start}
.col{flex:0 0 min(272px, 84vw);scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100dvh - 190px);min-width:0}
.col.over{outline:2px dashed var(--sc);outline-offset:-2px}
.colh{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 8px;padding:12px 12px 10px;border-bottom:3px solid var(--sc)}
.colh .dot{width:10px;height:10px;border-radius:50%;background:var(--sc)}
.colh h2{font-size:14px;font-weight:700}
.colh .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.colh .tot{grid-column:2 / 4;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto;min-height:40px}
.nocards{margin:6px 2px;color:var(--muted);font-size:13px}
.addq{border:0;background:none;color:var(--muted);text-align:left;padding:8px 14px 12px;font-weight:600}
.addq:hover{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:var(--line)}
.card.drag{opacity:.45}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.svc{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stars{color:var(--warn);font-size:12px;letter-spacing:1px}
.card h3{font-family:var(--f-body);font-stretch:100%;font-size:14.5px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.ccli{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.cbot{display:flex;align-items:center;gap:8px;margin-top:3px}
.cbot .amt{font-size:13px;font-weight:500;margin-right:auto}
.tag{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-none{background:var(--surface-2);color:var(--muted)}
.t-acc{background:var(--accent-soft);color:var(--accent)}
.av{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface-2)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 130px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row strong{display:block;overflow-wrap:anywhere}
.row .r-num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.row .r-meta{color:var(--muted);font-size:13px}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 130px;gap:12px;padding:0 16px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lhead span:nth-child(n+3){text-align:right}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-top:1px solid var(--line-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.code{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* agenda */
.group{margin-bottom:22px}
.group h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2)}
.arow:first-child{border-top:0}
.arow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.a-main{cursor:pointer;min-width:0}
.a-main strong{display:block;overflow-wrap:anywhere}
.a-main .muted{font-size:13px}
.atype{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.arow.done strong{text-decoration:line-through;color:var(--muted)}
.when{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.snz{border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:11.5px;font-weight:600;padding:1px 8px;color:var(--muted)}
.snz:hover{color:var(--accent);border-color:var(--accent)}
.psearch{margin-top:6px;font-size:13px}
.themebox{margin-top:auto;padding:12px 6px 4px;display:flex;flex-direction:column;gap:6px}
.themebox .seg{display:flex;width:100%}
.themebox .seg button{flex:1;padding:5px 2px;font-size:11.5px}
input[type=color]{height:38px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.blogo{width:30px;height:30px;object-fit:contain;border-radius:6px;flex:none}
.logoprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoprev img{height:44px;max-width:160px;object-fit:contain;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px}
.navsec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.nav .mob{display:none}
/* prioridad */
.pr{font-family:var(--f-mono);font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap}
.pr1{background:var(--urg);color:var(--urg-fg)}
.pr2{background:var(--urg-soft);color:var(--urg-text)}
.pr3{background:var(--yel-soft);color:var(--yel-text)}
.pr4{background:var(--surface-2);color:var(--muted)}
.t-abo{background:var(--yel-soft);color:var(--yel-text)}
.tkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-2);cursor:pointer}
.tkrow:first-child{border-top:0}
.tkrow:hover{background:var(--surface-2)}
.tkrow .tk-main{min-width:0}
.tkrow .tk-main strong{display:block;overflow-wrap:anywhere}
.tkrow .tk-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:3px}
.tkrow .tk-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tk-est{font-size:11.5px;font-weight:650;color:var(--muted)}
/* calendario */
.calnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day.off{background:var(--surface-2)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 6px;border-bottom:1px solid var(--line-2)}
.dayh b{font-family:var(--f-head);font-size:13px}
.dayh span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dayb{display:flex;flex-direction:column;gap:6px;padding:8px;flex:1}
.ev{border-radius:8px;background:var(--surface-2);border-left:4px solid var(--ec,var(--accent));padding:6px 8px;cursor:pointer;font-size:12.5px;min-width:0}
.ev b{display:block;font-weight:650;overflow-wrap:anywhere}
.ev .h{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ev.done{opacity:.55}
.ev.fu{border-left-style:dashed;background:none;border:1px dashed var(--line);border-left:4px dashed var(--line)}
.dayadd{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 8px 8px;text-align:left}
.dayadd:hover{color:var(--accent)}
/* campo */
.jobs{display:flex;flex-direction:column;gap:12px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;cursor:pointer}
.job .hr{font-family:var(--f-mono);font-size:20px;font-weight:500;letter-spacing:-.03em}
.job h3{font-size:16px}
.job .sub2{grid-column:2 / -1;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.job.done{opacity:.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a.btn{text-decoration:none;color:var(--fg)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .rmph{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:var(--scrim);color:var(--surface);font-size:12px;padding:2px 6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2)}
.file .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.file a{color:var(--accent);font-weight:600}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.busy{font-size:13px;color:var(--muted)}

<script>
(() => {
/* ---------- constantes del negocio ---------- */
const ETAPAS=[
  {k:'nuevo',n:'Nuevo',p:10},{k:'relev',n:'Relevamiento',p:25},{k:'pres',n:'Presupuestado',p:50},
  {k:'neg',n:'Negociación',p:70},{k:'gan',n:'Ganado',p:100},{k:'per',n:'Perdido',p:0}];
const EK=Object.fromEntries(ETAPAS.map(e=>[e.k,e]));
const SERV=['Fibra óptica','CCTV','Cableado estructurado','Control de acceso','Redes y WiFi','Mantenimiento','Otro'];
const DEPTOS=['Artigas','Canelones','Cerro Largo','Colonia','Durazno','Flores','Florida','Lavalleja','Maldonado','Montevideo','Paysandú','Río Negro','Rivera','Rocha','Salto','San José','Soriano','Tacuarembó','Treinta y Tres'];
const ORIG=['Referido','WhatsApp','Llamada','Web / redes','Cliente existente','Licitación','Otro'];
const TIPOS=[['visita','Visita técnica'],['llamada','Llamada'],['reunion','Reunión'],['mensaje','Email / mensaje'],['instal','Instalación'],['tarea','Tarea']];
const TK=Object.fromEntries(TIPOS);
const UNID=['unidad','metro','jornal','hora','global','rollo','caja'];
const EST=[['borrador','Borrador'],['enviado','Enviado'],['aceptado','Aceptado'],['rechazado','Rechazado']];
const ESTC={borrador:'t-none',enviado:'t-acc',aceptado:'t-ok',rechazado:'t-bad'};
const IVA=0.22;
const COLS=['clientes','oportunidades','actividades','presupuestos','productos','tickets','trabajos','facturas','proyectos','planos','relevamientos','tecnicos','depositos','movimientos','equipos','tareas','cuadrillas','kits','checklists'];
const NEED=COLS.length+1;
const TKT=[['emergencia','Emergencia'],['reclamo','Reclamo o falla'],['instalacion','Instalación nueva'],['relevamiento','Relevamiento'],['mantenimiento','Mantenimiento'],['consulta','Consulta']];
const TKTK=Object.fromEntries(TKT);
const TKE=[['nuevo','Nuevo'],['agendado','Agendado'],['en_curso','En curso'],['resuelto','Resuelto'],['cerrado','Cerrado']];
const TKEK=Object.fromEntries(TKE);
const PRN={1:'P1 Emergencia · abonado',2:'P2 Emergencia',3:'P3 Abonado',4:'P4 Normal'};
const PRC={1:'var(--urg)',2:'var(--urg-text)',3:'var(--yel)',4:'var(--s-per)'};
const TRE=[['programado','Programado'],['en_curso','En curso'],['terminado','Terminado']];
const MEDIOS=['Transferencia','Efectivo','Débito / crédito','Cheque','Otro'];
const TZ='America/Montevideo';

/* ---------- estado ---------- */
const D={clientes:{},oportunidades:{},actividades:{},presupuestos:{},productos:{},tickets:{},trabajos:{},facturas:{}};
let CFG={}, CFGDRAFT=null;
let DB=null, USER=null, DL=null, AS=null, SAMPLE=null, ME=null, mode='loading', readonly=false, slow=false;
let aboOnly=false, calStart=null, calTec='', tkFilter='abiertos', faTab='facturas', campoDay=0, campoAll=false;
const loaded=new Set();
const NAMES={};
let Q='', fServ='', mine=false, showLost=false;
let VIEW=lsGet('crm.view')||'tickets';
let repMon=lsGet('crm.mon')||'UYU';
let pView=lsGet('crm.pview')||'board';
let themePref=lsGet('crm.theme')||'auto';
function applyTheme(){const h=new Date().getHours();const m=themePref==='auto'?(h>=7&&h<19?'light':'dark'):themePref;if(document.documentElement.dataset.mode!==m)document.documentElement.dataset.mode=m}
applyTheme();setInterval(applyTheme,60000);
const PRODUCT='Olumi';
let logoData=null,logoLoading=false;
async function loadLogoData(){if(!has('marca')||!CFG.logo?.id||logoData||logoLoading)return;logoLoading=true;try{const lu=blobUrl(CFG.logo.id);if(lu===PIXEL){logoLoading=false;return}const r=await fetch(lu);if(r.ok){const b=await r.blob();logoData=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(b)})}}catch(e){}logoLoading=false}
function applyBrand(){
  $('#coName').textContent=CFG.nombre||'Olumi';$('#coSub').textContent=CFG.nombre?'con Olumi':'by Unity Tech';
  document.title=CFG.nombre?CFG.nombre+' · '+PRODUCT:PRODUCT;
  const id=has('marca')?CFG.logo?.id:null;[['#brandLogo','#brandMark'],['#mLogo','#mMark']].forEach(([l,m])=>{const img=$(l);if(id){const bu=blobUrl(id);if(img.getAttribute('src')!==bu)img.src=bu;img.hidden=false;$(m).style.display='none'}else{img.hidden=true;$(m).style.display=''}});
  const c=has('marca')&&/^#[0-9a-f]{6}$/i.test(CFG.color||'')?CFG.color:'';let st=document.getElementById('brandStyle');
  if(!st){st=document.createElement('style');st.id='brandStyle';document.body.appendChild(st)}
  const css=c?`:root[data-mode="light"]{--accent:${c};--accent-soft:color-mix(in srgb,${c} 13%,#ffffff)}:root[data-mode="dark"]{--accent:color-mix(in srgb,${c} 62%,#ffffff);--accent-soft:color-mix(in srgb,${c} 26%,#161d27)}`:'';
  if(st.textContent!==css)st.textContent=css;
  if(id&&!logoData)loadLogoData();
}
function themeSeg(){return`<div class="seg" role="group" aria-label="Apariencia">${[['light','Claro'],['dark','Oscuro'],['auto','Automático']].map(([k,n])=>`<button class="${themePref===k?'on':''}" data-act="theme:${k}" aria-pressed="${themePref===k}">${n}</button>`).join('')}</div>`}
const NEWBY={inicio:['cli','Cliente'],inventario:['mov','Movimiento'],proyectos:['pry','Proyecto'],tecnicos:['trab','Trabajo'],tickets:['tk','Ticket'],calendario:['trab','Trabajo'],campo:['trab','Trabajo'],facturacion:['fact','Factura'],menu:['tk','Ticket'],pipeline:['op','Oportunidad'],clientes:['cli','Cliente'],agenda:['act','Actividad'],presupuestos:['pres','Presupuesto'],reportes:['op','Oportunidad'],mas:['prod','Producto'],plan:['tk','Ticket'],admin:['tk','Ticket'],trabajos:['trab','Trabajo']};
let SH=null, QE=null, armed=null;

/* ---------- utilidades ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const localISO=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString()};
const today=()=>localISO(new Date()).slice(0,10);
const tomorrow9=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return localISO(d).slice(0,16)};
const qn=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const n0=v=>Number(v)||0;
const cot=()=>n0(CFG.cotizacion)||40;
const defMon=()=>CFG.monedaDef||'UYU';
const conv=(m,mon,to)=>{m=n0(m);mon=mon||'UYU';if(mon===to)return m;return to==='USD'?m/cot():m*cot()};
const money=(n,mon,dec=0)=>((mon||'UYU')==='USD'?'US$ ':'$ ')+n0(n).toLocaleString('es-UY',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const qty=n=>n0(n).toLocaleString('es-UY',{maximumFractionDigits:2});
const fdate=d=>d?new Date(d.slice(0,10)+'T12:00').toLocaleDateString('es-UY',{day:'numeric',month:'short'}):'';
const fdateL=d=>d?new Date(d.slice(0,10)+'T12:00').toLocaleDateString('es-UY',{day:'numeric',month:'long',year:'numeric'}):'';
const fdt=f=>{if(!f)return'Sin fecha';const d=f.slice(0,10),t=f.slice(11,16);const l=d===today()?'Hoy':fdate(d);return t?l+' · '+t:l};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const arr=col=>Object.entries(D[col]).map(([id,o])=>({...o,id}));
const cliName=id=>D.clientes[id]?.nombre||'';
const opp=id=>D.oportunidades[id];
const isOpen=o=>!['gan','per'].includes(o.etapa||'nuevo');
function waLink(tel){const d=String(tel||'').replace(/\D/g,'');if(d.length<8)return'';const n=d.startsWith('598')?d:'598'+d.replace(/^0/,'');return'https://wa.me/'+n}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function handleErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'&&PLAN&&PLAN.users>PLAN.max_users){readonly=true;sr();toast('La empresa superó los usuarios de su plan: quedó en solo lectura.')}
  else if(c==='invalid_argument'&&PLAN&&e.message&&/storage|bucket|object/i.test(e.message)){toast('Se llenó el espacio de fotos y planos del plan.')}
  else if(c==='invalid_argument'){readonly=true;sr();toast('No tenés permiso para guardar cambios en este CRM.')}
  else if(c==='quota_exceeded')toast('Se llenó el espacio de datos. Borrá registros viejos para seguir cargando.');
  else toast('No se pudo guardar. Probá de nuevo en unos segundos.');
}
const clean=o=>JSON.parse(JSON.stringify(o));
async function put(col,id,data){
  if(mode==='loading'){toast('Esperá a que terminen de cargar los datos.');throw {code:'loading'}}
  if(mode==='live'&&(col==='presupuestos'||col==='facturas')&&!has(col)){toast(`${col==='facturas'?'Las facturas no están incluidas':'Los presupuestos no están incluidos'} en el plan ${PLAN.nombre} de tu empresa.`);throw {code:'loading'}}
  if(mode==='live'){await DB.collection(col).doc(id).set(clean(data))}
  else{D[col][id]=clean(data);sr()}
}
async function remove(col,id){
  if(mode==='live')await DB.collection(col).doc(id).delete();
  else{delete D[col][id];sr()}
}
async function saveCfg(v){
  if(mode==='live')await DB.doc('config/empresa').set(clean(v));
  else{CFG=clean(v);sr()}
}

/* ---------- personas ---------- */
function av(id){
  if(!id)return'';
  const p=NAMES[id];const nm=p?.name||(id===ME?'Vos':'Compañero');
  return p?.av?`<img class="av" src="${esc(p.av)}" alt="${esc(nm)}" title="${esc(nm)}">`:'';
}
function personName(id){if(!id)return'Sin asignar';const n=NAMES[id]?.name;if(id===ME)return(n||'Vos')+' (vos)';return n||'Compañero'}
async function refreshNames(){
  if(!USER)return;
  const ids=new Set();if(ME)ids.add(ME);
  for(const c of ['oportunidades','actividades'])Object.values(D[c]).forEach(o=>o.responsable&&ids.add(o.responsable));
  Object.values(D.tickets).forEach(o=>o.responsable&&ids.add(o.responsable));Object.values(D.trabajos).forEach(j=>(j.tecnicos||[]).forEach(i=>ids.add(i)));
  const list=[...ids];if(!list.length)return;
  const ps=await USER.profiles(list);let ch=false;
  for(const id of list){const p=ps[id];if(!p)continue;const n={name:p.name||'',av:p.avatarUrl||''};
    if(!NAMES[id]||NAMES[id].name!==n.name||NAMES[id].av!==n.av){NAMES[id]=n;ch=true}}
  if(ch)sr();
}

/* ---------- actividades ---------- */
function pendingActs(opId){return arr('actividades').filter(a=>!a.hecha&&a.oportunidadId===opId).sort((a,b)=>(a.fecha||'9').localeCompare(b.fecha||'9'))}
function actState(a){if(!a.fecha)return't-none';const d=a.fecha.slice(0,10),t=today();return d<t?'t-bad':d===t?'t-warn':'t-ok'}
function actBadge(a){
  if(!a)return'<span class="tag t-none">Sin actividad</span>';
  const s=actState(a);const d=(a.fecha||'').slice(0,10);
  const l=s==='t-bad'?'Vencida':s==='t-warn'?'Hoy':a.fecha?fdate(d):'Pendiente';
  return `<span class="tag ${s}" title="${esc((TK[a.tipo]||'')+': '+(a.titulo||''))}">${l}</span>`;
}
function overdueCount(){const t=today();return arr('actividades').filter(a=>!a.hecha&&a.fecha&&a.fecha.slice(0,10)<t&&(!mine||a.responsable===ME)).length}

/* ---------- render ---------- */
let rq=0;function sr(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}
function render(){
  applyRubros();subGuard();
  if(ROLE==='pendiente'){document.body.classList.add('portal');$('#banner').innerHTML='';$('#main').innerHTML=pendingHtml();return}
  if(CFEI===undefined&&mode==='live'&&ORG&&PLAN&&has('cfe')&&!PORTAL())loadCfe();
  if(PORTAL()){document.body.classList.add('portal');applyBrand();$('#banner').innerHTML='';$('#main').innerHTML=(loaded.size>=NEED||slow)?vPortal():loadingHtml();return}
  document.body.classList.remove('portal');
  if(!VIEWS[VIEW])VIEW='pipeline';
  $('#themeSide').innerHTML='<span class="hint">Apariencia</span>'+themeSeg();
  applyBrand();
  const nb=NEWBY[VIEW];$('#topNew').dataset.new=nb[0];$('#topNew .lbl-long').textContent=nb[1];
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===VIEW?'page':'false'));
  const ov=overdueCount(),pill=$('#navOver');pill.hidden=!ov;pill.textContent=ov;
  const em=arr('tickets').filter(t=>tkOpen(t)&&t.tipo==='emergencia').length,p2=$('#navTk');p2.hidden=!em;p2.textContent=em;
  const fv=arr('facturas').filter(f=>factState(f)==='vencida').length,p3=$('#navFa');p3.hidden=!fv;p3.textContent=fv;
  const pm=$('#navMas');pm.hidden=!(ov+fv);pm.textContent=ov+fv;
  $('#banner').innerHTML=bannerHtml()+pendBanner()+setupBanner();
  $('#prodlist').innerHTML=arr('productos').map(p=>`<option value="${esc(p.nombre)}"></option>`).join('');
  const ready=mode==='local'||(mode==='live'&&(loaded.size>=NEED||slow));
  const ae=document.activeElement, aid=ae&&ae.id&&$('#main').contains(ae)?ae.id:null;
  const sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const view=Q&&['reportes','mas','menu','calendario','campo','plan','admin','trabajos','proyectos','tecnicos','inventario'].includes(VIEW)?vSearch:gated(VIEW)?()=>lockedHtml(VIEW):VIEWS[VIEW];
  $('#main').innerHTML=ready?view():loadingHtml();
  if(aid){const el=document.getElementById(aid);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function bannerHtml(){
  if(mode==='local')return'<p class="note">Sin conexión con el servidor: lo que cargues ahora no se guarda.</p>';
  if(slow&&loaded.size<NEED)return'<p class="note">Todavía no se pudo conectar con la base de datos. Lo que ves puede estar incompleto.</p>';
  if(PLAN&&PLAN.users>PLAN.max_users)return`<p class="note">${esc((ORGINFO&&ORGINFO.name)||'Tu empresa')} tiene ${PLAN.users} usuarios y el plan ${esc(PLAN.nombre)} incluye ${PLAN.max_users}, así que quedó en solo lectura. Los datos están todos guardados.${NATIVE?'':' <button class="btn ghost" data-view="plan">Ver plan</button>'}</p>`;
  if(readonly)return'<p class="note">Tenés acceso de solo lectura. Pedile al administrador de tu empresa que te cambie el rol a Técnico.</p>';
  const tl=PLAN&&!PLAN.founder&&PLAN.plan==='gratis'&&PLAN.efectivo!=='gratis'?daysLeft(PLAN.trial_ends):null;
  if(tl!=null&&tl<=5&&['owner','admin'].includes(ROLE))return`<p class="note">${tl<=0?'La prueba de Pro termina hoy':`Quedan ${tl} día${tl===1?'':'s'} de la prueba de Pro`}. Después la empresa sigue con el plan Gratis.${NATIVE?'':' <button class="btn ghost" data-view="plan">Ver planes</button>'}</p>`;
  return'';
}
const fiberArt=`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="56" cy="64" r="32" stroke="var(--accent)" stroke-width="16" fill="none"/><circle cx="95" cy="25" r="11" fill="#FF7A1A"/></svg>`;
function loadingHtml(){return`<div class="empty">${fiberArt}<h2>Cargando el CRM</h2><p>Trayendo clientes, oportunidades y presupuestos.</p></div>`}
function empty(t,p,kind,btn){return`<div class="empty">${fiberArt}<h2>${t}</h2><p>${p}</p>${kind?`<button class="btn pri" data-new="${kind}">${btn}</button>`:''}</div>`}
const cliF=()=>has('abonos')?CLIF:CLIF.filter(f=>!/^abono/.test(f.k));
const opts=(list,v)=>list.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}"${String(val)===String(v??'')?' selected':''}>${esc(l)}</option>`}).join('');

/* --- Pipeline --- */
function opMatch(o){
  if(fServ&&o.servicio!==fServ)return false;
  if(mine&&o.responsable!==ME)return false;
  if(!Q)return true;
  return qn([o.titulo,cliName(o.clienteId),o.servicio,o.obra].join(' ')).includes(qn(Q));
}
function card(o){

function bars(rows,color){

}
function vRep(){

  if(!ops.length&&!Object.keys(D.tickets).length)return head+empty('Sin datos para reportar','Los reportes se arman solos a medida que cargás oportunidades y las vas ganando o perdiendo.','op','+ Nueva oportunidad');

const isAbo=cid=>has('abonos')&&!!D.clientes[cid]?.abonado;
const tkOpen=t=>!['resuelto','cerrado'].includes(t.estado||'nuevo');
function tkPrio(t){const e=t.tipo==='emergencia',a=isAbo(t.clienteId);return e?(a?1:2):(a?3:4)}
const prChip=p=>`<span class="pr pr${p}" title="${PRN[p]}">P${p}</span>`;
const aboTag=cid=>isAbo(cid)?'<span class="tag t-abo">Abonado</span>':'';
function ago(ms){if(!ms)return'';const m=Math.round((Date.now()-ms)/60000);if(m<60)return`hace ${Math.max(1,m)} min`;const h=Math.round(m/60);if(h<48)return`hace ${h} h`;return`hace ${Math.round(h/24)} días`}
function nextCode(col,pre,offset=0){const m=Math.max(0,...arr(col).map(p=>parseInt(String(p.numero||'').replace(/\D/g,''),10)||0));return pre+'-'+String(m+1+offset).padStart(4,'0')}
function tkSorted(list){return list.sort((a,b)=>tkPrio(a)-tkPrio(b)||n0(a.creado)-n0(b.creado))}
function tkNextJob(id){return arr('trabajos').filter(j=>j.ticketId===id&&j.estado!=='terminado').sort((a,b)=>((a.fecha||'')+(a.hora||'')).localeCompare((b.fecha||'')+(b.hora||'')))[0]}
const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return localISO(x).slice(0,10)};

function vTickets(){
  const all=arr('tickets');
  let l=all.filter(t=>tkFilter==='abiertos'?tkOpen(t):tkFilter==='emergencias'?(tkOpen(t)&&t.tipo==='emergencia'):true);
  if(Q)l=l.filter(t=>qn([t.numero,t.titulo,cliName(t.clienteId),t.descripcion,TKTK[t.tipo]].join(' ')).includes(qn(Q)));
  l=tkFilter==='todos'?l.sort((a,b)=>n0(b.creado)-n0(a.creado)):tkSorted(l);
  const open=all.filter(tkOpen);
  const head=`<div class="vhead"><div><h1>Tickets</h1><p class="sub">${open.length} abiertos · ${open.filter(t=>t.tipo==='emergencia').length} emergencias · primero emergencias, el abono desempata</p></div>
    <div class="tools"><div class="seg" role="group" aria-label="Filtro">${[['abiertos','Abiertos'],['emergencias','Emergencias'],['todos','Todos']].map(([k,n])=>`<button class="${tkFilter===k?'on':''}" data-act="tkf:${k}">${n}</button>`).join('')}</div>
    ${PLAN&&PLAN.whatsapp&&has('whatsapp')?'<span class="tag t-ok" title="Los mensajes que llegan a ese número se convierten en tickets solos">WhatsApp automático</span>':''}<button class="btn" data-act="wa">Pegar WhatsApp</button></div></div>`;
  if(!all.length)return head+empty('Sin tickets','Cuando un cliente escriba por WhatsApp, tocá “Pegar WhatsApp” y pegá el mensaje: Claude arma el ticket con cliente, tipo y detalle. También lo podés cargar a mano.','tk','+ Nuevo ticket');
  if(!l.length)return head+'<p class="muted">No hay tickets con este filtro.</p>';

    <div class="tk-side"><span class="tk-est">${TKEK[t.estado||'nuevo']}</span>${j?`<span class="tag t-acc">${fdate(j.fecha)} ${esc(j.hora||'')}</span>`:(tkOpen(t)?'<span class="tag t-none">Sin agendar</span>':'')}</div></div>`;

      <div class="actions"><button class="btn pri" data-new="trab" data-tk="${id}">Agendar visita</button>${has('facturas')?'<button class="btn" data-act="tk2fact">Facturar</button>':''}</div></section>

function waUrl(tel,text){const b=waLink(tel);return b?b+'?text='+encodeURIComponent(text):''}
function waBtns(t){
  const c=D.clientes[t.clienteId];if(!c?.telefono||!waLink(c.telefono))return'<p class="hint">Cargá el teléfono del cliente para poder avisarle por WhatsApp.</p>';
  const co=CFG.nombre||'el equipo técnico',nm=(c.contacto||c.nombre||'').split(' ')[0],j=tkNextJob(t.id);
  const msgs=[['Pedido recibido',`Hola ${nm}, te escribimos de ${co}. Recibimos tu pedido ${t.numero}: ${t.titulo}. ${t.tipo==='emergencia'?'Lo tomamos como emergencia y te contactamos enseguida.':'Te escribimos para coordinar la visita.'}`]];
  if(j)msgs.push(['Visita agendada',`Hola ${nm}, agendamos la visita por el pedido ${t.numero} para el ${fdateL(j.fecha)}${j.hora?' a las '+j.hora:''}${(j.obra||t.obra)?' en '+(j.obra||t.obra):''}. Si necesitás cambiar algo, avisanos por acá. ${co}`]);
  if(t.estado==='en_curso')msgs.push(['Técnico en camino',`Hola ${nm}, el técnico de ${co} va en camino por el pedido ${t.numero}.`]);
  if(!tkOpen(t))msgs.push(['Resuelto',`Hola ${nm}, dejamos resuelto el pedido ${t.numero}: ${t.titulo}. Si notás algo más, escribinos por acá. Gracias, ${co}`]);
  if(PLAN&&PLAN.whatsapp&&has('whatsapp')){WAMSG=msgs.map(([l,m])=>({tel:c.telefono,text:m,tk:(SH&&SH.id)||t.id}));return msgs.map(([l],i)=>`<button class="btn" data-act="wasend:${i}">${l}</button>`).join('')}
  return msgs.map(([l,m])=>`<a class="btn" href="${esc(waUrl(c.telefono,m))}" target="_blank" rel="noopener">${l}</a>`).join('');
}
async function saveTk(){
  const v=readForm(TKF()),err=$('#shErr');
  if(!v.titulo){err.textContent='Escribí qué pasa o qué pide el cliente.';err.hidden=false;$('#f_titulo').focus();return}
  const nc=($('#f_nuevoCli')?.value||'').trim();
  if(nc){const cid=uid();await put('clientes',cid,{nombre:nc,telefono:($('#f_nuevoTel')?.value||'').trim(),creado:Date.now()});v.clienteId=cid}
  const base=SH.id?{...D.tickets[SH.id]}:{creado:Date.now(),numero:nextCode('tickets','T'),...(SH.preset?.draft?.equipoId?{equipoId:SH.preset.draft.equipoId}:{})};
  const t={...base,...v,actualizado:Date.now()};
  if(!tkOpen(t)&&!t.resueltoEn)t.resueltoEn=Date.now();
  if(tkOpen(t))t.resueltoEn=0;
  const isNew=!SH.id,id=SH.id||uid();
  await put('tickets',id,t);toast(`Ticket ${t.numero} guardado`);
  if(isNew){if(!D.tickets[id])D.tickets[id]=t;openSheet('tk',id)}else closeSheet();
}

function sheetWa(){
  return sheetFrame('WhatsApp','Pegar mensaje del cliente',`<p class="hint">Copiá el mensaje (o varios) del chat de WhatsApp y pegalo acá. ${SAMPLE?'Claude reconoce al cliente, el tipo de pedido y arma el ticket para que lo revises antes de guardar.':'Se arma un ticket con el mensaje para que lo completes.'}</p>
    <label class="fld full wa-box" for="wa_text"><span>Mensaje</span><textarea id="wa_text" placeholder="[3/11 09:12] Juan Pérez: Buenas, se cortó la cámara del portón y no graba desde anoche"></textarea></label>
    <p class="busy" id="waBusy" hidden>Claude está leyendo el mensaje…</p><p class="err" id="shErr" hidden></p>`,{saveLabel:SAMPLE?'Armar ticket con Claude':'Armar ticket'});
}
async function saveWa(){
  const txt=$('#wa_text').value.trim(),err=$('#shErr');
  if(!txt){err.textContent='Pegá el mensaje del cliente.';err.hidden=false;return}
  const draft={mensaje:txt,descripcion:txt,origen:'WhatsApp',tipo:'consulta',estado:'nuevo',responsable:ME||''};let newCli=null;
  if(SAMPLE){
    $('#waBusy').hidden=false;
    const clis=arr('clientes').map(c=>({id:c.id,nombre:c.nombre||'',contacto:c.contacto||'',telefono:c.telefono||''}));
    const prompt=`Sos el asistente de una empresa uruguaya de telecomunicaciones (fibra óptica, CCTV, cableado estructurado, control de acceso, redes). Leé este mensaje de WhatsApp de un cliente y armá un ticket de servicio.

Clientes registrados (JSON): ${JSON.stringify(clis).slice(0,60000)}

Mensaje:
"""
${txt.slice(0,8000)}
"""

Respondé solo con un objeto JSON con estas claves:
{"clienteId": el id de un cliente registrado si el nombre, el contacto o el teléfono coinciden claramente; si no, null,
 "clienteNuevo": {"nombre": "...", "telefono": "..."} si no coincide con ninguno registrado (tomá nombre y teléfono del mensaje si aparecen), o null,
 "tipo": uno de "emergencia", "instalacion", "relevamiento", "mantenimiento", "consulta" (emergencia = algo dejó de funcionar y urge: cámaras caídas, sin internet, alarma, acceso trabado),
 "titulo": resumen de hasta 8 palabras,
 "descripcion": qué pasa o qué pide, en 1 a 3 oraciones,
 "obra": dirección o lugar si lo menciona, si no ""}`;
    try{
      const r=await SAMPLE.json(prompt,{modelTier:'quick'});
      if(r&&typeof r==='object'){
        if(r.clienteId&&D.clientes[r.clienteId])draft.clienteId=String(r.clienteId);
        else if(r.clienteNuevo&&r.clienteNuevo.nombre)newCli={nombre:String(r.clienteNuevo.nombre),telefono:String(r.clienteNuevo.telefono||'')};
        if(TKTK[r.tipo])draft.tipo=r.tipo;
        if(r.titulo)draft.titulo=String(r.titulo).slice(0,120);
        if(r.descripcion)draft.descripcion=String(r.descripcion);
        if(r.obra)draft.obra=String(r.obra);
      }
    }catch(e){
      if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))SAMPLE=null;
      toast(e&&e.code==='rate_limited'?'Claude está ocupado. Completá el ticket a mano.':'No se pudo leer con Claude. Completá el ticket a mano.');
    }
  }
  openSheet('tk',null,{draft,newCli});SH.dirty=true;toast('Revisá el ticket y guardalo');
}

function techsHtml(sel=[]){

async function techSearch(inp){
  const q=inp.value.trim();if(!USER||!q)return;
  const hits=await USER.search(q);if(inp.value.trim()!==q||!hits.length)return;
  hits.forEach(h=>{NAMES[h.id]={name:h.name||'',av:h.avatarUrl||''}});
  const sel=[...document.querySelectorAll('#techs input[name=tec]:checked')].map(i=>i.value);if(!sel.includes(hits[0].id))sel.push(hits[0].id);
  const box=$('#techs');if(box)box.outerHTML=techsHtml(sel).replace(/<input type="search"[\s\S]*$/,'');
}
function gcalLink(j,c){
  const s=new Date((j.fecha||today())+'T'+(j.hora||'09:00')),e=new Date(s.getTime()+(n0(j.duracion)||1)*36e5);
  const f=x=>localISO(x).slice(0,19).replace(/[-:]/g,'');
  const loc=[j.obra||c?.direccion,c?.departamento].filter(Boolean).join(', ');
  const det=[c?.contacto&&('Contacto: '+c.contacto),c?.telefono&&('Tel: '+c.telefono),j.notas].filter(Boolean).join('\n');
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent((c?.nombre?c.nombre+' · ':'')+(j.titulo||'Trabajo'))}&dates=${f(s)}/${f(e)}&ctz=${TZ}&details=${encodeURIComponent(det)}&location=${encodeURIComponent(loc)}`;
}

}

async function saveTrab(close=true,estado){
  const v=readForm(TRF()),err=$('#shErr');
  if(!v.titulo&&!v.clienteId){err.textContent='Poné qué trabajo es o elegí el cliente.';err.hidden=false;return}
  v.duracion=n0(v.duracion)||1;
  v.tecnicos=[...document.querySelectorAll('#techs input[name=tec]:checked')].map(i=>i.value);
  const inf=$('#f_informe'),mat=$('#f_materiales');if(inf)v.informe=inf.value;if(mat)v.materiales=mat.value;if(TJ&&TJ._ms)v.matStock=msClean(TJ._ms);if(TJ&&TJ._ck)v.checklist=TJ._ck.map(x=>({t:x.t,ok:!!x.ok}));
  ['tipoTrabajo','llegada','salida','pendientes'].forEach(k=>{const e=$('#f_'+k);if(e)v[k]=e.value});
  if(estado)v.estado=estado;
  if(estado==='en_curso'&&!v.llegada)v.llegada=hhmm();
  if(estado==='terminado'&&!v.salida)v.salida=hhmm();
  const base=SH.id?{...D.trabajos[SH.id]}:{creado:Date.now(),ticketId:SH.preset?.tk||'',fotos:[],planos:[]};
  const j={...base,...v,actualizado:Date.now()};
  if(j.estado==='terminado'&&!j.terminadoEn)j.terminadoEn=Date.now();
  const id=SH.id||uid();await put('trabajos',id,j);D.trabajos[id]=j;
  if(invOn()&&((j.matStock||[]).length||arr('movimientos').some(x=>x.trabajoId===id)))await msSync(id,j);
  if(j.tareaId&&D.tareas[j.tareaId]){const tt=D.tareas[j.tareaId],ne=j.estado==='terminado'?'hecha':j.estado==='en_curso'?'en_curso':tt.estado;if(ne!==tt.estado){D.tareas[j.tareaId]={...tt,estado:ne,hechaEn:ne==='hecha'?Date.now():0,actualizado:Date.now()};await put('tareas',j.tareaId,D.tareas[j.tareaId]);await pryAvSync(tt.proyectoId)}}
  const t=j.ticketId&&D.tickets[j.ticketId];
  if(t){let ne=null;const te=t.estado||'nuevo';
    if(j.estado==='terminado'&&tkOpen(t))ne='resuelto';
    else if(j.estado==='en_curso'&&['nuevo','agendado'].includes(te))ne='en_curso';
    else if(j.estado==='programado'&&te==='nuevo')ne='agendado';
    if(ne)await put('tickets',j.ticketId,{...t,estado:ne,resueltoEn:ne==='resuelto'?Date.now():n0(t.resueltoEn),actualizado:Date.now()});}
  if(close){toast(SH.id?'Trabajo guardado':'Trabajo agendado');closeSheet()}
  else{openSheet('trab',id);toast(j.estado==='terminado'?'Trabajo terminado':'Trabajo en curso')}
}

async function shrink(f){
  if(f.size<1.5e6||!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  try{const bmp=await createImageBitmap(f);const s=Math.min(1,2000/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));return b&&b.size<f.size?b:f}catch(e){return f}
}
function upErr(e){const c=e&&e.code;return c==='too_large'?'El archivo supera los 20 MB.':c==='unsupported_type'?'Formato no soportado. Usá JPG, PNG o PDF.':c==='quota_or_state'?'Se llenó el espacio de archivos del CRM.':c==='rate_limited'?'Demasiadas subidas seguidas. Esperá un momento.':'No se pudo subir el archivo.'}

}
async function onUpload(inp){
  if(inp.dataset.up==='pfoto'){await portalUpload(inp);return}
  if(await planosUpload(inp))return;
  if(!AS){toast('Necesitás permiso de edición para subir archivos.');return}
  const files=[...inp.files];const kind=inp.dataset.up;if(!files.length||(kind!=='logo'&&!SH?.id))return;
  const busy=kind==='cliplano'?$('#cliBusy'):$('#upBusy');
  if(busy){busy.hidden=false;busy.textContent=`Subiendo ${files.length} archivo${files.length>1?'s':''}…`}
  const out=[];
  for(const f of files){
    try{const blob=f.type.startsWith('image/')?await shrink(f):f;
      let type=blob.type||f.type;if(!type&&/\.pdf$/i.test(f.name))type='application/pdf';
      const r=await AS.upload(blob,type?{type}:undefined);
      out.push({id:r.id,name:f.name||'archivo',type:r.contentType,at:Date.now(),by:ME||''});
    }catch(e){toast(upErr(e))}
  }
  inp.value='';if(busy)busy.hidden=true;if(!out.length)return;
  try{
    if(kind==='logo'){await saveCfg({...CFG,logo:{id:out[0].id,type:out[0].type}});logoData=null;loadLogoData();sr()}
    else if(kind==='cliplano'){const c=D.clientes[SH.id];if(!c)return;await patch('clientes',SH.id,{archivos:[...(c.archivos||[]),...out]});const el=$('#cliFiles');if(el)el.innerHTML=cliFilesHtml(SH.id)}
    else{const j=D.trabajos[SH.id];if(!j)return;const key=kind==='foto'?'fotos':'planos';await patch('trabajos',SH.id,{[key]:[...(j[key]||[]),...out]});refreshJob()}
    toast(out.length>1?`${out.length} archivos subidos`:'Archivo subido');
  }catch(e){handleErr(e)}
}

  const jobs=arr('trabajos').filter(j=>days.includes(j.fecha)&&(!calTec||(j.tecnicos||[]).includes(calTec)));
  const acts=arr('actividades').filter(a=>!a.hecha&&a.fecha&&days.includes(a.fecha.slice(0,10))&&(!calTec||a.responsable===calTec));
  const t=today();
  const head=`<div class="vhead"><div><h1>Calendario</h1><p class="sub">${fdate(days[0])} al ${fdateL(days[6])} · ${jobs.length} trabajo${jobs.length===1?'':'s'}</p></div>
    <div class="tools calnav"><button class="btn" data-act="cal:-7" aria-label="Semana anterior">‹</button><button class="btn" data-act="cal:0">Hoy</button><button class="btn" data-act="cal:7" aria-label="Semana siguiente">›</button>

      <div class="dayb">${dj.map(evHtml).join('')}${da.map(a=>`<div class="ev fu" role="button" tabindex="0" data-open="act:${a.id}"><span class="h">${esc(a.fecha.slice(11,16))} · seguimiento</span><b>${esc(a.titulo||'')}</b></div>`).join('')}</div>

    <p class="hint" style="margin-top:12px">El color del borde marca la prioridad del ticket: rojo P1, naranja P2, azul P3, gris P4. Cada trabajo tiene un botón para copiarlo a Google Calendar.</p>`;

/* ---------- facturación ---------- */
const FST={pendiente:['Pendiente','t-acc'],parcial:['Cobro parcial','t-warn'],cobrada:['Cobrada','t-ok'],vencida:['Vencida','t-bad'],anulada:['Anulada','t-none']};
function factCalc(f){const t=calcQ(f),pag=sum(f.cobros||[],c=>n0(c.monto));return{...t,pagado:pag,saldo:Math.max(0,t.total-pag)}}
function factState(f){if(f.anulada)return'anulada';const c=factCalc(f);if(c.total>0&&c.pagado>=c.total-0.5)return'cobrada';if(f.vence&&f.vence<today())return'vencida';return c.pagado>0?'parcial':'pendiente'}
const mesNombre=ym=>{const s=new Date(ym+'-15T12:00').toLocaleDateString('es-UY',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)};
function vFact(){
  const all=arr('facturas'),live=all.filter(f=>!f.anulada),ym=today().slice(0,7);
  const porCobrar=sum(live,f=>conv(factCalc(f).saldo,f.moneda,repMon));
  const venc=live.filter(f=>factState(f)==='vencida');
  const cobradoMes=sum(live,f=>sum((f.cobros||[]).filter(c=>(c.fecha||'').startsWith(ym)),c=>conv(c.monto,f.moneda,repMon)));
  const head=`<div class="vhead"><div><h1>Facturación</h1><p class="sub">El comprobante legal (CFE) lo emitís en tu proveedor; acá llevás el número de CFE, los cobros y los saldos.</p></div>
    <div class="tools"><div class="seg" role="group" aria-label="Sección">${[['facturas','Facturas'],['abonos','Abonos del mes']].map(([k,n])=>`<button class="${faTab===k?'on':''}" data-act="fat:${k}">${n}</button>`).join('')}</div></div></div>
    <div class="kpis"><div class="kpi"><span>Por cobrar</span><b>${money(porCobrar,repMon)}</b><small>${live.filter(f=>factCalc(f).saldo>0.5).length} con saldo</small></div>
    <div class="kpi"><span>Vencido</span><b>${money(sum(venc,f=>conv(factCalc(f).saldo,f.moneda,repMon)),repMon)}</b><small>${venc.length} vencida${venc.length===1?'':'s'}</small></div>
    <div class="kpi"><span>Cobrado este mes</span><b>${money(cobradoMes,repMon)}</b><small>según cobros registrados</small></div>
    <div class="kpi"><span>Sin número de CFE</span><b>${live.filter(f=>!f.cfe).length}</b><small>falta cargar el del proveedor</small></div></div>`;
  if(faTab==='abonos')return head+vAbonos();
  if(!all.length)return head+empty('Sin facturas','Creá una factura desde un presupuesto aceptado, un ticket resuelto o con las de abonos del mes. Después cargás el número de CFE de tu proveedor y registrás los cobros.','fact','+ Nueva factura');
  const l=all.filter(f=>!Q||qn([f.numero,f.cfe,cliName(f.clienteId)].join(' ')).includes(qn(Q))).sort((a,b)=>(b.numero||'').localeCompare(a.numero||''));
  return head+`<div class="tablewrap"><table><thead><tr><th>Nº</th><th>CFE</th><th>Cliente</th><th>Fecha</th><th>Vence</th><th class="n">Total</th><th class="n">Saldo</th><th>Estado</th></tr></thead><tbody>${l.map(f=>{const c=factCalc(f),s=factState(f);
    return`<tr data-open="fact:${f.id}" tabindex="0"><td class="code">${esc(f.numero)}</td><td class="code">${esc(f.cfe||'—')}</td><td>${esc(cliName(f.clienteId)||'—')}${f.tipo==='abono'?' <span class="tag t-abo">Abono</span>':''}</td><td>${fdate(f.fecha)}</td><td>${fdate(f.vence)}</td><td class="n">${money(c.total,f.moneda)}</td><td class="n">${s==='anulada'?'—':money(c.saldo,f.moneda)}</td><td><span class="tag ${FST[s][1]}">${FST[s][0]}</span></td></tr>`}).join('')}</tbody></table></div>`;

async function genAbonos(){

function fld(f,v,pre='f_'){
  const id=pre+f.k;v=v??f.def??'';
  let inp;
  if(f.t==='select')inp=`<select id="${id}">${opts(f.o,v)}</select>`;
  else if(f.t==='person')inp=`<select id="${id}">${opts(peopleOpts(v),v)}</select>`+(USER?`<input type="search" class="psearch" id="${id}_q" data-psearch="${id}" placeholder="Buscar compañero por nombre" aria-label="Buscar compañero">`:'');
  else if(f.t==='textarea')inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else if(f.t==='checkbox')return`<label class="fld chk ${f.w||''}"><input type="checkbox" id="${id}"${v?' checked':''}><span>${f.l}</span></label>`;
  else if(f.t==='hidden')return`<input type="hidden" id="${id}" value="${esc(v)}">`;
  else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.step?` step="${f.step}"`:''}${f.t==='number'?' min="0" inputmode="decimal"':''}${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
  return`<label class="fld ${f.w||''}" for="${id}"><span>${f.l}</span>${inp}</label>`;
}
function readForm(fields,pre='f_'){
  const o={};for(const f of fields){const el=document.getElementById(pre+f.k);if(!el)continue;
    let x=el.type==='checkbox'?el.checked:el.value;if(f.t==='number')x=x===''?0:Number(x);if(typeof x==='string')x=x.trim();o[f.k]=x}
  return o;
}

async function act(a,el){

  try{
  if(await teamAct(k,el))return;
  if(await planAct(k,el,arg))return;
  if(await obrasAct(k,el,arg))return;
  if(await planosAct(k,el,arg))return;
  if(await modulosAct(k,el,arg))return;
  if(await invAct(k,el,arg))return;
  if(await obraAct(k,el,arg))return;
  if(await rubAct(k,el,arg))return;
  if(await cuotaAct(k,el,arg))return;
  if(await pedidoAct(k,el))return;
  switch(k){
    case'close':
      if(SH&&SH.dirty&&!SH.warned){SH.warned=true;toast('Tenés cambios sin guardar. Cerrá de nuevo para descartarlos.');return}
      closeSheet();break;
    case'pview':pView=arg;lsSet('crm.pview',arg);sr();break;
    case'theme':themePref=arg;lsSet('crm.theme',arg);applyTheme();sr();toast(arg==='auto'?'Automático: claro de 7 a 19 h, oscuro el resto':arg==='dark'?'Modo oscuro':'Modo claro');break;
    case'rmlogo':{const old=CFG.logo;const c={...CFG};delete c.logo;await saveCfg(c);logoData=null;sr();if(old&&AS)AS.delete(old.id).catch(()=>{});toast('Logo quitado');break}
    case'tkf':tkFilter=arg;sr();break;
    case'fat':faTab=arg;sr();break;
    case'campo':campoDay=+arg;sr();break;
    case'campoall':campoAll=!campoAll;sr();break;
    case'cal':{if(+arg===0)calStart=monday(new Date());else{const d=new Date(calStart);d.setDate(d.getDate()+(+arg));calStart=d}sr();break}
    case'wa':openSheet('wa');break;
    case'lb':{const lb=$('#lightbox');lb.querySelector('img').src=blobUrl(a.slice(3));lb.hidden=false;break}
    case'lbclose':$('#lightbox').hidden=true;$('#lightbox img').removeAttribute('src');break;
    case'jstate':await saveTrab(false,arg);break;
    case'rmfoto':case'rmfile':{
      if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.textContent='¿Quitar?';return}
      const j=D.trabajos[SH.id];if(!j)return;const key=k==='rmfoto'?'fotos':'planos';const list=[...(j[key]||[])];const [gone]=list.splice(+arg,1);
      await patch('trabajos',SH.id,{[key]:list});armed=null;refreshJob();if(gone&&AS)AS.delete(gone.id).catch(()=>{});toast('Quitado');break}
    case'rmcfile':{
      if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.textContent='¿Quitar?';return}
      const c=D.clientes[SH.id];if(!c)return;const list=[...(c.archivos||[])];const [gone]=list.splice(+arg,1);
      await patch('clientes',SH.id,{archivos:list});armed=null;const ce=$('#cliFiles');if(ce)ce.innerHTML=cliFilesHtml(SH.id);if(gone&&AS)AS.delete(gone.id).catch(()=>{});toast('Quitado');break}
    case'addcobro':{
      const m=n0($('#co_monto').value);if(!m){$('#co_monto').focus();return}

    <div class="sigpad"><canvas id="sigCv" aria-label="Firmá acá con el dedo"></canvas><span class="sigline">Firmá acá</span></div><p class="err" id="sigErr" hidden></p>
    <div class="actions"><button class="btn ghost" data-act="sigclear">Borrar</button><span class="sp" style="flex:1"></span><button class="btn" data-act="sigclose">Cancelar</button><button class="btn pri" data-act="sigsave">Guardar firma</button></div></div>`;
  w.hidden=false;

  const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
  SIG={cv,g,drawn:false,last:null};
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);SIG.last=pos(e);g.beginPath();g.arc(SIG.last[0],SIG.last[1],1,0,7);g.fill();SIG.drawn=true};
  cv.onpointermove=e=>{if(!SIG.last)return;const p=pos(e);g.beginPath();g.moveTo(SIG.last[0],SIG.last[1]);g.lineTo(p[0],p[1]);g.stroke();SIG.last=p};

async function dataUrlOf(id,max=1100){

    if(!u&&SB){const {data}=await SB.storage.from(BUCKET).createSignedUrl(id,600);u=data&&data.signedUrl}
    if(!u)return'';const b=await (await fetch(u)).blob();

    const bmp=await createImageBitmap(b);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.8);
  }catch(e){return''}
}

function tfMatch(j){
  const t=j.ticketId&&D.tickets[j.ticketId];
  if(TF.cli&&j.clienteId!==TF.cli)return false;
  if(TF.pry&&(j.proyectoId||t?.proyectoId)!==TF.pry)return false;
  if(TF.tec&&!(j.tecnicos||[]).includes(TF.tec))return false;
  if(TF.tipo&&(j.tipoTrabajo||'')!==TF.tipo)return false;
  if(TF.est==='firmado'&&!(j.firma&&j.firma.id))return false;
  if(TF.est&&TF.est!=='firmado'&&j.estado!==TF.est)return false;
  if(TF.desde&&(j.fecha||'')<TF.desde)return false;
  if(TF.hasta&&(j.fecha||'')>TF.hasta)return false;
  if(TF.q){const s=qn([j.numero,j.titulo,cliName(j.clienteId),pryName(j.proyectoId),j.obra,j.informe,j.materiales,j.pendientes,t?.numero,t?.titulo].join(' '));if(!s.includes(qn(TF.q)))return false}
  return true;
}

function planStats(p){
  const pts=p.puntos||[],done=pts.filter(x=>x.estado==='instalado'||x.estado==='probado').length;
  const porTipo={};pts.forEach(x=>{porTipo[x.tipo]=(porTipo[x.tipo]||0)+1});
  const metros={};(p.recorridos||[]).forEach(r=>{metros[r.tipo]=(metros[r.tipo]||0)+routeMeters(p,r)});
  return{total:pts.length,done,pct:pts.length?Math.round(done/pts.length*100):0,porTipo,metros};
}
function routeMeters(p,r){
  if(!p.escala||!p.escala.mpp||!p.img)return 0;const W=p.img.w,H=p.img.h,v=r.v||[];let s=0;
  for(let i=1;i<v.length;i++){const dx=(v[i][0]-v[i-1][0])*W,dy=(v[i][1]-v[i-1][1])*H;s+=Math.hypot(dx,dy)}
  return s*p.escala.mpp;
}

let PDFJS=null;
async function loadPdfJs(){
  if(PDFJS)return PDFJS;
  const m=await import(new URL('vendor/pdfjs/pdf.min.js',location.href).href);
  m.GlobalWorkerOptions.workerSrc=new URL('vendor/pdfjs/pdf.worker.min.js',location.href).href;
  PDFJS=m;return m;
}
async function pdfToImages(file,maxPages=8){
  const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];for(let i=1;i<=Math.min(doc.numPages,maxPages);i++){
    const page=await doc.getPage(i);const v1=page.getViewport({scale:1});const sc=Math.min(4,2600/Math.max(v1.width,v1.height));const vp=page.getViewport({scale:sc});
    const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    out.push({blob:await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)),w:cv.width,h:cv.height,page:i,pages:doc.numPages});
  }return out;
}
async function imageToPlan(file){
  const bmp=await createImageBitmap(file);const s=Math.min(1,3000/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);
  return{blob:await new Promise(r=>cv.toBlob(r,'image/jpeg',.86)),w:cv.width,h:cv.height};
}
async function uploadPlano(inp,replaceId){

    const hojas=isPdf?await pdfToImages(f):[await imageToPlan(f)];
    let orig=null;if(isPdf){say('Guardando el PDF original…');const r=await AS.upload(f,{type:'application/pdf'});orig={id:r.id,name:f.name,type:'application/pdf'}}

      say(hojas.length>1?`Subiendo hoja ${h.page} de ${hojas.length}…`:'Subiendo el plano…');

      if(replaceId){const p=D.planos[replaceId];const vs=[...(p.versiones||[]),{img:p.img,original:p.original||null,at:p.actualizado||p.creado||Date.now(),by:p.actualizadoPor||''}];
        await put('planos',replaceId,{...p,img,original:orig,versiones:vs,actualizado:Date.now(),actualizadoPor:ME||''});ids.push(replaceId);break}
      const pry=D.proyectos[inp.dataset.pry]||{};const id=uid();
      await put('planos',id,{nombre:hojas.length>1?`${base} · hoja ${h.page}`:base,proyectoId:inp.dataset.pry||'',clienteId:pry.clienteId||'',img,original:orig,versiones:[],escala:null,puntos:[],recorridos:[],creado:Date.now(),actualizado:Date.now(),por:ME||''});ids.push(id);
    }

    toast(replaceId?'Versión nueva del plano guardada. Los puntos se mantienen.':hojas.length>1?`${hojas.length} hojas subidas`:'Plano subido');
    if(replaceId){openPlan(replaceId)}else{if(SH&&SH.type==='pry')openSheet('pry',SH.id);if(ids[0])openPlan(ids[0])}

}

function findProd(kws,unidad){const ps=arr('productos').filter(p=>unidad==='metro'?p.unidad==='metro':p.unidad!=='metro');for(const k of kws){const q=qn(k);const hit=ps.find(p=>qn(p.nombre||'').includes(q));if(hit)return hit}return null}
function lineFor(kws,fallback,cant,unidadDef,mon){const p=findProd(kws,unidadDef);return{desc:p?p.nombre:fallback,cant:Math.round(cant*100)/100,unidad:p?.unidad||unidadDef,precio:p?Math.round(conv(p.precio,p.moneda,mon)*100)/100:0}}
function quoteDraft({clienteId,proyectoId,lineas,notas}){
  const mon=defMon();return{numero:'',oportunidadId:'',proyectoId:proyectoId||'',clienteId:clienteId||'',fecha:today(),validez:15,moneda:mon,estado:'borrador',iva:true,descuento:0,lineas:lineas.length?lineas:[{desc:'',cant:1,unidad:'unidad',precio:0}],condiciones:CFG.condiciones||'',notas:notas||''}
}
function planToLines(p,desp){
  const mon=defMon(),s=planStats(p),out=[];
  PTIPOS.forEach(t=>{const n=s.porTipo[t.k];if(n)out.push(lineFor(t.kw,t.n,n,'unidad',mon))});
  RTIPOS.forEach(t=>{const m=s.metros[t.k];if(m)out.push(lineFor(t.kw,t.n+' (metros)',Math.ceil(m*(1+desp/100)),'metro',mon))});
  return out;
}

async function saveRel(close=true){
  const v=readForm(RELF()),e=$('#shErr');if(!v.clienteId&&!v.titulo){if(e){e.textContent='Poné qué se releva o elegí el cliente.';e.hidden=false}else toast('Poné qué se releva o elegí el cliente.');return false}
  const base=SH.id?{...D.relevamientos[SH.id]}:{creado:Date.now(),fotos:[]};const q={...(base.q||{})};
  (RSERV[v.servicio]||[]).forEach(f=>{const el=document.getElementById('rq_'+f.k);if(el)q[f.k]=el.type==='checkbox'?el.checked:(f.t==='number'?n0(el.value):el.value)});
  const id=SH.id||uid();const r={...base,...v,q,actualizado:Date.now()};await put('relevamientos',id,r);D.relevamientos[id]=r;
  if(close){toast('Relevamiento guardado');if(!SH.id)openSheet('rel',id);else closeSheet()}return id;
}
function relToLines(r){
  const mon=defMon(),out=[];
  (RSERV[r.servicio]||[]).forEach(f=>{const v=(r.q||{})[f.k];if(!f.kw||!n0(v))return;const cant=f.qty||n0(v);out.push(lineFor(f.kw,f.l.replace(/ estimad[oa]s? \(m\)/,'').replace(/ \(m\)/,''),cant,f.u||'unidad',mon))});
  if(n0(r.jornales))out.push(lineFor(['jornal','mano de obra'],'Mano de obra (jornal)',n0(r.jornales),'jornal',mon));
  if(r.proyectoId){pryPlanos(r.proyectoId).forEach(p=>planToLines(p,10).forEach(l=>{const ex=out.find(o=>o.desc===l.desc);if(ex)ex.cant=Math.max(ex.cant,l.cant);else out.push(l)}))}
  return out;
}
function cliRelHtml(cid,pid){
  const l=arr('relevamientos').filter(r=>pid?r.proyectoId===pid:r.clienteId===cid).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return`<section class="rel"><h3>Relevamientos</h3>${l.map(r=>`<div class="item link" role="button" tabindex="0" data-open="rel:${r.id}"><span>${fdate(r.fecha)}</span><span class="grow">${esc(r.titulo||r.servicio||'Relevamiento')}</span><span class="muted">${esc(r.servicio||'')}</span></div>`).join('')||'<p class="muted" style="margin:0">Sin relevamientos.</p>'}
    ${readonly?'':`<div><button class="btn" data-new="rel" data-cli="${esc(cid||'')}"${pid?` data-pry="${esc(pid)}"`:''}>+ Relevamiento</button></div>`}</section>`;
}

/* --- acciones --- */
async function planosAct(k,el,arg){
  switch(k){
    case'plan':openPlan(arg);return true;
    case'pvclose':closePlan();return true;
    case'pvmode':PV.mode=arg;PV.sel=null;PV.draft=null;PV.cal=null;renderPv();return true;
    case'pvtipo':PV.tipo=arg;renderPv();return true;
    case'pvrtipo':PV.rtipo=arg;renderPv();return true;
    case'pvundo':PV.draft=(PV.draft||[]).slice(0,-1);renderPv();return true;
    case'pvend':{const d=PV.draft||[];if(d.length<2){toast('Marcá al menos dos puntos del recorrido.');return true}let nid;mutPlan(p=>{nid=uid();p.recorridos=[...(p.recorridos||[]),{id:nid,tipo:PV.rtipo,v:d,notas:'',creado:Date.now()}]});PV.draft=null;PV.sel={t:'rt',id:nid};renderPv();const p=curPlan();const m=routeMeters(p,p.recorridos.find(r=>r.id===nid));toast(m?`Recorrido de ${fmtM(m)}`:'Recorrido guardado. Calibrá la escala para ver los metros.');return true}
    case'pvz':{const st=$('#pvStage');if(arg==='fit')fitPv();else zoomAt(arg==='in'?1.3:1/1.3,st.clientWidth/2,st.clientHeight/2);return true}
    case'pvcal':{const m=n0($('#pv_m').value);const c=PV.cal;if(!m||!c||c.length<2){toast('Escribí los metros.');return true}const p=curPlan();const px=Math.hypot((c[1][0]-c[0][0])*p.img.w,(c[1][1]-c[0][1])*p.img.h);if(px<5){toast('Los dos puntos están demasiado cerca.');return true}
      mutPlan(q=>{q.escala={mpp:m/px,at:Date.now()}});PV.cal=null;PV.mode='ver';renderPv();toast('Escala guardada: ya se ven los metros de los recorridos.');return true}
    case'pvdel':{if(!PV.sel)return true;if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='¿Seguro? Tocá de nuevo';return true}armed=null;const s=PV.sel;mutPlan(p=>{if(s.t==='pt')p.puntos=(p.puntos||[]).filter(x=>x.id!==s.id);else p.recorridos=(p.recorridos||[]).filter(x=>x.id!==s.id)});PV.sel=null;drawPv();renderSide();return true}
    case'pvrename':{const p=curPlan();const box=$('#pvSide');box.insertAdjacentHTML('beforeend',`<div class="actions" style="margin-top:8px"><input id="pv_name" type="text" value="${esc(p.nombre||'')}" aria-label="Nombre del plano"><button class="btn pri" data-act="pvrenameok">Guardar</button></div>`);$('#pv_name').focus();return true}
    case'pvrenameok':{const n=($('#pv_name').value||'').trim();if(!n)return true;mutPlan(p=>{p.nombre=n});renderPv();return true}
    case'pvdelplan':{if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='Se borra el plano con sus puntos. Tocá de nuevo';return true}armed=null;const id=PV.id;PV.dirty=false;const w=$('#pv');if(w)w.hidden=true;PV=null;await remove('planos',id);toast('Plano borrado');if(SH&&SH.type==='pry')openSheet('pry',SH.id);else document.body.style.overflow='';return true}
    case'pv2pres':{await flushPlan();const p=curPlan();const lines=planToLines(p,10);if(!lines.length){toast('Marcá puntos o recorridos en el plano primero.');return true}
      const q=quoteDraft({clienteId:p.clienteId,proyectoId:p.proyectoId,lineas:lines});closePlan();openSheet('pres',null,{copy:q});SH.dirty=true;
      toast(`Presupuesto armado con ${lines.length} línea${lines.length>1?'s':''} (metros +10 % de desperdicio). Revisá los precios.`);return true}
    case'rel2pres':{const id=await saveRel(false);if(!id)return true;const r=D.relevamientos[id];const lines=relToLines(r);
      const q=quoteDraft({clienteId:r.clienteId,proyectoId:r.proyectoId,lineas:lines,notas:r.notas});openSheet('pres',null,{copy:q});SH.dirty=true;
      toast(lines.length?`Presupuesto armado con ${lines.length} línea${lines.length>1?'s':''}. Revisá los precios.`:'Presupuesto vacío: cargá cantidades en el relevamiento.');return true}
  }
  return false;
}
async function planosUpload(inp){
  const k=inp.dataset.up;
  if(k==='planoint'){await uploadPlano(inp);return true}
  if(k==='planover'){await uploadPlano(inp,PV&&PV.id);return true}
  if(k==='ptfoto'){const f=inp.files&&inp.files[0];if(!f||!PV||!PV.sel)return true;try{const b=await shrink(f);const up=await AS.upload(b,{type:b.type||f.type});const sel=PV.sel;mutPlan(p=>{const q=(p.puntos||[]).find(x=>x.id===sel.id);if(q)q.fotos=[...(q.fotos||[]),{id:up.id,name:f.name||'foto',type:up.contentType,at:Date.now(),by:ME||''}]});await flushPlan();toast('Foto agregada al punto')}catch(e){toast(upErr(e))}inp.value='';return true}
  if(k==='relfoto'){const files=[...(inp.files||[])];if(!files.length||!SH||!SH.id)return true;const busy=$('#upBusy');if(busy){busy.hidden=false;busy.textContent='Subiendo fotos…'}const out=[];
    for(const f of files){try{const b=await shrink(f);const up=await AS.upload(b,{type:b.type||f.type});out.push({id:up.id,name:f.name||'foto',type:up.contentType,at:Date.now(),by:ME||''})}catch(e){toast(upErr(e))}}
    if(busy)busy.hidden=true;inp.value='';if(out.length){const r=D.relevamientos[SH.id];await patch('relevamientos',SH.id,{fotos:[...(r.fotos||[]),...out]});const el=$('#relFotos');if(el)el.innerHTML=photosHtmlRO(D.relevamientos[SH.id].fotos);toast('Fotos agregadas')}return true}
  return false;
}

const r2=x=>Math.round((Number(x)||0)*100)/100;

/* --- Técnicos --- */
let TP={per:'mes'};
function tpRange(){
  const d=new Date(),iso=x=>localISO(x).slice(0,10);
  if(TP.per==='semana'){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+6);return[iso(s),iso(e),'Esta semana']}
  if(TP.per==='mesant'){const s=new Date(d.getFullYear(),d.getMonth()-1,1),e=new Date(d.getFullYear(),d.getMonth(),0);return[iso(s),iso(e),s.toLocaleDateString('es-UY',{month:'long',year:'numeric'})]}
  if(TP.per==='rango'&&TP.desde&&TP.hasta)return[TP.desde,TP.hasta,`${fdate(TP.desde)} al ${fdate(TP.hasta)}`];
  const s=new Date(d.getFullYear(),d.getMonth(),1),e=new Date(d.getFullYear(),d.getMonth()+1,0);return[iso(s),iso(e),s.toLocaleDateString('es-UY',{month:'long',year:'numeric'})];
}
const hm=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])+(+m[2])/60:null};
function jobHours(j){const a=hm(j.llegada),b=hm(j.salida);if(a==null||b==null)return null;let h=b-a;if(h<0)h+=24;return h>16?null:h}
const fmtH=h=>{const t=Math.round((h||0)*60);return`${Math.floor(t/60)} h${t%60?' '+String(t%60).padStart(2,'0'):''}`};
function tecList(){return Object.keys(MEMBERS).filter(id=>!['cliente','pendiente'].includes(MEMBERS[id].role)).sort((a,b)=>personName(a).localeCompare(personName(b),'es'))}
function tecFicha(id){return D.tecnicos&&D.tecnicos[id]||{}}
function tecStats(id,[desde,hasta]){
  const f=tecFicha(id),jornada=n0(f.jornada)||8;
  const jobs=arr('trabajos').filter(j=>(j.tecnicos||[]).includes(id)&&j.fecha&&j.fecha>=desde&&j.fecha<=hasta);
  const porDia={};let sinHora=0;
  jobs.forEach(j=>{const h=jobHours(j);if(h==null){if(j.estado==='terminado')sinHora++;return}porDia[j.fecha]=(porDia[j.fecha]||0)+h});
  let normales=0,extra=0;
  Object.entries(porDia).forEach(([dia,h])=>{const dom=new Date(dia+'T12:00').getDay()===0;if(dom){extra+=h;return}normales+=Math.min(h,jornada);extra+=Math.max(0,h-jornada)});
  const term=jobs.filter(j=>j.estado==='terminado'),sinFirma=term.filter(j=>!(j.firma&&j.firma.id)).length;
  const vh=n0(f.valorHora),ve=n0(f.valorExtra)||r2(vh*1.5);
  return{jobs,dias:Object.keys(porDia).length,normales,extra,horas:normales+extra,term:term.length,sinFirma,sinHora,prom:term.length?(normales+extra)/term.length:0,vh,ve,total:r2(normales*vh+extra*ve),moneda:f.moneda||'UYU',jornada};
}

    case'prytab':PRYTAB=arg;sr();return true;

    case'tprango':TP.desde=$('#tp_desde').value;TP.hasta=$('#tp_hasta').value;if(TP.desde&&TP.hasta&&TP.desde>TP.hasta){const x=TP.desde;TP.desde=TP.hasta;TP.hasta=x}sr();return true;
    case'tec':openSheet('tec',arg);return true;
    case'liqcsv':{const rg=tpRange();saveFile(`Liquidación ${rg[0]} a ${rg[1]}.csv`,csv([['Técnico','Email','Días','Horas normales','Horas extra','Valor hora','Valor extra','Moneda','Total','Visitas cerradas','Sin firma'],
      ...liqRows().map(({id,s})=>[personName(id).replace(' (vos)',''),MEMBERS[id]?.email||'',s.dias,r2(s.normales),r2(s.extra),s.vh,s.ve,s.moneda,s.total,s.term,s.sinFirma])]));return true}
    case'liqdoc':{const rg=tpRange();await saveFile(`Liquidación ${rg[0]} a ${rg[1]}.html`,liqDoc());return true}
    case'cfesave':{const prov=$('#cf_prov').value,b={o:ORG,prov,amb:$('#cf_amb')?.value||'testing',k:($('#cf_key')?.value||'').trim(),s:($('#cf_sec')?.value||'').trim(),loc:($('#cf_local')?.value||'').trim(),rub:($('#cf_rubro')?.value||'').trim()};
      el.disabled=true;const {error}=await SB.rpc('cfe_set',b);el.disabled=false;if(error){toast(/sin_permiso/.test(error.message)?'Solo el dueño o un administrador puede cambiar esto.':'No se pudo guardar.');return true}
      toast('Facturación electrónica guardada');CFEI=undefined;await loadCfe();return true}
    case'cfetest':{el.disabled=true;const d=await cfeCall('probar');el.disabled=false;toast(d.ok?'Conexión con Fixed correcta ✓':(d.error||'Fixed no aceptó las claves.'));return true}
    case'cfe':{
      if(!SH||SH.type!=='fact')return true;
      if(arg==='emitir'){if(SH.dirty){const id=await saveFact(false);if(!id)return true}
        if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent=CFEI.ambiente==='produccion'?'Se emite un CFE real ante DGI. Tocá de nuevo':'Emitir CFE de prueba. Tocá de nuevo';return true}armed=null}
      if(arg==='devolver'){if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='Anula la factura con una nota de crédito por el total. Tocá de nuevo';return true}armed=null}
      el.disabled=true;el.textContent='Conectando con Fixed…';
      const d=await cfeCall(arg,{factura:SH.id});
      if(d.error){el.disabled=false;el.textContent=el.dataset.orig||'Reintentar';toast(d.error);return true}
      if(d.factura){D.facturas[SH.id]=d.factura}
      toast({emitir:'CFE emitido: '+(d.factura?.cfeData?.comprobante||''),consultar:'Estado actualizado',imprimir:'PDF listo',devolver:'Nota de crédito emitida'}[arg]||'Listo');
      openSheet('fact',SH.id);return true}
    case'zx':{const n={clientes:'Clientes',articulos:'Artículos',ventas:'Ventas',lineas:'Ventas con detalle'}[arg];saveFile(`${n} para Zureo ${today()}.csv`,zureoCsv(arg));return true}
  }
  return false;
}
