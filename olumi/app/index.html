const rentOn=()=>isBoss()&&has('reportes');
const MOVT=[['entrada','Entrada (compra)'],['salida','Salida a obra'],['transf','Transferencia'],['ajuste','Ajuste por conteo'],['devol','Devolución de obra']];
const MOVK=Object.fromEntries(MOVT);
const MOVC={entrada:'t-ok',salida:'t-acc',transf:'t-none',ajuste:'t-warn',devol:'t-ok'};
const uq=p=>({metro:'m',unidad:'u'}[p&&p.unidad]||(p&&p.unidad)||'');
const fq=(x,p)=>`${r2(x).toLocaleString('es-UY',{maximumFractionDigits:2})}${uq(p)?' '+uq(p):''}`;
const deps=()=>arr('depositos').filter(d=>!d.inactivo).sort((a,b)=>(a.tipo==='vehiculo')-(b.tipo==='vehiculo')||(a.nombre||'').localeCompare(b.nombre||'','es'));
const depName=id=>(D.depositos&&D.depositos[id]?.nombre)||(id?'Depósito borrado':'—');
const depOpts=(v,blank)=>opts([...(blank?[['',blank]]:[]),...deps().map(d=>[d.id,(d.tipo==='vehiculo'?'🚐 ':'')+d.nombre])],v);
function myDep(){const v=deps().find(d=>d.tecnicoId===ME);return v?v.id:((deps().find(d=>d.tipo!=='vehiculo')||deps()[0])?.id||'')}
const invProds=()=>arr('productos').filter(p=>p.unidad!=='jornal'&&p.unidad!=='hora').sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
const prodLabel=p=>(p.nombre||'Producto')+(p.codigo?' · '+p.codigo:'');
const costoUYU=(p,c)=>conv(c??n0(p&&p.costo),p&&p.moneda,'UYU');

/* stock: suma de lo que entra a cada depósito menos lo que sale */
function stockMap(){const m={};for(const x of arr('movimientos')){const c=n0(x.cant);if(!c||!x.prodId)continue;const r=m[x.prodId]||(m[x.prodId]={});if(x.hacia)r[x.hacia]=(r[x.hacia]||0)+c;if(x.desde)r[x.desde]=(r[x.desde]||0)-c}return m}
const stockOf=(m,pid,dep)=>{const r=m[pid]||{};return dep?(r[dep]||0):Object.values(r).reduce((a,b)=>a+b,0)};
const bajoMin=(m,p)=>n0(p.stockMin)>0&&stockOf(m,p.id)<n0(p.stockMin);

/* equipos instalados */
const fdY=d=>d?new Date(d.slice(0,10)+'T12:00').toLocaleDateString('es-UY',{day:'numeric',month:'short',year:'numeric'}):'';
function eqState(e){const t=today(),lim=addDays(t,30);
  const gar=e.garantiaHasta?(e.garantiaHasta>=t?['En garantía hasta '+fdY(e.garantiaHasta),'t-ok']:['Garantía vencida','t-none']):null;
  const man=e.estado==='retirado'||!e.proxMant?null:e.proxMant<t?['Mantenimiento vencido '+fdate(e.proxMant),'t-bad']:e.proxMant<=lim?['Mantenimiento '+fdate(e.proxMant),'t-warn']:['Próx. mantenimiento '+fdY(e.proxMant),'t-none'];
  return{gar,man,vence:!!(man&&e.proxMant<=lim)}}
const eqTags=e=>{const s=eqState(e);return(e.estado==='retirado'?'<span class="tag t-none">Retirado</span>':'')+(s.gar?`<span class="tag ${s.gar[1]}">${s.gar[0]}</span>`:'')+(s.man?`<span class="tag ${s.man[1]}">${s.man[0]}</span>`:'')};
const eqName=e=>e.descripcion||D.productos[e.prodId]?.nombre||'Equipo';
const mantPend=()=>arr('equipos').filter(e=>e.estado!=='retirado'&&eqState(e).vence);

/* --- vista Inventario --- */
let INVT='stock',INVD='',INVQ='',INVMIN=false,EQF='todos';
function vInventario(){
  if(!invOn())return`<div class="vhead"><div><h1>Inventario</h1></div></div><div class="empty">${fiberArt}<h2>Inventario incluido en Pro y Empresa</h2><p>Stock por depósito y por camioneta, materiales descontados desde cada trabajo, equipos instalados con número de serie, garantía y mantenimiento preventivo.</p><button class="btn pri" data-view="plan">Ver planes</button></div>`;
  const boss=isBoss(),m=stockMap(),ds=deps(),q=qn(INVQ),mp=mantPend().length;
  const tabs=`<div class="seg invtabs" role="tablist" style="margin-bottom:14px">${[['stock','Stock'],['movimientos','Movimientos'],['equipos','Equipos'+(mp?` (${mp})`:'')],['depositos','Depósitos']].map(([k,n])=>`<button role="tab" class="${INVT===k?'on':''}" aria-selected="${INVT===k}" data-act="invtab:${k}">${n}</button>`).join('')}</div>`;
  const search=ph=>`<input type="search" class="tfq" id="inv_q" value="${esc(INVQ)}" placeholder="${ph}" aria-label="Buscar">`;
  const kpi=(n,v)=>`<div class="kpi"><span class="k">${n}</span><b class="num">${v}</b></div>`;
  const head=(sub,tools='')=>`<div class="vhead"><div><h1>Inventario</h1><p class="sub">${sub}</p></div>${tools?`<div class="tools">${tools}</div>`:''}</div>`;
  if(INVT==='depositos'){
    return head(`${ds.length} depósito${ds.length===1?'':'s'} y camioneta${ds.length===1?'':'s'}`,readonly?'':'<button class="btn" data-act="invdep:vehiculo">+ Camioneta</button><button class="btn pri" data-act="invdep:deposito">+ Depósito</button>')+tabs
      +(ds.length?`<div class="list">${ds.map(d=>{const its=Object.keys(m).filter(pid=>stockOf(m,pid,d.id)>0),val=sum(its,pid=>stockOf(m,pid,d.id)*costoUYU(D.productos[pid]));
        return`<div class="row" role="button" tabindex="0" data-open="dep:${d.id}" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><strong>${d.tipo==='vehiculo'?'🚐 ':''}${esc(d.nombre)}</strong><span class="muted">${d.tipo==='vehiculo'?'Camioneta':'Depósito'}${d.tecnicoId?' · '+esc(personName(d.tecnicoId)):''} · ${its.length} artículo${its.length===1?'':'s'} con stock</span></div>${boss?`<span class="num">${money(val,'UYU')}</span>`:''}</div>`}).join('')}</div>`
      :`<div class="empty"><h2>Sin depósitos</h2><p>Creá el depósito de la empresa y una camioneta por técnico: cada uno ve lo que lleva y lo que usa en cada obra se descuenta solo.</p></div>`);
  }
  if(INVT==='movimientos'){
    const l=arr('movimientos').filter(x=>!q||qn([MOVK[x.tipo],D.productos[x.prodId]?.nombre,D.productos[x.prodId]?.codigo,depName(x.desde),depName(x.hacia),cliName(x.clienteId),x.proveedor,x.doc,x.nota].join(' ')).includes(q))
      .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||n0(b.creado)-n0(a.creado)).slice(0,300);
    return head('Entradas, salidas a obra, transferencias y ajustes',readonly?'':'<button class="btn" data-act="invnew:transf">Transferir</button><button class="btn pri" data-act="invnew:entrada">+ Entrada</button>')+tabs+search('Buscar por producto, depósito, cliente o proveedor')
      +(l.length?`<div class="list">${l.map(x=>{const p=D.productos[x.prodId];
        return`<div class="row" role="button" tabindex="0" data-open="${x.trabajoId&&D.trabajos[x.trabajoId]?'trab:'+x.trabajoId:'mov:'+x.id}" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><strong>${esc(p?.nombre||'Producto borrado')} · ${fq(x.cant,p)}</strong><span class="muted">${fdate(x.fecha)} · ${esc([x.desde?depName(x.desde):'',x.hacia?depName(x.hacia):''].filter(Boolean).join(' → '))}${x.clienteId?' · '+esc(cliName(x.clienteId)):''}${x.proveedor?' · '+esc(x.proveedor):''}${x.trabajoId?' · desde un trabajo':''}</span></div><span class="tag ${MOVC[x.tipo]||'t-none'}">${esc(MOVK[x.tipo]||x.tipo)}</span></div>`}).join('')}</div>`
      :`<div class="empty"><h2>Sin movimientos</h2><p>Cargá una entrada con lo que tenés en el depósito, o hacé un ajuste por conteo para arrancar con el stock real.</p></div>`);
  }
  if(INVT==='equipos'){
    const all=arr('equipos'),t=today();
    const l=all.filter(e=>(EQF==='todos'||(EQF==='mant'&&e.estado!=='retirado'&&eqState(e).vence)||(EQF==='gar'&&e.garantiaHasta&&e.garantiaHasta>=t))&&(!q||qn([eqName(e),e.serie,e.ubicacion,cliName(e.clienteId),pryName(e.proyectoId)].join(' ')).includes(q)))
      .sort((a,b)=>(eqState(b).vence-eqState(a).vence)||(a.proxMant||'9').localeCompare(b.proxMant||'9')||cliName(a.clienteId).localeCompare(cliName(b.clienteId),'es'));
    const fl=`<div class="seg" role="group" aria-label="Filtro" style="margin-bottom:10px">${[['todos','Todos'],['mant',`Mantenimiento a vencer${mp?' ('+mp+')':''}`],['gar','En garantía']].map(([k,n])=>`<button class="${EQF===k?'on':''}" aria-pressed="${EQF===k}" data-act="eqf:${k}">${n}</button>`).join('')}</div>`;
    return head(`${all.length} equipo${all.length===1?'':'s'} instalado${all.length===1?'':'s'} · número de serie, garantía y mantenimiento preventivo`,(all.length?'<button class="btn" data-act="eqcsv">Exportar CSV</button>':'')+(readonly?'':'<button class="btn pri" data-act="eqnew">+ Equipo</button>'))+tabs+fl+search('Buscar por número de serie, modelo, cliente o ubicación')
      +(l.length?`<div class="list">${l.map(e=>`<div class="row" role="button" tabindex="0" data-open="eq:${e.id}" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><strong>${esc(eqName(e))}${e.serie?` <span class="code">${esc(e.serie)}</span>`:''}</strong><span class="muted">${esc([cliName(e.clienteId)||'Sin cliente',pryName(e.proyectoId),e.ubicacion].filter(Boolean).join(' · '))}${e.instalado?' · instalado '+fdate(e.instalado):''}</span></div><span class="eqtags">${eqTags(e)}</span></div>`).join('')}</div>`
      :`<div class="empty"><h2>${all.length?'Ningún equipo coincide':'Sin equipos instalados'}</h2><p>Los equipos con número de serie se cargan solos cuando el técnico los saca del stock en un trabajo. También podés cargarlos a mano.</p></div>`);
  }
  // stock
  if(!ds.length)return head('Stock por depósito y camioneta')+tabs+`<div class="empty">${fiberArt}<h2>Empezá por los depósitos</h2><p>Creá el depósito de la empresa y una camioneta por técnico. Después cargá una entrada o un ajuste por conteo con lo que tenés hoy.</p>${readonly?'':'<div class="actions" style="justify-content:center"><button class="btn pri" data-act="invdep:deposito">+ Depósito</button><button class="btn" data-act="invdep:vehiculo">+ Camioneta</button></div>'}</div>`;
  const prods=arr('productos').filter(p=>p.stock||m[p.id]).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  const l=prods.filter(p=>(!INVD||stockOf(m,p.id,INVD)!==0)&&(!INVMIN||bajoMin(m,p))&&(!q||qn([p.nombre,p.codigo,p.servicio].join(' ')).includes(q)));
  const val=sum(prods,p=>Math.max(0,INVD?stockOf(m,p.id,INVD):stockOf(m,p.id))*costoUYU(p)),nb=prods.filter(p=>bajoMin(m,p)).length;
  const cols=INVD?[D.depositos[INVD]].filter(Boolean):ds.slice(0,6);
  const st=p=>{const s=stockOf(m,p.id);return s<0?'<span class="tag t-bad">Negativo</span>':bajoMin(m,p)?'<span class="tag t-warn">Bajo mínimo</span>':s===0?'<span class="tag t-none">Sin stock</span>':''};
  const tools=readonly?'':`<button class="btn" data-act="invnew:ajuste">Ajuste</button><button class="btn" data-act="invnew:transf">Transferir</button><button class="btn pri" data-act="invnew:entrada">+ Entrada</button>`;
  const filt=`<div class="mini invfil"><select id="inv_dep" aria-label="Depósito">${depOpts(INVD,'Todos los depósitos')}</select><button class="tgl${INVMIN?' on':''}" data-act="invmin" aria-pressed="${INVMIN}">Bajo mínimo (${nb})</button><button class="btn ghost" data-act="invcsv:stock">Exportar stock</button>${nb?'<button class="btn ghost" data-act="invcsv:compra">Lista de compra</button>':''}</div>`;
  const tot=p=>INVD?stockOf(m,p.id,INVD):stockOf(m,p.id);
  const mob=`<div class="list only-mob">${l.map(p=>`<div class="row" role="button" tabindex="0" data-open="stk:${p.id}" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><strong>${esc(p.nombre)}</strong><span class="muted">${esc(ds.filter(d=>stockOf(m,p.id,d.id)).map(d=>d.nombre+': '+fq(stockOf(m,p.id,d.id),p)).join(' · ')||'Sin stock')}</span></div><span style="text-align:right"><b class="num">${fq(tot(p),p)}</b><br>${st(p)}</span></div>`).join('')}</div>`;
  const dsk=`<div class="tablewrap only-dsk"><table><thead><tr><th>Producto</th>${cols.map(d=>`<th class="n">${esc(d.nombre)}</th>`).join('')}${INVD?'':'<th class="n">Total</th>'}<th class="n">Mínimo</th>${boss?'<th class="n">Valor (costo)</th>':''}<th></th></tr></thead>
    <tbody>${l.map(p=>`<tr data-open="stk:${p.id}" tabindex="0" style="cursor:pointer"><td><b>${esc(p.nombre)}</b>${p.codigo?`<br><span class="muted code">${esc(p.codigo)}</span>`:''}</td>${cols.map(d=>{const v=stockOf(m,p.id,d.id);return`<td class="n"${v<0?' style="color:var(--bad)"':''}>${v?fq(v,p):'—'}</td>`}).join('')}${INVD?'':`<td class="n"><b>${fq(stockOf(m,p.id),p)}</b></td>`}<td class="n">${n0(p.stockMin)?fq(p.stockMin,p):'—'}</td>${boss?`<td class="n">${n0(p.costo)?money(Math.max(0,tot(p))*costoUYU(p),'UYU'):'<span class="muted">sin costo</span>'}</td>`:''}<td>${st(p)}</td></tr>`).join('')}</tbody></table></div>`;
  return head(`Stock por depósito y camioneta${ds.length>6&&!INVD?' · se muestran los primeros 6 depósitos, filtrá para ver otro':''}`,tools)+tabs
    +`<div class="kpis only-dsk" style="margin:0 0 14px">${kpi('Artículos con stock',prods.filter(p=>stockOf(m,p.id)>0).length)}${boss?kpi('Valor del stock',money(val,'UYU')):kpi('Depósitos',ds.length)}${kpi('Bajo mínimo',nb)}${kpi('Mantenimientos a vencer',mp)}</div>`
    +filt+search('Buscar producto o código')
    +(l.length?mob+dsk:prods.length?'<p class="muted">Ningún producto coincide.</p>':`<div class="empty"><h2>Todavía no hay stock</h2><p>Cargá una <b>entrada</b> con lo que compraste o un <b>ajuste por conteo</b> con lo que hay hoy en cada depósito. Los productos se toman del catálogo.</p></div>`)
    +`<p class="hint" style="margin-top:12px">El stock baja solo cuando un técnico carga “Materiales del stock” en un trabajo. Los productos con número de serie quedan además como equipos instalados del cliente.</p>`;
}

/* --- hoja: depósito o camioneta --- */
const DEPF=()=>[{k:'nombre',l:'Nombre',w:'full',ph:'Ej.: Depósito central · Camioneta Juan'},{k:'tipo',l:'Tipo',t:'select',o:[['deposito','Depósito'],['vehiculo','Camioneta o vehículo']]},{k:'tecnicoId',l:'Responsable',t:'person'},{k:'notas',l:'Notas',t:'textarea',w:'full'}];
function sheetDep(id,p){
  const d=id?D.depositos[id]:{tipo:p.tipo||'deposito',tecnicoId:''};
  let body=`<div class="grid">${DEPF().map(f=>fld(f,d[f.k])).join('')}</div><p class="err" id="shErr" hidden></p>`;
  if(id){const m=stockMap(),its=Object.keys(m).filter(pid=>stockOf(m,pid,id)!==0&&D.productos[pid]).map(pid=>D.productos[pid]&&{...D.productos[pid],id:pid}).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
    body+=`<section class="rel"><h3>Lo que hay ${d.tipo==='vehiculo'?'en la camioneta':'en el depósito'} <span class="num">${its.length}</span></h3>${its.map(x=>`<div class="item link" role="button" tabindex="0" data-open="stk:${x.id}"><span class="grow">${esc(x.nombre)}</span><b class="num">${fq(stockOf(m,x.id,id),x)}</b></div>`).join('')||'<p class="muted" style="margin:0">Vacío.</p>'}
      ${readonly?'':`<div class="actions"><button class="btn" data-act="invnew:transf::${id}">Transferir desde acá</button><button class="btn" data-act="invnew:ajuste::${id}">Ajuste por conteo</button></div>`}</section>`}
  return sheetFrame(d.tipo==='vehiculo'?'Camioneta':'Depósito',id?d.nombre:(d.tipo==='vehiculo'?'Nueva camioneta':'Nuevo depósito'),body,{del:!!id});
}
async function saveDep(){const v=readForm(DEPF());if(!v.nombre){const e=$('#shErr');e.textContent='Poné un nombre.';e.hidden=false;return}
  const id=SH.id||uid();await put('depositos',id,{...(SH.id?D.depositos[SH.id]:{creado:Date.now()}),...v});toast(v.tipo==='vehiculo'?'Camioneta guardada':'Depósito guardado');closeSheet()}

/* --- hoja: stock de un producto --- */
function sheetStk(pid){
  const p=D.productos[pid]||{},m=stockMap(),boss=isBoss();
  const movs=arr('movimientos').filter(x=>x.prodId===pid).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||n0(b.creado)-n0(a.creado)).slice(0,40);
  const body=`<div class="contact">${p.codigo?`<span class="code">${esc(p.codigo)}</span>`:''}<strong>${fq(stockOf(m,pid),p)} en total</strong>${n0(p.stockMin)?`<span class="muted">mínimo ${fq(p.stockMin,p)}</span>`:''}${bajoMin(m,{...p,id:pid})?'<span class="tag t-warn">Bajo mínimo</span>':''}${boss&&n0(p.costo)?`<span class="muted">costo ${money(p.costo,p.moneda,2)}</span>`:''}</div>
    ${readonly?'':`<div class="actions"><button class="btn pri" data-act="invnew:entrada:${pid}">+ Entrada</button><button class="btn" data-act="invnew:transf:${pid}">Transferir</button><button class="btn" data-act="invnew:ajuste:${pid}">Ajuste por conteo</button>${boss?`<button class="btn ghost" data-open="prod:${pid}">Editar producto</button>`:''}</div>`}
    <section class="rel"><h3>Por depósito</h3>${deps().map(d=>`<div class="item"><span class="grow">${d.tipo==='vehiculo'?'🚐 ':''}${esc(d.nombre)}</span><b class="num">${fq(stockOf(m,pid,d.id),p)}</b></div>`).join('')}</section>
    <section class="rel"><h3>Últimos movimientos</h3>${movs.map(x=>`<div class="item link" role="button" tabindex="0" data-open="${x.trabajoId&&D.trabajos[x.trabajoId]?'trab:'+x.trabajoId:'mov:'+x.id}"><span>${fdate(x.fecha)}</span><span class="grow">${esc(MOVK[x.tipo]||'')}${x.clienteId?' · '+esc(cliName(x.clienteId)):''}<br><span class="muted">${esc([x.desde?depName(x.desde):'',x.hacia?depName(x.hacia):''].filter(Boolean).join(' → '))}</span></span><b class="num">${x.hacia&&!x.desde?'+':x.desde&&!x.hacia?'−':''}${fq(x.cant,p)}</b></div>`).join('')||'<p class="muted" style="margin:0">Sin movimientos.</p>'}</section>`;
  return sheetFrame('Stock',p.nombre||'Producto',body,{saveLabel:'Cerrar'});
}

/* --- hoja: movimiento --- */
function sheetMov(id,pr){
  const x=id?{...D.movimientos[id]}:{tipo:pr.tipo||'entrada',fecha:today(),prodId:pr.prod||'',cant:'',desde:'',hacia:'',...(pr.mv||{})};
  if(!id&&!pr.mv){const dd=pr.dep||(x.tipo==='entrada'||x.tipo==='devol'?(deps().find(d=>d.tipo!=='vehiculo')||deps()[0])?.id:myDep())||'';
    if(x.tipo==='entrada'||x.tipo==='devol')x.hacia=dd;else x.desde=dd;
    if(x.tipo==='transf'){x.desde=pr.dep||(deps().find(d=>d.tipo!=='vehiculo')||deps()[0])?.id||'';x.hacia=(deps().find(d=>d.id!==x.desde&&d.tecnicoId===ME)||deps().find(d=>d.id!==x.desde))?.id||''}}
  if(x.trabajoId&&D.trabajos[x.trabajoId])return sheetFrame('Movimiento',MOVK[x.tipo]||'Movimiento',`<p>Este movimiento sale del trabajo <b>${esc(D.trabajos[x.trabajoId].titulo||'')}</b> del ${fdate(D.trabajos[x.trabajoId].fecha)}. Para cambiarlo, editá los materiales en el trabajo.</p><div class="actions"><button class="btn pri" data-open="trab:${x.trabajoId}">Abrir el trabajo</button></div>`,{saveLabel:'Cerrar'});
  if(!deps().length)return sheetFrame('Movimiento','Primero creá un depósito','<p>Para mover stock hace falta al menos un depósito o una camioneta.</p><div class="actions"><button class="btn pri" data-act="invdep:deposito">+ Depósito</button></div>',{saveLabel:'Cerrar'});
  const t=x.tipo,ps=invProds(),m=stockMap(),p=D.productos[x.prodId];
  const sel=(k,l,v,o)=>`<label class="fld" for="mv_${k}"><span>${l}</span><select id="mv_${k}">${o}</select></label>`;
  const inp=(k,l,v,a='')=>`<label class="fld" for="mv_${k}"><span>${l}</span><input id="mv_${k}" value="${esc(v??'')}" ${a}></label>`;
  const where=t==='ajuste'?x.desde||x.hacia:t==='entrada'||t==='devol'?x.hacia:x.desde;
  let g=(id?`<label class="fld" for="mv_tipo"><span>Tipo de movimiento</span><select id="mv_tipo" disabled>${opts(MOVT,t)}</select></label>`:sel('tipo','Tipo de movimiento',t,opts(MOVT,t)))+inp('fecha','Fecha',x.fecha,'type="date"')
    +`<label class="fld full" for="mv_prod"><span>Producto</span><select id="mv_prod">${opts([['','Elegí el producto'],...ps.map(q=>[q.id,prodLabel(q)])],x.prodId)}</select></label>`;
  if(t==='entrada')g+=sel('hacia','Entra a',x.hacia,depOpts(x.hacia));
  if(t==='salida')g+=sel('desde','Sale de',x.desde,depOpts(x.desde));

async function saveMov(){
  const r=movRead(),e=$('#shErr'),bad=t=>{e.textContent=t;e.hidden=false};

  const x={...base,tipo:r.tipo,fecha:r.fecha||today(),prodId:r.prodId,desde:'',hacia:'',nota:r.nota,clienteId:r.clienteId||'',proyectoId:r.proyectoId||''};

    Object.assign(x,{contado:n0(r.contado),cant:Math.abs(delta),[delta>=0?'hacia':'desde']:r.dep});}
  else{const c=n0(r.cant);if(!(c>0))return bad('Poné una cantidad mayor que cero.');x.cant=c;
    if(r.tipo==='entrada'){if(!r.hacia)return bad('Elegí a qué depósito entra.');x.hacia=r.hacia;x.proveedor=r.proveedor;x.doc=r.doc;if(r.costo!=='')x.costo=n0(r.costo)}
    if(r.tipo==='devol'){if(!r.hacia)return bad('Elegí a qué depósito vuelve.');x.hacia=r.hacia}
    if(r.tipo==='salida'){if(!r.desde)return bad('Elegí de dónde sale.');x.desde=r.desde;x.costo=n0(p?.costo)}
    if(r.tipo==='transf'){if(!r.desde||!r.hacia)return bad('Elegí origen y destino.');if(r.desde===r.hacia)return bad('El origen y el destino son el mismo.');x.desde=r.desde;x.hacia=r.hacia}}
  const id=SH.id||uid();

  if(p&&!SH.id&&r.tipo==='entrada'&&r.costo!==''&&isBoss()){const st=Math.max(0,stockOf(stockMap(),r.prodId)),oc=n0(p.costo);
    const nc=st>0&&oc?r2((st*oc+x.cant*n0(r.costo))/(st+x.cant)):n0(r.costo);await put('productos',r.prodId,{...p,costo:nc,stock:true})}
  else if(p&&!p.stock)await put('productos',r.prodId,{...p,stock:true});

}

/* --- rentabilidad por proyecto (solo dueño y administradores) --- */
function pryRent(pid){
  const it=pryItems(pid),jids=new Set(it.jobs.map(j=>j.id));
  const ing=sum(it.fs.filter(f=>!f.anulada),f=>conv(calcQ(f).base,f.moneda,'UYU'));
  const pres=sum(it.qs.filter(q=>q.estado==='aceptado'),q=>conv(calcQ(q).base,q.moneda,'UYU'));
  const mv=arr('movimientos').filter(x=>x.proyectoId===pid||(x.trabajoId&&jids.has(x.trabajoId)));
  const mat=sum(mv,x=>{const p=D.productos[x.prodId],c=n0(x.cant)*costoUYU(p,n0(x.costo)||n0(p&&p.costo));return x.tipo==='salida'?c:x.tipo==='devol'?-c:0});
  let horas=0,sinHora=0;const mo=sum(it.jobs,j=>{const h=jobHours(j);if(h==null){if(j.estado==='terminado')sinHora++;return 0}
    return sum(j.tecnicos||[],t=>{const f=tecFicha(t);horas+=h;return h*conv(n0(f.valorHora),f.moneda,'UYU')})});
  const sinCosto=new Set(mv.filter(x=>!n0(x.costo)&&!n0(D.productos[x.prodId]?.costo)).map(x=>x.prodId)).size;
  const costo=mat+mo,marg=ing-costo;
  return{ing,pres,mat,mo,horas,costo,marg,pct:ing?Math.round(marg/ing*100):null,sinHora,sinCosto};
}

/* el avance por etapa queda guardado en el proyecto, que es lo que ve el cliente en su portal */
async function pryAvSync(pid){
  const p=D.proyectos[pid];if(!p)return;const T=tareasOf(pid),av={};
  (p.etapas||[]).forEach(e=>{const l=T.filter(t=>t.etapaId===e.id);av[e.id]=[l.filter(t=>t.estado==='hecha').length,l.length]});
  const a=pryTaskAv(pid),nv={etapas:av,d:a.d,t:a.t};
  if(JSON.stringify(p.avanceTareas||{})===JSON.stringify(nv))return;
  await put('proyectos',pid,{...p,avanceTareas:nv,actualizado:Date.now()});
}

/* --- del presupuesto aceptado a la obra --- */
async function obraFromQuote(q){
  if(!q||!q.id)return'';
  if(q.obraId&&D.proyectos[q.obraId])return q.obraId;
  const o=q.oportunidadId&&D.oportunidades[q.oportunidadId],c=D.clientes[q.clienteId]||{};
  let pid=q.proyectoId&&D.proyectos[q.proyectoId]?q.proyectoId:'';
  if(!pid){pid=uid();D.proyectos[pid]={nombre:(o&&o.titulo)||`Obra ${q.numero||''} · ${c.nombre||''}`.trim(),clienteId:q.clienteId||'',estado:'activo',inicio:today(),direccion:(o&&o.obra)||c.direccion||'',presupuestoId:q.id,etapas:ETPL.map(e=>({...e})),creado:Date.now()};await put('proyectos',pid,D.proyectos[pid])}
  else if(!(D.proyectos[pid].etapas||[]).length){D.proyectos[pid]={...D.proyectos[pid],etapas:ETPL.map(e=>({...e})),presupuestoId:q.id};await put('proyectos',pid,D.proyectos[pid])}
  const E=D.proyectos[pid].etapas,eid=k=>(E.find(e=>e.id===k)||E[0]).id;
  const ls=(q.lineas||[]).filter(l=>(l.desc||'').trim()&&!['jornal','hora'].includes(l.unidad));
  const items=[{e:'rep',t:'Replanteo en obra con el cliente'}];
  ls.slice(0,12).forEach(l=>items.push({e:l.unidad==='metro'?'can':'ins',t:l.desc.trim(),cant:n0(l.cant),unidad:l.unidad||'unidad'}));
  if(ls.length>12)items.push({e:'ins',t:'Resto de los materiales del presupuesto',check:ls.slice(12).map(l=>({t:`${l.desc.trim()} × ${n0(l.cant)}`,ok:false}))});
  items.push({e:'prue',t:'Pruebas y configuración'},{e:'ent',t:'Entrega, capacitación y conformidad firmada'});
  for(const [i,x] of items.entries()){const id=`${pid}-q${i}`;if(D.tareas[id])continue;
    D.tareas[id]={proyectoId:pid,clienteId:q.clienteId||'',etapaId:eid(x.e),titulo:x.t,cant:x.cant||'',unidad:x.unidad||'',checklist:x.check||[],asignados:[],cuadrillaId:'',fecha:'',estado:'pendiente',orden:i,presupuestoId:q.id,creado:Date.now()+i};
    await put('tareas',id,D.tareas[id])}
  const cur=D.presupuestos[q.id]||q;await put('presupuestos',q.id,{...cur,obraId:pid,proyectoId:cur.proyectoId||pid,actualizado:Date.now()});
  await pryAvSync(pid);
  return pid;
}

const colIdx=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readXlsx(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();
  let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);files[td.decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};p+=46+nl+el+cl}
  const get=async name=>{const f=files[name];if(!f)return null;const s0=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u8.slice(s0,s0+f.cs);
    if(f.m===0)return td.decode(data);return td.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())};
  const xml=t=>new DOMParser().parseFromString(t,'application/xml'),ss=[],sx=await get('xl/sharedStrings.xml');
  if(sx)xml(sx).querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
  const sn=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/))).at(0);if(!sn)throw new Error('sheet');
  const rows=[];xml(await get(sn)).querySelectorAll('sheetData row').forEach(r=>{const row=[];r.querySelectorAll('c').forEach(c=>{const ci=colIdx((c.getAttribute('r')||'A').replace(/\d+/g,'')),t=c.getAttribute('t');
    row[ci]=t==='s'?(ss[+(c.querySelector('v')?.textContent||0)]||''):t==='inlineStr'?[...c.querySelectorAll('is t')].map(x=>x.textContent).join(''):(c.querySelector('v')?.textContent||'')});rows.push(Array.from(row,x=>x??''))});
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function parseCsv(t){t=t.replace(/^﻿/,'');const f0=(t.split(/\r?\n/)[0]||'');const sep=[';',',','\t'].map(s=>[s,f0.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
const IMPMAP={clientes:{nombre:['nombre','razon social','cliente','empresa','nombre o razon social'],rut:['rut','ci','documento','cedula','rut o ci'],contacto:['contacto','persona de contacto'],telefono:['telefono','celular','tel','movil','whatsapp'],email:['email','correo','mail','e-mail','correo electronico'],direccion:['direccion','domicilio'],departamento:['departamento','depto'],notas:['notas','observaciones','comentarios']},
  productos:{codigo:['codigo','sku','cod','codigo interno'],nombre:['nombre','descripcion','producto','articulo'],unidad:['unidad','um','unidad de medida'],precio:['precio','precio sin iva','precio de venta','pvp','precio unitario'],moneda:['moneda'],costo:['costo','precio de costo','costo unitario'],servicio:['servicio','rubro','categoria']}};
const numUY=v=>{let s=String(v??'').replace(/[^\d,.\-]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return Number(s)||0};
function impMap(kind,rows){
  const hdr=(rows[0]||[]).map(h=>qn(h).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()),M=IMPMAP[kind],idx={};
  Object.entries(M).forEach(([k,al])=>{let i=hdr.findIndex(h=>al.includes(h));if(i<0)i=hdr.findIndex(h=>al.some(a=>h.startsWith(a)));if(i>=0)idx[k]=i});
  const out=rows.slice(1).map(r=>{const o={};Object.entries(idx).forEach(([k,i])=>o[k]=String(r[i]??'').trim());return o}).filter(o=>o.nombre);
  if(kind==='clientes')out.forEach(o=>{if(o.departamento){const d=DEPTOS.find(x=>qn(x)===qn(o.departamento));o.departamento=d||o.departamento}});
  if(kind==='productos')out.forEach(o=>{const u=UNID.find(x=>qn(x)===qn(o.unidad)||qn(x).startsWith(qn(o.unidad||'-'))&&qn(o.unidad).length>=2);o.unidad=u||(/^m(t|ts|etros?)?$/.test(qn(o.unidad))?'metro':'unidad');o.precio=numUY(o.precio);if('costo' in o)o.costo=numUY(o.costo);o.moneda=/us|u\$|dol/i.test(o.moneda||'')?'USD':'UYU'});

const CUOTA={anticipo:'Anticipo',avance:'Avance de obra',final:'Saldo final',total:'Total'};
function qFacturado(qid,mon){return sum(arr('facturas').filter(f=>f.presupuestoId===qid&&!f.anulada),f=>conv(calcQ(f).base,f.moneda,mon))}
function qFactInfo(qid,q){
  const base=calcQ(q).base,fact=qFacturado(qid,q.moneda),pid=q.obraId&&D.proyectos[q.obraId]?q.obraId:(q.proyectoId&&D.proyectos[q.proyectoId]?q.proyectoId:'');
  const av=pid?pryTaskAv(pid):{t:0,pct:0},pctF=base?Math.round(fact/base*100):0;
  return{base,fact,saldo:Math.max(0,base-fact),pctF,pid,av,sugAvance:Math.max(0,(av.t?av.pct:0)-pctF)};
}
function qFactHtml(id,q){
  const x=qFactInfo(id,q),m=q.moneda,fs=arr('facturas').filter(f=>f.presupuestoId===id).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  return`<section class="rel"><h3>Facturación del presupuesto</h3>
    <div class="kpis" style="margin-bottom:8px"><div class="kpi"><span class="k">Presupuesto sin IVA</span><b class="num">${money(x.base,m)}</b></div><div class="kpi"><span class="k">Facturado</span><b class="num">${money(x.fact,m)} · ${x.pctF}%</b></div><div class="kpi"><span class="k">Falta facturar</span><b class="num">${money(x.saldo,m)}</b></div>${x.av.t?`<div class="kpi"><span class="k">Avance de la obra</span><b class="num">${x.av.pct}%</b></div>`:''}</div>
    ${fs.length?fs.map(f=>{const s=factState(f);return`<div class="item link" role="button" tabindex="0" data-open="fact:${f.id}"><span class="code">${esc(f.numero||'')}</span><span class="grow">${esc(CUOTA[f.cuota?.tipo]||'Factura')}${f.cuota?.pct?` ${f.cuota.pct}%`:''} · ${fdate(f.fecha)}</span><span class="num">${money(calcQ(f).base,f.moneda)}</span><span class="tag ${FST[s][1]}">${FST[s][0]}</span></div>`}).join(''):''}
    ${readonly||x.saldo<=0.5?(x.saldo<=0.5&&x.base?'<p class="hint" style="margin:6px 0 0">Ya está facturado completo.</p>':''):`<div class="mini" style="margin-top:10px"><div class="row2"><input type="number" id="qc_pct" min="1" max="100" step="1" inputmode="numeric" value="${x.fact?(x.sugAvance||Math.min(100,100-x.pctF)):30}" aria-label="Porcentaje a facturar" style="max-width:90px"><span class="muted" style="align-self:center">%</span>
      ${x.fact?'':'<button class="btn" data-act="qcuota:anticipo">Facturar anticipo</button>'}<button class="btn" data-act="qcuota:avance">Facturar avance</button><button class="btn pri" data-act="qcuota:final">${x.fact?'Facturar el saldo':'Facturar todo'}</button></div></div>
      <p class="hint" style="margin:6px 0 0">${x.av.t?`La obra va ${x.av.pct}% por tareas hechas${x.sugAvance?`: te sugiero facturar ${x.sugAvance}% de avance`:''}. `:''}El anticipo y el avance salen como una línea con el porcentaje; ${x.fact?'el saldo':'“Facturar todo”'} ${x.fact?'cierra lo que falta':'copia todas las líneas del presupuesto'}.</p>`}
  </section>`;
}
async function cuotaAct(k,el,arg){
  if(k!=='qcuota'||!SH||SH.type!=='pres'||!QE)return false;
  if(SH.dirty){const ok=await saveQ(false);if(!ok)return true}
  const qid=SH.id,q=clean(QE),x=qFactInfo(qid,q),cli=q.clienteId||opp(q.oportunidadId)?.clienteId||'',ref=`Presupuesto ${q.numero||''}${x.pid?' · '+pryName(x.pid):''}`.trim();
  const extra={moneda:q.moneda,iva:q.iva,presupuestoId:qid,proyectoId:x.pid||q.proyectoId||''};
  if(arg==='final'&&!x.fact){openSheet('fact',null,{draft:factDraft(cli,q.lineas,{...extra,descuento:n0(q.descuento),cuota:{tipo:'total',pct:100}})});SH.dirty=true;return true}
  let pct=arg==='final'?Math.round((x.saldo/x.base)*1000)/10:Math.max(1,Math.min(100,n0($('#qc_pct')?.value)));
  let monto=arg==='final'?x.saldo:r2(x.base*pct/100);
  if(monto>x.saldo+0.5){monto=r2(x.saldo);pct=Math.round(monto/x.base*1000)/10;toast(`Solo falta facturar ${money(x.saldo,q.moneda)}: ajusté el porcentaje`)}
  if(monto<=0){toast('No queda nada por facturar en este presupuesto.');return true}
  const desc=`${CUOTA[arg]} ${pct}% · ${ref}`;
  openSheet('fact',null,{draft:factDraft(cli,[{desc,cant:1,unidad:'global',precio:monto}],{...extra,descuento:0,cuota:{tipo:arg,pct}})});SH.dirty=true;return true;
}
function pryFactLine(pid){
  const q=arr('presupuestos').find(x=>x.estado==='aceptado'&&(x.obraId===pid||x.proyectoId===pid));if(!q)return'';
  const x=qFactInfo(q.id,q);if(!x.base)return'';
  return`<p class="hint" style="margin:8px 0 0">Facturado ${money(x.fact,q.moneda)} de ${money(x.base,q.moneda)} (${x.pctF}%) del presupuesto ${esc(q.numero||'')}${x.sugAvance?` · la obra va ${x.av.pct}%`:''}. ${readonly?'':`<button class="btn ghost sm" data-open="pres:${q.id}">${x.sugAvance?'Facturar avance':'Ver facturación'}</button>`}</p>`;
}

  if(o.plan!=='gratis'&&o.efectivo===o.plan&&o.paid_until)return new Date(o.paid_until)<Date.now()?['Atrasado','t-warn']:['Pago hasta '+fdate(o.paid_until),'t-ok'];
  if(o.plan==='gratis'&&o.efectivo!=='gratis')return['Prueba hasta '+fdate(o.trial_ends),'t-acc'];
  if(o.plan!=='gratis'&&o.efectivo==='gratis')return['Vencido','t-bad'];
  return['Gratis','t-none'];
}

function addMonths(d,n){const x=new Date((d||today())+'T12:00');x.setMonth(x.getMonth()+n);return localISO(x).slice(0,10)}
async function planAct(k,el,arg){
  if(k==='sub'){const [p,c]=String(arg).split('-');const ex=Math.max(0,Math.round(n0($('#p_extra_'+p)?.value)));el.disabled=true;
    try{const d=await fnData(await SB.functions.invoke('mp-suscribir',{body:{org:ORG,plan:p,ciclo:c,extra:ex,email:($('#p_mpemail')?.value||'').trim()}}));
      if(!d.url){toast(d.error||'No se pudo iniciar el pago. Probá de nuevo.');return true}
      toast('Abriendo Mercado Pago…');location.href=d.url}
    finally{el.disabled=false}return true}
  if(k==='subcancel'){
    if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='¿Cancelar la suscripción? Tocá de nuevo';return true}
    const d=await fnData(await SB.functions.invoke('mp-suscribir',{body:{org:ORG,accion:'cancelar'}}));
    armed=null;if(d.error){toast(d.error);return true}await loadPlan();toast('Suscripción cancelada. El plan sigue hasta la fecha pagada.');return true}
  if(k==='wasend'){const m=WAMSG[+arg];if(!m)return true;el.disabled=true;
    try{const d=await fnData(await SB.functions.invoke('wa-enviar',{body:{org:ORG,to:m.tel,text:m.text,ticket:m.tk}}));
      if(d.ok)toast('Enviado por WhatsApp');
      else if(d.error==='fuera_de_ventana'){window.open(waUrl(m.tel,m.text),'_blank');toast('El cliente no escribió en las últimas 24 h: se abrió WhatsApp para que lo mandes vos.')}
      else toast(d.error||'No se pudo enviar.')}
    finally{el.disabled=false}return true}
  if(k==='admreload'){ADM=null;sr();return true}
  if(k==='orgx'){const pu=$('#g_paid_until'),tr=$('#g_trial_ends'),pl=$('#g_plan'),t=today();
    if(arg==='t15'){tr.value=addDays(tr.value&&tr.value>t?tr.value:t,15)}
    else{const base=pu.value&&pu.value>t?pu.value:t;pu.value=addMonths(base,arg==='1y'?12:1);if(pl.value==='gratis')pl.value='pro'}
    if(SH)SH.dirty=true;return true}
  if(k==='orgwa'||k==='orgwaoff'){const id=SH&&SH.id;if(!id)return true;
    const pn=k==='orgwa'?($('#w_pnid').value||'').trim():'',ph=k==='orgwa'?($('#w_phone').value||'').trim():'',tk=k==='orgwa'?($('#w_tok').value||'').trim():'';
    if(k==='orgwa'&&(!pn||!tk)){const e=$('#shErr');e.textContent='Completá el identificador del número y el token.';e.hidden=false;return true}
    const {error}=await SB.rpc('admin_set_whatsapp',{o:id,pnid:pn,phone:ph,token:tk});
    if(error){toast('No se pudo guardar WhatsApp.');return true}
    await loadAdmin();if(id===ORG)loadPlan();openSheet('org',id);toast(k==='orgwa'?'WhatsApp conectado':'WhatsApp desconectado');return true}
  return false;
}

const BUCKET='archivos', URL_TTL=7*24*3600;
const PIXEL='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const URLS={}; let urlPend=new Set(), urlT=null;
function blobUrl(id){
  if(!id)return PIXEL;
  const u=URLS[id];if(u&&u.exp>Date.now())return u.url;
  if(SB&&ORG){urlPend.add(id);clearTimeout(urlT);urlT=setTimeout(signPending,30)}
  return PIXEL;
}
async function signPending(){
  const ids=[...urlPend];urlPend=new Set();if(!ids.length)return;
  const {data}=await SB.storage.from(BUCKET).createSignedUrls(ids,URL_TTL);
  let any=false;(data||[]).forEach(r=>{if(r.signedUrl&&r.path){URLS[r.path]={url:r.signedUrl,exp:Date.now()+(URL_TTL-3600)*1000};any=true}});
  if(any){sr();if(SH&&SH.type==='trab')refreshJob();if(SH&&SH.type==='cli'){const e=$('#cliFiles');if(e)e.innerHTML=cliFilesHtml(SH.id)}planUrlsSigned();applyBrand()}
}
function prefetchUrls(){
  const ids=[];
  Object.values(D.trabajos).forEach(j=>[...(j.fotos||[]),...(j.planos||[])].forEach(f=>f&&f.id&&ids.push(f.id)));
  Object.values(D.clientes).forEach(c=>(c.archivos||[]).forEach(f=>f&&f.id&&ids.push(f.id)));
  if(CFG.logo?.id)ids.push(CFG.logo.id);
  Object.values(D.planos||{}).forEach(p=>p&&p.img&&p.img.id&&ids.push(p.img.id));
  ids.forEach(blobUrl);
}
function sbErr(e){
  const m=(e&&e.message)||'';
  return {code:(e&&(e.code==='42501'||/row-level security|permission/i.test(m)))?'invalid_argument':'unavailable',message:m};
}

/* Mismos verbos que usaba la app: colecciones y documentos en vivo */
const LIVE={};
const liveCol=c=>LIVE[c]||(LIVE[c]={map:{},cbs:[],loaded:false});
function snapOf(col){const L=liveCol(col);const docs=Object.entries(L.map).map(([id,data])=>({id,exists:true,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}}));
  return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
function emit(col){const L=liveCol(col);if(!L.loaded)return;const s=snapOf(col);L.cbs.forEach(cb=>{try{cb(s)}catch(e){console.error(e)}});if(col==='trabajos'||col==='clientes'||col==='config')prefetchUrls()}
const SBDB={
  collection(col){return{
    doc:id=>SBDB.doc(col+'/'+id),
    onSnapshot(next){const L=liveCol(col);L.cbs.push(next);if(L.loaded)setTimeout(()=>next(snapOf(col)));return()=>{L.cbs=L.cbs.filter(x=>x!==next)}}
  }},
  doc(path){const [col,id]=path.split('/');const L=liveCol(col);return{
    async set(data){L.map[id]=data;emit(col);
      const {error}=await SB.from('docs').upsert({org_id:ORG,col,id,data,updated_at:new Date().toISOString()});
      if(error){loadAll().catch(()=>{});throw sbErr(error)}},
    async update(f){const cur=L.map[id];if(!cur)throw{code:'invalid_argument',message:'No existe'};return this.set({...cur,...f})},
    async delete(){delete L.map[id];emit(col);
      const {error}=await SB.from('docs').delete().match({org_id:ORG,col,id});
      if(error){loadAll().catch(()=>{});throw sbErr(error)}},
    onSnapshot(next){const w=()=>{const d=L.map[id];next({id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}})};
      L.cbs.push(w);if(L.loaded)setTimeout(w);return()=>{L.cbs=L.cbs.filter(x=>x!==w)}}
  }}
};
async function loadAll(){
  const all=[];for(let from=0;;from+=1000){
    const {data,error}=await SB.from('docs').select('col,id,data').eq('org_id',ORG).range(from,from+999);
    if(error)throw error;all.push(...data);if(data.length<1000)break}
  const by={};all.forEach(r=>{(by[r.col]=by[r.col]||{})[r.id]=r.data});
  [...COLS,'config'].forEach(c=>{const L=liveCol(c);L.map=by[c]||{};L.loaded=true;emit(c)});
}
let chan=null;
function subscribeLive(){
  if(chan)SB.removeChannel(chan);
  chan=SB.channel('docs-'+ORG)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'docs',filter:'org_id=eq.'+ORG},p=>{const r=p.new;liveCol(r.col).map[r.id]=r.data;emit(r.col)})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'docs',filter:'org_id=eq.'+ORG},p=>{const r=p.new;liveCol(r.col).map[r.id]=r.data;emit(r.col)})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'docs'},p=>{const r=p.old||{};if(r.org_id!==ORG)return;delete liveCol(r.col).map[r.id];emit(r.col)})
    .subscribe();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ORG&&SB){loadAll().catch(()=>{});loadPlan().catch(()=>{})}});

/* Personas del equipo */
const AVC=['#FF7A1A','#E0A800','#3FA7FF','#2FA36B','#9A6BE0','#E0307A'];
function avatarOf(name,color){const t=(name||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase().replace(/[<>&'"]/g,'');
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><rect width='44' height='44' rx='22' fill='${color}'/><text x='22' y='28' font-family='Arial' font-size='16' font-weight='700' text-anchor='middle' fill='#1E1F23'>${t}</text></svg>`)}
function profOf(id){const m=MEMBERS[id];const name=(m&&(m.display_name||m.email))||STAFF[id]||'';const color=AVC[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%AVC.length];
  return {id,name,avatarUrl:avatarOf(name,color),color,email:(m&&m.email)||null,isMe:id===ME,guest:false}}
const SBUSER={
  id:async()=>ME, isOwner:async()=>ROLE==='owner', canEdit:async()=>['owner','admin'].includes(ROLE), can:async()=>ROLE!=='viewer',
  me:async()=>profOf(ME),
  profiles:async ids=>{const o={};(Array.isArray(ids)?ids:[ids]).forEach(i=>o[i]=profOf(i));return o},
  search:async q=>{q=qn(q||'');return Object.keys(MEMBERS).filter(i=>MEMBERS[i].role!=='cliente').map(profOf).filter(p=>p.name&&(!q||qn(p.name+' '+(p.email||'')).includes(q))).slice(0,8)}
};
async function loadMembers(){
  const {data,error}=await SB.from('members').select('user_id,display_name,email,role,created_at,client_id').eq('org_id',ORG);
  if(error)return;MEMBERS={};data.forEach(m=>MEMBERS[m.user_id]=m);
  Object.keys(MEMBERS).filter(id=>MEMBERS[id].role!=='cliente').forEach(id=>{const p=profOf(id);NAMES[id]={name:p.name,av:p.avatarUrl}});
}

/* Fotos y planos */
const SBAS={
  async upload(blob,opts){
    const type=(opts&&opts.type)||blob.type||'application/octet-stream';
    const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg','application/pdf':'pdf'})[type]||'bin';
    const path=`${ORG}/${uid()}.${ext}`;
    const {error}=await SB.storage.from(BUCKET).upload(path,blob,{contentType:type,upsert:false});
    if(error)throw{code:/size|large|exceed/i.test(error.message||'')?'too_large':(/mime|type/i.test(error.message||'')?'unsupported_type':'upstream_error'),message:error.message};
    const {data}=await SB.storage.from(BUCKET).createSignedUrl(path,URL_TTL);
    if(data&&data.signedUrl)URLS[path]={url:data.signedUrl,exp:Date.now()+(URL_TTL-3600)*1000};
    return {id:path,url:(data&&data.signedUrl)||'',contentType:type,sizeBytes:blob.size};
  },
  async delete(id){await SB.storage.from(BUCKET).remove([id]);return{deleted:true}}
};

/* Descargas: en el celular abre el menú de compartir; en la computadora descarga */
const SBDL={
  async save({filename,data}){
    const Cap=window.Capacitor;
    if(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform()&&Cap.Plugins&&Cap.Plugins.Filesystem&&Cap.Plugins.Share){
      const r=await Cap.Plugins.Filesystem.writeFile({path:filename,data:String(data),directory:'CACHE',encoding:'utf8'});
      await Cap.Plugins.Share.share({title:filename,url:r.uri});return{status:'saved'}}
    const type=/\.csv$/i.test(filename)?'text/csv;charset=utf-8':'text/html;charset=utf-8';
    const blob=data instanceof Blob?data:new Blob([data],{type});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);return{status:'saved'}
  }
};

    body=`<h2>Revisá tu email</h2><p class="muted">Si ese email tiene cuenta en Olumi, te llegó un enlace para elegir una contraseña nueva.</p><button class="btn pri" data-auth="login">Volver a entrar</button>`;
  }else if(authMode==='setpass'){
    body=`<h2>Elegí tu contraseña</h2><p class="muted">Con esta contraseña vas a entrar a Olumi desde la app o la web.</p><form data-form="setpass" class="authform"><label class="fld" for="a_pass"><span>Contraseña nueva</span><input id="a_pass" type="password" autocomplete="new-password" minlength="6" required></label>${err}<button class="btn pri" type="submit">Guardar y entrar</button></form>`;
  }else if(authMode==='pedido'||authMode==='pedidook'){
    body=pedidoHtml();
  }else if(authMode==='config'){
    body=`<h2>Falta conectar el servidor</h2><p class="muted">Completá el archivo <b>www/config.js</b> con la URL y la clave pública de tu proyecto de Supabase.</p>`;
  }
  $('#authBody').innerHTML=body;
  const f=$('#authBody input');if(f)f.focus();
}
function authErrText(e){const m=(e&&e.message)||'';
  if(/Invalid login/i.test(m))return'Email o contraseña incorrectos.';
  if(/already registered|already exists/i.test(m))return'Ese email ya tiene cuenta. Entrá con tu contraseña.';
  if(/Email not confirmed/i.test(m))return'Falta confirmar el email: revisá tu casilla.';
  if(/codigo_invalido/.test(m))return'Ese código no corresponde a ninguna empresa. Revisalo con el administrador.';
  if(/sin_portal/.test(m))return'El portal de clientes de esa empresa no está activo.';
  if(/limite_usuarios/.test(m))return'Esa empresa llegó al máximo de usuarios de su plan. Avisale al administrador.';
  if(/Password/i.test(m))return'La contraseña tiene que tener al menos 6 caracteres.';
  if(/rate limit/i.test(m))return'Se mandaron demasiados emails. Probá de nuevo en una hora.';
  if(/fetch|network/i.test(m))return'Sin conexión con el servidor. Revisá internet y probá de nuevo.';
  return m||'Algo salió mal. Probá de nuevo.'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-auth]');if(t){authMsg='';authMode=t.dataset.auth;renderAuth()}});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;authMsg='';
  try{
    const k=f.dataset.form;
    if(k==='pedido'){await pedidoSend();return}
    if(k==='forgot'){const {error}=await SB.auth.resetPasswordForEmail($('#a_email').value.trim(),{redirectTo:PORTAL_URL});if(error)throw error;authMode='sent';renderAuth();return}
    if(k==='setpass'){const {error}=await SB.auth.updateUser({password:$('#a_pass').value});if(error)throw error;PASSDONE=true;history.replaceState(null,'',location.pathname);await boot();return}
    if(k==='login'){const {error}=await SB.auth.signInWithPassword({email:$('#a_email').value.trim(),password:$('#a_pass').value});if(error)throw error;await boot()}
    else if(k==='signup'){const name=$('#a_name').value.trim();const {data,error}=await SB.auth.signUp({email:$('#a_email').value.trim(),password:$('#a_pass').value,options:{data:{name}}});if(error)throw error;
      if(!data.session){authMode='check';renderAuth();return}await boot()}
    else if(k==='neworg'||k==='join'){const {data:{user}}=await SB.auth.getUser();const my=(user&&user.user_metadata&&user.user_metadata.name)||(user&&user.email)||'';
      const r=k==='neworg'?await SB.rpc('create_org',{org_name:$('#a_org').value.trim(),my_name:my}):await ($('#a_code').value.trim().length===8?SB.rpc('join_as_client',{code:$('#a_code').value.trim(),my_name:my}):SB.rpc('join_org',{code:$('#a_code').value.trim(),my_name:my}));
      if(r.error)throw r.error;lsSet('olumi.org',r.data);await boot()}
  }catch(err){authMsg=authErrText(err);renderAuth()}
  finally{btn.disabled=false}
});

/* ---------- equipo (en Ajustes) ---------- */
const ROLES=[['admin','Administrador'],['encargado','Encargado'],['ventas','Ventas'],['administracion','Administración'],['tecnico','Técnico'],['subcontratista','Subcontratista'],['viewer','Solo lectura']];
const ROLEN={owner:'Dueño',admin:'Administrador',encargado:'Encargado',ventas:'Ventas',administracion:'Administración',tecnico:'Técnico',viewer:'Solo lectura',pendiente:'Pide entrar',subcontratista:'Subcontratista'};
function equipoHtml(){
  if(!ORG)return'';const admin=['owner','admin'].includes(ROLE);
  const ms=Object.values(MEMBERS).filter(m=>m.role!=='cliente').sort((a,b)=>(a.display_name||a.email||'').localeCompare(b.display_name||b.email||'','es'));
  return`<div class="vhead" style="margin-top:34px"><div><h1>Equipo</h1><p class="sub">Quién usa Olumi en ${esc((ORGINFO&&ORGINFO.name)||'tu empresa')}${PLAN?` · ${PLAN.users} de ${PLAN.max_users} usuarios del plan ${esc(PLAN.nombre)}`:''}</p></div></div>
  <div class="panel">${admin?`<p style="margin:0 0 10px">Para sumar a alguien: que instale Olumi, cree su cuenta y elija <b>Unirme a la empresa</b> con este código. Queda esperando hasta que lo apruebes acá abajo y le elijas el rol.</p>
    <div class="actions" style="margin-bottom:16px;align-items:center"><span class="num" style="font-size:24px;letter-spacing:.18em">${esc((ORGINFO&&ORGINFO.join_code)||'')}</span><button class="btn" data-act="copycode">Copiar código</button><button class="btn ghost" data-act="newcode">Cambiar código</button></div>`:''}
  <div class="list">${ms.map(m=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto;cursor:default"><div><strong>${esc(m.display_name||m.email||'Sin nombre')}${m.user_id===ME?' (vos)':''}</strong><span class="muted">${esc(m.email||'')}</span></div>
    ${admin&&m.role==='pendiente'?pendHtml(m):admin&&m.user_id!==ME&&m.role!=='owner'?`<select data-role="${esc(m.user_id)}" aria-label="Rol de ${esc(m.display_name||m.email||'')}">${opts(ROLES,m.role)}</select>`:`<span class="tag t-none">${ROLEN[m.role]||m.role}</span>`}</div>`).join('')}</div>
  ${admin?inviteHtml():''}
  <div class="actions" style="margin-top:16px"><button class="btn" data-act="logout">Cerrar sesión</button><button class="btn ghost danger" data-act="delacct">Eliminar mi cuenta</button></div></div>`;
}
async function teamAct(k,el){
  if(k==='logout'){await SB.auth.signOut();location.reload();return true}
  if(k==='copycode'){const c=(ORGINFO&&ORGINFO.join_code)||'';try{await navigator.clipboard.writeText(c);toast('Código copiado')}catch(e){toast('Código: '+c)}return true}
  if(k==='newcode'){const {data,error}=await SB.rpc('new_join_code',{o:ORG});if(error){toast('No se pudo cambiar el código.');return true}ORGINFO.join_code=data;sr();toast('Código nuevo listo');return true}
  if(k==='delacct'){
    if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='Se borra tu cuenta para siempre. Tocá de nuevo';return true}
    const {error}=await SB.rpc('delete_my_account');if(error){toast('No se pudo eliminar la cuenta.');return true}
    await SB.auth.signOut();location.reload();return true}
  return false;
}
document.addEventListener('change',async e=>{const t=e.target;if(!t.dataset||!t.dataset.role)return;
  const {error}=await SB.from('members').update({role:t.value}).match({org_id:ORG,user_id:t.dataset.role});
  if(error){toast('No se pudo cambiar el rol.');return}MEMBERS[t.dataset.role].role=t.value;toast('Rol actualizado')});

/* ---------- arranque ---------- */
render();
const slowT=setTimeout(()=>{slow=true;sr()},10000);
let booted=false;
async function boot(){
  if(!SB){clearTimeout(slowT);showAuth('config');return}
  if(PEDIR){clearTimeout(slowT);showAuth('pedido');return}
  const {data:{session}}=await SB.auth.getSession();
  if(!session){clearTimeout(slowT);showAuth('login');return}
  ME=session.user.id;
  if(/type=(invite|recovery)/.test(AUTHHASH)&&!PASSDONE){clearTimeout(slowT);showAuth('setpass');return}
  try{await SB.rpc('claim_invites')}catch(e){}
  const {data:mems,error}=await SB.from('members').select('org_id,role,orgs(name,join_code)').eq('user_id',ME);
  if(error){showAuth('login',authErrText(error));return}
  if(!mems.length){clearTimeout(slowT);showAuth('org');return}
  const pick=mems.find(m=>m.org_id===lsGet('olumi.org'))||mems[0];
  ORG=pick.org_id;ROLE=pick.role;ORGINFO={id:ORG,...(pick.orgs||{})};lsSet('olumi.org',ORG);
  readonly=ROLE==='viewer'||ROLE==='cliente'||ROLE==='pendiente';
  DB=SBDB;USER=SBUSER;AS=(readonly&&ROLE!=='cliente')?null:SBAS;DL=SBDL;SAMPLE=null;
  hideAuth();mode='live';
  await Promise.all([loadMembers(),loadPlan(),loadInvites()]);
  if(PORTAL())await loadStaff();
  if(!booted){booted=true;
    const done=k=>{loaded.add(k);if(loaded.size>=NEED)clearTimeout(slowT)};
    COLS.forEach(col=>DB.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());D[col]=o;done(col);sr();refreshNames()}));
    DB.doc('config/empresa').onSnapshot(s=>{CFG=s.exists?{...s.data()}:{};done('cfg');sr()});
  }
  try{await loadAll()}catch(e){toast('No se pudieron cargar los datos. Revisá la conexión.')}
  subscribeLive();sr();refreshNames();afterPayment();
}
if(SB)SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ORG)location.reload()});
boot();
})();

</script>
