/* ---------- 1.4: Inventario por depósito y camioneta, equipos instalados (garantía y mantenimiento) y rentabilidad por proyecto ---------- */
const invOn=()=>has('inventario');
const rentOn=()=>isBoss()&&has('reportes');
const MOVT=[['entrada','Entrada (compra)'],['salida','Salida a obra'],['transf','Transferencia'],['ajuste','Ajuste por conteo'],['devol','Devolución de obra']];
const MOVK=Object.fromEntries(MOVT);
const MOVC={entrada:'t-ok',salida:'t-acc',transf:'t-none',ajuste:'t-warn',devol:'t-ok'};
const uq=p=>({metro:'m',unidad:'u'}[p&&p.unidad]||(p&&p.unidad)||'');
const fq=(x,p)=>`${r2(x).toLocaleString('es-UY',{maximumFractionDigits:2})}${uq(p)?' '+uq(p):''}`;
const deps=()=>arr('depositos').filter(d=>!d.inactivo).sort((a,b)=>(a.tipo==='vehiculo')-(b.tipo==='vehiculo')||(a.nombre||'').localeCompare(b.nombre||'','es'));
const depName=id=>(D.depositos&&D.depositos[id]?.nombre)||(id?'Depósito borrado':'—');
const depOpts=(v,blank)=>opts([...(blank?[['',blank]]:[]),...deps().map(d=>[d.id,(d.tipo==='vehiculo'?'🚐 ':'')+d.nombre])],v);
function myDep(){const v=deps().find(d=>d.tecnicoId===ME);return v?v.id:((deps().find(d=>d.tipo!=='vehiculo')||deps()[0])?.id||'')}
const invProds=()=>arr('productos').filter(p=>p.unidad!=='jornal'&&p.unidad!=='hora').sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
const prodLabel=p=>(p.nombre||'Producto')+(p.codigo?' · '+p.codigo:'');
const costoUYU=(p,c)=>conv(c??n0(p&&p.costo),p&&p.moneda,'UYU');

/* stock: suma de lo que entra a cada depósito menos lo que sale */
function stockMap(hasta){const m={};for(const x of arr('movimientos')){if(hasta&&(x.fecha||'')>hasta)continue;const c=n0(x.cant);if(!c||!x.prodId)continue;const r=m[x.prodId]||(m[x.prodId]={});if(x.hacia)r[x.hacia]=(r[x.hacia]||0)+c;if(x.desde)r[x.desde]=(r[x.desde]||0)-c}return m}
const stockOf=(m,pid,dep)=>{const r=m[pid]||{};return dep?(r[dep]||0):Object.values(r).reduce((a,b)=>a+b,0)};
const bajoMin=(m,p)=>n0(p.stockMin)>0&&stockOf(m,p.id)<n0(p.stockMin);

/* equipos instalados */
const fdY=d=>d?new Date(d.slice(0,10)+'T12:00').toLocaleDateString('es-UY',{day:'numeric',month:'short',year:'numeric'}):'';
function eqState(e){const t=today(),lim=addDays(t,30);
  const gar=e.garantiaHasta?(e.garantiaHasta>=t?['En garantía hasta '+fdY(e.garantiaHasta),'t-ok']:['Garantía vencida','t-none']):null;
  const man=e.estado==='retirado'||!e.proxMant?null:e.proxMant<t?['Mantenimiento vencido '+fdate(e.proxMant),'t-bad']:e.proxMant<=lim?['Mantenimiento '+fdate(e.proxMant),'t-warn']:['Próx. mantenimiento '+fdY(e.proxMant),'t-none'];
  return{gar,man,vence:!!(man&&e.proxMant<=lim)}}
const eqTags=e=>{const s=eqState(e);return(e.estado==='retirado'?'<span class="tag t-none">Retirado</span>':'')+(s.gar?`<span class="tag ${s.gar[1]}">${s.gar[0]}</span>`:'')+(s.man?`<span class="tag ${s.man[1]}">${s.man[0]}</span>`:'')};
const eqName=e=>e.descripcion||D.productos[e.prodId]?.nombre||'Equipo';
const mantPend=()=>arr('equipos').filter(e=>e.estado!=='retirado'&&eqState(e).vence);

/* --- vista Inventario --- */
let INVT='stock',INVD='',INVQ='',INVMIN=false,EQF='todos';
function vInventario(){
  if(!invOn())return`<div class="vhead"><div><h1>Inventario</h1></div></div><div class="empty">${fiberArt}<h2>Inventario incluido en Pro y Empresa</h2><p>Stock por depósito y por camioneta, materiales descontados desde cada trabajo, equipos instalados con número de serie, garantía y mantenimiento preventivo.</p><button class="btn pri" data-view="plan">Ver planes</button></div>`;
  const boss=isBoss(),m=stockMap(),q=qn(INVQ),mp=mantPend().length;
  const tec=isTec();const ds=tec?deps().filter(d=>d.tecnicoId===ME||arr('cuadrillas').some(c=>c.depositoId===d.id&&(c.miembros||[]).includes(ME))):deps();
  if(tec&&!['stock','equipos'].includes(INVT))INVT='stock';
  const tabs=`<div class="seg invtabs" role="tablist" style="margin-bottom:14px">${(tec?[['stock','Mi camioneta'],['equipos','Equipos'+(mp?` (${mp})`:'')]]:[['stock','Stock'],['movimientos','Movimientos'],['compras','Compras'],['equipos','Equipos'+(mp?` (${mp})`:'')],['depositos','Depósitos']]).map(([k,n])=>`<button role="tab" class="${INVT===k?'on':''}" aria-selected="${INVT===k}" data-act="invtab:${k}">${n}</button>`).join('')}</div>`;
  const search=ph=>`<div class="row2" style="align-items:center"><input type="search" class="tfq" id="inv_q" value="${esc(INVQ)}" placeholder="${ph}" aria-label="Buscar" style="flex:1">${INVT==='stock'?scanBtn('inv'):''}</div>`;
  const kpi=(n,v)=>`<div class="kpi"><span class="k">${n}</span><b class="num">${v}</b></div>`;
  const head=(sub,tools='')=>`<div class="vhead"><div><h1>${tec?'Mi camioneta':'Inventario'}</h1><p class="sub">${tec?'Lo que llevás cargado. Lo que usás en cada trabajo se descuenta desde el informe de la visita; la carga la hace la empresa.':sub}</p></div>${tools&&!tec?`<div class="tools">${tools}</div>`:''}</div>`;
  if(INVT==='compras')return vCompras(head,tabs);
  if(INVT==='depositos'){
    return head(`${ds.length} depósito${ds.length===1?'':'s'} y camioneta${ds.length===1?'':'s'}`,readonly?'':'<button class="btn" data-act="invdep:vehiculo">+ Camioneta</button><button class="btn pri" data-act="invdep:deposito">+ Depósito</button>')+tabs
      +(ds.length?`<div class="list">${ds.map(d=>{const its=Object.keys(m).filter(pid=>stockOf(m,pid,d.id)>0),val=sum(its,pid=>stockOf(m,pid,d.id)*costoUYU(D.productos[pid]));
        return`<div class="row" role="button" tabindex="0" data-open="dep:${d.id}" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><strong>${d.tipo==='vehiculo'?'🚐 ':''}${esc(d.nombre)}</strong><span class="muted">${d.tipo==='vehiculo'?'Camioneta':'Depósito'}${d.tecnicoId?' · '+esc(personName(d.tecnicoId)):''} · ${its.length} artículo${its.length===1?'':'s'} con stock</span></div>${boss?`<span class="num">${money(val,'UYU')}</span>`:''}</div>`}).join('')}</div>`
      :`<div class="empty"><h2>Sin depósitos</h2><p>Creá el depósito de la empresa y una camioneta por técnico: cada uno ve lo que lleva y lo que usa en cada obra se descuenta solo.</p></div>`);
  }
  if(INVT==='movimientos'){
    const l=arr('movimientos').filter(x=>!q||qn([MOVK[x.tipo],D.productos[x.prodId]?.nombre,D.productos[x.prodId]?.codigo,depName(x.desde),depName(x.hacia),cliName(x.clienteId),x.proveedor,x.doc,x.nota].join(' ')).includes(q))
      .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||n0(b.creado)-n0(a.creado)).slice(0,300);
    return head('Entradas, salidas a obra, transferencias y ajustes',readonly?'':'<button class="btn" data-act="invnew:transf">Transferir</button><button class="btn" data-act="invnew:ing">Ingreso con lector</button><button class="btn pri" data-act="invnew:entrada">+ Entrada</button>')+tabs+search('Buscar por producto, depósito, cliente o proveedor')
      +(l.length?`<div class="list">${l.map(x=>{const p=D.productos[x.prodId];
        return`<div class="row" role="button" tabindex="0" data-open="${x.trabajoId&&D.trabajos[x.trabajoId]?'trab:'+x.trabajoId:'mov:'+x.id}" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><strong>${esc(p?.nombre||'Producto borrado')} · ${fq(x.cant,p)}</strong><span class="muted">${fdate(x.fecha)} · ${esc([x.desde?depName(x.desde):'',x.hacia?depName(x.hacia):''].filter(Boolean).join(' → '))}${x.clienteId?' · '+esc(cliName(x.clienteId)):''}${x.proveedor?' · '+esc(x.proveedor):''}${x.trabajoId?' · desde un trabajo':''}</span></div><span class="tag ${MOVC[x.tipo]||'t-none'}">${esc(MOVK[x.tipo]||x.tipo)}</span></div>`}).join('')}</div>`
      :`<div class="empty"><h2>Sin movimientos</h2><p>Cargá una entrada con lo que tenés en el depósito, o hacé un ajuste por conteo para arrancar con el stock real.</p></div>`);
  }
  if(INVT==='equipos'){
    const all=arr('equipos'),t=today();
    const l=all.filter(e=>(EQF==='todos'||(EQF==='mant'&&e.estado!=='retirado'&&eqState(e).vence)||(EQF==='gar'&&e.garantiaHasta&&e.garantiaHasta>=t))&&(!q||qn([eqName(e),e.serie,e.ubicacion,cliName(e.clienteId),pryName(e.proyectoId)].join(' ')).includes(q)))
      .sort((a,b)=>(eqState(b).vence-eqState(a).vence)||(a.proxMant||'9').localeCompare(b.proxMant||'9')||cliName(a.clienteId).localeCompare(cliName(b.clienteId),'es'));
    const fl=`<div class="seg" role="group" aria-label="Filtro" style="margin-bottom:10px">${[['todos','Todos'],['mant',`Mantenimiento a vencer${mp?' ('+mp+')':''}`],['gar','En garantía']].map(([k,n])=>`<button class="${EQF===k?'on':''}" aria-pressed="${EQF===k}" data-act="eqf:${k}">${n}</button>`).join('')}</div>`;
    return head(`${all.length} equipo${all.length===1?'':'s'} instalado${all.length===1?'':'s'} · número de serie, garantía y mantenimiento preventivo`,(all.length?'<button class="btn" data-act="eqcsv">Exportar CSV</button>':'')+(readonly?'':'<button class="btn pri" data-act="eqnew">+ Equipo</button>'))+tabs+fl+search('Buscar por número de serie, modelo, cliente o ubicación')
      +(l.length?`<div class="list">${l.map(e=>`<div class="row" role="button" tabindex="0" data-open="eq:${e.id}" style="grid-template-columns:minmax(0,1fr) auto"><div class="r-main"><strong>${esc(eqName(e))}${e.serie?` <span class="code">${esc(e.serie)}</span>`:''}</strong><span class="muted">${esc([cliName(e.clienteId)||'Sin cliente',pryName(e.proyectoId),e.ubicacion].filter(Boolean).join(' · '))}${e.instalado?' · instalado '+fdate(e.instalado):''}</span></div><span class="eqtags">${eqTags(e)}</span></div>`).join('')}</div>`
      :`<div class="empty"><h2>${all.length?'Ningún equipo coincide':'Sin equipos instalados'}</h2><p>Los equipos con número de serie se cargan solos cuando el técnico los saca del stock en un trabajo. También podés cargarlos a mano.</p></div>`);
  }
  // stock
  if(tec&&!ds.length)return head('')+tabs+`<div class="empty">${fiberArt}<h2>Todavía no tenés camioneta asignada</h2><p>Pedile a la empresa que te asigne una camioneta en Inventario → Depósitos.</p></div>`;
  if(!ds.length)return head('Stock por depósito y camioneta')+tabs+`<div class="empty">${fiberArt}<h2>Empezá por los depósitos</h2><p>Creá el depósito de la empresa y una camioneta por técnico. Después cargá una entrada o un ajuste por conteo con lo que tenés hoy.</p>${readonly?'':'<div class="actions" style="justify-content:center"><button class="btn pri" data-act="invdep:deposito">+ Depósito</button><button class="btn" data-act="invdep:vehiculo">+ Camioneta</button></div>'}</div>`;
  const prods=arr('productos').filter(p=>p.stock||m[p.id]).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  const l=prods.filter(p=>(!INVD||stockOf(m,p.id,INVD)!==0)&&(!INVMIN||bajoMin(m,p))&&(!q||qn([p.nombre,p.codigo,p.servicio].join(' ')).includes(q)));
  const val=sum(prods,p=>Math.max(0,INVD?stockOf(m,p.id,INVD):stockOf(m,p.id))*costoUYU(p)),nb=prods.filter(p=>bajoMin(m,p)).length;
  if(tec&&!ds.some(d=>d.id===INVD))INVD=ds[0]?.id||'';
  const cols=INVD?[D.depositos[INVD]].filter(Boolean):ds.slice(0,6);
  const st=p=>{const s=stockOf(m,p.id);return s<0?'<span class="tag t-bad">Negativo</span>':bajoMin(m,p)?'<span class="tag t-warn">Bajo mínimo</span>':s===0?'<span class="tag t-none">Sin stock</span>':''};
  const tools=readonly?'':`<button class="btn" data-act="invnew:transf">Movimiento</button><button class="btn" data-act="invnew:ing">Entrada de mercadería</button><button class="btn pri" data-new="prod">+ Producto</button>`;
  const filt=tec?`<div class="mini invfil"><select id="inv_dep" aria-label="Camioneta">${opts(ds.map(d=>[d.id,(d.tipo==='vehiculo'?'🚐 ':'')+d.nombre]),INVD)}</select><button class="tgl${INVMIN?' on':''}" data-act="invmin" aria-pressed="${INVMIN}">Bajo mínimo (${nb})</button></div>`:`<div class="mini invfil"><select id="inv_dep" aria-label="Depósito">${depOpts(INVD,'Todos los depósitos')}</select><button class="tgl${INVMIN?' on':''}" data-act="invmin" aria-pressed="${INVMIN}">Bajo mínimo (${nb})</button><button class="btn ghost" data-act="invcsv:stock">Exportar stock</button>${nb?'<button class="btn ghost" data-act="invcsv:compra">Lista de compra</button>':''}</div>`;
  const tot=p=>INVD?stockOf(m,p.id,INVD):stockOf(m,p.id);
  const mob=`<div class="list only-mob">${l.map(p=>`<div class="row" role="button" tabindex="0" data-open="stk:${p.id}" style="grid-template-columns:auto minmax(0,1fr) auto">${prodThumb(p,44)}<div class="r-main"><strong>${esc(p.nombre)}</strong><span class="muted">${esc(ds.filter(d=>stockOf(m,p.id,d.id)).map(d=>d.nombre+': '+fq(stockOf(m,p.id,d.id),p)).join(' · ')||'Sin stock')}</span></div><span style="text-align:right"><b class="num">${fq(tot(p),p)}</b><br>${st(p)}</span></div>`).join('')}</div>`;
  const dsk=`<div class="tablewrap only-dsk"><table><thead><tr><th>Producto</th>${cols.map(d=>`<th class="n">${esc(d.nombre)}</th>`).join('')}${INVD?'':'<th class="n">Total</th>'}<th class="n">Mínimo</th>${boss?'<th class="n">Valor (costo)</th>':''}<th></th></tr></thead>
    <tbody>${l.map(p=>`<tr data-open="stk:${p.id}" tabindex="0" style="cursor:pointer"><td><span class="pcell">${prodThumb(p,34)}<span><b>${esc(p.nombre)}</b>${p.codigo?`<br><span class="muted code">${esc(p.codigo)}</span>`:''}</td>${cols.map(d=>{const v=stockOf(m,p.id,d.id);return`<td class="n"${v<0?' style="color:var(--bad)"':''}>${v?fq(v,p):'—'}</td>`}).join('')}${INVD?'':`<td class="n"><b>${fq(stockOf(m,p.id),p)}</b></td>`}<td class="n">${n0(p.stockMin)?fq(p.stockMin,p):'—'}</td>${boss?`<td class="n">${n0(p.costo)?money(Math.max(0,tot(p))*costoUYU(p),'UYU'):'<span class="muted">sin costo</span>'}</td>`:''}<td>${st(p)}</td></tr>`).join('')}</tbody></table></div>`;
  return head(`Stock por depósito y camioneta${ds.length>6&&!INVD?' · se muestran los primeros 6 depósitos, filtrá para ver otro':''}`,tools)+tabs
    +`<div class="kpis only-dsk" style="margin:0 0 14px">${kpi('Artículos con stock',prods.filter(p=>stockOf(m,p.id)>0).length)}${boss?kpi('Valor del stock',money(val,'UYU')):kpi('Depósitos',ds.length)}${kpi('Bajo mínimo',nb)}${kpi('Mantenimientos a vencer',mp)}</div>`
    +filt+search('Buscar producto o código')
    +(l.length?mob+dsk:prods.length?'<p class="muted">Ningún producto coincide.</p>':`<div class="empty"><h2>Todavía no hay stock</h2><p>Cargá una <b>entrada</b> con lo que compraste o un <b>ajuste por conteo</b> con lo que hay hoy en cada depósito. Los productos se toman del catálogo.</p></div>`)
    +`<p class="hint" style="margin-top:12px">El stock baja solo cuando un técnico carga “Materiales del stock” en un trabajo. Los productos con número de serie quedan además como equipos instalados del cliente.</p>`;
}

    +(id?'':`<div class="fld full"><span>Código del producto</span><div class="row2"><input id="mv_code" type="text" placeholder="Código con el lector o a mano + Enter" autocomplete="off" inputmode="text">${scanBtn('mov')}</div></div>`);
  if(t==='entrada')g+=sel('hacia','Entra a',x.hacia,depOpts(x.hacia));
  if(t==='salida')g+=sel('desde','Sale de',x.desde,depOpts(x.desde));
  if(t==='transf')g+=sel('desde','Desde',x.desde,depOpts(x.desde))+sel('hacia','Hacia',x.hacia,depOpts(x.hacia));
  if(t==='devol')g+=sel('hacia','Vuelve a',x.hacia,depOpts(x.hacia));

  if(t==='salida'||t==='devol')g+=`<label class="fld" for="mv_cli"><span>Cliente</span><select id="mv_cli">${opts([['','—'],...arr('clientes').sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es')).map(c=>[c.id,c.nombre])],x.clienteId)}</select></label>`

  return sheetFrame('Inventario',id?MOVK[t]||'Movimiento':'Nuevo movimiento',`<div class="grid">${g}</div>${hint}<p class="err" id="shErr" hidden></p>`,{del:!!id&&isBoss()});

function movRead(){const g=k=>{const e=$('#mv_'+k);return e?e.value.trim():''};return{tipo:g('tipo'),fecha:g('fecha'),prodId:g('prod'),cant:g('cant'),desde:g('desde'),hacia:g('hacia'),dep:g('dep'),contado:g('contado'),costo:g('costo'),proveedor:g('proveedor'),doc:g('doc'),clienteId:g('cli'),proyectoId:g('pry'),nota:g('nota')}}
async function saveMov(){
  const r=movRead(),e=$('#shErr'),bad=t=>{e.textContent=t;e.hidden=false};
  if(!r.prodId)return bad('Elegí el producto.');
  const p=D.productos[r.prodId],base=SH.id?{...D.movimientos[SH.id]}:{creado:Date.now(),by:ME||''};
  const x={...base,tipo:r.tipo,fecha:r.fecha||today(),prodId:r.prodId,desde:'',hacia:'',nota:r.nota,clienteId:r.clienteId||'',proyectoId:r.proyectoId||''};
  if(r.tipo==='ajuste'){if(r.contado==='')return bad('Escribí cuánto contaste.');if(!r.dep)return bad('Elegí el depósito.');
    const m=stockMap(r.fecha||today());if(SH.id){const o=D.movimientos[SH.id],mo=m[o.prodId]||(m[o.prodId]={});if(o.hacia)mo[o.hacia]=(mo[o.hacia]||0)-n0(o.cant);if(o.desde)mo[o.desde]=(mo[o.desde]||0)+n0(o.cant)}
    const delta=r2(n0(r.contado)-stockOf(m,r.prodId,r.dep));if(!delta&&!SH.id){toast('El stock ya coincide con lo contado');closeSheet();return}
    Object.assign(x,{contado:n0(r.contado),cant:Math.abs(delta),[delta>=0?'hacia':'desde']:r.dep});}
  else{const c=n0(r.cant);if(!(c>0))return bad('Poné una cantidad mayor que cero.');x.cant=c;
    if(r.tipo==='entrada'){if(!r.hacia)return bad('Elegí a qué depósito entra.');x.hacia=r.hacia;x.proveedor=r.proveedor;x.doc=r.doc;if(r.costo!=='')x.costo=n0(r.costo)}
    if(r.tipo==='devol'){if(!r.hacia)return bad('Elegí a qué depósito vuelve.');x.hacia=r.hacia}
    if(r.tipo==='salida'){if(!r.desde)return bad('Elegí de dónde sale.');const disp=stockOf(stockMap(),r.prodId,r.desde);if(c>disp&&!SH.negOk){SH.negOk=true;return bad(`Hay ${fq(disp,p)} en ${depName(r.desde)}. Tocá Guardar de nuevo si igual querés dejarlo en negativo.`)}x.desde=r.desde;x.costo=n0(p?.costo)}
    if(r.tipo==='transf'){if(!r.desde||!r.hacia)return bad('Elegí origen y destino.');if(r.desde===r.hacia)return bad('El origen y el destino son el mismo.');const disp=stockOf(stockMap(),r.prodId,r.desde);if(c>disp&&!SH.negOk){SH.negOk=true;return bad(`Hay ${fq(disp,p)} en ${depName(r.desde)}. Tocá Guardar de nuevo si igual querés moverlo.`)}x.desde=r.desde;x.hacia=r.hacia}}
  const id=SH.id||uid();
  // costo promedio ponderado del producto con cada compra
  if(p&&!SH.id&&r.tipo==='entrada'&&r.costo!==''&&isBoss()){const st=Math.max(0,stockOf(stockMap(),r.prodId)),oc=n0(p.costo);
    const nc=st>0&&oc?r2((st*oc+x.cant*n0(r.costo))/(st+x.cant)):n0(r.costo);await put('productos',r.prodId,{...p,costo:nc,stock:true})}
  else if(p&&!p.stock)await put('productos',r.prodId,{...p,stock:true});
  await put('movimientos',id,x);toast('Movimiento guardado');closeSheet();
}

  const pres=sum(it.qs.filter(q=>q.estado==='aceptado'),q=>conv(calcQ(q).base,q.moneda,'UYU'));
  const mv=arr('movimientos').filter(x=>x.proyectoId===pid||(x.trabajoId&&jids.has(x.trabajoId)));
  const mat=sum(mv,x=>{const p=D.productos[x.prodId],c=n0(x.cant)*costoUYU(p,n0(x.costo)||n0(p&&p.costo));return x.tipo==='salida'?c:x.tipo==='devol'?-c:0});
  let horas=0,sinHora=0;const mo=sum(it.jobs,j=>{const h=jobHours(j);if(h==null){if(j.estado==='terminado')sinHora++;return 0}
    return sum(j.tecnicos||[],t=>{const f=payOf(t);horas+=h;return h*conv(n0(f.valorHora),f.moneda,'UYU')})});
  const sinCosto=new Set(mv.filter(x=>!n0(x.costo)&&!n0(D.productos[x.prodId]?.costo)).map(x=>x.prodId)).size;

const colIdx=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};

    if(f.m===0)return td.decode(data);return td.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())};

  if(sx)xml(sx).querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
  const sn=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/))).at(0);if(!sn)throw new Error('sheet');

    row[ci]=t==='s'?(ss[+(c.querySelector('v')?.textContent||0)]||''):t==='inlineStr'?[...c.querySelectorAll('is t')].map(x=>x.textContent).join(''):(c.querySelector('v')?.textContent||'')});rows.push(Array.from(row,x=>x??''))});

function parseCsv(t){t=t.replace(/^﻿/,'');const f0=(t.split(/\r?\n/)[0]||'');const sep=[';',',','\t'].map(s=>[s,f0.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];

async function offFlush(){
  if(OFF.busy||!OFF.q.length||!navigator.onLine||OFF.loading||!SB||!ORG)return;OFF.busy=true;let fail=0,ok=0;
  try{while(OFF.q.length){const it=OFF.q[0];let error=null;
      if(it.op==='set')({error}=await SB.from('docs').upsert({org_id:ORG,col:it.col,id:it.id,data:it.data,updated_at:new Date().toISOString()}));
      else if(it.op==='del')({error}=await SB.from('docs').delete().match({org_id:ORG,col:it.col,id:it.id}));
      else if(it.op==='up'){const b=await kvGet('foto-'+it.path);if(b){({error}=await SB.storage.from(BUCKET).upload(it.path,b,{contentType:it.type,upsert:true}));if(!error)await kvDel('foto-'+it.path)}}
      if(error&&netErr(error))break;

  finally{OFF.busy=false}

  sr();
}

const PDF_X={'€':128,'…':133,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'™':153};
const PDF_S={'−':'-','✓':'x','✔':'x','☐':'[ ]','☑':'[x]','☒':'[x]','→':'->',' ':' ',' ':' ',' ':' '};

function pdfNew(){return{W:595.28,H:841.89,m:{l:48,r:48,t:46,b:52},pages:[],imgs:[],cur:null,y:0,color:'#18202c',muted:'#5a6676',line:'#cfd6e0',acc:/^#[0-9a-f]{6}$/i.test(CFG.color||'')?CFG.color:'#1E1F23',hdr:''}}

function pdfPage(d){d.cur={ops:[]};d.pages.push(d.cur);d.y=d.m.t;if(d.pages.length>1&&d.hdr){pdfText(d,d.m.l,d.y,d.hdr,{size:8.5,color:d.muted});pdfLine(d,d.m.l,d.y+6,d.W-d.m.r,d.y+6);d.y+=20}}

/* tabla con columnas de ancho fijo (en puntos) o proporcional (0..1); repite el encabezado al cambiar de página */
function pdfTable(d,cols,rows,o={}){

function pdfBox(d,lines,o={}){const size=10,lh=14,pad=10;const h=lines.length*lh+pad*2;pdfNeed(d,h);pdfRect(d,d.m.l,d.y,pdfCW(d),h,{fill:'#f3f5f8'});let y=d.y+pad;lines.forEach((l,i)=>{if(typeof l==='string')l={t:l};pdfText(d,d.m.l+pad,y+size-1,l.t,{size:l.size||size,bold:l.bold,color:l.color});y+=lh});d.y+=h+(o.gap??12)}
const b64u8=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
function jpgDims(u){let i=2;while(i<u.length-9){if(u[i]!==0xFF){i++;continue}const m=u[i+1];if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return{h:(u[i+5]<<8)|u[i+6],w:(u[i+7]<<8)|u[i+8]};if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){i+=2;continue}i+=2+((u[i+2]<<8)|u[i+3])}return null}
/* cualquier imagen (data URL) → JPEG para el PDF; las PNG se pintan sobre blanco */
async function pdfImgFrom(dataUrl,maxPx=1400){
  if(!dataUrl)return null;

    if(/^data:image\/jpe?g/i.test(dataUrl)){const u8=b64u8(dataUrl.split(',')[1]);const dm=jpgDims(u8);if(dm&&dm.w&&dm.h&&dm.w<=maxPx&&dm.h<=maxPx)return{bytes:u8,w:dm.w,h:dm.h}}
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('img'));im.src=dataUrl});
    const s=Math.min(1,maxPx/Math.max(img.naturalWidth||1,img.naturalHeight||1));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round((img.naturalWidth||1)*s));cv.height=Math.max(1,Math.round((img.naturalHeight||1)*s));

    return{bytes:b64u8(cv.toDataURL('image/jpeg',.86).split(',')[1]),w:cv.width,h:cv.height};
  }catch(e){return null}

/* fotos en grilla de 3 por fila */

function pdfBytes(d){

    pageN.push(objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pdfN(d.W)} ${pdfN(d.H)}] /Resources ${res} /Contents ${cn} 0 R >>`))});
  objs[0]='<< /Type /Catalog /Pages 2 0 R >>';objs[1]=`<< /Type /Pages /Kids [${pageN.map(n=>n+' 0 R').join(' ')}] /Count ${np} >>`;
  objs[2]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';

async function savePdf(name,u8){

    if(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform()&&Cap.Plugins&&Cap.Plugins.Filesystem&&Cap.Plugins.Share){
      const r=await Cap.Plugins.Filesystem.writeFile({path:name,data:u8b64(u8),directory:'CACHE'});

    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u8],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);return true;

}

/* --- editor de notas (negrita, listas, casillas, títulos, enlaces); se guarda HTML limpio y también texto plano --- */
const RTE_OK={P:1,DIV:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,UL:1,OL:1,LI:1,H3:1,H4:1,A:1,BLOCKQUOTE:1,SPAN:1,IMG:1};
function rteClean(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');
  const walk=n=>{let c=n.firstChild;while(c){const nx=c.nextSibling;
    if(c.nodeType===3){c=nx;continue}
    if(c.nodeType!==1||!RTE_OK[c.tagName]){if(c.nodeType===1&&c.tagName!=='SCRIPT'&&c.tagName!=='STYLE'){const f=document.createDocumentFragment();while(c.firstChild)f.appendChild(c.firstChild);c.replaceWith(f)}else c.remove();c=n.firstChild;continue}
    for(const a of [...c.attributes]){if(c.tagName==='A'&&a.name==='href'&&/^(https?:|mailto:|tel:)/i.test(a.value))continue;
      if(c.tagName==='IMG'&&(a.name==='data-fid'||(a.name==='src'&&!c.getAttribute('data-fid')&&/^(https?:|data:image\/)/i.test(a.value))))continue;c.removeAttribute(a.name)}
    if(c.tagName==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}
    walk(c);c=nx}};
  walk(t.content);return t.innerHTML.slice(0,400000);
}
function rtePlain(el){const c=el.cloneNode(true);c.querySelectorAll('img').forEach(i=>i.replaceWith('[imagen] '));c.querySelectorAll('li').forEach(li=>li.prepend('• '));c.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));c.querySelectorAll('p,div,li,h3,h4,blockquote').forEach(x=>x.append('\n'));return c.textContent.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim().slice(0,20000)}
const rteFromPlain=t=>t?'<p>'+esc(String(t)).replace(/\n/g,'<br>')+'</p>':'';
const RTB=[['img','🖼','Imagen (foto o captura)'],['bold','B','Negrita'],['italic','I','Cursiva'],['underline','U','Subrayado'],['insertUnorderedList','•','Lista'],['insertOrderedList','1.','Lista numerada'],['chk','☐','Casilla para tildar'],['h','T','Título'],['link','⌘','Enlace'],['clear','✕','Quitar formato']];
function rteHtml(id,f,v){
  const html=rteResolveImgs(/<[a-z][\s\S]*>/i.test(String(v||''))?rteClean(v):rteFromPlain(v||''));
  return`<div class="fld ${f.w||''} rtew"><span>${f.l}</span><div class="rtbar" data-rte="${id}" role="toolbar">${readonly?'':RTB.map(([c,t,l])=>`<button type="button" class="rtb" data-rt="${c}" title="${l}" aria-label="${l}">${t}</button>`).join('')}</div><div class="rte" id="${id}" contenteditable="${readonly?'false':'true'}" data-ph="${esc(f.ph||'Escribí acá…')}">${html}</div></div>`;

function rteCmd(b){
  const ed=document.getElementById(b.closest('.rtbar').dataset.rte);if(!ed||readonly)return;ed.focus();const c=b.dataset.rt;
  if(c==='chk'){const sel=window.getSelection();const r=sel&&sel.rangeCount?sel.getRangeAt(0):null;const atStart=!r||(r.startOffset===0&&(r.startContainer===ed||!r.startContainer.textContent.slice(0,r.startOffset).trim()))||/\n$/.test(r.startContainer.textContent.slice(0,r.startOffset));document.execCommand('insertText',false,(atStart?'':'\n')+'☐ ')}

async function scanOpen(ctx){
  let w=$('#scan');if(!w){w=document.createElement('div');w.id='scan';w.innerHTML=`<div class="scan-h"><b>Escanear código</b><button class="x" data-act="scanclose" aria-label="Cerrar">✕</button></div><video playsinline muted autoplay></video><div class="scan-f"><input type="text" id="scan_manual" placeholder="O escribilo acá y Enter" inputmode="text" autocomplete="off"><p class="hint" id="scanMsg">Apuntá al código de barras o QR del producto.</p></div>`;document.body.appendChild(w)}

      try{reader.decodeFromVideoElementContinuously(v,(res)=>{if(res&&SCAN){try{reader.reset()}catch(e){}done(res.getText())}})}catch(e){msg.textContent='El lector no arrancó. Escribí el código abajo.';return}
      msg.textContent='Apuntá al código de barras o QR del producto.'}
  }catch(e){msg.textContent='No se pudo abrir la cámara (permiso denegado). Escribí el código abajo.'}

  if(t.id==='scan_manual'){e.preventDefault();const c=t.value.trim();if(c&&SCAN){const d=SCAN.done;t.value='';d(c)}return}
  if(t.id==='mv_code'){e.preventDefault();const c=t.value.trim();if(c){t.value='';scanApply('mov',c)}return}
  if(t.id==='ing_code'){e.preventDefault();const c=t.value.trim();if(c){t.value='';scanApply('ing',c)}return}
  if(t.id==='oc_code'){e.preventDefault();const c=t.value.trim();if(c){t.value='';scanApply('oc',c)}return}
  if(t.id==='inv_q'&&/^\d{8,14}$/.test(t.value.trim())){const p=scanFind(t.value.trim());if(p){e.preventDefault();INVQ=p.codigo||p.nombre;sr()}}
});

function relText(r){

  const secs=[];(r.items||[]).forEach(it=>{const k=it.ubic||'';let s=secs.find(x=>x.k===k);if(!s){s={k,l:[]};secs.push(s)}s.l.push(it)});
  secs.forEach(s=>{L.push('');if(s.k)L.push(s.k+':');s.l.forEach(it=>{const u=U[it.unidad||'unidad']||'';const ex=[it.metros?`${r2(it.metros)} m de cable`:'',it.canal?CANALN[it.canal]||it.canal:'',it.altura?`a ${r2(it.altura)} m`:''].filter(Boolean).join(', ');L.push(`(${r2(it.cant||0).toLocaleString('es-UY')}${u?' '+u:''}) ${it.desc||''}${ex?' · '+ex:''}`.trim())})});
  const q=(RSERV[r.servicio]||[]).filter(f=>(r.q||{})[f.k]).map(f=>f.t==='checkbox'?f.l:`${f.l}: ${(r.q||{})[f.k]}`);if(q.length){L.push('');L.push(...q)}
  if(n0(r.jornales)){L.push('');L.push(`Tiempo: ${r2(r.jornales)} jornal${r.jornales==1?'':'es'}${r.dificultad&&r.dificultad!=='Normal'?' · dificultad '+r.dificultad.toLowerCase():''}`)}

  if(r.geo)L.push(`Ubicación: https://maps.google.com/?q=${r.geo.lat},${r.geo.lng}`);
  return L.join('\n');

function relItemsToLines(r,mon,out){

    const ex=out.find(o=>o.desc===l.desc&&o.unidad===l.unidad);if(ex)ex.cant=r2(ex.cant+cant);else out.push(l)});

/* --- imágenes en el editor: se suben al almacenamiento y quedan referenciadas por id (no infla la base) --- */
function rteInsertImage(edId){
  const ed=document.getElementById(edId);if(!ed||readonly)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.hidden=true;document.body.appendChild(inp);
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;ed.focus();
    try{const b=await shrinkRte(f);let html;
      if(AS){const up=await AS.upload(b,{type:b.type||f.type});html=`<img data-fid="${esc(up.id)}" src="${esc(blobUrl(up.id))}" alt="">`}
      else{const du=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});html=`<img src="${du}" alt="">`}
      document.execCommand('insertHTML',false,html+'<p><br></p>');if(SH)SH.dirty=true;toast('Imagen agregada')}
    catch(e){toast(upErr(e))}};
  inp.click();
}
async function shrinkRte(f){
  try{const bmp=await createImageBitmap(f);const s=Math.min(1,1400/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8));return b||f}catch(e){return f}
}
const rteResolveImgs=html=>String(html||'').replace(/<img([^>]*?)data-fid="([^"]+)"([^>]*)>/g,(m,a,id,c)=>`<img${a}data-fid="${id}"${c.replace(/\ssrc="[^"]*"/,'')} src="${esc(blobUrl(id))}">`);
function refreshFidImgs(){document.querySelectorAll('img[data-fid]').forEach(im=>{const u=URLS[im.dataset.fid];if(u&&im.getAttribute('src')!==u.url)im.src=u.url})}
// pegar o soltar imágenes directamente en el editor
document.addEventListener('paste',e=>{const ed=e.target.closest&&e.target.closest('.rte');if(!ed||!ed.isContentEditable)return;const it=[...((e.clipboardData||{}).items||[])].find(x=>x.type&&x.type.startsWith('image/'));if(!it)return;e.preventDefault();e.stopImmediatePropagation();const f=it.getAsFile();if(f)rteDropFile(ed,f)},true);
document.addEventListener('drop',e=>{const ed=e.target.closest&&e.target.closest('.rte');if(!ed||!ed.isContentEditable)return;const f=[...((e.dataTransfer||{}).files||[])].find(x=>x.type.startsWith('image/'));if(!f)return;e.preventDefault();rteDropFile(ed,f)});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.rte'))e.preventDefault()});
async function rteDropFile(ed,f){ed.focus();try{const b=await shrinkRte(f);let html;if(AS){const up=await AS.upload(b,{type:b.type||f.type});html=`<img data-fid="${esc(up.id)}" src="${esc(blobUrl(up.id))}" alt="">`}else{const du=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});html=`<img src="${du}" alt="">`}document.execCommand('insertHTML',false,html+'<p><br></p>');if(SH)SH.dirty=true}catch(e){toast(upErr(e))}}

async function croquisNuevo({relId,pryId}){

  for(let x=0;x<=W;x+=100){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke()}for(let y=0;y<=H;y+=100){g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke()}
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8));
  let up;try{up=await AS.upload(blob,{type:'image/jpeg'})}catch(e){toast(upErr(e));return}
  const r=relId?D.relevamientos[relId]:null,pry=pryId?D.proyectos[pryId]:null;

  await put('planos',id,doc);D.planos[id]=doc;
  openPlan(id);PV.mode='dibujo';PV.dtool='pared';PV.dcol=DCOLS[0][0];renderPv(true);toast('Croquis creado: dibujá las paredes tocando cada esquina y “Terminar”.');
}

function drawDibujo(p){

/* --- cable y canalización por ítem → líneas del presupuesto --- */
function relCanalLines(r,mon,out){
  const add=l=>{if(!l||!l.cant)return;const ex=out.find(o=>o.desc===l.desc&&o.unidad===l.unidad);if(ex)ex.cant=r2(ex.cant+l.cant);else out.push(l)};
  const porCanal={};let cable=0;
  (r.items||[]).forEach(it=>{const m=n0(it.metros);if(!m)return;const veces=n0(it.cant)||1;const mt=m*veces;cable+=mt;if(it.canal)porCanal[it.canal]=(porCanal[it.canal]||0)+mt});
  if(cable){const kw=/fibra/i.test(r.servicio||'')?['fibra']:/coax/i.test(JSON.stringify(r.items||''))?['coaxil','coax']:['utp','cat6','cat 6','cable de red'];add(lineFor(kw,'Cable (metros)',Math.ceil(cable*1.1),'metro',mon))}
  Object.entries(porCanal).forEach(([c,m])=>{const mm=Math.ceil(m*1.1);
    if(c==='cano'){add(lineFor(['caño','cano','daisa'],'Caño (metros)',mm,'metro',mon));add(lineFor(['grampa','grapa'],'Grampas',Math.ceil(m/1.5),'unidad',mon))}
    else if(c==='pvc')add(lineFor(['pvc','conducto'],'Conducto PVC (metros)',mm,'metro',mon));
    else if(c==='canaleta')add(lineFor(['canaleta'],'Canaleta (metros)',mm,'metro',mon));
    else if(c==='bandeja')add(lineFor(['bandeja'],'Bandeja portacable (metros)',mm,'metro',mon))});
}

async function agAct(k,arg,el){
  if(k==='agt'){AGT=arg;lsSet('olumi.ag',arg);sr();return true}
  if(k==='agsend'){const t=$('#agTxt');const tx=t?t.value:'';if(t)t.value='';await agEnviar(arg,tx);return true}
  if(k==='agok'){lsSet('olumi.agok.'+(ME||''),'1');sr();return true}
  if(k==='agno'){lsSet('olumi.agok.'+(ME||''),'');toast('Listo: las asistentes no reciben más datos tuyos');sr();return true}
  if(k==='agclear'){for(const m of agMsgs(arg))await remove('agentes_chat',m.id);sr();return true}
  if(k==='agcfg'){openSheet('agcfg');return true}
  if(k==='aprob'){const x=D.aprobaciones[arg];if(!x)return true;const cli=arr('clientes').find(c=>norm2(c.nombre)===norm2(x.cliente));
    await put('aprobaciones',arg,{...x,estado:'aprobado',aprobadoPor:ME||'',aprobadoEn:Date.now()});
    openSheet('pres',null,{copy:{numero:'',oportunidadId:'',proyectoId:'',clienteId:cli?cli.id:'',fecha:today(),validez:15,moneda:x.moneda||defMon(),estado:'borrador',iva:true,descuento:0,lineas:(x.lineas||[]).map(l=>({desc:l.desc||'',cant:n0(l.cant)||1,unidad:l.unidad||'unidad',precio:n0(l.precio)})),condiciones:CFG.condiciones||'',notas:(x.nota||'')+(cli?'':(x.cliente?'\nCliente: '+x.cliente:''))}});return true}
  if(k==='aprobok'||k==='aprobno'){const x=D.aprobaciones[arg];if(x)await put('aprobaciones',arg,{...x,estado:k==='aprobok'?'aprobado':'descartado',aprobadoPor:ME||'',aprobadoEn:Date.now()});sr();return true}
  if(k==='ent2tkq'){const e=D.entradas[arg];if(!e)return true;const c=e.contacto||{};const tipo={falla:'reclamo',trabajo:'instalacion',presupuesto:'relevamiento',consulta:'consulta'}[e.tipo]||'consulta';
    openSheet('tk',null,{cli:e.clienteId||'',draft:{titulo:e.titulo||'',descripcion:[e.resumen,e.texto].filter(Boolean).join('\n\n'),mensaje:e.texto||'',tipo:e.urgente?'emergencia':tipo,origen:e.canal==='mail'?'Email':'WhatsApp',contacto:e.clienteId?null:c,entradaId:arg,waFrom:(c.telefono||e.de||'').replace(/\D/g,''),waNombre:c.nombre||e.nombre||''}});if(SH)SH.dirty=true;return true}

function blobUrl(id){

  if(OFF.q.some(x=>x.op==='up'&&x.path===id)){kvGet('foto-'+id).then(b=>{if(b){URLS[id]={url:URL.createObjectURL(b),exp:Date.now()+864e5};sr()}});return PIXEL}if(SB&&ORG){urlPend.add(id);clearTimeout(urlT);urlT=setTimeout(signPending,30)}

async function signPending(){

    (data||[]).forEach(r=>{if(r.signedUrl&&r.path){URLS[r.path]={url:r.signedUrl,exp:Date.now()+(URL_TTL-3600)*1000};any=true}})}

/* Mismos verbos que usaba la app: colecciones y documentos en vivo */
const LIVE={};
const liveCol=c=>LIVE[c]||(LIVE[c]={map:{},cbs:[],loaded:false});
function snapOf(col){const L=liveCol(col);const docs=Object.entries(L.map).map(([id,data])=>({id,exists:true,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}}));
  return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
function emit(col){arrDirty();offSnapLive();const L=liveCol(col);if(!L.loaded)return;const s=snapOf(col);L.cbs.forEach(cb=>{try{cb(s)}catch(e){console.error(e)}});if(col==='trabajos'||col==='clientes'||col==='config')prefetchUrls()}
const SBDB={
  collection(col){return{
    doc:id=>SBDB.doc(col+'/'+id),
    onSnapshot(next){const L=liveCol(col);L.cbs.push(next);if(L.loaded)setTimeout(()=>next(snapOf(col)));return()=>{L.cbs=L.cbs.filter(x=>x!==next)}}
  }},
  doc(path){const [col,id]=path.split('/');const L=liveCol(col);return{
    async set(data){L.map[id]=data;emit(col);
      if(OFF.q.length||!navigator.onLine||OFF.loading){await offQueue({op:'set',col,id,data});return}
      const {error}=await SB.from('docs').upsert({org_id:ORG,col,id,data,updated_at:new Date().toISOString()});
      if(error&&netErr(error)){await offQueue({op:'set',col,id,data});return}
      if(error){loadAll().catch(()=>{});throw sbErr(error)}},
    async update(f){const cur=L.map[id];if(!cur)throw{code:'not_found',message:'No existe'};return this.set({...cur,...f})},
    async delete(){delete L.map[id];emit(col);
      if(OFF.q.length||!navigator.onLine||OFF.loading){await offQueue({op:'del',col,id});return}
      const {error}=await SB.from('docs').delete().match({org_id:ORG,col,id});
      if(error&&netErr(error)){await offQueue({op:'del',col,id});return}
      if(error){loadAll().catch(()=>{});throw sbErr(error)}},
    onSnapshot(next){const w=()=>{const d=L.map[id];next({id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}})};
      L.cbs.push(w);if(L.loaded)setTimeout(w);return()=>{L.cbs=L.cbs.filter(x=>x!==w)}}
  }}
};

async function teamAct(k,el){
  if(k==='logout'){await pushOff();try{await kvDel('snap-'+ORG);if(!OFF.q.length)await kvDel('cola-'+ORG);['olumi.members.'+ORG,'olumi.mems.'+ME,'olumi.plan.'+ORG,'olumi.org'].forEach(k=>localStorage.removeItem(k))}catch(e){}await SB.auth.signOut();location.reload();return true}
  if(k==='sopdar'){const d=Number(String(el.dataset.act||'').slice(7))||7;const {data,error}=await SB.rpc('soporte_permitir',{o:ORG,dias:d});if(error){toast('No se pudo habilitar. ¿Está corrido soporte-1.20.sql?');return true}toast('Soporte habilitado hasta '+sopHasta(data));await loadSoporte();return true}
  if(k==='sopcortar'){if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='¿Cortar? Tocá de nuevo';return true}armed=null;const {error}=await SB.rpc('soporte_cortar',{o:ORG});if(error){toast('No se pudo cortar.');return true}toast('Acceso cortado');await loadSoporte();return true}
  if(k==='sopsalir'){localStorage.removeItem('olumi.soporte');const real=(MEMS||[]).find(m=>!m.soporte);if(real)lsSet('olumi.org',real.org_id);else localStorage.removeItem('olumi.org');location.reload();return true}
  if(k==='sopentrar'){const id=String(el.dataset.act||'').slice(10);if(!id)return true;lsSet('olumi.soporte',id);lsSet('olumi.org',id);lsSet('crm.view','hoy');location.reload();return true}
  if(k==='ajtab'){const id=String(el.dataset.act||'').slice(6);AJTAB=id;document.querySelectorAll('.ajtabs button').forEach(b=>b.classList.toggle('on',b.dataset.act==='ajtab:'+id));const t=document.getElementById(id);if(t){const y=t.getBoundingClientRect().top+window.scrollY-70;window.scrollTo({top:y,behavior:'smooth'})}return true}
  if(k==='pwreset'){const mail=String(el.dataset.act||'').slice(8);if(!mail)return true;if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='¿Mandar mail a '+mail+'?';return true}armed=null;const {error}=await SB.auth.resetPasswordForEmail(mail,{redirectTo:PORTAL_URL});toast(error?'No se pudo mandar el mail.':'Listo: le llega un mail para elegir la contraseña nueva.');sr();return true}
  if(k==='copycode'){const c=(ORGINFO&&ORGINFO.join_code)||'';try{await navigator.clipboard.writeText(c);toast('Código copiado')}catch(e){toast('Código: '+c)}return true}
  if(k==='newcode'){const {data,error}=await SB.rpc('new_join_code',{o:ORG});if(error){toast('No se pudo cambiar el código.');return true}ORGINFO.join_code=data;sr();toast('Código nuevo listo');return true}
  if(k==='setupoff'){try{localStorage.setItem('olumi.setupoff.'+ORG,'1')}catch(e){}toast('Listo. Lo seguís cuando quieras desde Menú → Primeros pasos.');sr();return true}
  if(k==='myorgdel'){const nm=($('#myorg_del').value||'').trim(),real=String((ORGINFO&&ORGINFO.name)||'').trim();
    if(!nm||nm.toLowerCase()!==real.toLowerCase()){toast('Escribí el nombre exacto de la empresa.');return true}
    if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='Se borra todo para siempre. Tocá de nuevo';return true}armed=null;
    const {error}=await SB.rpc('delete_my_org',{o:ORG,nombre:nm});if(error){toast(empErr(error));return true}
    localStorage.removeItem('olumi.org');toast('Empresa borrada');setTimeout(()=>location.reload(),600);return true}
  if(k==='leaveorg'){
    if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='¿Salir? Tocá de nuevo';return true}armed=null;
    const {error}=await SB.rpc('leave_org',{o:ORG});if(error){toast(empErr(error));return true}
    localStorage.removeItem('olumi.org');setTimeout(()=>location.reload(),300);return true}
  if(k==='delacct'){
    if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='Se borra tu cuenta para siempre. Tocá de nuevo';return true}
    const {error}=await SB.rpc('delete_my_account');if(error){toast('No se pudo eliminar la cuenta.');return true}
    await SB.auth.signOut();location.reload();return true}
  return false;
}
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset&&t.dataset.orgsel!=null){lsSet('olumi.org',t.value);location.reload();return}if(!t.dataset||!t.dataset.role)return;
  const {error}=await SB.from('members').update({role:t.value}).match({org_id:ORG,user_id:t.dataset.role});
  if(error){toast('No se pudo cambiar el rol.');return}MEMBERS[t.dataset.role].role=t.value;toast('Rol actualizado')});

/* ---------- arranque ---------- */
render();
const slowT=setTimeout(()=>{slow=true;sr()},10000);
let booted=false;
async function boot(){
  if(!SB){clearTimeout(slowT);showAuth('config');return}
  if(PEDIR){clearTimeout(slowT);showAuth('pedido');return}
  const {data:{session}}=await SB.auth.getSession();
  if(!session){clearTimeout(slowT);showAuth('login');return}
  ME=session.user.id;
  if(/type=(invite|recovery)/.test(AUTHHASH)&&!PASSDONE){clearTimeout(slowT);showAuth('setpass');return}
  try{const {data:nc}=await SB.rpc('claim_invites');if(nc>0){const r=await SB.from('members').select('org_id,created_at').eq('user_id',ME).order('created_at',{ascending:false}).limit(1);const nw=(r.data||[])[0];if(nw)lsSet('olumi.org',nw.org_id)}}catch(e){}
  let {data:mems,error}=await SB.from('members').select('org_id,role,orgs(name,join_code)').eq('user_id',ME);
  if(error&&netErr(error)){const c=lsJ('olumi.mems.'+ME);if(c&&c.length){mems=c;error=null;OFF.stale=true}}
  if(error){showAuth('login',authErrText(error));return}
  if(!OFF.stale)lsSetJ('olumi.mems.'+ME,mems);
  /* 1.20: soporte Unity Tech */
  {const sop=lsGet('olumi.soporte');if(sop&&!mems.some(m=>m.org_id===sop)){let og=null;try{const r=await SB.from('orgs').select('id,name,join_code').eq('id',sop);og=(r.data||[])[0]||null}catch(e){}
    if(og){mems=[...mems,{org_id:sop,role:'admin',soporte:true,orgs:{name:og.name,join_code:og.join_code}}];lsSet('olumi.org',sop)}else{localStorage.removeItem('olumi.soporte');if(lsGet('olumi.org')===sop)localStorage.removeItem('olumi.org')}}}
  if(!mems.length){clearTimeout(slowT);showAuth('org');return}
  MEMS=mems;const pick=mems.find(m=>m.org_id===lsGet('olumi.org'))||mems[0];SOPORTE=!!pick.soporte;
  try{if(lsGet('olumi.geo')==='1'){VIVO.geoOn=true;setTimeout(geoStart,3000)}}catch(e){}
  ORG=pick.org_id;ROLE=pick.role;ORGINFO={id:ORG,...(pick.orgs||{})};lsSet('olumi.org',ORG);
  readonly=ROLE==='viewer'||ROLE==='cliente'||ROLE==='pendiente';
  if(!lsGet('crm.view')&&!PORTAL())VIEW=isLead()?'hoy':ROLE==='tecnico'||ROLE==='subcontratista'?'campo':'tickets';
  try{if(!PORTAL()&&!isTec()&&viewOk('oficina')&&!sessionStorage.getItem('olumi.ses')){VIEW='oficina';lsSet('crm.view',VIEW)}sessionStorage.setItem('olumi.ses','1')}catch(e){}
  DB=SBDB;USER=SBUSER;AS=(readonly&&ROLE!=='cliente')?null:SBAS;DL=SBDL;SAMPLE=null;
  hideAuth();mode='live';await offLoadQ();
  {const cp=lsJ('olumi.plan.'+ORG);if(cp)PLAN=cp}
  const pre=Promise.allSettled([loadMembers(),loadPlan(),loadInvites()]).then(()=>{
    if(Object.keys(MEMBERS).length)lsSetJ('olumi.members.'+ORG,MEMBERS);else{const c=lsJ('olumi.members.'+ORG);if(c)MEMBERS=c}
    if(PLAN)lsSetJ('olumi.plan.'+ORG,PLAN);refreshNames();sr()});
  if(!booted){booted=true;
    const done=k=>{loaded.add(k);if(loaded.size>=NEED)clearTimeout(slowT)};
    COLS.forEach(col=>DB.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());D[col]=o;done(col);sr();refreshNames()}));
    DB.doc('config/empresa').onSnapshot(s=>{CFG=s.exists?{...s.data()}:{};done('cfg');sr()});
  }
  subscribeLive();
  const dataP=loadAll().catch(e=>{toast('No se pudieron cargar los datos. Revisá la conexión.');const re=()=>loadAll().then(()=>sr()).catch(()=>setTimeout(re,15000));setTimeout(re,15000)});
  await pre;if(PORTAL())await loadStaff();await dataP;
  sr();refreshNames();afterPayment();setTimeout(onbCheck,1200);
  if(!['cliente','pendiente'].includes(ROLE))setTimeout(pushInit,2000);
}
if(SB)SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ORG)location.reload()});
boot();
})();
