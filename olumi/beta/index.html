<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: sidebar (desktop) / bottom tabs (phone) + work surface; pipeline stages colored after the fiber-optic strand code */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --surface-2:#F7F7F4; --line:#D9D9D3; --line-2:#E8E8E3;
  --fg:#1E1F23; --muted:#5C5E66; --accent:#1E1F23; --accent-fg:#FFC93C; --accent-soft:#ECECE6;
  --ok:#16794a; --ok-soft:#dcf2e6; --warn:#a35a00; --warn-soft:#fbecd5; --bad:#b4312a; --bad-soft:#fbe1df;
  --s-nuevo:#1f5fd6; --s-relev:#e0701a; --s-pres:#8b5a2b; --s-neg:#7a46cc; --s-gan:#16794a; --s-per:#6b7787;
  --shadow:0 1px 2px rgb(20 28 40 / .06), 0 3px 10px rgb(20 28 40 / .05);
  --scrim:rgb(12 18 28 / .42);
  --f-head:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-mode]){
  --bg:#1E1F23; --surface:#2A2C31; --surface-2:#313339; --line:#3D3F46; --line-2:#34363C;
  --fg:#F3F3F1; --muted:#A9ABB2; --accent:#FFC93C; --accent-fg:#1E1F23; --accent-soft:#3D3622;
  --ok:#56c98b; --ok-soft:#13301f; --warn:#f2a945; --warn-soft:#35260e; --bad:#f07a72; --bad-soft:#3b1816;
  --s-nuevo:#6c9bff; --s-relev:#f5954a; --s-pres:#c4935f; --s-neg:#a985f0; --s-gan:#56c98b; --s-per:#8e9bad;
  --shadow:0 1px 2px rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1E1F23; --surface:#2A2C31; --surface-2:#313339; --line:#3D3F46; --line-2:#34363C;
  --fg:#F3F3F1; --muted:#A9ABB2; --accent:#FFC93C; --accent-fg:#1E1F23; --accent-soft:#3D3622;
  --ok:#56c98b; --ok-soft:#13301f; --warn:#f2a945; --warn-soft:#35260e; --bad:#f07a72; --bad-soft:#3b1816;
  --s-nuevo:#6c9bff; --s-relev:#f5954a; --s-pres:#c4935f; --s-neg:#a985f0; --s-gan:#56c98b; --s-per:#8e9bad;
  --shadow:0 1px 2px rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .6); color-scheme:dark }

/* preferencia propia del CRM: claro, oscuro o automático por horario */
:root[data-mode="light"]{--bg:#F2F2EF;--surface:#FFFFFF;--surface-2:#F7F7F4;--line:#D9D9D3;--line-2:#E8E8E3;--fg:#1E1F23;--muted:#5C5E66;--accent:#1E1F23;--accent-fg:#FFC93C;--accent-soft:#ECECE6;--ok:#16794a;--ok-soft:#dcf2e6;--warn:#a35a00;--warn-soft:#fbecd5;--bad:#b4312a;--bad-soft:#fbe1df;--s-nuevo:#1f5fd6;--s-relev:#e0701a;--s-pres:#8b5a2b;--s-neg:#7a46cc;--s-gan:#16794a;--s-per:#6b7787;--shadow:0 1px 2px rgb(20 28 40 / .06), 0 3px 10px rgb(20 28 40 / .05);--scrim:rgb(12 18 28 / .42);color-scheme:light}
:root[data-mode="dark"]{--bg:#1E1F23; --surface:#2A2C31; --surface-2:#313339; --line:#3D3F46; --line-2:#34363C;
  --fg:#F3F3F1; --muted:#A9ABB2; --accent:#FFC93C; --accent-fg:#1E1F23; --accent-soft:#3D3622;
  --ok:#56c98b; --ok-soft:#13301f; --warn:#f2a945; --warn-soft:#35260e; --bad:#f07a72; --bad-soft:#3b1816;
  --s-nuevo:#6c9bff; --s-relev:#f5954a; --s-pres:#c4935f; --s-neg:#a985f0; --s-gan:#56c98b; --s-per:#8e9bad;
  --shadow:0 1px 2px rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .6); color-scheme:dark}

/* Grafito: amarillo para lo que se toca, naranja para lo urgente */
:root{--yel:#E0A800;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#FFE4CF;--urg-text:#A84300;--yel-soft:#FFF0C2;--yel-text:#6E5200}
@media (prefers-color-scheme: dark){:root:not([data-mode]){--yel:#FFC93C;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#45311F;--urg-text:#FF9B52;--yel-soft:#3D3622;--yel-text:#FFC93C}}
:root[data-theme="dark"]{--yel:#FFC93C;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#45311F;--urg-text:#FF9B52;--yel-soft:#3D3622;--yel-text:#FFC93C}
:root[data-mode="light"]{--yel:#E0A800;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#FFE4CF;--urg-text:#A84300;--yel-soft:#FFF0C2;--yel-text:#6E5200}
:root[data-mode="dark"]{--yel:#FFC93C;--urg:#FF7A1A;--urg-fg:#1E1F23;--urg-soft:#45311F;--urg-text:#FF9B52;--yel-soft:#3D3622;--yel-text:#FFC93C}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-head);font-stretch:108%;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num,.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* shell */
.app{min-height:100%;display:grid;grid-template-columns:212px minmax(0,1fr)}
.nav{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px;padding-left:max(10px, env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand svg{flex:none}
.brand strong{display:block;font-family:var(--f-head);font-stretch:112%;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.brand span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;color:var(--muted);font-weight:600;position:relative}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .pill{margin-left:auto;background:var(--bad);color:var(--surface);font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
.shell{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:var(--gl);padding-right:var(--gr)}
.top .mbrand{display:none}
.bell{position:relative;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.bell svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell .pill{position:absolute;top:-5px;right:-5px;margin:0}
.av-it{align-items:flex-start}.av-ic{font-size:18px;line-height:1.3}.av-new{background:color-mix(in srgb,var(--acc,#FFC93C) 14%,transparent);border-radius:10px}
.search{flex:1;min-width:0;position:relative}
.search input[type=search]{width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
#banner:empty{display:none}
#banner{padding-left:var(--gl);padding-right:var(--gr);padding-block:10px 0}
.note{border-radius:8px;padding:9px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line)}
main{padding-left:var(--gl);padding-right:var(--gr);padding-block:18px 40px;min-width:0}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.tgl{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.tgl.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input:not([type]),input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],input[type=email],input[type=tel],input[type=password],input[type=time],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;box-sizing:border-box}
textarea{resize:vertical;min-height:72px;width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width: 899px), (pointer: coarse){input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=range]),select,textarea{font-size:16px}}
@media (pointer: coarse){.btn,.tgl,.seg button,.x,.snz,.step,.dayadd{min-height:44px}.btn.sm{min-height:36px}.rmph{padding:8px 11px;font-size:14px}.ql .rm{min-width:40px;min-height:40px}.arow input[type=checkbox],.tarck,.fld.chk input{width:24px;height:24px}}

.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:16px}
.vhead h1{font-size:26px;font-weight:750;font-stretch:115%}
.sub{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start}
.col{flex:0 0 min(272px, 84vw);scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100dvh - 190px);min-width:0}
.col.over{outline:2px dashed var(--sc);outline-offset:-2px}
.colh{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 8px;padding:12px 12px 10px;border-bottom:3px solid var(--sc)}
.colh .dot{width:10px;height:10px;border-radius:50%;background:var(--sc)}
.colh h2{font-size:14px;font-weight:700}
.colh .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.colh .tot{grid-column:2 / 4;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto;min-height:40px}
.nocards{margin:6px 2px;color:var(--muted);font-size:13px}
.addq{border:0;background:none;color:var(--muted);text-align:left;padding:8px 14px 12px;font-weight:600}
.addq:hover{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:var(--line)}
.card.drag{opacity:.45}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.svc{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stars{color:var(--warn);font-size:12px;letter-spacing:1px}
.card h3{font-family:var(--f-body);font-stretch:100%;font-size:14.5px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.ccli{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.cbot{display:flex;align-items:center;gap:8px;margin-top:3px}
.cbot .amt{font-size:13px;font-weight:500;margin-right:auto}
.tag{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-none{background:var(--surface-2);color:var(--muted)}
.t-acc{background:var(--accent-soft);color:var(--accent)}
.av{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface-2)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 130px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row strong{display:block;overflow-wrap:anywhere}
.row .r-num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.row .r-meta{color:var(--muted);font-size:13px}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 130px;gap:12px;padding:0 16px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lhead span:nth-child(n+3){text-align:right}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-top:1px solid var(--line-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.code{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* agenda */
.group{margin-bottom:22px}
.group h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line-2)}
.arow:first-child{border-top:0}
.arow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.a-main{cursor:pointer;min-width:0}
.a-main strong{display:block;overflow-wrap:anywhere}
.a-main .muted{font-size:13px}
.atype{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.arow.done strong{text-decoration:line-through;color:var(--muted)}
.when{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.snz{border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:11.5px;font-weight:600;padding:1px 8px;color:var(--muted)}
.snz:hover{color:var(--accent);border-color:var(--accent)}
.psearch{margin-top:6px;font-size:13px}
.themebox{margin-top:auto;padding:12px 6px 4px;display:flex;flex-direction:column;gap:6px}
.themebox .seg{display:flex;width:100%}
.themebox .seg button{flex:1;padding:5px 2px;font-size:11.5px}
input[type=color]{height:38px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.blogo{width:30px;height:30px;object-fit:contain;border-radius:6px;flex:none}
.logoprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoprev img{height:44px;max-width:160px;object-fit:contain;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px}
.navsec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.nav .mob{display:none}
/* prioridad */
.pr{font-family:var(--f-mono);font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap}
.pr1{background:var(--urg);color:var(--urg-fg)}
.pr2{background:var(--urg-soft);color:var(--urg-text)}
.pr3{background:var(--yel-soft);color:var(--yel-text)}
.pr4{background:var(--surface-2);color:var(--muted)}
.t-abo{background:var(--yel-soft);color:var(--yel-text)}
.tkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-2);cursor:pointer}
.tkrow:first-child{border-top:0}
.tkrow:hover{background:var(--surface-2)}
.tkrow .tk-main{min-width:0}
.tkrow .tk-main strong{display:block;overflow-wrap:anywhere}
.tkrow .tk-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:3px}
.tkrow .tk-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tk-est{font-size:11.5px;font-weight:650;color:var(--muted)}
/* calendario */
.calnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day.off{background:var(--surface-2)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 6px;border-bottom:1px solid var(--line-2)}
.dayh b{font-family:var(--f-head);font-size:13px}
.dayh span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dayb{display:flex;flex-direction:column;gap:6px;padding:8px;flex:1}
.ev{border-radius:8px;background:var(--surface-2);border-left:4px solid var(--ec,var(--accent));padding:6px 8px;cursor:pointer;font-size:12.5px;min-width:0}
.ev b{display:block;font-weight:650;overflow-wrap:anywhere}
.ev .h{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ev.done{opacity:.55}
.ev.fu{border-left-style:dashed;background:none;border:1px dashed var(--line);border-left:4px dashed var(--line)}
.dayadd{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 8px 8px;text-align:left}
.dayadd:hover{color:var(--accent)}
/* campo */
.jobs{display:flex;flex-direction:column;gap:12px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;cursor:pointer}
.job .hr{font-family:var(--f-mono);font-size:20px;font-weight:500;letter-spacing:-.03em}
.job h3{font-size:16px}
.job .sub2{grid-column:2 / -1;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.job.done{opacity:.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a.btn{text-decoration:none;color:var(--fg)}

/* ---------- 1.10: apariencia renovada · tipografía del sistema, barras traslúcidas, bordes suaves (estilo Apple) ---------- */
:root{--f-head:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--r:12px;--rc:16px;

:root[data-mode="light"]{--bg:#F5F5F7;--surface:#FFFFFF;--surface-2:#F0F0F3;--line:#E2E2E7;--line-2:#ECECF0;--muted:#6B6B71;--accent-soft:#FFF1BE;--shadow:0 1px 2px rgb(0 0 0 / .04),0 8px 24px rgb(0 0 0 / .06);--glass:rgb(255 255 255 / .78);--ring:rgb(255 201 60 / .45)}
:root[data-mode="dark"]{--bg:#1C1C1E;--surface:#2A2A2D;--surface-2:#353538;--line:#3B3B3F;--line-2:#333337;--muted:#A1A1A6;--accent-soft:#3E3619;--shadow:0 1px 2px rgb(0 0 0 / .5),0 10px 30px rgb(0 0 0 / .35);--glass:rgb(28 28 30 / .72);--ring:rgb(255 201 60 / .4)}

/* barras traslúcidas */
.nav{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-right:1px solid var(--line)}

select,input:not([type]),input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],input[type=email],input[type=tel],input[type=password],input[type=time],textarea{border-radius:11px;background:var(--surface-2);border:1px solid transparent;padding:9px 12px;transition:box-shadow .15s,background .15s,border-color .15s}

.md-seg{overflow-x:auto;flex-wrap:nowrap;max-width:100%}.md-seg button{white-space:nowrap}
/* 1.46: reporte tecnico */
.repcli{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface-2);margin:2px 0 4px}
.repcli b{font-size:17px}
.reptk{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.reph{margin:16px 0 8px}
.repmat{display:grid;grid-template-columns:70px minmax(0,1fr) 190px 40px;gap:6px;margin-bottom:8px;align-items:center}
.repmat .rm-c{grid-column:1;grid-row:1}.repmat .rm-d{grid-column:2;grid-row:1}.repmat .rm-o{grid-column:3;grid-row:1}.repmat .rm-x{grid-column:4;grid-row:1;min-height:40px;padding:0}.repmat .rm-p{grid-column:2/4;grid-row:2}
.repmat .rm-p[hidden]{display:none}
@media (max-width:640px){.repmat{grid-template-columns:64px minmax(0,1fr) 40px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}.repmat .rm-x{grid-column:3}.repmat .rm-o{grid-column:1/4;grid-row:2}.repmat .rm-p{grid-column:1/4;grid-row:3}}
.mdtk-act{display:flex;justify-content:flex-end;margin:-2px 0 10px}
/* 1.42: distribucion */
.btn.mobonly,.mobonly{display:none}
.menusec{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.ofidia{margin:4px 0 16px}.ofidia h2{display:flex;align-items:center;gap:8px;font-size:20px;text-transform:none;letter-spacing:0;color:var(--text)}
.ofidia h2 .btn{font-size:14px;font-weight:600}
.ofih2{font-size:20px;margin:18px 0 10px}
/* 1.39: agentes */
.agav{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(140deg,var(--agc),color-mix(in srgb,var(--agc) 55%,#fff));color:#fff;font-weight:700;position:relative;flex:0 0 auto;box-shadow:0 0 0 3px color-mix(in srgb,var(--agc) 22%,transparent)}
.agav i{position:absolute;right:-3px;top:-4px;font-style:normal;font-size:11px;color:var(--agc);background:var(--surface);border-radius:50%;width:16px;height:16px;display:grid;place-items:center}
.agchat{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;max-width:860px;min-height:420px}
.aghead{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.aglog{flex:1;overflow:auto;max-height:56vh;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.agm{max-width:82%;padding:10px 13px;border-radius:16px 16px 16px 4px;background:var(--soft,rgba(120,120,128,.12));line-height:1.45;font-size:15px}
.agm.yo{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--acc,#f5b800);color:var(--acc-ink,#1d1d1f)}
.agm.err{background:rgba(255,69,58,.12)}.agm.pensando{opacity:.6;font-style:italic}
.agin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.agin textarea{flex:1;resize:none;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:inherit}
/* 1.33: oficina */
.ofi{margin:0 -4px}.ofi iframe{display:block;width:100%;height:900px;border:0;background:transparent}.ofi iframe.ofiFull{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:9999;margin:0;background:#000}
/* 1.25: en vivo */
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc84;margin-right:8px;vertical-align:middle;animation:livepulse 1.6s infinite}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}}
.vivo-kpis{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.vivo-kpis .kpi{min-width:150px;flex:1}.vivo-kpis .kpi b i{font:500 12px var(--f-body,inherit);color:var(--muted);font-style:normal;margin-left:4px}
.vivo-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
/* arreglo mapa capas */.vivo-map{isolation:isolate;z-index:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:420px;aspect-ratio:16/10}
#vivoMapHost{position:absolute;inset:0}
.vivo-map .legend{position:absolute;left:12px;bottom:12px;z-index:500;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:6px 10px;border-radius:8px;backdrop-filter:blur(4px)}
.vivo-map .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.vivo-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.vivo-side .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vivo-side .card h2{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vivo-side .feed{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.vev{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;background:var(--surface-2);border-radius:10px;cursor:pointer}
.vev i{display:block;width:4px;height:100%;min-height:34px;border-radius:2px;background:#4da3ff}.vev.bad i{background:#ff4d5e}.vev.ok i{background:#3ddc84}.vev.warn i{background:#ffb020}
.vev b{display:block;font-size:13px}.vev span{color:var(--muted);font-size:12px}.vev time{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.card.alert{border-color:rgba(255,77,94,.5);background:linear-gradient(180deg,rgba(255,77,94,.10),transparent) var(--surface)}
.card.alert h2{color:#ff4d5e}.card.alert p{margin:0 0 10px;font-size:13px}
.card.alert .near{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:10px;margin-bottom:8px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#111;flex:none}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.tech{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;cursor:pointer;color:inherit}
.tech:hover{border-color:var(--accent)}.tech .av{width:38px;height:38px}
.tech b{display:block;font-size:13px}.tech>span>span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech .st{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;padding:2px 6px;border-radius:5px;margin-top:4px;background:var(--surface-2)}
.st.camino{color:#4da3ff}.st.obra{color:#3ddc84}.st.fin{color:var(--muted)}
.vm-obra{display:block;width:14px;height:14px;background:var(--accent);transform:rotate(45deg);border:2px solid #111;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.vm-obra.urg{background:#ff4d5e;animation:livepulse 1.2s infinite}
.vm-tech{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#111;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.vm-tech.obra{box-shadow:0 0 0 4px rgba(61,220,132,.35)}.vm-tech.old{opacity:.45}
.vm-eta{display:inline-block;font:700 11px/20px var(--f-mono,monospace);padding:0 7px;border-radius:10px;background:var(--c);color:#111;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.vm-lbl{position:absolute;left:50%;top:28px;transform:translateX(-50%);font-size:11px;font-weight:600;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--text);padding:1px 6px;border-radius:6px;white-space:nowrap}
.leaflet-popup-content{font:13px/1.4 var(--f-body,inherit)}.leaflet-popup-content .btn{font-size:12px;padding:5px 9px}
body.tv nav,body.tv header.top,body.tv #banner,body.tv .vivo-side .card:not(.alert) h2{display:none!important}

@media (max-width:900px){.vivo-grid{grid-template-columns:1fr}.vivo-map{aspect-ratio:4/3;min-height:320px}}

.pthumb{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pcell{display:inline-flex;align-items:center;gap:10px}

#main .vhead:not(:first-child):not(.vhead-top) h1{font-size:22px;letter-spacing:-.015em;padding-left:12px;border-left:4px solid var(--accent);line-height:1.15}

.ajtabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:3;background:var(--bg);padding:8px 0 10px;margin:-8px 0 12px;border-bottom:1px solid var(--line)}
.ajtabs button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.ajtabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.shell.fondo{background:linear-gradient(color-mix(in srgb,var(--bg) 82%,transparent),color-mix(in srgb,var(--bg) 82%,transparent)),var(--fondo) center/cover fixed no-repeat}
.shell.fondo .panel,.shell.fondo .kpi,.shell.fondo .row,.shell.fondo .tablewrap,.shell.fondo .empty,.shell.fondo .jobs>*{backdrop-filter:blur(2px)}
.fondoprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.fondoprev img{height:56px;width:120px;object-fit:cover;border:1px solid var(--line);border-radius:8px}
/* 1.11: editor de notas, historial, chips, escáner */
.rtew>span{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.rtbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.rtb{min-width:34px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:var(--surface-2);color:var(--fg);font:inherit;font-weight:700;cursor:pointer}
.rtb:hover{background:var(--line-2)}
.rte{min-height:110px;max-height:420px;overflow:auto;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:10px 12px;line-height:1.45;outline:none}
.rte:focus{background:var(--surface);box-shadow:0 0 0 3px var(--ring)}
.rte:empty:before{content:attr(data-ph);color:var(--muted)}
.rte p{margin:0 0 6px}.rte h4{margin:8px 0 4px;font-size:15px}.rte ul,.rte ol{margin:4px 0 6px;padding-left:22px}.rte a{color:var(--accent);text-decoration:underline}
.rte[contenteditable="false"]{background:none;border:0;padding:0;min-height:0}
.smart{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 6px}
.chips .tag{font-size:10.5px;padding:1px 7px}
#opLog textarea{width:100%;box-sizing:border-box;min-height:64px}
.log{display:flex;flex-direction:column;gap:8px}
.logi{padding:9px 12px;border-radius:12px;background:var(--surface-2)}
.logi.sys{background:none;border:1px dashed var(--line);font-size:13px}
.logh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-bottom:3px}
.logt{white-space:normal;word-break:break-word}
#scan{position:fixed;inset:0;z-index:120;background:#000;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.scan-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.scan-h .x{background:rgb(255 255 255 / .15);color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:18px}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}

.scan-f .hint{color:#ddd;margin:8px 0 0}

const NEWBY={bandeja:['ent','Pedido'],hoy:['tk','Ticket'],inicio:['cli','Cliente'],inventario:['mov','Movimiento'],proyectos:['pry','Proyecto'],tecnicos:['trab','Trabajo'],tickets:['tk','Ticket'],calendario:['trab','Trabajo'],campo:['trab','Trabajo'],facturacion:['fact','Factura'],menu:['tk','Ticket'],pipeline:['op','Oportunidad'],clientes:['cli','Cliente'],agenda:['act','Actividad'],presupuestos:['pres','Presupuesto'],reportes:['op','Oportunidad'],mas:['prod','Producto'],ajustes:['cli','Cliente'],vivo:['tk','Ticket'],oficina:['tk','Ticket'],gastos:['gasto','Factura'],personal:['gasto','Factura'],agentes:['tk','Ticket'],plan:['tk','Ticket'],admin:['tk','Ticket'],trabajos:['trab','Trabajo']};
let SH=null, QE=null, armed=null;

/* ---------- utilidades ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const localISO=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString()};
const today=()=>localISO(new Date()).slice(0,10);
const tomorrow9=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return localISO(d).slice(0,16)};
const qn=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const n0=v=>Number(v)||0;
const pl=(n,s,p)=>`${n} ${n===1?s:p}`;
const cot=()=>n0(CFG.cotizacion)||40;
const defMon=()=>CFG.monedaDef||'UYU';
const conv=(m,mon,to)=>{m=n0(m);mon=mon||'UYU';if(mon===to)return m;return to==='USD'?m/cot():m*cot()};
const NFC={};const nfmt=dec=>NFC[dec]||(NFC[dec]=new Intl.NumberFormat('es-UY',{minimumFractionDigits:dec,maximumFractionDigits:dec}));

const QF=new Intl.NumberFormat('es-UY',{maximumFractionDigits:2});const qty=n=>QF.format(n0(n));
const DTF_S=new Intl.DateTimeFormat('es-UY',{day:'numeric',month:'short'});const fdate=d=>d?DTF_S.format(new Date(d.slice(0,10)+'T12:00')):'';
const DTF_L=new Intl.DateTimeFormat('es-UY',{day:'numeric',month:'long',year:'numeric'});const fdateL=d=>d?DTF_L.format(new Date(d.slice(0,10)+'T12:00')):'';
const fdt=f=>{if(!f)return'Sin fecha';const d=f.slice(0,10),t=f.slice(11,16);const l=d===today()?'Hoy':fdate(d);return t?l+' · '+t:l};

const arr=col=>{const o=D[col];if(!o)return[];const c=ARRC.get(col);if(c&&c.o===o&&c.v===ARRV)return c.a.slice();const a=Object.entries(o).map(([id,x])=>({...x,id}));ARRC.set(col,{o,a,v:ARRV});return a.slice()};

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function handleErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'&&PLAN&&PLAN.users>PLAN.max_users){readonly=true;sr();toast('La empresa superó los usuarios de su plan: quedó en solo lectura.')}
  else if(c==='invalid_argument'&&PLAN&&e.message&&/storage|bucket|object/i.test(e.message)){toast('Se llenó el espacio de fotos y planos del plan.')}
  else if(c==='invalid_argument'){loadPlan().catch(()=>{});toast('El servidor rechazó el cambio: revisá tu rol o el plan de la empresa.')}
  else if(c==='quota_exceeded')toast('Se llenó el espacio de datos. Borrá registros viejos para seguir cargando.');
  else toast('No se pudo guardar. Probá de nuevo en unos segundos.');
}
const clean=o=>JSON.parse(JSON.stringify(o));
async function put(col,id,data){
  if(mode==='loading'||(mode==='live'&&!liveCol(col).loaded)){toast('Esperá a que terminen de cargar los datos.');throw {code:'loading'}}
  if(mode==='live'&&(col==='presupuestos'||col==='facturas')&&!has(col)){toast(`${col==='facturas'?'Las facturas no están incluidas':'Los presupuestos no están incluidos'} en el plan ${PLAN.nombre} de tu empresa.`);throw {code:'loading'}}
  AV.touched.add(col+':'+id);AV.t=0;
  if(mode==='live'){const avq=avPrep(col,id,data);await DB.collection(col).doc(id).set(clean(data));if(avq)avSend(avq)}
  else{D[col][id]=clean(data);arrDirty();sr()}
}
async function remove(col,id){if(readonly){toast('No tenés permiso para borrar.');throw{code:'loading'}}
  if(mode==='live')await DB.collection(col).doc(id).delete();
  else{delete D[col][id];arrDirty();sr()}
}
async function saveCfg(v){
  if(mode==='live')await DB.doc('config/empresa').set(clean(v));
  else{CFG=clean(v);sr()}
}

/* ---------- personas ---------- */
function av(id){
  if(!id)return'';
  const p=NAMES[id];const nm=p?.name||(id===ME?'Vos':'Compañero');
  return p?.av?`<img class="av" src="${esc(p.av)}" alt="${esc(nm)}" title="${esc(nm)}">`:'';
}
function personName(id){if(!id)return'Sin asignar';const n=NAMES[id]?.name;if(id===ME)return(n||'Vos')+' (vos)';return n||'Compañero'}
async function refreshNames(){
  if(!USER)return;
  const ids=new Set();if(ME)ids.add(ME);
  for(const c of ['oportunidades','actividades'])Object.values(D[c]).forEach(o=>o.responsable&&ids.add(o.responsable));
  Object.values(D.tickets).forEach(o=>o.responsable&&ids.add(o.responsable));Object.values(D.trabajos).forEach(j=>(j.tecnicos||[]).forEach(i=>ids.add(i)));
  const list=[...ids];if(!list.length)return;
  const ps=await USER.profiles(list);let ch=false;
  for(const id of list){const p=ps[id];if(!p)continue;const n={name:p.name||'',av:p.avatarUrl||''};
    if(!NAMES[id]||NAMES[id].name!==n.name||NAMES[id].av!==n.av){NAMES[id]=n;ch=true}}
  if(ch)sr();
}

/* ---------- actividades ---------- */
function pendingActs(opId){return arr('actividades').filter(a=>!a.hecha&&a.oportunidadId===opId).sort((a,b)=>(a.fecha||'9').localeCompare(b.fecha||'9'))}

function actBadge(a){
  if(!a)return'<span class="tag t-none">Sin actividad</span>';
  const s=actState(a);const d=(a.fecha||'').slice(0,10);
  const l=s==='t-bad'?'Vencida':s==='t-warn'?'Hoy':a.fecha?fdate(d):'Pendiente';
  return `<span class="tag ${s}" title="${esc((TK[a.tipo]||'')+': '+(a.titulo||''))}">${l}</span>`;
}
function overdueCount(){const t=today();return arr('actividades').filter(a=>!a.hecha&&a.fecha&&a.fecha.slice(0,10)<t&&(!mine||a.responsable===ME)).length}

/* ---------- render ---------- */
let rq=0;function sr(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}
function render(){
  arrDirty();applyRubros();subGuard();
  if(ROLE==='pendiente'){document.body.classList.add('portal');$('#banner').innerHTML='';$('#main').innerHTML=pendingHtml();return}
  if(CFEI===undefined&&mode==='live'&&ORG&&PLAN&&has('cfe')&&!PORTAL())loadCfe();

  {const ne=entNuevas().length,p3=$('#navEnt');if(p3){p3.hidden=!ne;p3.textContent=ne}}
  {const na=agOk()&&isLead()?aprobPend().length:0,pa=$('#navAg');if(pa){pa.hidden=!na;pa.textContent=na}}

  $('#prodlist').innerHTML=arr('productos').map(p=>`<option value="${esc(p.nombre)}"></option>`).join('');

  applyTabs();
  document.querySelectorAll('.nav .navsec').forEach(h=>{let n=h.nextElementSibling,vis=false;while(n&&!n.classList.contains('navsec')){if(n.matches('[data-view]')&&!n.hidden)vis=true;n=n.nextElementSibling}h.hidden=!vis});
  document.querySelectorAll('.nav .navsec').forEach(h=>{let n=h.nextElementSibling,any=false;while(n&&!n.classList.contains('navsec')){if(n.dataset&&n.dataset.view&&!n.hidden)any=true;n=n.nextElementSibling}h.hidden=!any});

function bannerHtml(){

}

    const lbl=d.toLocaleDateString('es-UY',{month:'long',year:'numeric'});months.push({l:`${lbl.charAt(0).toUpperCase()+lbl.slice(1)} (${l.length})`,v:sum(l,C),t:money(sum(l,C),repMon),c:'var(--s-gan)'})}

  <div class="panels"><section class="panel"><h2>Oportunidades por etapa</h2>${bars(stageRows)}</section>

async function shrink(f){
  if(f.size<1.5e6||!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  try{const bmp=await createImageBitmap(f);const s=Math.min(1,2000/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));return b&&b.size<f.size?b:f}catch(e){return f}
}

async function saveFact(close=true){

  if(!QE.lineas.some(l=>l.desc)){e.textContent='Agregá al menos una línea con descripción.';e.hidden=false;return null}
  {const prev=SH.id&&D.facturas[SH.id];if(prev&&prev.cfeData&&prev.cfeData.idCFE&&(Math.abs(calcQ(prev).total-calcQ(QE).total)>0.004||prev.clienteId!==QE.clienteId||prev.moneda!==QE.moneda)){e.textContent='Esta factura ya tiene CFE emitido: no se pueden cambiar cliente, moneda ni importes. Si hay un error, hacé una nota de crédito y una factura nueva.';e.hidden=false;return null}}

function fld(f,v,pre='f_'){
  const id=pre+f.k;v=v??f.def??'';
  let inp;
  if(f.t==='select')inp=`<select id="${id}">${opts(f.o,v)}</select>`;
  else if(f.t==='person')inp=`<select id="${id}">${opts(peopleOpts(v),v)}</select>`+(USER?`<input type="search" class="psearch" id="${id}_q" data-psearch="${id}" placeholder="Buscar compañero por nombre" aria-label="Buscar compañero">`:'');
  else if(f.t==='textarea')inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else if(f.t==='checkbox')return`<label class="fld chk ${f.w||''}"><input type="checkbox" id="${id}"${v?' checked':''}><span>${f.l}</span></label>`;
  else if(f.t==='hidden')return`<input type="hidden" id="${id}" value="${esc(v)}">`;
  else if(f.t==='rich')return rteHtml(id,f,v);
  else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.step?` step="${f.step}"`:''}${f.t==='number'?' min="0" inputmode="decimal"':''}${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
  return`<label class="fld ${f.w||''}" for="${id}"><span>${f.l}</span>${inp}</label>`;
}
function readForm(fields,pre='f_'){
  const o={};for(const f of fields){const el=document.getElementById(pre+f.k);if(!el)continue;
    if(f.t==='rich'){o[f.k]=rtePlain(el);o[f.k+'Html']=rteClean(el.innerHTML);continue}
    let x=el.type==='checkbox'?el.checked:el.value;if(f.t==='number')x=x===''?0:Number(x);if(typeof x==='string')x=x.trim();o[f.k]=x}
  return o;
}

  SIG={cv,g,drawn:false,last:null};

  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);SIG.last=pos(e);g.beginPath();g.arc(SIG.last[0],SIG.last[1],1,0,7);g.fill();SIG.drawn=true};
  cv.onpointermove=e=>{if(!SIG.last)return;const p=pos(e);g.beginPath();g.moveTo(SIG.last[0],SIG.last[1]);g.lineTo(p[0],p[1]);g.stroke();SIG.last=p};

function tfMatch(j){
  const t=j.ticketId&&D.tickets[j.ticketId];
  if(TF.cli&&j.clienteId!==TF.cli)return false;
  if(TF.pry&&(j.proyectoId||t?.proyectoId)!==TF.pry)return false;
  if(TF.tec&&!(j.tecnicos||[]).includes(TF.tec))return false;
  if(TF.tipo&&(j.tipoTrabajo||'')!==TF.tipo)return false;
  if(TF.est==='firmado'&&!(j.firma&&j.firma.id))return false;
  if(TF.est&&TF.est!=='firmado'&&j.estado!==TF.est)return false;
  if(TF.desde&&(j.fecha||'')<TF.desde)return false;
  if(TF.hasta&&(j.fecha||'')>TF.hasta)return false;
  if(TF.q){const s=qn([j.numero,j.titulo,jCli(j),pryName(j.proyectoId),j.obra,j.informe,j.materiales,j.pendientes,t?.numero,t?.titulo].join(' '));if(!s.includes(qn(TF.q)))return false}
  return true;
}

      PCMSG=msg;return true}

    case'pqok':case'pqno':{if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent=k==='pqok'?'¿Aceptar? Tocá de nuevo':'¿Rechazar? Tocá de nuevo';return true}
      armed=null;const nm=(MEMBERS[ME]&&MEMBERS[ME].display_name)||'';const {error}=await SB.rpc('portal_quote',{o:ORG,qid:arg,acepta:k==='pqok',nombre:nm});
      if(error){toast('No se pudo responder el presupuesto.');return true}await loadAll().catch(()=>{});toast(k==='pqok'?'Presupuesto aceptado. ¡Gracias! Te contactamos para coordinar.':'Presupuesto rechazado.');return true}
    case'invite':{const n=($('#inv_n').value||'').trim(),m=($('#inv_e').value||'').trim(),r=$('#inv_r').value;if(!m){toast('Escribí el email.');return true}
      el.disabled=true;try{const d=await fnData(await SB.functions.invoke('invitar',{body:{org:ORG,email:m,rol:r,nombre:n}}));
        if(d.error){toast(d.error);return true}toast(d.existente?'Ya tenía cuenta: cuando entre a Olumi queda sumado.':'Invitación enviada a '+m);await loadInvites();sr()}finally{el.disabled=false}return true}
    case'uninv':{await SB.rpc('cancel_invite',{o:ORG,mail:arg});await loadInvites();sr();toast('Invitación cancelada');return true}
  }
  return false;
}

  {k:'red',n:'Punto de red',l:'R',c:'#2F7FD0',kw:['punto de red','punto red','rj45','cat6','cat 6']},
  {k:'ap',n:'Access point',l:'W',c:'#7A5AF8',kw:['access point','wifi','ap ']},
  {k:'acc',n:'Control de acceso',l:'A',c:'#E0307A',kw:['lector','biométric','biometric','acceso','cerradura']},
  {k:'caja',n:'Caja o empalme',l:'E',c:'#C28B00',kw:['caja','empalme','fusión','fusion']},
  {k:'rack',n:'Rack o gabinete',l:'K',c:'#1E1F23',kw:['rack','gabinete']},
  {k:'alarma',n:'Sensor de alarma',l:'S',c:'#2FA36B',kw:['sensor','alarma','pir']},

const RTIPOS=[
  {k:'utp',n:'Cable UTP',c:'#2F7FD0',kw:['utp','cat6','cat 6','cable de red']},
  {k:'fibra',n:'Fibra óptica',c:'#E6A800',kw:['fibra']},
  {k:'coax',n:'Coaxil',c:'#8A5A2B',kw:['coaxil','coax','rg59','rg6']},
  {k:'elec',n:'Eléctrico',c:'#D93A30',kw:['eléctric','electric','taller','energía']},
  {k:'canal',n:'Caño o canaleta',c:'#6B6E76',kw:['caño','cano','canaleta','ducto','bandeja']}];
const PTK=Object.fromEntries(PTIPOS.map(t=>[t.k,t])),RTK=Object.fromEntries(RTIPOS.map(t=>[t.k,t]));
const PEST=[['pendiente','Pendiente'],['instalado','Instalado'],['probado','Probado']];
const PESTC={pendiente:'#9AA0A8',instalado:'#2F7FD0',probado:'#2FA36B'};
let PV=null, PVsave=null;

function planStats(p){
  const pts=p.puntos||[],done=pts.filter(x=>x.estado==='instalado'||x.estado==='probado').length;
  const porTipo={};pts.forEach(x=>{porTipo[x.tipo]=(porTipo[x.tipo]||0)+1});
  const metros={};(p.recorridos||[]).forEach(r=>{metros[r.tipo]=(metros[r.tipo]||0)+routeMeters(p,r)});
  return{total:pts.length,done,pct:pts.length?Math.round(done/pts.length*100):0,porTipo,metros};
}
function routeMeters(p,r){
  if(!p.escala||!p.escala.mpp||!p.img)return 0;const W=p.img.w,H=p.img.h,v=r.v||[];let s=0;
  for(let i=1;i<v.length;i++){const dx=(v[i][0]-v[i-1][0])*W,dy=(v[i][1]-v[i-1][1])*H;s+=Math.hypot(dx,dy)}
  return s*p.escala.mpp;
}
const fmtM=m=>(Math.round(m*10)/10).toLocaleString('es-UY')+' m';
function pryPlanos(pid){return arr('planos').filter(p=>p.proyectoId===pid).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es',{numeric:true}))}
function pryAvance(pid){const ps=pryPlanos(pid);let t=0,d=0;ps.forEach(p=>{const s=planStats(p);t+=s.total;d+=s.done});return{t,d,pct:t?Math.round(d/t*100):0}}
function pryPlanosHtml(pid){
  const ps=pryPlanos(pid),av=pryAvance(pid);
  return`<section class="rel"><h3>Planos${ps.length?` <span class="num">${ps.length}</span>`:''}</h3>
    ${av.t?`<div class="bar" style="--bc:var(--ok)"><span class="lbl">Avance de la instalación</span><span class="val">${av.d} de ${av.t} puntos · ${av.pct}%</span><div class="trk"><div class="fil" style="width:${Math.max(2,av.pct)}%"></div></div></div>`:''}
    ${ps.length?`<div class="planthumbs">${ps.map(p=>{const s=planStats(p);return`<button class="planthumb" data-act="plan:${p.id}"><img data-blob="${esc(p.img&&p.img.id||'')}" src="${esc(blobUrl(p.img&&p.img.id))}" alt="" loading="lazy"><b>${esc(p.nombre||'Plano')}</b><span class="muted">${s.total} punto${s.total===1?'':'s'}${Object.keys(s.metros).length?' · '+fmtM(Object.values(s.metros).reduce((a,b)=>a+b,0)):''}${(p.versiones||[]).length?' · v'+((p.versiones||[]).length+1):''}</span></button>`}).join('')}</div>`:'<p class="muted" style="margin:0">Subí el plano de la obra para marcar cámaras, puntos y recorridos, medir metros y seguir el avance.</p>'}
    ${AS&&!readonly?`<div class="actions"><label class="btn upl">Subir plano (PDF o imagen)<input type="file" accept="image/*,application/pdf" data-up="planoint" data-pry="${esc(pid)}"></label></div><p class="busy" id="plBusy" hidden></p>`:''}</section>`;
}

// cuando llegan las URLs firmadas, completar las imágenes que todavía muestran el píxel vacío
function planUrlsSigned(){document.querySelectorAll('img[data-blob],img[data-act^="lb:"]').forEach(im=>{const id=im.dataset.blob||(im.dataset.act||'').slice(3);if(id&&im.getAttribute('src')===PIXEL){const u=blobUrl(id);if(u!==PIXEL)im.src=u}})}
/* --- subir plano: imágenes directo; PDF: cada hoja se convierte en imagen --- */
let PDFJS=null;
async function loadPdfJs(){
  if(PDFJS)return PDFJS;
  const m=await import(new URL('vendor/pdfjs/pdf.min.js',location.href).href);
  m.GlobalWorkerOptions.workerSrc=new URL('vendor/pdfjs/pdf.worker.min.js',location.href).href;
  PDFJS=m;return m;
}
async function pdfToImages(file,maxPages=8){
  const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];for(let i=1;i<=Math.min(doc.numPages,maxPages);i++){
    const page=await doc.getPage(i);const v1=page.getViewport({scale:1});const sc=Math.min(4,2600/Math.max(v1.width,v1.height));const vp=page.getViewport({scale:sc});
    const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    out.push({blob:await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)),w:cv.width,h:cv.height,page:i,pages:doc.numPages});
  }return out;
}
async function imageToPlan(file){
  const bmp=await createImageBitmap(file);const s=Math.min(1,3000/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);
  return{blob:await new Promise(r=>cv.toBlob(r,'image/jpeg',.86)),w:cv.width,h:cv.height};
}
async function uploadPlano(inp,replaceId){
  const f=inp.files&&inp.files[0];if(!f||!AS)return;const busy=$('#plBusy')||$('#pvBusy');
  const say=t=>{if(busy){busy.hidden=false;busy.textContent=t}};
  try{
    const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);say(isPdf?'Leyendo el PDF…':'Preparando el plano…');
    const hojas=isPdf?await pdfToImages(f):[await imageToPlan(f)];
    let orig=null;if(isPdf){say('Guardando el PDF original…');const r=await AS.upload(f,{type:'application/pdf'});orig={id:r.id,name:f.name,type:'application/pdf'}}
    const base=(f.name||'Plano').replace(/\.[a-z0-9]+$/i,'');const ids=[];
    for(const h of hojas){
      say(hojas.length>1?`Subiendo hoja ${h.page} de ${hojas.length}…`:'Subiendo el plano…');
      const up=await AS.upload(h.blob,{type:'image/jpeg'});const img={id:up.id,w:h.w,h:h.h};
      if(replaceId){const p=D.planos[replaceId];const vs=[...(p.versiones||[]),{img:p.img,original:p.original||null,at:p.actualizado||p.creado||Date.now(),by:p.actualizadoPor||''}];
        await put('planos',replaceId,{...p,img,original:orig,versiones:vs,actualizado:Date.now(),actualizadoPor:ME||''});ids.push(replaceId);break}
      const pry=D.proyectos[inp.dataset.pry]||{},rel=D.relevamientos[inp.dataset.rel]||{};const id=uid();
      await put('planos',id,{nombre:hojas.length>1?`${base} · hoja ${h.page}`:base,proyectoId:inp.dataset.pry||rel.proyectoId||'',relevamientoId:inp.dataset.rel||'',clienteId:pry.clienteId||rel.clienteId||'',img,original:orig,versiones:[],escala:null,puntos:[],recorridos:[],creado:Date.now(),actualizado:Date.now(),por:ME||''});ids.push(id);
    }
    inp.value='';if(busy)busy.hidden=true;
    toast(replaceId?'Versión nueva del plano guardada. Los puntos se mantienen.':hojas.length>1?`${hojas.length} hojas subidas`:'Plano subido');
    if(replaceId){openPlan(replaceId)}else{if(SH&&(SH.type==='pry'||SH.type==='rel'))openSheet(SH.type,SH.id);if(ids[0])openPlan(ids[0])}
  }catch(e){if(busy)busy.hidden=true;inp.value='';console.error(e);toast(e&&e.code?upErr(e):'No se pudo leer el archivo. Probá con un PDF o una imagen JPG o PNG.')}
}

/* --- visor --- */
function openPlan(id){
  const p=D.planos[id];if(!p)return;
  let w=document.getElementById('pv');if(!w){w=document.createElement('div');w.id='pv';w.className='pv';document.body.appendChild(w)}
  PV={id,s:1,tx:0,ty:0,mode:'ver',tipo:'cam',rtipo:'utp',draft:null,sel:null,cal:null,ptrs:new Map(),moved:false};
  document.body.style.overflow='hidden';w.hidden=false;renderPv(true);
}
function closePlan(){if(P3.on)p3off();flushPlan();const w=document.getElementById('pv');if(w)w.hidden=true;PV=null;if(!SH)document.body.style.overflow='';if(SH&&SH.type==='pry'&&!SH.dirty)openSheet('pry',SH.id);if(SH&&SH.type==='rel'&&SH.id){const el=$('#relPlanos');if(el){el.outerHTML=relPlanosHtml(SH.id,D.relevamientos[SH.id]||{});planUrlsSigned()}}}
function curPlan(){return PV&&(PV.doc||D.planos[PV.id])}
function savePlanSoon(){clearTimeout(PVsave);PVsave=setTimeout(flushPlan,500)}
async function flushPlan(){clearTimeout(PVsave);PVsave=null;if(!PV||!PV.dirty)return;const p=PV.doc||D.planos[PV.id];PV.dirty=false;
  try{await put('planos',PV.id,{...p,actualizado:Date.now(),actualizadoPor:ME||''})}catch(e){if(e&&e.code!=='loading')handleErr(e)}}
function mutPlan(fn){const p=curPlan();const n=JSON.parse(JSON.stringify(p));fn(n);PV.doc=n;D.planos[PV.id]=n;PV.dirty=true;savePlanSoon();drawPv();renderSide()}
const canEdit=()=>!!AS&&!readonly&&!PORTAL();
function renderPv(fit){
  const p=curPlan();if(!p)return closePlan();const w=$('#pv');const ed=canEdit();
  const modes=[['ver','Mirar'],['dibujo','Dibujar'],['punto','+ Punto'],['ruta','Recorrido'],['escala','Escala']];
  w.innerHTML=`<header class="pv-h"><button class="btn ghost" data-act="pvclose" aria-label="Cerrar plano">✕</button><div class="pv-t"><b>${esc(p.nombre||'Plano')}</b><span class="muted">${esc(pryName(p.proyectoId)||cliName(p.clienteId)||'')}</span></div>
    <span class="sp"></span><button class="btn${PV.v3d?' pri':''}" data-act="pv3d" aria-pressed="${!!PV.v3d}" title="Ver el plano en 3D">${PV.v3d?'Volver al plano':'Ver en 3D'}</button>${ed&&has('presupuestos')?'<button class="btn pri" data-act="pv2pres"><span class="only-dsk">Pasar a presupuesto</span><span class="only-mob">Presupuesto</span></button>':''}</header>
    ${ed?`<div class="pv-tools"><div class="seg" role="group" aria-label="Modo">${modes.map(([k,n])=>`<button class="${PV.mode===k?'on':''}" data-act="pvmode:${k}" aria-pressed="${PV.mode===k}">${n}</button>`).join('')}</div>
      ${PV.mode==='punto'?`<div class="pv-chips">${PTIPOS.map(t=>`<button class="pv-chip${PV.tipo===t.k?' on':''}" data-act="pvtipo:${t.k}" style="--pc:${t.c}"><i>${t.l}</i>${t.n}</button>`).join('')}</div>`:''}
      ${PV.mode==='dibujo'?dibujoChips():''}
      ${PV.mode==='ruta'?`<div class="pv-chips">${RTIPOS.map(t=>`<button class="pv-chip${PV.rtipo===t.k?' on':''}" data-act="pvrtipo:${t.k}" style="--pc:${t.c}"><i>—</i>${t.n}</button>`).join('')}${PV.draft&&PV.draft.length?`<button class="btn" data-act="pvundo">Deshacer</button><button class="btn pri" data-act="pvend">Terminar recorrido</button>`:''}</div>`:''}
      <p class="hint pv-help">${{dibujo:DHELP(),ver:'Arrastrá para moverte, pellizcá o usá + y − para el zoom. Tocá un punto para ver su detalle.',punto:'Tocá el plano para ubicar: '+PTK[PV.tipo].n+'.',ruta:p.escala?'Tocá cada quiebre del recorrido y después “Terminar recorrido”.':'Primero calibrá la escala para medir metros (podés dibujar igual).',escala:'Tocá dos puntos de una medida que conozcas (por ejemplo, una pared) y escribí cuántos metros son.'}[PV.mode]}</p></div>`:''}
    <div class="pv-body"><div class="pv-stage" id="pvStage"><div class="pv-world" id="pvWorld"><img id="pvImg" data-blob="${esc(p.img&&p.img.id||'')}" src="${esc(blobUrl(p.img&&p.img.id))}" alt="Plano ${esc(p.nombre||'')}" draggable="false" width="${p.img.w}" height="${p.img.h}" style="width:${p.img.w}px;height:${p.img.h}px;max-width:none"><svg id="pvSvg" viewBox="0 0 ${p.img.w} ${p.img.h}" width="${p.img.w}" height="${p.img.h}" style="width:${p.img.w}px;height:${p.img.h}px;max-width:none"></svg></div>
      <div class="pv-zoom"><button class="btn" data-act="pvz:in" aria-label="Acercar">+</button><button class="btn" data-act="pvz:out" aria-label="Alejar">−</button><button class="btn" data-act="pvz:fit">Ajustar</button></div></div>
      <aside class="pv-side" id="pvSide"></aside></div><p class="busy" id="pvBusy" hidden></p>`;
  bindStage();if(fit)setTimeout(fitPv,0);else applyT();drawPv();renderSide();
  if(PV.v3d)setTimeout(p3on,0);else if(P3.on)p3off();
}
function fitPv(){const st=$('#pvStage'),p=curPlan();if(!st||!p)return;const s=Math.min(st.clientWidth/p.img.w,st.clientHeight/p.img.h)*0.96;PV.s=s;PV.tx=(st.clientWidth-p.img.w*s)/2;PV.ty=(st.clientHeight-p.img.h*s)/2;applyT();drawPv()}
function applyT(){const w=$('#pvWorld');if(w)w.style.transform=`translate(${PV.tx}px,${PV.ty}px) scale(${PV.s})`}
function zoomAt(f,cx,cy){const s0=PV.s,s1=Math.max(0.05,Math.min(8,s0*f));PV.tx=cx-(cx-PV.tx)*s1/s0;PV.ty=cy-(cy-PV.ty)*s1/s0;PV.s=s1;applyT();drawPv()}
function toPlan(e){const st=$('#pvStage').getBoundingClientRect(),p=curPlan();const x=(e.clientX-st.left-PV.tx)/PV.s/p.img.w,y=(e.clientY-st.top-PV.ty)/PV.s/p.img.h;return[Math.max(0,Math.min(1,x)),Math.max(0,Math.min(1,y))]}
function bindStage(){
  const st=$('#pvStage');if(!st)return;
  st.onwheel=e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)};
  st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);PV.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});PV.moved=false;PV.down={x:e.clientX,y:e.clientY,t:Date.now(),target:e.target};
    if(PV.mode==='dibujo'&&PV.dtool==='libre'&&canEdit()&&PV.ptrs.size===1)PV.free=[toPlan(e)]};
  st.onpointermove=e=>{const pr=PV.ptrs.get(e.pointerId);if(!pr)return;
    if(PV.free){if(PV.ptrs.size>1){PV.free=null}else{PV.free.push(toPlan(e));PV.moved=true;drawPv();return}}
    if(PV.ptrs.size===2){const [a,b]=[...PV.ptrs.values()];const d0=Math.hypot(a.x-b.x,a.y-b.y);pr.x=e.clientX;pr.y=e.clientY;const [c,dd]=[...PV.ptrs.values()];const d1=Math.hypot(c.x-dd.x,c.y-dd.y);const r=st.getBoundingClientRect();if(d0>0)zoomAt(d1/d0,(c.x+dd.x)/2-r.left,(c.y+dd.y)/2-r.top);PV.moved=true;return}
    const dx=e.clientX-pr.x,dy=e.clientY-pr.y;if(Math.abs(e.clientX-PV.down.x)+Math.abs(e.clientY-PV.down.y)>6)PV.moved=true;
    if(PV.moved){PV.tx+=dx;PV.ty+=dy;applyT()}pr.x=e.clientX;pr.y=e.clientY};
  st.onpointerup=st.onpointercancel=e=>{const was=PV.ptrs.size;PV.ptrs.delete(e.pointerId);
    if(PV.free){const v=PV.free;PV.free=null;if(v.length>2)mutPlan(p=>{p.dibujo=[...(p.dibujo||[]),{id:uid(),t:'free',v,c:PV.dcol||'#1E1F23'}]});else drawPv();return}
    if(was===1&&!PV.moved&&e.type==='pointerup')tapPlan(e)};
}
function tapPlan(e){
  if(PV.mode==='dibujo'&&canEdit()){dibujoTap(e);return}
  const tg=(PV.down&&PV.down.target)||e.target;const mk=tg.closest&&tg.closest('[data-pt],[data-rt]');
  if(mk&&PV.mode!=='ruta'&&PV.mode!=='escala'){PV.sel=mk.dataset.pt?{t:'pt',id:mk.dataset.pt}:{t:'rt',id:mk.dataset.rt};drawPv();renderSide();return}
  if(!canEdit()){PV.sel=null;drawPv();renderSide();return}
  const [x,y]=toPlan(e);
  if(PV.mode==='punto'){const t=PTK[PV.tipo];let nid;mutPlan(p=>{const n=(p.puntos||[]).filter(q=>q.tipo===t.k).length+1;nid=uid();p.puntos=[...(p.puntos||[]),{id:nid,tipo:t.k,x,y,etiqueta:t.l+n,estado:'pendiente',notas:'',fotos:[],creado:Date.now()}]});PV.sel={t:'pt',id:nid};drawPv();renderSide()}
  else if(PV.mode==='ruta'){PV.draft=[...(PV.draft||[]),[x,y]];renderPv()}
  else if(PV.mode==='escala'){PV.cal=[...(PV.cal||[]),[x,y]].slice(-2);drawPv();renderSide()}
  else{PV.sel=null;drawPv();renderSide()}
}
function drawPv(){
  const p=curPlan(),svg=$('#pvSvg');if(!p||!svg)return;const W=p.img.w,H=p.img.h,k=1/PV.s;
  const P=v=>`${v[0]*W},${v[1]*H}`;let h='';
  (p.recorridos||[]).forEach(r=>{const t=RTK[r.tipo]||RTIPOS[0],sel=PV.sel&&PV.sel.t==='rt'&&PV.sel.id===r.id;const v=r.v||[];if(v.length<2)return;
    h+=`<polyline data-rt="${r.id}" points="${v.map(P).join(' ')}" fill="none" stroke="${t.c}" stroke-width="${(sel?7:5)*k}" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="${sel?1:.85}"/>`;
    const m=routeMeters(p,r);if(m){const mid=v[Math.floor((v.length-1)/2)],nx=v[Math.min(v.length-1,Math.floor((v.length-1)/2)+1)];const cx=(mid[0]+nx[0])/2*W,cy=(mid[1]+nx[1])/2*H;
      h+=`<g data-rt="${r.id}"><rect x="${cx-34*k}" y="${cy-13*k}" width="${68*k}" height="${26*k}" rx="${8*k}" fill="#1E1F23" opacity=".88"/><text x="${cx}" y="${cy+5*k}" font-size="${14*k}" font-family="Arial" font-weight="700" fill="#fff" text-anchor="middle">${fmtM(m)}</text></g>`}});
  if(PV.draft&&PV.draft.length){const t=RTK[PV.rtipo];h+=`<polyline points="${PV.draft.map(P).join(' ')}" fill="none" stroke="${t.c}" stroke-width="${5*k}" stroke-dasharray="${10*k} ${7*k}" stroke-linecap="round"/>`+PV.draft.map(v=>`<circle cx="${v[0]*W}" cy="${v[1]*H}" r="${6*k}" fill="${t.c}"/>`).join('')}
  if(PV.cal&&PV.cal.length){h+=PV.cal.map(v=>`<circle cx="${v[0]*W}" cy="${v[1]*H}" r="${8*k}" fill="none" stroke="#D93A30" stroke-width="${3*k}"/>`).join('');if(PV.cal.length===2)h+=`<line x1="${PV.cal[0][0]*W}" y1="${PV.cal[0][1]*H}" x2="${PV.cal[1][0]*W}" y2="${PV.cal[1][1]*H}" stroke="#D93A30" stroke-width="${3*k}" stroke-dasharray="${8*k} ${6*k}"/>`}
  (p.puntos||[]).forEach(q=>{const t=PTK[q.tipo]||PTIPOS[7],sel=PV.sel&&PV.sel.t==='pt'&&PV.sel.id===q.id,r=(sel?17:14)*k,cx=q.x*W,cy=q.y*H;
    h+=`<g data-pt="${q.id}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="${r+4*k}" fill="${PESTC[q.estado]||PESTC.pendiente}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${t.c}" stroke="#fff" stroke-width="${2*k}"/><text x="${cx}" y="${cy+5*k}" font-size="${13*k}" font-family="Arial" font-weight="700" fill="#fff" text-anchor="middle">${esc(q.etiqueta||t.l)}</text></g>`});
  svg.innerHTML=drawDibujo(p)+h;
}
function renderSide(){
  const el=$('#pvSide'),p=curPlan();if(!el||!p)return;const ed=canEdit();

function findProd(kws,unidad){const ps=arr('productos').filter(p=>unidad==='metro'?p.unidad==='metro':p.unidad!=='metro');for(const k of kws){const q=qn(k);const hit=ps.find(p=>qn(p.nombre||'').includes(q));if(hit)return hit}return null}
function lineFor(kws,fallback,cant,unidadDef,mon){const p=findProd(kws,unidadDef);return{desc:p?p.nombre:fallback,cant:Math.round(cant*100)/100,unidad:p?.unidad||unidadDef,precio:p?Math.round(conv(p.precio,p.moneda,mon)*100)/100:0}}
function quoteDraft({clienteId,proyectoId,lineas,notas}){
  const mon=defMon();return{numero:'',oportunidadId:'',proyectoId:proyectoId||'',clienteId:clienteId||'',fecha:today(),validez:15,moneda:mon,estado:'borrador',iva:true,descuento:0,lineas:lineas.length?lineas:[{desc:'',cant:1,unidad:'unidad',precio:0}],condiciones:CFG.condiciones||'',notas:notas||''}
}
function planToLines(p,desp){
  const mon=defMon(),s=planStats(p),out=[];
  PTIPOS.forEach(t=>{const n=s.porTipo[t.k];if(n)out.push(lineFor(t.kw,t.n,n,'unidad',mon))});
  RTIPOS.forEach(t=>{const m=s.metros[t.k];if(m)out.push(lineFor(t.kw,t.n+' (metros)',Math.ceil(m*(1+desp/100)),'metro',mon))});
  return out;
}

    case'pvcal':{const m=n0($('#pv_m').value);const c=PV.cal;if(!m||!c||c.length<2){toast('Escribí los metros.');return true}const p=curPlan();const px=Math.hypot((c[1][0]-c[0][0])*p.img.w,(c[1][1]-c[0][1])*p.img.h);if(px<5){toast('Los dos puntos están demasiado cerca.');return true}
      mutPlan(q=>{q.escala={mpp:m/px,at:Date.now()}});PV.cal=null;PV.mode='ver';renderPv();toast('Escala guardada: ya se ven los metros de los recorridos.');return true}
    case'pvdel':{if(!PV.sel)return true;if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='¿Seguro? Tocá de nuevo';return true}armed=null;const s=PV.sel;mutPlan(p=>{if(s.t==='pt')p.puntos=(p.puntos||[]).filter(x=>x.id!==s.id);else p.recorridos=(p.recorridos||[]).filter(x=>x.id!==s.id)});PV.sel=null;drawPv();renderSide();return true}
    case'pvrename':{const p=curPlan();const box=$('#pvSide');box.insertAdjacentHTML('beforeend',`<div class="actions" style="margin-top:8px"><input id="pv_name" type="text" value="${esc(p.nombre||'')}" aria-label="Nombre del plano"><button class="btn pri" data-act="pvrenameok">Guardar</button></div>`);$('#pv_name').focus();return true}
    case'pvrenameok':{const n=($('#pv_name').value||'').trim();if(!n)return true;mutPlan(p=>{p.nombre=n});renderPv();return true}
    case'pvdelplan':{if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='Se borra el plano con sus puntos. Tocá de nuevo';return true}armed=null;const id=PV.id;PV.dirty=false;const w=$('#pv');if(w)w.hidden=true;PV=null;await remove('planos',id);toast('Plano borrado');if(SH&&SH.type==='pry')openSheet('pry',SH.id);else document.body.style.overflow='';return true}

      const q=quoteDraft({clienteId:p.clienteId,proyectoId:p.proyectoId,lineas:lines});closePlan();openSheet('pres',null,{copy:q});SH.dirty=true;
      toast(`Presupuesto armado con ${lines.length} línea${lines.length>1?'s':''} (metros +10 % de desperdicio). Revisá los precios.`);return true}

let TP={per:'mes'};
function tpRange(){
  const d=new Date(),iso=x=>localISO(x).slice(0,10);
  if(TP.per==='semana'){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+6);return[iso(s),iso(e),'Esta semana']}
  if(TP.per==='mesant'){const s=new Date(d.getFullYear(),d.getMonth()-1,1),e=new Date(d.getFullYear(),d.getMonth(),0);return[iso(s),iso(e),s.toLocaleDateString('es-UY',{month:'long',year:'numeric'})]}
  if(TP.per==='rango'&&TP.desde&&TP.hasta)return[TP.desde,TP.hasta,`${fdate(TP.desde)} al ${fdate(TP.hasta)}`];
  const s=new Date(d.getFullYear(),d.getMonth(),1),e=new Date(d.getFullYear(),d.getMonth()+1,0);return[iso(s),iso(e),s.toLocaleDateString('es-UY',{month:'long',year:'numeric'})];
}
const hm=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])+(+m[2])/60:null};
function jobHours(j){const a=hm(j.llegada),b=hm(j.salida);if(a==null||b==null)return null;let h=b-a;if(h<0)h+=24;return h>16?null:h}
const fmtH=h=>{const t=Math.round((h||0)*60);return`${Math.floor(t/60)} h${t%60?' '+String(t%60).padStart(2,'0'):''}`};
function tecList(){return Object.keys(MEMBERS).filter(id=>!['cliente','pendiente'].includes(MEMBERS[id].role)).sort((a,b)=>personName(a).localeCompare(personName(b),'es'))}
function tecFicha(id){return D.tecnicos&&D.tecnicos[id]||{}}
function tecStats(id,[desde,hasta]){
  const f=tecFicha(id),jornada=n0(f.jornada)||8;
  const jobs=arr('trabajos').filter(j=>(j.tecnicos||[]).includes(id)&&j.fecha&&j.fecha>=desde&&j.fecha<=hasta);
  const porDia={};let sinHora=0;
  jobs.forEach(j=>{const h=jobHours(j);if(h==null){if(j.estado==='terminado')sinHora++;return}porDia[j.fecha]=(porDia[j.fecha]||0)+h});
  let normales=0,extra=0;
  Object.entries(porDia).forEach(([dia,h])=>{const dom=new Date(dia+'T12:00').getDay()===0;if(dom){extra+=h;return}normales+=Math.min(h,jornada);extra+=Math.max(0,h-jornada)});
  const term=jobs.filter(j=>j.estado==='terminado'),sinFirma=term.filter(j=>!(j.firma&&j.firma.id)).length;
  const pg=payOf(id),vh=n0(pg.valorHora),ve=n0(pg.valorExtra)||r2(vh*1.5);
  return{jobs,dias:Object.keys(porDia).length,normales,extra,horas:normales+extra,term:term.length,sinFirma,sinHora,prom:term.length?(normales+extra)/term.length:0,vh,ve,total:r2(normales*vh+extra*ve),moneda:pg.moneda||'UYU',jornada};
}

    ...arr('clientes').map(c=>{const d=docNum(c);return[c.id,c.nombre,c.nombre,d.length===12?'RUT':d?'CI':'',d,c.direccion,c.localidad||c.departamento||'',c.departamento,c.telefono,c.email,c.contacto]})]);
  if(k==='articulos')return csv([['Código','Descripción','Unidad','Precio sin IVA','Moneda','IVA','Rubro'],...arr('productos').map(p=>[p.codigo||p.id,p.nombre,p.unidad,n0(p.precio),p.moneda||'UYU','Básico 22%',p.servicio||''])]);
  const fs=arr('facturas').filter(f=>!f.anulada).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  if(k==='ventas')return csv([['Fecha','Número','CFE','Cliente','Documento','Moneda','Subtotal','Descuento','IVA','Total','Cobrado','Saldo','Vence'],
    ...fs.map(f=>{const c=D.clientes[f.clienteId]||{},t=factCalc(f);return[f.fecha,f.numero,(f.cfeData&&f.cfeData.comprobante)||f.cfe||'',c.nombre||'',docNum(c),f.moneda,r2(t.sub),r2(t.desc),r2(t.iva),r2(t.total),r2(t.pagado),r2(t.saldo),f.vence]})]);
  return csv([['Fecha','Número','Cliente','Documento','Moneda','Descripción','Cantidad','Unidad','Precio unitario','Descuento %','IVA','Importe'],
    ...fs.flatMap(f=>{const c=D.clientes[f.clienteId]||{};return(f.lineas||[]).map(l=>[f.fecha,f.numero,c.nombre||'',docNum(c),f.moneda,l.desc,n0(l.cant),l.unidad,n0(l.precio),n0(f.descuento),f.iva?'22%':'Exento',r2(n0(l.cant)*n0(l.precio))])})]);
}

/* --- acciones --- */
async function modulosAct(k,el,arg){
  switch(k){
    case'prytab':PRYTAB=arg;sr();return true;
    case'tpper':TP.per=arg;sr();return true;
    case'tprango':TP.desde=$('#tp_desde').value;TP.hasta=$('#tp_hasta').value;if(TP.desde&&TP.hasta&&TP.desde>TP.hasta){const x=TP.desde;TP.desde=TP.hasta;TP.hasta=x}sr();return true;
    case'tec':openSheet('tec',arg);return true;
    case'liqcsv':{const rg=tpRange();saveFile(`Liquidación ${rg[0]} a ${rg[1]}.csv`,csv([['Técnico','Email','Días','Horas normales','Horas extra','Valor hora','Valor extra','Moneda','Total','Visitas cerradas','Sin firma'],
      ...liqRows().map(({id,s})=>[personName(id).replace(' (vos)',''),MEMBERS[id]?.email||'',s.dias,r2(s.normales),r2(s.extra),s.vh,s.ve,s.moneda,s.total,s.term,s.sinFirma])]));return true}
    case'liqdoc':{const rg=tpRange();await saveFile(`Liquidación ${rg[0]} a ${rg[1]}.html`,liqDoc());return true}
    case'cfesave':{const prov=$('#cf_prov').value,b={o:ORG,prov,amb:$('#cf_amb')?.value||'testing',k:($('#cf_key')?.value||'').trim(),s:($('#cf_sec')?.value||'').trim(),loc:($('#cf_local')?.value||'').trim(),rub:($('#cf_rubro')?.value||'').trim()};
      el.disabled=true;const {error}=await SB.rpc('cfe_set',b);el.disabled=false;if(error){toast(/sin_permiso/.test(error.message)?'Solo el dueño o un administrador puede cambiar esto.':'No se pudo guardar.');return true}
      toast('Facturación electrónica guardada');CFEI=undefined;await loadCfe();return true}
    case'cfetest':{el.disabled=true;const d=await cfeCall('probar');el.disabled=false;toast(d.ok?'Conexión con Fixed correcta ✓':(d.error||'Fixed no aceptó las claves.'));return true}
    case'cfe':{
      if(!SH||SH.type!=='fact')return true;
      if(arg==='emitir'){if(SH.dirty){const id=await saveFact(false);if(!id)return true}
        if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent=CFEI.ambiente==='produccion'?'Se emite un CFE real ante DGI. Tocá de nuevo':'Emitir CFE de prueba. Tocá de nuevo';return true}armed=null}
      if(arg==='devolver'){if(armed!==el){armed=el;el.dataset.orig=el.textContent;el.classList.add('arm');el.textContent='Anula la factura con una nota de crédito por el total. Tocá de nuevo';return true}armed=null}
      el.disabled=true;el.textContent='Conectando con Fixed…';
      const d=await cfeCall(arg,{factura:SH.id});
      if(d.error){el.disabled=false;el.textContent=el.dataset.orig||'Reintentar';toast(d.error);return true}
      if(d.factura){D.facturas[SH.id]=d.factura;liveCol('facturas').map[SH.id]=d.factura}
      toast({emitir:'CFE emitido: '+(d.factura?.cfeData?.comprobante||''),consultar:'Estado actualizado',imprimir:'PDF listo',devolver:'Nota de crédito emitida'}[arg]||'Listo');
      openSheet('fact',SH.id);return true}
    case'zx':{const n={clientes:'Clientes',articulos:'Artículos',ventas:'Ventas',lineas:'Ventas con detalle'}[arg];saveFile(`${n} para Zureo ${today()}.csv`,zureoCsv(arg));return true}
  }
  return false;
}
